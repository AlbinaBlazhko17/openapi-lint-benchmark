        run: |
          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 env -u GITHUB_ACTIONS speakeasy lint openapi --schema openapi.yaml --non-interactive > $RESULTS/aws-ec2/speakeasy.$run.txt 2>&1; echo "exit $?" >> $RESULTS/aws-ec2/speakeasy.$run.txt; } 2>> $RESULTS/aws-ec2/speakeasy.times
            if grep -qx "exit 137" $RESULTS/aws-ec2/speakeasy.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/aws-ec2/speakeasy.times) s"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: results

      - name: Render README
        run: node scripts/render-readme.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update benchmark results [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main
          done
          exit 1
