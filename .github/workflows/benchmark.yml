          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 redocly lint spec3.yaml > $RESULTS/stripe/redocly.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/redocly.$run.txt; } 2>> $RESULTS/stripe/redocly.times
            if grep -qx "exit 137" $RESULTS/stripe/redocly.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/redocly.times) s"
          done

      - name: Scalar CLI, Stripe single file
        working-directory: specs/stripe
        run: |
          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 scalar document lint spec3.yaml > $RESULTS/stripe/scalar.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/scalar.$run.txt; } 2>> $RESULTS/stripe/scalar.times
            if grep -qx "exit 137" $RESULTS/stripe/scalar.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/scalar.times) s"
          done

      # With GITHUB_ACTIONS set, Speakeasy spends minutes building a step summary of every finding.
      - name: Speakeasy CLI, Stripe single file
        working-directory: specs/stripe
        run: |
          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 env -u GITHUB_ACTIONS speakeasy lint openapi --schema spec3.yaml --non-interactive > $RESULTS/stripe/speakeasy.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/speakeasy.$run.txt; } 2>> $RESULTS/stripe/speakeasy.times
            if grep -qx "exit 137" $RESULTS/stripe/speakeasy.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/speakeasy.times) s"
