          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 redocly lint stripe.yaml > $RESULTS/stripe/redocly.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/redocly.$run.txt; } 2>> $RESULTS/stripe/redocly.times
            if grep -qx "exit 137" $RESULTS/stripe/redocly.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/redocly.times) s"
          done

      - name: Scalar CLI, Stripe bundled
