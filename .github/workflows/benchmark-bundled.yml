name: Benchmark (bundled)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - BUNDLED.md
      - results/**
      - results-bundled/**

permissions:
  contents: write

concurrency:
  group: benchmark-bundled
  cancel-in-progress: false

# The same benchmark as benchmark.yml, but every input is a single file produced by
# `redocly bundle` from the multi-file source. Every tool is installed at its latest release
# in its own step, then runs 5 times from the spec's directory, one process at a time,
# after a 5 s pause.
# `time` reports wall-clock seconds (the last line of each install step is its install time);
# `timeout -s KILL 300` stops a run after 5 minutes (exit 137) and ends that tool's loop.
# Redocly CLI is in the middle of the order.
env:
  TIMEFORMAT: "%R"
  RESULTS: ${{ github.workspace }}/results-bundled

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare results directory
        run: |
          rm -rf results-bundled
          mkdir -p results-bundled/stripe results-bundled/digitalocean results-bundled/azure results-bundled/github results-bundled/cloudflare results-bundled/aws-ec2

      # ---- Install ----------------------------------------------------------------------------

      - name: Install vacuum
        run: |
          time {
            version=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/daveshanley/vacuum/releases/latest | sed 's#.*/tag/v##')
            curl -fsSL "https://github.com/daveshanley/vacuum/releases/download/v${version}/vacuum_${version}_linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin vacuum
          }

      - name: Install Spectral
        run: time npm install -g @stoplight/spectral-cli@latest

      - name: Install Redocly CLI
        run: time npm install -g @redocly/cli@latest

      - name: Install Scalar CLI
        run: time npm install -g @scalar/cli@latest

      - name: Install Speakeasy CLI
        run: |
          time {
            version=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/speakeasy-api/speakeasy/releases/latest | sed 's#.*/tag/v##')
            curl -fsSL -o speakeasy.zip "https://github.com/speakeasy-api/speakeasy/releases/download/v${version}/speakeasy_linux_amd64.zip"
            sudo unzip -oq speakeasy.zip speakeasy -d /usr/local/bin
            rm speakeasy.zip
          }

      - name: Warm up and record versions and machine
        run: |
          {
            echo "vacuum $(vacuum version)"
            echo "Spectral $(spectral --version)"
            echo "Redocly CLI $(redocly --version)"
            echo "Scalar CLI $(scalar --version)"
            echo "Speakeasy CLI $(speakeasy --version | head -1 | awk '{print $NF}')"
          } | tee results-bundled/versions.txt
          echo "$(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores, $(free -g | awk '/^Mem/ {print $2}') GB RAM, $(uname -sr), Node $(node --version)" | tee results-bundled/machine.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > results-bundled/run.txt
          date -u +"%Y-%m-%d %H:%M UTC" >> results-bundled/run.txt

      # ---- Stripe, bundled ---------------------------------------------------------------------

      - name: vacuum, Stripe bundled
        working-directory: specs/bundled
        run: |
          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 vacuum lint stripe.yaml > $RESULTS/stripe/vacuum.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/vacuum.$run.txt; } 2>> $RESULTS/stripe/vacuum.times
            if grep -qx "exit 137" $RESULTS/stripe/vacuum.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/vacuum.times) s"
          done

      - name: Spectral, Stripe bundled
        working-directory: specs/bundled
        run: |
          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 spectral lint stripe.yaml --ruleset $GITHUB_WORKSPACE/.spectral.yaml > $RESULTS/stripe/spectral.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/spectral.$run.txt; } 2>> $RESULTS/stripe/spectral.times
            if grep -qx "exit 137" $RESULTS/stripe/spectral.$run.txt; then echo "run $run: killed after 300 s"; break; fi
            echo "run $run: $(tail -1 $RESULTS/stripe/spectral.times) s"
          done

      - name: Redocly CLI, Stripe bundled
