          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 env -u GITHUB_ACTIONS speakeasy lint openapi --schema stripe.yaml --non-interactive > $RESULTS/stripe/speakeasy.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/speakeasy.$run.txt; } 2>> $RESULTS/stripe/speakeasy.times
            if grep -qx "exit 137" $RESULTS/stripe/speakeasy.$run.txt; then echo "run $run: killed after 300 s"; break; fi
