          name: results-bundled
          path: results-bundled

      - name: Render BUNDLED.md
        run: node scripts/render-bundled.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUNDLED.md results-bundled
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: update bundled benchmark results [skip ci]"
          for attempt in 1 2 3; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main
          done
          exit 1
