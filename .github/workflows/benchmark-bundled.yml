          sleep 5
          set +e
          for run in 1 2 3 4 5; do
            { time timeout -s KILL 300 scalar document lint stripe.yaml > $RESULTS/stripe/scalar.$run.txt 2>&1; echo "exit $?" >> $RESULTS/stripe/scalar.$run.txt; } 2>> $RESULTS/stripe/scalar.times
            if grep -qx "exit 137" $RESULTS/stripe/scalar.$run.txt; then echo "run $run: killed after 300 s"; break; fi
