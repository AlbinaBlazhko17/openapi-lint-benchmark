get:
  description: >-
    <p>Retrieves a Tax <code>Calculation</code> object, if the calculation
    hasn’t expired.</p>
  operationId: GetTaxCalculationsCalculation
  parameters:
    - in: path
      name: calculation
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax.calculation.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a Calculation
