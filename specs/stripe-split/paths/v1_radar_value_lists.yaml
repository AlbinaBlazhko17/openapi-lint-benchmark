get:
  description: >-
    <p>Returns a list of <code>ValueList</code> objects. The objects are sorted
    in descending order by creation date, with the most recently created object
    appearing first.</p>
  operationId: GetRadarValueLists
  parameters:
    - description: The alias used to reference the value list when writing rules.
      in: query
      name: alias
      required: false
      schema:
        maxLength: 100
        type: string
      style: form
    - description: >-
        A value contained within a value list - returns all value lists
        containing this value.
      in: query
      name: contains
      required: false
      schema:
        maxLength: 800
        type: string
      style: form
    - description: >-
        Only return value lists that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/radar.value_list.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/radar/value_lists
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: RadarListListList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all value lists
post:
  description: >-
    <p>Creates a new <code>ValueList</code> object, which can then be referenced
    in rules.</p>
  operationId: PostRadarValueLists
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            alias:
              description: The name of the value list for use in rules.
              maxLength: 100
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            item_type:
              description: >-
                Type of the items in the value list. One of `card_fingerprint`,
                `card_bin`, `crypto_fingerprint`, `email`, `ip_address`,
                `country`, `string`, `case_sensitive_string`, `customer_id`,
                `account`, `sepa_debit_fingerprint`, or
                `us_bank_account_fingerprint`. Use `string` if the item type is
                unknown or mixed.
              enum:
                - account
                - card_bin
                - card_fingerprint
                - case_sensitive_string
                - country
                - crypto_fingerprint
                - customer_id
                - email
                - ip_address
                - sepa_debit_fingerprint
                - string
                - us_bank_account_fingerprint
              maxLength: 5000
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            name:
              description: The human-readable name of the value list.
              maxLength: 100
              type: string
          required:
            - alias
            - name
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/radar.value_list.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a value list
