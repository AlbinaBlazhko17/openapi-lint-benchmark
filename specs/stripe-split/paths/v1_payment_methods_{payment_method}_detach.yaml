post:
  description: >-
    <p>Detaches a PaymentMethod object from a Customer. Detachment is permanent
    and irreversible — once detached, a PaymentMethod can no longer be used for
    payments or re-attached to a Customer.</p>
  operationId: PostPaymentMethodsPaymentMethodDetach
  parameters:
    - in: path
      name: payment_method
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_method.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Detach a PaymentMethod from a Customer
