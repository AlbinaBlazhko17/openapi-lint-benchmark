get:
  description: <p>Retrieves a credit grant.</p>
  operationId: GetBillingCreditGrantsId
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Unique identifier for the object.
      in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.credit_grant.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a credit grant
post:
  description: <p>Updates a credit grant.</p>
  operationId: PostBillingCreditGrantsId
  parameters:
    - description: Unique identifier for the object.
      in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          expires_at:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            expires_at:
              anyOf:
                - format: unix-time
                  type: integer
                - enum:
                    - ''
                  type: string
              description: >-
                The time when the billing credits created by this credit grant
                expire. If set to empty, the billing credits never expire.
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of key-value pairs you can attach to an object. You can use
                this to store additional information about the object (for
                example, cost basis) in a structured format.
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.credit_grant.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a credit grant
