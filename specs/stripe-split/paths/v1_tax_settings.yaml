get:
  description: <p>Retrieves Tax <code>Settings</code> for a merchant.</p>
  operationId: GetTaxSettings
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax.settings.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve settings
post:
  description: >-
    <p>Updates Tax <code>Settings</code> parameters used in tax calculations.
    All parameters are editable but none can be removed once set.</p>
  operationId: PostTaxSettings
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          defaults:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          head_office:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            defaults:
              description: Default configuration to be used on Stripe Tax calculations.
              properties:
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - inferred_by_currency
                  type: string
                tax_code:
                  type: string
              title: defaults_param
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            head_office:
              description: The place where your business is located.
              properties:
                address:
                  properties:
                    city:
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      maxLength: 5000
                      type: string
                    line2:
                      maxLength: 5000
                      type: string
                    postal_code:
                      maxLength: 5000
                      type: string
                    state:
                      maxLength: 5000
                      type: string
                  title: validated_country_address
                  type: object
              required:
                - address
              title: head_office_param
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax.settings.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update settings
