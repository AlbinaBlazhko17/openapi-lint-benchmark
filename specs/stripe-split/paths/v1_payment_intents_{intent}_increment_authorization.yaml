post:
  description: >-
    <p>Perform an incremental authorization on an eligible

    <a href="/docs/api/payment_intents/object">PaymentIntent</a>. To be
    eligible, the

    PaymentIntent’s status must be <code>requires_capture</code> and

    <a
    href="/docs/api/charges/object#charge_object-payment_method_details-card_present-incremental_authorization_supported">incremental_authorization_supported</a>

    must be <code>true</code>.</p>


    <p>Incremental authorizations attempt to increase the authorized amount on

    your customer’s card to the new, higher <code>amount</code> provided.
    Similar to the

    initial authorization, incremental authorizations can be declined. A

    single PaymentIntent can call this endpoint multiple times to further

    increase the authorized amount.</p>


    <p>If the incremental authorization succeeds, the PaymentIntent object

    returns with the updated

    <a
    href="/docs/api/payment_intents/object#payment_intent_object-amount">amount</a>.

    If the incremental authorization fails, a

    <a href="/docs/error-codes#card-declined">card_declined</a> error returns,
    and no other

    fields on the PaymentIntent or Charge update. The PaymentIntent

    object remains capturable for the previously authorized amount.</p>


    <p>Each PaymentIntent can have a maximum of 10 incremental authorization
    attempts, including declines.

    After it’s captured, a PaymentIntent can no longer be incremented.</p>


    <p>Learn more about incremental authorizations with

    <a href="/docs/terminal/features/incremental-authorizations">in-person
    payments</a> and

    <a
    href="/docs/payments/incremental-authorization?platform=web&ui=elements">online
    payments</a>.</p>
  operationId: PostPaymentIntentsIntentIncrementAuthorization
  parameters:
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          amount_details:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          hooks:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payment_details:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The updated total amount that you intend to collect from the
                cardholder. This amount must be greater than the currently
                authorized amount.
              type: integer
            amount_details:
              description: Provides industry-specific information about the amount.
              properties:
                discount_amount:
                  anyOf:
                    - type: integer
                    - enum:
                        - ''
                      type: string
                enforce_arithmetic_validation:
                  type: boolean
                line_items:
                  anyOf:
                    - items:
                        properties:
                          discount_amount:
                            type: integer
                          payment_method_options:
                            properties:
                              card:
                                properties:
                                  commodity_code:
                                    maxLength: 12
                                    type: string
                                title: >-
                                  payment_intent_amount_details_line_item_payment_method_options_param
                                type: object
                              card_present:
                                properties:
                                  commodity_code:
                                    maxLength: 12
                                    type: string
                                title: >-
                                  amount_details_line_item_payment_method_options_param
                                type: object
                              klarna:
                                properties:
                                  image_url:
                                    maxLength: 4096
                                    type: string
                                  product_url:
                                    maxLength: 4096
                                    type: string
                                  reference:
                                    maxLength: 255
                                    type: string
                                  subscription_reference:
                                    maxLength: 255
                                    type: string
                                title: >-
                                  payment_intent_amount_details_line_item_payment_method_options_param
                                type: object
                              paypal:
                                properties:
                                  category:
                                    enum:
                                      - digital_goods
                                      - donation
                                      - physical_goods
                                    type: string
                                  description:
                                    maxLength: 127
                                    type: string
                                  sold_by:
                                    maxLength: 127
                                    type: string
                                title: >-
                                  amount_details_line_item_payment_method_options_param
                                type: object
                            title: >-
                              amount_details_line_item_payment_method_options_param
                            type: object
                          product_code:
                            maxLength: 12
                            type: string
                          product_name:
                            maxLength: 1024
                            type: string
                          quantity:
                            type: integer
                          tax:
                            properties:
                              total_tax_amount:
                                type: integer
                            required:
                              - total_tax_amount
                            title: amount_details_line_item_tax_param
                            type: object
                          unit_cost:
                            type: integer
                          unit_of_measure:
                            maxLength: 12
                            type: string
                        required:
                          - product_name
                          - quantity
                          - unit_cost
                        title: amount_details_line_item_param
                        type: object
                      type: array
                    - enum:
                        - ''
                      type: string
                shipping:
                  anyOf:
                    - properties:
                        amount:
                          anyOf:
                            - type: integer
                            - enum:
                                - ''
                              type: string
                        from_postal_code:
                          anyOf:
                            - maxLength: 10
                              type: string
                            - enum:
                                - ''
                              type: string
                        to_postal_code:
                          anyOf:
                            - maxLength: 10
                              type: string
                            - enum:
                                - ''
                              type: string
                      title: amount_details_shipping_param
                      type: object
                    - enum:
                        - ''
                      type: string
                tax:
                  anyOf:
                    - properties:
                        total_tax_amount:
                          type: integer
                      required:
                        - total_tax_amount
                      title: amount_details_tax_param
                      type: object
                    - enum:
                        - ''
                      type: string
              title: amount_details_param
              type: object
            application_fee_amount:
              description: >-
                The amount of the application fee (if any) that will be
                requested to be applied to the payment and transferred to the
                application owner's Stripe account. The amount of the
                application fee collected will be capped at the total amount
                captured. For more information, see the PaymentIntents [use case
                for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              type: integer
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 1000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            hooks:
              description: Automations to be run during the PaymentIntent lifecycle
              properties:
                inputs:
                  properties:
                    tax:
                      properties:
                        calculation:
                          anyOf:
                            - maxLength: 5000
                              type: string
                            - enum:
                                - ''
                              type: string
                      required:
                        - calculation
                      title: async_workflows_inputs_tax_param
                      type: object
                  title: async_workflows_inputs_param
                  type: object
              title: async_workflows_param
              type: object
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            payment_details:
              description: Provides industry-specific information about the charge.
              properties:
                customer_reference:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
                order_reference:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
              title: payment_details_order_customer_reference_param
              type: object
            statement_descriptor:
              description: >-
                Text that appears on the customer's statement as the statement
                descriptor for a non-card or card charge. This value overrides
                the account's default statement descriptor. For information
                about requirements, including the 22-character limit, see [the
                Statement Descriptor
                docs](https://docs.stripe.com/get-started/account/statement-descriptors).
              maxLength: 22
              type: string
            transfer_data:
              description: >-
                The parameters used to automatically create a transfer after the
                payment is captured.

                Learn more about the [use case for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              properties:
                amount:
                  type: integer
              title: transfer_data_update_auth_params
              type: object
          required:
            - amount
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_intent.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Increment an authorization
