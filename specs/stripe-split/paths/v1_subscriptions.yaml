              description: >-
                Specifies an interval for how often to bill for any pending
                invoice items. It is analogous to calling [Create an
                invoice](/api/invoices/create) for the given subscription at the
                specified interval.
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                resulting from the `billing_cycle_anchor`. If no value is
                passed, the default is `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            transfer_data:
              description: >-
                If specified, the funds from the subscription's invoices will be
                transferred to the destination and the ID of the resulting
                transfers will be found on the resulting charges.
              properties:
                amount_percent:
                  type: number
                destination:
                  type: string
              required:
                - destination
              title: transfer_data_specs
              type: object
            trial_end:
              anyOf:
                - enum:
                    - now
                  maxLength: 5000
                  type: string
                - format: unix-time
                  type: integer
              description: >-
                Unix timestamp representing the end of the trial period the
                customer will get before being charged for the first time. If
                set, trial_end will override the default trial period of the
                plan the customer is being subscribed to. The special value
                `now` can be provided to end the customer's trial immediately.
                Can be at most two years from `billing_cycle_anchor`. See [Using
                trial periods on
                subscriptions](https://docs.stripe.com/billing/subscriptions/trials)
                to learn more.
            trial_from_plan:
              description: >-
                Indicates if a plan's `trial_period_days` should be applied to
                the subscription. Setting `trial_end` per subscription is
                preferred, and this defaults to `false`. Setting this flag to
                `true` together with `trial_end` is not allowed. See [Using
                trial periods on
                subscriptions](https://docs.stripe.com/billing/subscriptions/trials)
                to learn more.
              type: boolean
            trial_period_days:
              description: >-
                Integer representing the number of trial period days before the
                customer is charged for the first time. This will always
                overwrite any trials that might apply via a subscribed plan. See
                [Using trial periods on
                subscriptions](https://docs.stripe.com/billing/subscriptions/trials)
                to learn more.
              type: integer
