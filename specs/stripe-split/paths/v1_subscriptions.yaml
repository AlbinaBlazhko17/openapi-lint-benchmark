get:
  description: >-
    <p>By default, returns a list of subscriptions that have not been canceled.
    In order to list canceled subscriptions, specify
    <code>status=canceled</code>.</p>
  operationId: GetSubscriptions
  parameters:
    - description: Filter subscriptions by their automatic tax settings.
      explode: true
      in: query
      name: automatic_tax
      required: false
      schema:
        properties:
          enabled:
            type: boolean
        required:
          - enabled
        title: automatic_tax_filter_params
        type: object
      style: deepObject
    - description: >-
        The collection method of the subscriptions to retrieve. Either
        `charge_automatically` or `send_invoice`.
      in: query
      name: collection_method
      required: false
      schema:
        enum:
          - charge_automatically
          - send_invoice
        type: string
      style: form
    - description: >-
        Only return subscriptions that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        Only return subscriptions whose minimum item current_period_end falls
        within the given date interval.
      explode: true
      in: query
      name: current_period_end
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        Only return subscriptions whose maximum item current_period_start falls
        within the given date interval.
      explode: true
      in: query
      name: current_period_start
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: The ID of the customer whose subscriptions you're retrieving.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        The ID of the account representing the customer whose subscriptions
        you're retrieving.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Filter for subscriptions that contain this recurring price ID.
      in: query
      name: price
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        The status of the subscriptions to retrieve. Passing in a value of
        `canceled` will return all canceled subscriptions, including those
        belonging to deleted customers. Pass `ended` to find subscriptions that
        are canceled and subscriptions that are expired due to [incomplete
        payment](https://docs.stripe.com/billing/subscriptions/overview#subscription-statuses).
        Passing in a value of `all` will return subscriptions of all statuses.
        If no value is supplied, all subscriptions that have not been canceled
        are returned.
      in: query
      name: status
      required: false
      schema:
        enum:
          - active
          - all
          - canceled
          - ended
          - incomplete
          - incomplete_expired
          - past_due
          - paused
          - trialing
          - unpaid
        type: string
      style: form
    - description: >-
        Filter for subscriptions that are associated with the specified test
        clock. The response will not include subscriptions with test clocks if
        this and the customer parameter is not set.
      in: query
      name: test_clock
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/subscription.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/subscriptions
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: SubscriptionsSubscriptionList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List subscriptions
post:
  description: >-
    <p>Creates a new subscription on an existing customer. Each customer can
    have up to 500 active or scheduled subscriptions.</p>


    <p>When you create a subscription with
    <code>collection_method=charge_automatically</code>, the first invoice is
    finalized as part of the request.

    The <code>payment_behavior</code> parameter determines the exact behavior of
    the initial payment.</p>


    <p>To start subscriptions where the first invoice always begins in a
    <code>draft</code> status, use <a
    href="/docs/billing/subscriptions/subscription-schedules#managing">subscription
    schedules</a> instead.

    Schedules provide the flexibility to model more complex billing
    configurations that change over time.</p>
  operationId: PostSubscriptions
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          add_invoice_items:
            explode: true
            style: deepObject
          application_fee_percent:
            explode: true
            style: deepObject
          automatic_tax:
            explode: true
            style: deepObject
          billing_cycle_anchor_config:
            explode: true
            style: deepObject
          billing_mode:
            explode: true
            style: deepObject
          billing_schedules:
            explode: true
            style: deepObject
          billing_thresholds:
            explode: true
            style: deepObject
          cancel_at:
            explode: true
            style: deepObject
          default_tax_rates:
            explode: true
            style: deepObject
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          invoice_settings:
            explode: true
            style: deepObject
          items:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          on_behalf_of:
            explode: true
            style: deepObject
          payment_settings:
            explode: true
            style: deepObject
          pending_invoice_item_interval:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
          trial_end:
            explode: true
            style: deepObject
          trial_settings:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            add_invoice_items:
              description: >-
                A list of prices and quantities that will generate invoice items
                appended to the next invoice for this subscription. You may pass
                up to 20 items.
              items:
                properties:
                  discountable:
                    type: boolean
                  discounts:
                    items:
                      properties:
                        coupon:
                          maxLength: 5000
                          type: string
                        discount:
                          maxLength: 5000
                          type: string
                        promotion_code:
                          maxLength: 5000
                          type: string
                      title: discounts_data_param
                      type: object
                    type: array
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  period:
                    properties:
                      end:
                        properties:
                          timestamp:
                            format: unix-time
                            type: integer
                          type:
                            enum:
                              - min_item_period_end
                              - timestamp
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: invoice_item_period_end
                        type: object
                      start:
                        properties:
                          timestamp:
                            format: unix-time
                            type: integer
                          type:
                            enum:
                              - max_item_period_start
                              - now
                              - timestamp
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: invoice_item_period_start
                        type: object
                    required:
                      - end
                      - start
                    title: invoice_item_period
                    type: object
                  price:
                    maxLength: 5000
                    type: string
                  price_data:
                    properties:
                      currency:
                        format: currency
                        type: string
                      product:
                        maxLength: 5000
                        type: string
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    required:
                      - currency
                      - product
                    title: one_time_price_data_with_negative_amounts
                    type: object
                  quantity:
                    type: integer
                  tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                title: add_invoice_item_entry
                type: object
              type: array
            application_fee_percent:
              anyOf:
                - type: number
                - enum:
                    - ''
                  type: string
              description: >-
                A non-negative decimal between 0 and 100, with at most two
                decimal places. This represents the percentage of the
                subscription invoice total that will be transferred to the
                application owner's Stripe account. The request must be made by
                a platform account on a connected account in order to set an
                application fee percentage. For more information, see the
                application fees
                [documentation](https://stripe.com/docs/connect/subscriptions#collecting-fees-on-subscriptions).
            automatic_tax:
              description: Automatic tax settings for this subscription.
              properties:
                enabled:
                  type: boolean
                liability:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              required:
                - enabled
              title: automatic_tax_config
              type: object
            backdate_start_date:
              description: >-
                A past timestamp to backdate the subscription's start date to.
                If set, the first invoice will contain line items for the
                timespan between the start date and the current time. Can be
                combined with trials and the billing cycle anchor.
              format: unix-time
              type: integer
            billing_cycle_anchor:
              description: >-
                A future timestamp in UTC format to anchor the subscription's
                [billing
                cycle](https://docs.stripe.com/subscriptions/billing-cycle). The
                anchor is the reference point that aligns future billing cycle
                dates. It sets the day of week for `week` intervals, the day of
                month for `month` and `year` intervals, and the month of year
                for `year` intervals.
              format: unix-time
              type: integer
              x-stripeBypassValidation: true
            billing_cycle_anchor_config:
              description: >-
                Mutually exclusive with billing_cycle_anchor and only valid with
                monthly and yearly price intervals. When provided, the
                billing_cycle_anchor is set to the next occurrence of the
                day_of_month at the hour, minute, and second UTC.
              properties:
                day_of_month:
                  type: integer
                hour:
                  type: integer
                minute:
                  type: integer
                month:
                  type: integer
                second:
                  type: integer
              required:
                - day_of_month
              title: cycle_anchor_config_param
              type: object
            billing_mode:
              description: >-
                Controls how prorations and invoices for subscriptions are
                calculated and orchestrated.
              properties:
                flexible:
                  properties:
                    proration_discounts:
                      enum:
                        - included
                        - itemized
                      type: string
                  title: flexible_params
                  type: object
                type:
                  enum:
                    - classic
                    - flexible
                  type: string
              required:
                - type
              title: billing_mode
              type: object
            billing_schedules:
              description: >-
                An array of billing schedules, which allow you to bill customers
                in advance for multiple service periods. Requires flexible
                billing mode and API version 2026-05-27.dahlia or later. Learn
                more about
                [prebilling](https://docs.stripe.com/billing/subscriptions/prebilling).
              items:
                properties:
                  applies_to:
                    items:
                      properties:
                        price:
                          maxLength: 5000
                          type: string
                        type:
                          enum:
                            - price
                          type: string
                      required:
                        - type
                      title: billing_schedules_applies_to
                      type: object
                    type: array
                  bill_until:
                    properties:
                      duration:
                        properties:
                          interval:
                            enum:
                              - day
                              - month
                              - week
                              - year
                            type: string
                          interval_count:
                            type: integer
                        required:
                          - interval
                        title: billing_schedules_bill_until_duration
                        type: object
                      timestamp:
                        format: unix-time
                        type: integer
                      type:
                        enum:
                          - duration
                          - timestamp
                        type: string
                    required:
                      - type
                    title: billing_schedules_bill_until
                    type: object
                  key:
                    maxLength: 200
                    type: string
                required:
                  - bill_until
                title: billing_schedules_create_params
                type: object
              type: array
            billing_thresholds:
              anyOf:
                - properties:
                    amount_gte:
                      type: integer
                    reset_billing_cycle_anchor:
                      type: boolean
                  title: billing_thresholds_param
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Define thresholds at which an invoice will be sent, and the
                subscription advanced to a new billing period. When updating,
                pass an empty string to remove previously-defined thresholds.
            cancel_at:
              anyOf:
                - format: unix-time
                  type: integer
                - enum:
                    - max_billed_until
                    - max_period_end
                    - min_period_end
                  type: string
              description: >-
                A timestamp at which the subscription should cancel. If set to a
                date before the current period ends, this will cause a proration
                if prorations have been enabled using `proration_behavior`. If
                set during a future period, this will always cause a proration
                for that period.
            cancel_at_period_end:
              description: >-
                Indicate whether this subscription should cancel at the end of
                the current period (`current_period_end`). Defaults to `false`.
              type: boolean
            collection_method:
              description: >-
                Either `charge_automatically`, or `send_invoice`. When charging
                automatically, Stripe will attempt to pay this subscription at
                the end of the cycle using the default source attached to the
                customer. When sending an invoice, Stripe will email your
                customer an invoice with payment instructions and mark the
                subscription as `active`. Defaults to `charge_automatically`.
              enum:
                - charge_automatically
                - send_invoice
              type: string
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            customer:
              description: The identifier of the customer to subscribe.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                The identifier of the account representing the customer to
                subscribe.
              maxLength: 5000
              type: string
            days_until_due:
              description: >-
                Number of days a customer has to pay invoices generated by this
                subscription. Valid only for subscriptions where
                `collection_method` is set to `send_invoice`.
              type: integer
            default_payment_method:
              description: >-
                ID of the default payment method for the subscription. It must
                belong to the customer associated with the subscription. This
                takes precedence over `default_source`. If neither are set,
                invoices will use the customer's
                [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method)
                or
                [default_source](https://docs.stripe.com/api/customers/object#customer_object-default_source).
              maxLength: 5000
              type: string
            default_source:
              description: >-
                ID of the default payment source for the subscription. It must
                belong to the customer associated with the subscription and be
                in a chargeable state. If `default_payment_method` is also set,
                `default_payment_method` will take precedence. If neither are
                set, invoices will use the customer's
                [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method)
                or
                [default_source](https://docs.stripe.com/api/customers/object#customer_object-default_source).
              maxLength: 5000
              type: string
            default_tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The tax rates that will apply to any subscription item that does
                not have `tax_rates` set. Invoices created will have their
                `default_tax_rates` populated from the subscription.
            description:
              description: >-
                The subscription's description, meant to be displayable to the
                customer. Use this field to optionally store an explanation of
                the subscription for rendering in Stripe surfaces and certain
                local payment methods UIs.
              maxLength: 500
              type: string
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The coupons to redeem into discounts for the subscription. If
                not specified or empty, inherits the discount from the
                subscription's customer.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            invoice_settings:
              description: All invoices will be billed using the specified settings.
              properties:
                account_tax_ids:
                  anyOf:
                    - items:
                        maxLength: 5000
                        type: string
                      type: array
                    - enum:
                        - ''
                      type: string
                custom_fields:
                  anyOf:
                    - items:
                        properties:
                          name:
                            maxLength: 40
                            type: string
                          value:
                            maxLength: 140
                            type: string
                        required:
                          - name
                          - value
                        title: custom_field_params
                        type: object
                      type: array
                    - enum:
                        - ''
                      type: string
                description:
                  maxLength: 1500
                  type: string
                footer:
                  maxLength: 5000
                  type: string
                issuer:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              title: invoice_settings_param
              type: object
            items:
              description: >-
                A list of up to 20 subscription items, each with an attached
                price.
              items:
                properties:
                  billing_thresholds:
                    anyOf:
                      - properties:
                          usage_gte:
                            type: integer
                        required:
                          - usage_gte
                        title: item_billing_thresholds_param
                        type: object
                      - enum:
                          - ''
                        type: string
                  discounts:
                    anyOf:
                      - items:
                          properties:
                            coupon:
                              maxLength: 5000
                              type: string
                            discount:
                              maxLength: 5000
                              type: string
                            promotion_code:
                              maxLength: 5000
                              type: string
                          title: discounts_data_param
                          type: object
                        type: array
                      - enum:
                          - ''
                        type: string
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  price:
                    maxLength: 5000
                    type: string
                  price_data:
                    properties:
                      currency:
                        format: currency
                        type: string
                      product:
                        maxLength: 5000
                        type: string
                      recurring:
                        properties:
                          interval:
                            enum:
                              - day
                              - month
                              - week
                              - year
                            type: string
                          interval_count:
                            type: integer
                        required:
                          - interval
                        title: recurring_adhoc
                        type: object
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    required:
                      - currency
                      - product
                      - recurring
                    title: recurring_price_data
                    type: object
                  quantity:
                    type: integer
                  tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                title: subscription_item_create_params
                type: object
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            off_session:
              description: >-
                Indicates if a customer is on or off-session while an invoice
                payment is attempted. Defaults to `false` (on-session).
              type: boolean
            on_behalf_of:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: >-
                The account on behalf of which to charge, for each of the
                subscription's invoices.
            payment_behavior:
              description: >-
                Controls how Stripe handles the first invoice when payment is
                required and `collection_method=charge_automatically`.
                Subscriptions with `collection_method=send_invoice` are
                automatically activated regardless of the first Invoice status.
              enum:
                - allow_incomplete
                - default_incomplete
                - error_if_incomplete
                - pending_if_incomplete
              type: string
            payment_settings:
              description: >-
                Payment settings to pass to invoices created by the
                subscription.
              properties:
                payment_method_options:
                  properties:
                    acss_debit:
                      anyOf:
                        - properties:
                            mandate_options:
                              properties:
                                transaction_type:
                                  enum:
                                    - business
                                    - personal
                                  type: string
                              title: mandate_options_param
                              type: object
                            verification_method:
                              enum:
                                - automatic
                                - instant
                                - microdeposits
                              type: string
                              x-stripeBypassValidation: true
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    bancontact:
                      anyOf:
                        - properties:
                            preferred_language:
                              enum:
                                - de
                                - en
                                - fr
                                - nl
                              type: string
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    billie:
                      anyOf:
                        - properties: {}
                          title: subscription_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    card:
                      anyOf:
                        - properties:
                            mandate_options:
                              properties:
                                amount:
                                  type: integer
                                amount_type:
                                  enum:
