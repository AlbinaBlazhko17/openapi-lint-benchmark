delete:
  description: >-
    <p>With <a href="/connect">Connect</a>, you can delete accounts you
    manage.</p>


    <p>Test-mode accounts can be deleted at any time.</p>


    <p>Live-mode accounts that have access to the standard dashboard and Stripe
    is responsible for negative account balances cannot be deleted, which
    includes Standard accounts. All other Live-mode accounts, can be deleted
    when all <a href="/api/balance/balance_object">balances</a> are zero.</p>


    <p>If you want to delete your own account, use the <a
    href="https://dashboard.stripe.com/settings/account">account information tab
    in your account settings</a> instead.</p>
  operationId: DeleteAccountsAccount
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete an account
get:
  description: <p>Retrieves the details of an account.</p>
  operationId: GetAccountsAccount
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve account
post:
  description: >-
    <p>Updates a <a href="/connect/accounts">connected account</a> by setting
    the values of the parameters passed. Any parameters not provided are

    left unchanged.</p>


    <p>For accounts where <a
    href="/api/accounts/object#account_object-controller-requirement_collection">controller.requirement_collection</a>

    is <code>application</code>, which includes Custom accounts, you can update
    any information on the account.</p>


    <p>For accounts where <a
    href="/api/accounts/object#account_object-controller-requirement_collection">controller.requirement_collection</a>

    is <code>stripe</code>, which includes Standard and Express accounts, you
    can update all information until you create

    an <a href="/api/account_links">Account Link</a> or <a
    href="/api/account_sessions">Account Session</a> to start Connect
    onboarding,

    after which some properties can no longer be updated.</p>


    <p>To update your own account, use the <a
    href="https://dashboard.stripe.com/settings/account">Dashboard</a>. Refer to
    our

    <a href="/docs/connect/updating-accounts">Connect</a> documentation to learn
    more about updating accounts.</p>
