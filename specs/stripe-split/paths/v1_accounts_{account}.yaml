            explode: true
            style: deepObject
          capabilities:
            explode: true
            style: deepObject
          company:
            explode: true
            style: deepObject
          documents:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          groups:
            explode: true
            style: deepObject
          individual:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          settings:
            explode: true
            style: deepObject
          tos_acceptance:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            account_token:
              description: >-
                An [account token](https://api.stripe.com#create_account_token),
                used to securely provide details to the account.
              maxLength: 5000
              type: string
            business_profile:
              description: Business information about the account.
              properties:
                annual_revenue:
                  properties:
                    amount:
                      type: integer
                    currency:
                      format: currency
                      type: string
                    fiscal_year_end:
                      maxLength: 5000
                      type: string
                  required:
                    - amount
                    - currency
                    - fiscal_year_end
                  title: annual_revenue_specs
                  type: object
                estimated_worker_count:
                  type: integer
                mcc:
                  maxLength: 4
                  type: string
                minority_owned_business_designation:
                  items:
                    enum:
                      - lgbtqi_owned_business
                      - minority_owned_business
                      - none_of_these_apply
                      - prefer_not_to_answer
                      - women_owned_business
                    type: string
                  type: array
                monthly_estimated_revenue:
                  properties:
                    amount:
                      type: integer
                    currency:
                      format: currency
                      type: string
                  required:
                    - amount
                    - currency
                  title: monthly_estimated_revenue_specs
                  type: object
                name:
                  maxLength: 5000
                  type: string
                product_description:
                  maxLength: 40000
                  type: string
                support_address:
                  properties:
