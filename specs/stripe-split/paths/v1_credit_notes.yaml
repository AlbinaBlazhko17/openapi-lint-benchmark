get:
  description: <p>Returns a list of credit notes.</p>
  operationId: GetCreditNotes
  parameters:
    - description: >-
        Only return credit notes that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return credit notes for the customer specified by this customer ID.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return credit notes for the account representing the customer
        specified by this account ID.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Only return credit notes for the invoice specified by this invoice ID.
      in: query
      name: invoice
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/credit_note.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: CreditNotesList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all credit notes
post:
  description: >-
    <p>Issue a credit note to adjust the amount of a finalized invoice. A credit
    note will first reduce the invoice’s <code>amount_remaining</code> (and
    <code>amount_due</code>), but not below zero.

    This amount is indicated by the credit note’s
    <code>pre_payment_amount</code>. The excess amount is indicated by
    <code>post_payment_amount</code>, and it can result in any combination of
    the following:</p>


    <ul>

    <li>Refunds: create a new refund (using <code>refund_amount</code>) or link
    existing refunds (using <code>refunds</code>).</li>

    <li>Customer balance credit: credit the customer’s balance (using
    <code>credit_amount</code>) which will be automatically applied to their
    next invoice when it’s finalized.</li>

    <li>Outside of Stripe credit: record the amount that is or will be credited
    outside of Stripe (using <code>out_of_band_amount</code>).</li>

    </ul>


    <p>The sum of refunds, customer balance credits, and outside of Stripe
    credits must equal the <code>post_payment_amount</code>.</p>


    <p>You may issue multiple credit notes for an invoice. Each credit note may
    increment the invoice’s <code>pre_payment_credit_notes_amount</code>,

    <code>post_payment_credit_notes_amount</code>, or both, depending on the
    invoice’s <code>amount_remaining</code> at the time of credit note
    creation.</p>


    <p>For invoices that also have refunds created through the <a
    href="/docs/api/refunds">Refund API</a>, the credit note API subtracts those
    refund amounts from the maximum creditable amount. This prevents the
    combined credit notes and refunds from exceeding the invoice amount. If you
    use both, ensure the combined total does not exceed the invoice’s paid
    amount.</p>
  operationId: PostCreditNotes
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          lines:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          refunds:
            explode: true
            style: deepObject
          shipping_cost:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The integer amount in cents (or local equivalent) representing
                the total amount of the credit note. One of `amount`, `lines`,
                or `shipping_cost` must be provided.
              type: integer
            credit_amount:
              description: >-
                The integer amount in cents (or local equivalent) representing
                the amount to credit the customer's balance, which will be
                automatically applied to their next invoice.
              type: integer
            effective_at:
              description: >-
                The date when this credit note is in effect. Same as `created`
                unless overwritten. When defined, this value replaces the
                system-generated 'Date of issue' printed on the credit note PDF.
              format: unix-time
              type: integer
            email_type:
              description: >-
                Type of email to send to the customer, one of `credit_note` or
                `none` and the default is `credit_note`.
              enum:
                - credit_note
                - none
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            invoice:
              description: ID of the invoice.
              maxLength: 5000
              type: string
            lines:
              description: >-
                Line items that make up the credit note. One of `amount`,
                `lines`, or `shipping_cost` must be provided.
              items:
                properties:
                  amount:
                    type: integer
                  description:
                    maxLength: 5000
                    type: string
                  invoice_line_item:
                    maxLength: 5000
                    type: string
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  quantity:
                    type: integer
                  tax_amounts:
                    anyOf:
                      - items:
                          properties:
                            amount:
                              type: integer
                            tax_rate:
                              maxLength: 5000
                              type: string
                            taxable_amount:
                              type: integer
                          required:
                            - amount
                            - tax_rate
                            - taxable_amount
                          title: tax_amount_with_tax_rate_param
                          type: object
                        type: array
                      - enum:
                          - ''
                        type: string
                  tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                  type:
                    enum:
                      - custom_line_item
                      - invoice_line_item
                    type: string
                  unit_amount:
                    type: integer
                  unit_amount_decimal:
                    format: decimal
                    type: string
                required:
                  - type
                title: credit_note_line_item_params
                type: object
              type: array
            memo:
              description: The credit note's memo appears on the credit note PDF.
              maxLength: 5000
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            out_of_band_amount:
              description: >-
                The integer amount in cents (or local equivalent) representing
                the amount that is credited outside of Stripe.
              type: integer
            reason:
              description: >-
                Reason for issuing this credit note, one of `duplicate`,
                `fraudulent`, `order_change`, or `product_unsatisfactory`
              enum:
                - duplicate
                - fraudulent
                - order_change
                - product_unsatisfactory
              type: string
              x-stripeBypassValidation: true
            refund_amount:
              description: >-
                The integer amount in cents (or local equivalent) representing
                the amount to refund. If set, a refund will be created for the
                charge associated with the invoice.
              type: integer
            refunds:
              description: Refunds to link to this credit note.
              items:
                properties:
                  amount_refunded:
                    type: integer
                  payment_record_refund:
                    properties:
                      payment_record:
                        maxLength: 5000
                        type: string
                      refund_group:
                        maxLength: 5000
                        type: string
                    required:
                      - payment_record
                      - refund_group
                    title: payment_record_refund_params
                    type: object
                  refund:
                    type: string
                  type:
                    enum:
                      - payment_record_refund
                      - refund
                    type: string
                title: credit_note_refund_params
                type: object
              type: array
            shipping_cost:
              description: >-
                When shipping_cost contains the shipping_rate from the invoice,
                the shipping_cost is included in the credit note. One of
                `amount`, `lines`, or `shipping_cost` must be provided.
              properties:
                shipping_rate:
                  maxLength: 5000
                  type: string
              title: credit_note_shipping_cost
              type: object
          required:
            - invoice
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/credit_note.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a credit note
