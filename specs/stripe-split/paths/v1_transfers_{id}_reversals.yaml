get:
  description: >-
    <p>You can see a list of the reversals belonging to a specific transfer.
    Note that the 10 most recent reversals are always available by default on
    the transfer object. If you need more than those 10, you can use this API
    method and the <code>limit</code> and <code>starting_after</code> parameters
    to page through additional reversals.</p>
  operationId: GetTransfersIdReversals
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/transfer_reversal.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TransferReversalList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all reversals
post:
  description: >-
    <p>When you create a new reversal, you must specify a transfer to create it
    on.</p>


    <p>When reversing transfers, you can optionally reverse part of the
    transfer. You can do so as many times as you wish until the entire transfer
    has been reversed.</p>


    <p>Once entirely reversed, a transfer can’t be reversed again. This method
    will return an error when called on an already-reversed transfer, or when
    trying to reverse more money than is left on a transfer.</p>
  operationId: PostTransfersIdReversals
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                A positive integer in cents (or local equivalent) representing
                how much of this transfer to reverse. Can only reverse up to the
                unreversed amount remaining of the transfer. Partial transfer
                reversals are only allowed for transfers to Stripe Accounts.
                Defaults to the entire transfer amount.
              type: integer
            description:
              description: >-
                An arbitrary string which you can attach to a reversal object.
                This will be unset if you POST an empty value.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            refund_application_fee:
              description: >-
                Boolean indicating whether the application fee should be
                refunded when reversing this transfer. If a full transfer
                reversal is given, the full application fee will be refunded.
                Otherwise, the application fee will be refunded with an amount
                proportional to the amount of the transfer reversed.
              type: boolean
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/transfer_reversal.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a transfer reversal
