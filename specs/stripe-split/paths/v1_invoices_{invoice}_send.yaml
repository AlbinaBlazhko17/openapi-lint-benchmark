post:
  description: >-
    <p>Stripe will automatically send invoices to customers according to your <a
    href="https://dashboard.stripe.com/account/billing/automatic">subscriptions
    settings</a>. However, if you’d like to manually send an invoice to your
    customer out of the normal schedule, you can do so. When sending invoices
    that have already been paid, there will be no reference to the payment in
    the email.</p>


    <p>Requests made in test-mode result in no emails being sent, despite
    sending an <code>invoice.sent</code> event.</p>
  operationId: PostInvoicesInvoiceSend
  parameters:
    - in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Send an invoice for manual payment
