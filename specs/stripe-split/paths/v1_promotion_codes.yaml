get:
  description: <p>Returns a list of your promotion codes.</p>
  operationId: GetPromotionCodes
  parameters:
    - description: Filter promotion codes by whether they are active.
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: Only return promotion codes that have this case-insensitive code.
      in: query
      name: code
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return promotion codes for this coupon.
      in: query
      name: coupon
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A filter on the list, based on the object `created` field. The value can
        be a string with an integer Unix timestamp, or it can be a dictionary
        with a number of different query options.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return promotion codes that are restricted to this customer.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return promotion codes that are restricted to this account
        representing the customer.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/promotion_code.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/promotion_codes
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: PromotionCodesResourcePromotionCodeList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all promotion codes
post:
  description: >-
    <p>A promotion code points to an underlying promotion. You can optionally
    restrict the code to a specific customer, redemption limit, and expiration
    date.</p>
  operationId: PostPromotionCodes
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          promotion:
            explode: true
            style: deepObject
          restrictions:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: Whether the promotion code is currently active.
              type: boolean
            code:
              description: >-
                The customer-facing code. Regardless of case, this code must be
                unique across all active promotion codes for a specific
                customer. Valid characters are lower case letters (a-z), upper
                case letters (A-Z), digits (0-9), and dashes (-).


                If left blank, we will generate one automatically.
              maxLength: 500
              type: string
            customer:
              description: >-
                The customer who can use this promotion code. If not set, all
                customers can use the promotion code.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                The account representing the customer who can use this promotion
                code. If not set, all customers can use the promotion code.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            expires_at:
              description: >-
                The timestamp at which this promotion code will expire. If the
                coupon has specified a `redeems_by`, then this value cannot be
                after the coupon's `redeems_by`.
              format: unix-time
              type: integer
            max_redemptions:
              description: >-
                A positive integer specifying the number of times the promotion
                code can be redeemed. If the coupon has specified a
                `max_redemptions`, then this value cannot be greater than the
                coupon's `max_redemptions`.
              type: integer
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            promotion:
              description: The promotion referenced by this promotion code.
              properties:
                coupon:
                  maxLength: 5000
                  type: string
                type:
                  enum:
                    - coupon
                  type: string
              required:
                - type
              title: promotion
              type: object
            restrictions:
              description: Settings that restrict the redemption of the promotion code.
              properties:
                currency_options:
                  additionalProperties:
                    properties:
                      minimum_amount:
                        type: integer
                    title: currency_option
                    type: object
                  type: object
                first_time_transaction:
                  type: boolean
                minimum_amount:
                  type: integer
                minimum_amount_currency:
                  format: currency
                  type: string
              title: restrictions_params
              type: object
          required:
            - promotion
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/promotion_code.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a promotion code
