post:
  description: <p>Reverse a test-mode Authorization.</p>
  operationId: PostTestHelpersIssuingAuthorizationsAuthorizationReverse
  parameters:
    - in: path
      name: authorization
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            reverse_amount:
              description: >-
                The amount to reverse from the authorization. If not provided,
                the full amount of the authorization will be reversed. This
                amount is in the authorization currency and in the [smallest
                currency unit](https://docs.stripe.com/currencies#zero-decimal).
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.authorization.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Reverse a test-mode authorization
