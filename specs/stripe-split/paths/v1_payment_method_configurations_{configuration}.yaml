        schema:
          additionalProperties: false
          properties:
            acss_debit:
              description: >-
                Canadian pre-authorized debit payments, check this
                [page](https://docs.stripe.com/payments/acss-debit) for more
                details like country availability.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            active:
              description: Whether the configuration can be used for new payments.
              type: boolean
            affirm:
              description: >-
                [Affirm](https://www.affirm.com/) gives your customers a way to
                split purchases over a series of payments. Depending on the
                purchase, they can pay with four interest-free payments (Split
                Pay) or pay over a longer term (Installments), which might
                include interest. Check this
                [page](https://docs.stripe.com/payments/affirm) for more details
                like country availability.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            afterpay_clearpay:
              description: >-
                Afterpay gives your customers a way to pay for purchases in
                installments, check this
                [page](https://docs.stripe.com/payments/afterpay-clearpay) for
                more details like country availability. Afterpay is particularly
                popular among businesses selling fashion, beauty, and sports
                products.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            alipay:
              description: >-
                Alipay is a digital wallet in China that has more than a billion
                active users worldwide. Alipay users can pay on the web or on a
                mobile device using login credentials or their Alipay app.
                Alipay has a low dispute rate and reduces fraud by
                authenticating payments using the customer's login credentials.
                Check this [page](https://docs.stripe.com/payments/alipay) for
                more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            alma:
              description: >-
                Alma is a Buy Now, Pay Later payment method that offers
                customers the ability to pay in 2, 3, or 4 installments.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            amazon_pay:
              description: >-
                Amazon Pay is a wallet payment method that lets your customers
                check out the same way as on Amazon.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            apple_pay:
              description: >-
                Stripe users can accept [Apple
                Pay](https://stripe.com/payments/apple-pay) in iOS applications
                in iOS 9 and later, and on the web in Safari starting with iOS
                10 or macOS Sierra. There are no additional fees to process
                Apple Pay payments, and the
                [pricing](https://stripe.com/pricing) is the same as other card
                transactions. Check this
                [page](https://docs.stripe.com/apple-pay) for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            apple_pay_later:
              description: >-
                Apple Pay Later, a payment method for customers to buy now and
                pay later, gives your customers a way to split purchases into
                four installments across six weeks.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            au_becs_debit:
              description: >-
                Stripe users in Australia can accept Bulk Electronic Clearing
                System (BECS) direct debit payments from customers with an
                Australian bank account. Check this
                [page](https://docs.stripe.com/payments/au-becs-debit) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            bacs_debit:
              description: >-
                Stripe users in the UK can accept Bacs Direct Debit payments
                from customers with a UK bank account, check this
                [page](https://docs.stripe.com/payments/payment-methods/bacs-debit)
                for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            bancontact:
              description: >-
                Bancontact is the most popular online payment method in Belgium,
                with over 15 million cards in circulation.
                [Customers](https://docs.stripe.com/api/customers) use a
                Bancontact card or mobile app linked to a Belgian bank account
                to make online payments that are secure, guaranteed, and
                confirmed immediately. Check this
                [page](https://docs.stripe.com/payments/bancontact) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            billie:
              description: >-
                Billie is a
                [single-use](https://docs.stripe.com/payments/payment-methods#usage)
                payment method that offers businesses Pay by Invoice where they
                offer payment terms ranging from 7-120 days. Customers are
                redirected from your website or app, authorize the payment with
                Billie, then return to your website or app. You get [immediate
                notification](/payments/payment-methods#payment-notification) of
                whether the payment succeeded or failed.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            bizum:
              description: >-
                To enable Bizum, buyers need a Spanish IBAN from a bank
                connected to Bizum. Within their banking app, they can enable
                Bizum and link their mobile number to their IBAN.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            blik:
              description: >-
                BLIK is a [single
                use](https://docs.stripe.com/payments/payment-methods#usage)
                payment method that requires customers to authenticate their
                payments. When customers want to pay online using BLIK, they
                request a six-digit code from their banking application and
                enter it into the payment collection form. Check this
                [page](https://docs.stripe.com/payments/blik) for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            boleto:
              description: >-
                Boleto is an official (regulated by the Central Bank of Brazil)
                payment method in Brazil. Check this
                [page](https://docs.stripe.com/payments/boleto) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            card:
              description: >-
                Cards are a popular way for consumers and businesses to pay
                online or in person. Stripe supports global and local card
                networks.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            cartes_bancaires:
              description: >-
                Cartes Bancaires is France's local card network. More than 95%
                of these cards are co-branded with either Visa or Mastercard,
                meaning you can process these cards over either Cartes Bancaires
                or the Visa or Mastercard networks. Check this
                [page](https://docs.stripe.com/payments/cartes-bancaires) for
                more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            cashapp:
              description: >-
                Cash App is a popular consumer app in the US that allows
                customers to bank, invest, send, and receive money using their
                digital wallet. Check this
                [page](https://docs.stripe.com/payments/cash-app-pay) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            crypto:
              description: >-
                [Stablecoin
                payments](https://docs.stripe.com/payments/stablecoin-payments)
                enable customers to pay in stablecoins like USDC from 100s of
                wallets including Phantom and Metamask.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            customer_balance:
              description: >-
                Uses a customer’s [cash
                balance](https://docs.stripe.com/payments/customer-balance) for
                the payment. The cash balance can be funded via a bank transfer.
                Check this
                [page](https://docs.stripe.com/payments/bank-transfers) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            eps:
              description: >-
                EPS is an Austria-based payment method that allows customers to
                complete transactions online using their bank credentials. EPS
                is supported by all Austrian banks and is accepted by over 80%
                of Austrian online retailers. Check this
                [page](https://docs.stripe.com/payments/eps) for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            fpx:
              description: >-
                Financial Process Exchange (FPX) is a Malaysia-based payment
                method that allows customers to complete transactions online
                using their bank credentials. Bank Negara Malaysia (BNM), the
                Central Bank of Malaysia, and eleven other major Malaysian
                financial institutions are members of the PayNet Group, which
                owns and operates FPX. It is one of the most popular online
                payment methods in Malaysia, with nearly 90 million transactions
                in 2018 according to BNM. Check this
                [page](https://docs.stripe.com/payments/fpx) for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            fr_meal_voucher_conecs:
              description: >-
                Meal vouchers in France, or “titres-restaurant”, is a local
                benefits program commonly offered by employers for their
                employees to purchase prepared food and beverages on working
                days. Check this
                [page](https://docs.stripe.com/payments/meal-vouchers/fr-meal-vouchers)
                for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            giropay:
              description: >-
                giropay is a German payment method based on online banking,
                introduced in 2006. It allows customers to complete transactions
                online using their online banking environment, with funds
                debited from their bank account. Depending on their bank,
                customers confirm payments on giropay using a second factor of
                authentication or a PIN. giropay accounts for 10% of online
                checkouts in Germany. Check this
                [page](https://docs.stripe.com/payments/giropay) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            google_pay:
              description: >-
                Google Pay allows customers to make payments in your app or
                website using any credit or debit card saved to their Google
                Account, including those from Google Play, YouTube, Chrome, or
                an Android device. Use the Google Pay API to request any credit
                or debit card stored in your customer's Google account. Check
                this [page](https://docs.stripe.com/google-pay) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            grabpay:
              description: >-
                GrabPay is a payment method developed by
                [Grab](https://www.grab.com/sg/consumer/finance/pay/). GrabPay
                is a digital wallet - customers maintain a balance in their
                wallets that they pay out with. Check this
                [page](https://docs.stripe.com/payments/grabpay) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            ideal:
              description: >-
                iDEAL is a Netherlands-based payment method that allows
                customers to complete transactions online using their bank
                credentials. All major Dutch banks are members of Currence, the
                scheme that operates iDEAL, making it the most popular online
                payment method in the Netherlands with a share of online
                transactions close to 55%. Check this
                [page](https://docs.stripe.com/payments/ideal) for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            jcb:
              description: >-
                JCB is a credit card company based in Japan. JCB is currently
                available in Japan to businesses approved by JCB, and available
                to all businesses in Australia, Canada, Hong Kong, Japan, New
                Zealand, Singapore, Switzerland, United Kingdom, United States,
                and all countries in the European Economic Area except Iceland.
                Check this
                [page](https://support.stripe.com/questions/accepting-japan-credit-bureau-%28jcb%29-payments)
                for more details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            kakao_pay:
              description: Kakao Pay is a popular local wallet available in South Korea.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            klarna:
              description: >-
                Klarna gives customers a range of [payment
                options](https://docs.stripe.com/payments/klarna#payment-options)
                during checkout. Available payment options vary depending on the
                customer's billing address and the transaction amount. These
                payment options make it convenient for customers to purchase
                items in all price ranges. Check this
                [page](https://docs.stripe.com/payments/klarna) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            konbini:
              description: >-
                Konbini allows customers in Japan to pay for bills and online
                purchases at convenience stores with cash. Check this
                [page](https://docs.stripe.com/payments/konbini) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            kr_card:
              description: >-
                Korean cards let users pay using locally issued cards from South
                Korea.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            link:
              description: >-
                [Link](https://docs.stripe.com/payments/link) is a payment
                method network. With Link, users save their payment details
                once, then reuse that information to pay with one click for any
                business on the network.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            mb_way:
              description: >-
                MB WAY is the most popular wallet in Portugal. After entering
                their phone number in your checkout, customers approve the
                payment directly in their MB WAY app. Check this
                [page](https://docs.stripe.com/payments/mb-way) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
                  type: object
              title: payment_method_param
              type: object
            mobilepay:
              description: >-
                MobilePay is a
                [single-use](https://docs.stripe.com/payments/payment-methods#usage)
                card wallet payment method used in Denmark and Finland. It
                allows customers to [authenticate and
                approve](https://docs.stripe.com/payments/payment-methods#customer-actions)
                payments using the MobilePay app. Check this
                [page](https://docs.stripe.com/payments/mobilepay) for more
                details.
              properties:
                display_preference:
                  properties:
                    preference:
                      enum:
                        - none
                        - 'off'
                        - 'on'
                      type: string
                  title: display_preference_param
