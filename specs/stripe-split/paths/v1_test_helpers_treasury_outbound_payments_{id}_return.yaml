post:
  description: >-
    <p>Transitions a test mode created OutboundPayment to the
    <code>returned</code> status. The OutboundPayment must already be in the
    <code>processing</code> state.</p>
  operationId: PostTestHelpersTreasuryOutboundPaymentsIdReturn
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          returned_details:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            returned_details:
              description: Optional hash to set the return code.
              properties:
                code:
                  enum:
                    - account_closed
                    - account_frozen
                    - bank_account_restricted
                    - bank_ownership_changed
                    - declined
                    - incorrect_account_holder_name
                    - invalid_account_number
                    - invalid_currency
                    - no_account
                    - other
                  type: string
              title: returned_details_params
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.outbound_payment.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: 'Test mode: Return an OutboundPayment'
