get:
  description: >-
    <p>Retrieves a specific cash balance transaction, which updated the
    customer’s <a href="/docs/payments/customer-balance">cash balance</a>.</p>
  operationId: GetCustomersCustomerCashBalanceTransactionsTransaction
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: transaction
      required: true
      schema:
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer_cash_balance_transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a cash balance transaction
