                  - promptpay
                  - satispay
                  - sepa_debit
                  - sofort
                  - sunbit
                  - swish
                  - twint
                  - upi
                  - us_bank_account
                  - wechat_pay
                  - zip
                type: string
                x-stripeBypassValidation: true
              type: array
            phone_number_collection:
              description: >-
                Controls phone number collection settings during checkout.


                We recommend that you review your privacy policy and check with
                your legal contacts.
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
              title: phone_number_collection_params
              type: object
            restrictions:
              description: Settings that restrict the usage of a payment link.
              properties:
                completed_sessions:
                  properties:
                    limit:
                      type: integer
                  required:
                    - limit
                  title: completed_sessions_params
                  type: object
              required:
                - completed_sessions
              title: restrictions_params
              type: object
