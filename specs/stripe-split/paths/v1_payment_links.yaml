get:
  description: <p>Returns a list of your payment links.</p>
  operationId: GetPaymentLinks
  parameters:
    - description: >-
        Only return payment links that are active or inactive (e.g., pass
        `false` to list all inactive payment links).
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/payment_link.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/payment_links
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: PaymentLinksResourcePaymentLinkList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all payment links
post:
  description: <p>Creates a payment link.</p>
  operationId: PostPaymentLinks
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          after_completion:
            explode: true
            style: deepObject
          automatic_tax:
            explode: true
            style: deepObject
          consent_collection:
            explode: true
            style: deepObject
          custom_fields:
            explode: true
            style: deepObject
          custom_text:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          invoice_creation:
            explode: true
            style: deepObject
          line_items:
            explode: true
            style: deepObject
          managed_payments:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          name_collection:
            explode: true
            style: deepObject
          optional_items:
            explode: true
            style: deepObject
          payment_intent_data:
            explode: true
            style: deepObject
          payment_method_options:
            explode: true
            style: deepObject
          payment_method_types:
            explode: true
            style: deepObject
          phone_number_collection:
            explode: true
            style: deepObject
          restrictions:
            explode: true
            style: deepObject
          shipping_address_collection:
            explode: true
            style: deepObject
          shipping_options:
            explode: true
            style: deepObject
          subscription_data:
            explode: true
            style: deepObject
          tax_id_collection:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            after_completion:
              description: Behavior after the purchase is complete.
              properties:
                hosted_confirmation:
                  properties:
                    custom_message:
                      maxLength: 500
                      type: string
                  title: after_completion_confirmation_page_params
                  type: object
                redirect:
                  properties:
                    url:
                      type: string
                  required:
                    - url
                  title: after_completion_redirect_params
                  type: object
                type:
                  enum:
                    - hosted_confirmation
                    - redirect
                  type: string
              required:
                - type
              title: after_completion_params
              type: object
            allow_promotion_codes:
              description: Enables user redeemable promotion codes.
              type: boolean
            application_fee_amount:
              description: >-
                The amount of the application fee (if any) that will be
                requested to be applied to the payment and transferred to the
                application owner's Stripe account. Can only be applied when
                there are no line items with recurring prices.
              type: integer
            application_fee_percent:
              description: >-
                A non-negative decimal between 0 and 100, with at most two
                decimal places. This represents the percentage of the
                subscription invoice total that will be transferred to the
                application owner's Stripe account. There must be at least 1
                line item with a recurring price to use this field.
              type: number
            automatic_tax:
              description: Configuration for automatic tax collection.
              properties:
                enabled:
                  type: boolean
                liability:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              required:
                - enabled
              title: automatic_tax_params
              type: object
            billing_address_collection:
              description: >-
                Configuration for collecting the customer's billing address.
                Defaults to `auto`.
              enum:
                - auto
                - required
              type: string
            consent_collection:
              description: Configure fields to gather active consent from customers.
              properties:
                payment_method_reuse_agreement:
                  properties:
                    position:
                      enum:
                        - auto
                        - hidden
                      type: string
                  required:
                    - position
                  title: payment_method_reuse_agreement_params
                  type: object
                promotions:
                  enum:
                    - auto
                    - none
                  type: string
                terms_of_service:
                  enum:
                    - none
                    - required
                  type: string
              title: consent_collection_params
              type: object
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies) and supported by
                each line item's price.
              format: currency
              type: string
            custom_fields:
              description: >-
                Collect additional information from your customer using custom
                fields. Up to 3 fields are supported. You can't set this
                parameter if `ui_mode` is `custom`.
              items:
                properties:
                  dropdown:
                    properties:
                      default_value:
                        maxLength: 100
                        type: string
                      options:
                        items:
                          properties:
                            label:
                              maxLength: 100
                              type: string
                            value:
                              maxLength: 100
                              type: string
                          required:
                            - label
                            - value
                          title: custom_field_option_param
                          type: object
                        type: array
                    required:
                      - options
                    title: custom_field_dropdown_param
                    type: object
                  key:
                    maxLength: 200
                    type: string
                  label:
                    properties:
                      custom:
                        maxLength: 50
                        type: string
                      type:
                        enum:
                          - custom
                        type: string
                    required:
                      - custom
                      - type
                    title: custom_field_label_param
                    type: object
                  numeric:
                    properties:
                      default_value:
                        maxLength: 255
                        type: string
                      maximum_length:
                        type: integer
                      minimum_length:
                        type: integer
                    title: custom_field_numeric_param
                    type: object
                  optional:
                    type: boolean
                  text:
                    properties:
                      default_value:
                        maxLength: 255
                        type: string
                      maximum_length:
                        type: integer
                      minimum_length:
                        type: integer
                    title: custom_field_text_param
                    type: object
                  type:
                    enum:
                      - dropdown
                      - numeric
                      - text
                    type: string
                required:
                  - key
                  - label
                  - type
                title: custom_field_param
                type: object
              type: array
            custom_text:
              description: >-
                Display additional text for your customers using custom text.
                You can't set this parameter if `ui_mode` is `custom`.
              properties:
                after_submit:
                  anyOf:
                    - properties:
                        message:
                          maxLength: 1200
                          type: string
                      required:
                        - message
                      title: custom_text_position_param
                      type: object
                    - enum:
                        - ''
                      type: string
                shipping_address:
                  anyOf:
                    - properties:
                        message:
                          maxLength: 1200
                          type: string
                      required:
                        - message
                      title: custom_text_position_param
                      type: object
                    - enum:
                        - ''
                      type: string
                submit:
                  anyOf:
                    - properties:
                        message:
                          maxLength: 1200
                          type: string
                      required:
                        - message
                      title: custom_text_position_param
                      type: object
                    - enum:
                        - ''
                      type: string
                terms_of_service_acceptance:
                  anyOf:
                    - properties:
                        message:
                          maxLength: 1200
                          type: string
                      required:
                        - message
                      title: custom_text_position_param
                      type: object
                    - enum:
                        - ''
                      type: string
              title: custom_text_param
              type: object
            customer_creation:
              description: >-
                Configures whether [checkout
                sessions](https://docs.stripe.com/api/checkout/sessions) created
                by this payment link create a
                [Customer](https://docs.stripe.com/api/customers).
              enum:
                - always
                - if_required
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            inactive_message:
              description: >-
                The custom message to be displayed to a customer when a payment
                link is no longer active.
              maxLength: 500
              type: string
            invoice_creation:
              description: Generate a post-purchase Invoice for one-time payments.
              properties:
                enabled:
                  type: boolean
                invoice_data:
                  properties:
                    account_tax_ids:
                      anyOf:
                        - items:
                            maxLength: 5000
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    custom_fields:
                      anyOf:
                        - items:
                            properties:
                              name:
                                maxLength: 40
                                type: string
                              value:
                                maxLength: 140
                                type: string
                            required:
                              - name
                              - value
                            title: custom_field_params
                            type: object
                          type: array
                        - enum:
                            - ''
                          type: string
                    description:
                      maxLength: 1500
                      type: string
                    footer:
                      maxLength: 5000
                      type: string
                    issuer:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                    metadata:
                      anyOf:
                        - additionalProperties:
                            type: string
                          type: object
                        - enum:
                            - ''
                          type: string
                    rendering_options:
                      anyOf:
                        - properties:
                            amount_tax_display:
                              enum:
                                - ''
                                - exclude_tax
                                - include_inclusive_tax
                              type: string
                            template:
                              maxLength: 5000
                              type: string
                          title: checkout_rendering_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                  title: invoice_settings_params
                  type: object
              required:
                - enabled
              title: invoice_creation_create_params
              type: object
            line_items:
              description: >-
                The line items representing what is being sold. Each line item
                represents an item being sold. Up to 20 line items are
                supported.
              items:
                properties:
                  adjustable_quantity:
                    properties:
                      enabled:
                        type: boolean
                      maximum:
                        type: integer
                      minimum:
                        type: integer
                    required:
                      - enabled
                    title: adjustable_quantity_params
                    type: object
                  price:
                    maxLength: 5000
                    type: string
                  price_data:
                    properties:
                      currency:
                        format: currency
                        type: string
                      product:
                        maxLength: 5000
                        type: string
                      product_data:
                        properties:
                          description:
                            maxLength: 40000
                            type: string
                          images:
                            items:
                              type: string
                            type: array
                          metadata:
                            additionalProperties:
                              type: string
                            type: object
                          name:
                            maxLength: 5000
                            type: string
                          tax_code:
                            maxLength: 5000
                            type: string
                          unit_label:
                            maxLength: 12
                            type: string
                        required:
                          - name
                        title: product_data
                        type: object
                      recurring:
                        properties:
                          interval:
                            enum:
                              - day
                              - month
                              - week
                              - year
                            type: string
                          interval_count:
                            type: integer
                        required:
                          - interval
                        title: recurring_adhoc
                        type: object
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    required:
                      - currency
                    title: custom_amount_price_data_with_product_data
                    type: object
                  quantity:
                    type: integer
                required:
                  - quantity
                title: line_items_create_params
                type: object
              type: array
            managed_payments:
              description: >-
                Settings for Managed Payments for this Payment Link and
                resulting [CheckoutSessions](/api/checkout/sessions/object),
                [PaymentIntents](/api/payment_intents/object),
                [Invoices](/api/invoices/object), and
                [Subscriptions](/api/subscriptions/object).
              properties:
                enabled:
                  type: boolean
              title: managed_payments_params
              type: object
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
                Metadata associated with this Payment Link will automatically be
                copied to [checkout
                sessions](https://docs.stripe.com/api/checkout/sessions) created
                by this payment link.
              type: object
            name_collection:
              description: Controls settings applied for collecting the customer's name.
              properties:
                business:
                  properties:
                    enabled:
                      type: boolean
                    optional:
                      type: boolean
                  required:
                    - enabled
                  title: name_collection_business_params
                  type: object
                individual:
                  properties:
                    enabled:
                      type: boolean
                    optional:
                      type: boolean
                  required:
                    - enabled
                  title: name_collection_individual_params
                  type: object
              title: name_collection_params
              type: object
            on_behalf_of:
              description: The account on behalf of which to charge.
              type: string
            optional_items:
              description: >-
                A list of optional items the customer can add to their order at
                checkout. Use this parameter to pass one-time or recurring
                [Prices](https://docs.stripe.com/api/prices).

                There is a maximum of 10 optional items allowed on a payment
                link, and the existing limits on the number of line items
                allowed on a payment link apply to the combined number of line
                items and optional items.

                There is a maximum of 20 combined line items and optional items.
              items:
                properties:
                  adjustable_quantity:
                    properties:
                      enabled:
                        type: boolean
                      maximum:
                        type: integer
                      minimum:
                        type: integer
                    required:
                      - enabled
                    title: optional_item_adjustable_quantity_params
                    type: object
                  price:
                    maxLength: 5000
                    type: string
                  quantity:
                    type: integer
                required:
                  - price
                  - quantity
                title: optional_item_params
                type: object
              type: array
            payment_intent_data:
              description: >-
                A subset of parameters to be passed to PaymentIntent creation
                for Checkout Sessions in `payment` mode.
              properties:
                capture_method:
                  enum:
                    - automatic
                    - automatic_async
                    - manual
                  type: string
                description:
                  maxLength: 1000
                  type: string
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                setup_future_usage:
                  enum:
                    - off_session
                    - on_session
                  type: string
                statement_descriptor:
                  maxLength: 22
                  type: string
                statement_descriptor_suffix:
                  maxLength: 22
                  type: string
                transfer_group:
                  maxLength: 5000
                  type: string
              title: payment_intent_data_params
              type: object
            payment_method_collection:
              description: >-
                Specify whether Checkout should collect a payment method. When
                set to `if_required`, Checkout will not collect a payment method
                when the total due for the session is 0.This may occur if the
                Checkout Session includes a free trial or a discount.


                Can only be set in `subscription` mode. Defaults to `always`.


                If you'd like information on how to collect a payment method
                outside of Checkout, read the guide on [configuring
                subscriptions with a free
                trial](https://docs.stripe.com/payments/checkout/free-trials).
              enum:
                - always
                - if_required
              type: string
              x-stripeBypassValidation: true
            payment_method_options:
              description: Payment-method-specific configuration.
              properties:
                card:
                  properties:
                    restrictions:
                      properties:
                        brands_blocked:
                          items:
                            enum:
                              - american_express
                              - discover_global_network
                              - mastercard
                              - visa
                            type: string
                          type: array
                      title: card_restrictions_params
                      type: object
                  title: card_payment_method_options_params
                  type: object
              title: payment_method_options_params
              type: object
            payment_method_types:
              description: >-
                The list of payment method types that customers can use. If no
                value is passed, Stripe will dynamically show relevant payment
                methods from your [payment method
                settings](https://dashboard.stripe.com/settings/payment_methods)
                (20+ payment methods
                [supported](https://docs.stripe.com/payments/payment-methods/integration-options#payment-method-product-support)).
              items:
                enum:
                  - affirm
                  - afterpay_clearpay
                  - alipay
                  - alma
                  - au_becs_debit
                  - bacs_debit
                  - bancontact
                  - billie
                  - bizum
                  - blik
                  - boleto
                  - card
                  - cashapp
                  - eps
                  - fpx
                  - giropay
                  - grabpay
