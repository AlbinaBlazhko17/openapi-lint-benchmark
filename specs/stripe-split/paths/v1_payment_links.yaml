                  shipping_rate:
                    maxLength: 5000
                    type: string
                title: shipping_option_params
                type: object
              type: array
            submit_type:
              description: >-
                Describes the type of transaction being performed in order to
                customize relevant text on the page, such as the submit button.
                Changing this value will also affect the hostname in the
                [url](https://docs.stripe.com/api/payment_links/payment_links/object#url)
                property (example: `donate.stripe.com`).
              enum:
                - auto
                - book
                - donate
                - pay
                - subscribe
              type: string
            subscription_data:
              description: >-
                When creating a subscription, the specified configuration data
                will be used. There must be at least one line item with a
                recurring price to use `subscription_data`.
              properties:
                description:
                  maxLength: 500
                  type: string
                invoice_settings:
                  properties:
                    issuer:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                  title: subscription_data_invoice_settings_params
                  type: object
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                trial_period_days:
                  type: integer
                trial_settings:
                  properties:
                    end_behavior:
                      properties:
                        missing_payment_method:
                          enum:
                            - cancel
                            - create_invoice
                            - pause
                          type: string
                      required:
                        - missing_payment_method
                      title: end_behavior
                      type: object
                  required:
                    - end_behavior
                  title: trial_settings_config
                  type: object
              title: subscription_data_params
              type: object
            tax_id_collection:
              description: Controls tax ID collection during checkout.
              properties:
                enabled:
                  type: boolean
                required:
                  enum:
                    - if_supported
                    - never
                  type: string
              required:
                - enabled
              title: tax_id_collection_params
              type: object
            transfer_data:
              description: >-
                The account (if any) the payments will be attributed to for tax
                reporting, and where funds from each payment will be transferred
                to.
              properties:
                amount:
                  type: integer
                destination:
                  type: string
              required:
                - destination
              title: transfer_data_params
              type: object
          required:
            - line_items
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_link.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a payment link
