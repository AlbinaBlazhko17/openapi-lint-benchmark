delete:
  description: >-
    <p>Deletes an item from the subscription. Removing a subscription item from
    a subscription will not cancel the subscription.</p>
  operationId: DeleteSubscriptionItemsItem
  parameters:
    - in: path
      name: item
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties:
            clear_usage:
              description: >-
                Delete all usage for the given subscription item. Allowed only
                when the current plan's `usage_type` is `metered`.
              type: boolean
            payment_behavior:
              description: >-
                Controls how Stripe handles payment when a subscription update
                requires payment and `collection_method=charge_automatically`.
              enum:
                - allow_incomplete
                - default_incomplete
                - error_if_incomplete
                - pending_if_incomplete
              type: string
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                when the billing cycle changes (e.g., when switching plans,
                resetting `billing_cycle_anchor=now`, or starting a trial), or
                if an item's `quantity` changes. The default value is
                `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            proration_date:
              description: >-
                If set, the proration will be calculated as though the
                subscription was updated at the given time. This can be used to
                apply the same proration that was previewed with the [upcoming
                invoice](/api/invoices/create_preview) endpoint.
              format: unix-time
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_subscription_item.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a subscription item
get:
  description: <p>Retrieves the subscription item with the given ID.</p>
  operationId: GetSubscriptionItemsItem
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: item
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_item.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a subscription item
post:
  description: <p>Updates the plan or quantity of an item on a current subscription.</p>
  operationId: PostSubscriptionItemsItem
  parameters:
    - in: path
      name: item
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          billing_thresholds:
            explode: true
            style: deepObject
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          price_data:
            explode: true
            style: deepObject
          tax_rates:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            billing_thresholds:
              anyOf:
                - properties:
                    usage_gte:
                      type: integer
                  required:
                    - usage_gte
                  title: item_billing_thresholds_param
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Define thresholds at which an invoice will be sent, and the
                subscription advanced to a new billing period. Pass an empty
                string to remove previously-defined thresholds.
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: The coupons to redeem into discounts for the subscription item.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            off_session:
              description: >-
                Indicates if a customer is on or off-session while an invoice
                payment is attempted. Defaults to `false` (on-session).
              type: boolean
            payment_behavior:
              description: >-
                Controls how Stripe handles payment when a subscription update
                requires payment and `collection_method=charge_automatically`.
              enum:
                - allow_incomplete
                - default_incomplete
                - error_if_incomplete
                - pending_if_incomplete
              type: string
            price:
              description: >-
                The ID of the price object. One of `price` or `price_data` is
                required. When changing a subscription item's price, `quantity`
                is set to 1 unless a `quantity` parameter is provided.
              maxLength: 5000
              type: string
            price_data:
              description: >-
                Data used to generate a new
                [Price](https://docs.stripe.com/api/prices) object inline. One
                of `price` or `price_data` is required.
              properties:
                currency:
                  format: currency
                  type: string
                product:
                  maxLength: 5000
                  type: string
                recurring:
                  properties:
                    interval:
                      enum:
                        - day
                        - month
                        - week
                        - year
                      type: string
                    interval_count:
                      type: integer
                  required:
                    - interval
                  title: recurring_adhoc
                  type: object
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - unspecified
                  type: string
                unit_amount:
                  type: integer
                unit_amount_decimal:
                  format: decimal
                  type: string
              required:
                - currency
                - product
                - recurring
              title: recurring_price_data
              type: object
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                when the billing cycle changes (e.g., when switching plans,
                resetting `billing_cycle_anchor=now`, or starting a trial), or
                if an item's `quantity` changes. The default value is
                `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            proration_date:
              description: >-
                If set, the proration will be calculated as though the
                subscription was updated at the given time. This can be used to
                apply the same proration that was previewed with the [upcoming
                invoice](/api/invoices/create_preview) endpoint.
              format: unix-time
              type: integer
            quantity:
              description: >-
                The quantity you'd like to apply to the subscription item you're
                creating.
              type: integer
            tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of [Tax Rate](https://docs.stripe.com/api/tax_rates) ids.
                These Tax Rates will override the
                [`default_tax_rates`](https://docs.stripe.com/api/subscriptions/create#create_subscription-default_tax_rates)
                on the Subscription. When updating, pass an empty string to
                remove previously-defined tax rates.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_item.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a subscription item
