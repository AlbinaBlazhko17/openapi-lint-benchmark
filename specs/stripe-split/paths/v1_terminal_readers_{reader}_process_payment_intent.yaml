post:
  description: >-
    <p>Initiates a payment flow on a Reader. See <a
    href="/docs/terminal/payments/collect-card-payment?terminal-sdk-platform=server-driven&process=immediately#process-payment">process
    the payment</a> for more details.</p>
  operationId: PostTerminalReadersReaderProcessPaymentIntent
  parameters:
    - in: path
      name: reader
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          process_config:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            payment_intent:
              description: The ID of the PaymentIntent to process on the reader.
              maxLength: 5000
              type: string
            process_config:
              description: >-
                Configuration overrides for this transaction, such as tipping
                and customer cancellation settings.
              properties:
                allow_redisplay:
                  enum:
                    - always
                    - limited
                    - unspecified
                  type: string
                enable_customer_cancellation:
                  type: boolean
                return_url:
                  type: string
                skip_tipping:
                  type: boolean
                tipping:
                  properties:
                    amount_eligible:
                      type: integer
                  title: tipping_config
                  type: object
              title: process_config
              type: object
          required:
            - payment_intent
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/terminal.reader.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Hand-off a PaymentIntent to a Reader
