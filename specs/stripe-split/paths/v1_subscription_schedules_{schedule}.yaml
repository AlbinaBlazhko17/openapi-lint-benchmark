get:
  description: >-
    <p>Retrieves the details of an existing subscription schedule. You only need
    to supply the unique subscription schedule identifier that was returned upon
    subscription schedule creation.</p>
  operationId: GetSubscriptionSchedulesSchedule
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: schedule
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_schedule.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a schedule
post:
  description: <p>Updates an existing subscription schedule.</p>
  operationId: PostSubscriptionSchedulesSchedule
  parameters:
    - in: path
      name: schedule
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          default_settings:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          phases:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            default_settings:
              description: >-
                Object representing the subscription schedule's default
                settings.
              properties:
                application_fee_percent:
                  type: number
                automatic_tax:
                  properties:
                    enabled:
                      type: boolean
                    liability:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                  required:
                    - enabled
                  title: automatic_tax_config
                  type: object
                billing_cycle_anchor:
                  enum:
                    - automatic
                    - phase_start
                  type: string
                billing_thresholds:
                  anyOf:
                    - properties:
                        amount_gte:
                          type: integer
                        reset_billing_cycle_anchor:
                          type: boolean
                      title: billing_thresholds_param
                      type: object
                    - enum:
                        - ''
                      type: string
                collection_method:
                  enum:
                    - charge_automatically
                    - send_invoice
                  type: string
                default_payment_method:
                  maxLength: 5000
                  type: string
                description:
                  anyOf:
                    - maxLength: 500
                      type: string
                    - enum:
                        - ''
                      type: string
                invoice_settings:
                  properties:
                    account_tax_ids:
                      anyOf:
                        - items:
                            maxLength: 5000
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    custom_fields:
                      anyOf:
                        - items:
                            properties:
                              name:
                                maxLength: 40
                                type: string
                              value:
                                maxLength: 140
                                type: string
                            required:
                              - name
                              - value
                            title: custom_field_params
                            type: object
                          type: array
                        - enum:
                            - ''
                          type: string
                    days_until_due:
                      type: integer
                    description:
                      anyOf:
                        - maxLength: 1500
                          type: string
                        - enum:
                            - ''
                          type: string
                    footer:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    issuer:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                  title: subscription_schedule_default_settings_param
                  type: object
                on_behalf_of:
                  anyOf:
                    - type: string
                    - enum:
                        - ''
                      type: string
                transfer_data:
                  anyOf:
                    - properties:
                        amount_percent:
                          type: number
                        destination:
                          type: string
                      required:
                        - destination
                      title: transfer_data_specs
                      type: object
                    - enum:
                        - ''
                      type: string
              title: default_settings_params
              type: object
            end_behavior:
              description: >-
                Behavior of the subscription schedule and underlying
                subscription when it ends. Possible values are `release` or
                `cancel` with the default being `release`. `release` will end
                the subscription schedule and keep the underlying subscription
                running. `cancel` will end the subscription schedule and cancel
                the underlying subscription.
              enum:
                - cancel
                - none
                - release
                - renew
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            phases:
              description: >-
                List representing phases of the subscription schedule. Each
                phase can be customized to have different durations, plans, and
                coupons. If there are multiple phases, the `end_date` of one
                phase will always equal the `start_date` of the next phase. Note
                that past phases can be omitted.
              items:
                properties:
                  add_invoice_items:
                    items:
                      properties:
                        discountable:
                          type: boolean
                        discounts:
                          items:
                            properties:
                              coupon:
                                maxLength: 5000
                                type: string
                              discount:
                                maxLength: 5000
                                type: string
                              promotion_code:
                                maxLength: 5000
                                type: string
                            title: discounts_data_param
                            type: object
                          type: array
                        metadata:
                          additionalProperties:
                            type: string
                          type: object
                        period:
                          properties:
                            end:
                              properties:
                                timestamp:
                                  format: unix-time
                                  type: integer
                                type:
                                  enum:
                                    - min_item_period_end
                                    - phase_end
                                    - timestamp
                                  type: string
                                  x-stripeBypassValidation: true
                              required:
                                - type
                              title: invoice_item_period_end
                              type: object
                            start:
                              properties:
                                timestamp:
                                  format: unix-time
                                  type: integer
                                type:
                                  enum:
                                    - max_item_period_start
                                    - phase_start
                                    - timestamp
                                  type: string
                                  x-stripeBypassValidation: true
                              required:
                                - type
                              title: invoice_item_period_start
                              type: object
                          required:
                            - end
                            - start
                          title: invoice_item_period
                          type: object
                        price:
                          maxLength: 5000
                          type: string
                        price_data:
                          properties:
                            currency:
                              format: currency
                              type: string
                            product:
                              maxLength: 5000
                              type: string
                            tax_behavior:
                              enum:
                                - exclusive
                                - inclusive
                                - unspecified
                              type: string
                            unit_amount:
                              type: integer
                            unit_amount_decimal:
                              format: decimal
                              type: string
                          required:
                            - currency
                            - product
                          title: one_time_price_data_with_negative_amounts
                          type: object
                        quantity:
                          type: integer
                        tax_rates:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      title: add_invoice_item_entry
                      type: object
                    type: array
                  application_fee_percent:
                    type: number
                  automatic_tax:
                    properties:
                      enabled:
                        type: boolean
                      liability:
                        properties:
                          account:
                            type: string
                          type:
                            enum:
                              - account
                              - self
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: param
                        type: object
                    required:
                      - enabled
                    title: automatic_tax_config
                    type: object
                  billing_cycle_anchor:
                    enum:
                      - automatic
                      - phase_start
                    type: string
                  billing_thresholds:
                    anyOf:
                      - properties:
                          amount_gte:
                            type: integer
                          reset_billing_cycle_anchor:
                            type: boolean
                        title: billing_thresholds_param
                        type: object
                      - enum:
                          - ''
                        type: string
                  collection_method:
                    enum:
                      - charge_automatically
                      - send_invoice
                    type: string
                  default_payment_method:
                    maxLength: 5000
                    type: string
                  default_tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                  description:
                    anyOf:
                      - maxLength: 500
                        type: string
                      - enum:
                          - ''
                        type: string
                  discounts:
                    anyOf:
                      - items:
                          properties:
                            coupon:
                              maxLength: 5000
                              type: string
                            discount:
                              maxLength: 5000
                              type: string
                            promotion_code:
                              maxLength: 5000
                              type: string
                          title: schedule_discounts_data_param
                          type: object
                        type: array
                      - enum:
                          - ''
                        type: string
                  duration:
                    properties:
                      interval:
                        enum:
                          - day
                          - month
                          - week
                          - year
                        type: string
                      interval_count:
                        type: integer
                    required:
                      - interval
                    title: duration_params
                    type: object
                  end_date:
                    anyOf:
                      - format: unix-time
                        type: integer
                      - enum:
                          - now
                        maxLength: 5000
                        type: string
                  invoice_settings:
                    properties:
                      account_tax_ids:
                        anyOf:
                          - items:
                              maxLength: 5000
                              type: string
                            type: array
                          - enum:
                              - ''
                            type: string
                      custom_fields:
                        anyOf:
                          - items:
                              properties:
                                name:
                                  maxLength: 40
                                  type: string
                                value:
                                  maxLength: 140
                                  type: string
                              required:
                                - name
                                - value
                              title: custom_field_params
                              type: object
                            type: array
                          - enum:
                              - ''
                            type: string
                      days_until_due:
                        type: integer
                      description:
                        anyOf:
                          - maxLength: 1500
                            type: string
                          - enum:
                              - ''
                            type: string
                      footer:
                        anyOf:
                          - maxLength: 5000
                            type: string
                          - enum:
                              - ''
                            type: string
                      issuer:
                        properties:
                          account:
                            type: string
                          type:
                            enum:
                              - account
                              - self
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: param
                        type: object
                    title: schedule_phase_invoice_settings
                    type: object
                  items:
                    items:
                      properties:
                        billing_thresholds:
                          anyOf:
                            - properties:
                                usage_gte:
                                  type: integer
                              required:
                                - usage_gte
                              title: item_billing_thresholds_param
                              type: object
                            - enum:
                                - ''
                              type: string
                        discounts:
                          anyOf:
                            - items:
                                properties:
                                  coupon:
                                    maxLength: 5000
                                    type: string
                                  discount:
                                    maxLength: 5000
                                    type: string
                                  promotion_code:
                                    maxLength: 5000
                                    type: string
                                title: schedule_discounts_data_param
                                type: object
                              type: array
                            - enum:
                                - ''
                              type: string
                        metadata:
                          additionalProperties:
                            type: string
                          type: object
                        price:
                          maxLength: 5000
                          type: string
                        price_data:
                          properties:
                            currency:
                              format: currency
                              type: string
                            product:
                              maxLength: 5000
                              type: string
                            recurring:
                              properties:
                                interval:
                                  enum:
                                    - day
                                    - month
                                    - week
                                    - year
                                  type: string
                                interval_count:
                                  type: integer
                              required:
                                - interval
                              title: recurring_adhoc
                              type: object
                            tax_behavior:
                              enum:
                                - exclusive
                                - inclusive
                                - unspecified
                              type: string
                            unit_amount:
                              type: integer
                            unit_amount_decimal:
                              format: decimal
                              type: string
                          required:
                            - currency
                            - product
                            - recurring
                          title: recurring_price_data
                          type: object
                        quantity:
                          type: integer
                        tax_rates:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      title: configuration_item_params
                      type: object
                    type: array
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  on_behalf_of:
                    type: string
                  proration_behavior:
                    enum:
                      - always_invoice
                      - create_prorations
                      - none
                    type: string
                  start_date:
                    anyOf:
                      - format: unix-time
                        type: integer
                      - enum:
                          - now
                        maxLength: 5000
                        type: string
                  transfer_data:
                    properties:
                      amount_percent:
                        type: number
                      destination:
                        type: string
                    required:
                      - destination
                    title: transfer_data_specs
                    type: object
                  trial:
                    type: boolean
                  trial_end:
                    anyOf:
                      - format: unix-time
                        type: integer
                      - enum:
                          - now
                        maxLength: 5000
                        type: string
                required:
                  - items
                title: phase_configuration_params
                type: object
              type: array
            proration_behavior:
              description: >-
                If the update changes the billing configuration (item price,
                quantity, etc.) of the current phase, indicates how prorations
                from this change should be handled. The default value is
                `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_schedule.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a schedule
