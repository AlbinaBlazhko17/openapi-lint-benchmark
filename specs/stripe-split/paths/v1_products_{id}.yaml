delete:
  description: >-
    <p>Delete a product. Deleting a product is only possible if it has no prices
    associated with it. Additionally, deleting a product with
    <code>type=good</code> is only possible if it has no SKUs associated with
    it.</p>
  operationId: DeleteProductsId
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_product.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a product
get:
  description: >-
    <p>Retrieves the details of an existing product. Supply the unique product
    ID from either a product creation request or the product list, and Stripe
    will return the corresponding product information.</p>
  operationId: GetProductsId
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/product.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a product
post:
  description: >-
    <p>Updates the specific product by setting the values of the parameters
    passed. Any parameters not provided will be left unchanged.</p>
  operationId: PostProductsId
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          description:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          images:
            explode: true
            style: deepObject
          marketing_features:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          package_dimensions:
            explode: true
            style: deepObject
          tax_code:
            explode: true
            style: deepObject
          unit_label:
            explode: true
            style: deepObject
          url:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: Whether the product is available for purchase.
              type: boolean
            default_price:
              description: >-
                The ID of the [Price](https://docs.stripe.com/api/prices) object
                that is the default price for this product.
              maxLength: 5000
              type: string
            description:
              anyOf:
                - maxLength: 40000
                  type: string
                - enum:
                    - ''
                  type: string
              description: >-
                The product's description, meant to be displayable to the
                customer. Use this field to optionally store a long form
                explanation of the product being sold for your own rendering
                purposes.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            images:
              anyOf:
                - items:
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of up to 8 URLs of images for this product, meant to be
                displayable to the customer.
            marketing_features:
              anyOf:
                - items:
                    properties:
                      name:
                        maxLength: 5000
                        type: string
                    required:
                      - name
                    title: features
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of up to 15 marketing features for this product. These
                are displayed in [pricing
                tables](https://docs.stripe.com/payments/checkout/pricing-table).
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            name:
              description: The product's name, meant to be displayable to the customer.
              maxLength: 5000
              type: string
            package_dimensions:
              anyOf:
                - properties:
                    height:
                      type: number
                    length:
                      type: number
                    weight:
                      type: number
                    width:
                      type: number
                  required:
                    - height
                    - length
                    - weight
                    - width
                  title: package_dimensions_specs
                  type: object
                - enum:
                    - ''
                  type: string
              description: The dimensions of this product for shipping purposes.
            shippable:
              description: Whether this product is shipped (i.e., physical goods).
              type: boolean
            statement_descriptor:
              description: >-
                An arbitrary string to be displayed on your customer's credit
                card or bank statement. While most banks display this
                information consistently, some may display it incorrectly or not
                at all.


                This may be up to 22 characters. The statement description may
                not include `<`, `>`, `\`, `"`, `'` characters, and will appear
                on your customer's statement in capital letters. Non-ASCII
                characters are automatically stripped.
                 It must contain at least one letter. May only be set if `type=service`. Only used for subscription payments.
              maxLength: 22
              type: string
            tax_code:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: A [tax code](https://docs.stripe.com/tax/tax-categories) ID.
            unit_label:
              anyOf:
                - maxLength: 12
                  type: string
                - enum:
                    - ''
                  type: string
              description: >-
                A label that represents units of this product. When set, this
                will be included in customers' receipts, invoices, Checkout, and
                the customer portal. May only be set if `type=service`.
            url:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: A URL of a publicly-accessible webpage for this product.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/product.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a product
