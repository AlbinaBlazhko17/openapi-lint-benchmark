post:
  description: <p>Creates a short-lived API key for a given resource.</p>
  operationId: PostEphemeralKeys
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            customer:
              description: >-
                The ID of the Customer you'd like to modify using the resulting
                ephemeral key.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            issuing_card:
              description: >-
                The ID of the Issuing Card you'd like to access using the
                resulting ephemeral key.
              maxLength: 5000
              type: string
            nonce:
              description: >-
                A single-use token, created by Stripe.js, used for creating
                ephemeral keys for Issuing Cards without exchanging sensitive
                information.
              maxLength: 5000
              type: string
            verification_session:
              description: >-
                The ID of the Identity VerificationSession you'd like to access
                using the resulting ephemeral key
              maxLength: 5000
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ephemeral_key.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create an ephemeral key
