get:
  description: <p>Retrieves information about the specified Account Capability.</p>
  operationId: GetAccountsAccountCapabilitiesCapability
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: capability
      required: true
      schema:
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/capability.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve an Account Capability
post:
  description: >-
    <p>Updates an existing Account Capability. Request or remove a capability by
    updating its <code>requested</code> parameter.</p>
  operationId: PostAccountsAccountCapabilitiesCapability
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: capability
      required: true
      schema:
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            requested:
              description: >-
                To request a new capability for an account, pass true. There can
                be a delay before the requested capability becomes active. If
                the capability has any activation requirements, the response
                includes them in the `requirements` arrays.


                If a capability isn't permanent, you can remove it from the
                account by passing false. Some capabilities are permanent after
                they've been requested. Attempting to remove a permanent
                capability returns an error.
              type: boolean
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/capability.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update an Account Capability
