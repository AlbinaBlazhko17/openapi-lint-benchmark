get:
  description: <p>Returns a list of PaymentMethods for a given Customer</p>
  operationId: GetCustomersCustomerPaymentMethods
  parameters:
    - description: >-
        This field indicates whether this payment method can be shown again to
        its customer in a checkout flow. Stripe products such as Checkout and
        Elements use this field to determine whether a payment method can be
        shown as a saved payment method in a checkout flow.
      in: query
      name: allow_redisplay
      required: false
      schema:
        enum:
          - always
          - limited
          - unspecified
        type: string
      style: form
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        An optional filter on the list, based on the object `type` field.
        Without the filter, the list includes all current and future payment
        method types. If your integration expects only one type of payment
        method in the response, make sure to provide a type value in the
        request.
      in: query
      name: type
      required: false
      schema:
        enum:
          - acss_debit
          - affirm
          - afterpay_clearpay
          - alipay
          - alma
          - amazon_pay
          - au_becs_debit
          - bacs_debit
          - bancontact
          - billie
          - bizum
          - blik
          - boleto
          - card
          - cashapp
          - crypto
          - custom
          - customer_balance
          - eps
          - fpx
          - giropay
          - grabpay
          - ideal
          - kakao_pay
          - klarna
          - konbini
          - kr_card
          - link
          - mb_way
          - mobilepay
          - multibanco
          - naver_pay
          - nz_bank_account
          - oxxo
          - p24
          - pay_by_bank
          - payco
          - paynow
          - paypal
          - payto
          - pix
          - promptpay
          - revolut_pay
          - samsung_pay
          - satispay
          - scalapay
          - sepa_debit
          - sofort
          - sunbit
          - swish
          - twint
          - upi
          - us_bank_account
          - wechat_pay
          - zip
        type: string
        x-stripeBypassValidation: true
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/payment_method.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: CustomerPaymentMethodResourceList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List a Customer's PaymentMethods
