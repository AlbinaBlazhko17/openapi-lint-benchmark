get:
  description: >-
    <p>Returns a list of transactions that updated the customer’s <a
    href="/docs/billing/customer/balance">balances</a>.</p>
  operationId: GetCustomersCustomerBalanceTransactions
  parameters:
    - description: >-
        Only return customer balance transactions that were created during the
        given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Only return transactions that are related to the specified invoice.
      in: query
      name: invoice
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/customer_balance_transaction.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: CustomerBalanceTransactionList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List customer balance transactions
post:
  description: >-
    <p>Creates an immutable transaction that updates the customer’s credit <a
    href="/docs/billing/customer/balance">balance</a>.</p>
  operationId: PostCustomersCustomerBalanceTransactions
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The integer amount in **cents (or local equivalent)** to apply
                to the customer's credit balance.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies). Specifies the
                [`invoice_credit_balance`](https://docs.stripe.com/api/customers/object#customer_object-invoice_credit_balance)
                that this transaction will apply to. If the customer's
                `currency` is not set, it will be updated to this value.
              format: currency
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 350
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
          required:
            - amount
            - currency
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer_balance_transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a customer balance transaction
