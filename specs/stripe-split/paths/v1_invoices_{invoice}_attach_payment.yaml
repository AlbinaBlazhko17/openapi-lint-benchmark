post:
  description: >-
    <p>Attaches a PaymentIntent or an Out of Band Payment to the invoice, adding
    it to the list of <code>payments</code>.</p>


    <p>For the PaymentIntent, when the PaymentIntent’s status changes to
    <code>succeeded</code>, the payment is credited

    to the invoice, increasing its <code>amount_paid</code>. When the invoice is
    fully paid, the

    invoice’s status becomes <code>paid</code>.</p>


    <p>If the PaymentIntent’s status is already <code>succeeded</code> when it’s
    attached, it’s

    credited to the invoice immediately.</p>


    <p>See: <a href="/docs/invoicing/partial-payments">Partial payments</a> to
    learn more.</p>
  operationId: PostInvoicesInvoiceAttachPayment
  parameters:
    - in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            payment_intent:
              description: The ID of the PaymentIntent to attach to the invoice.
              maxLength: 5000
              type: string
            payment_record:
              description: The ID of the PaymentRecord to attach to the invoice.
              maxLength: 5000
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Attach a payment to an Invoice
