get:
  description: <p>List external accounts for an account.</p>
  operationId: GetAccountsAccountExternalAccounts
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Filter external accounts according to a particular object type.
      in: query
      name: object
      required: false
      schema:
        enum:
          - bank_account
          - card
        maxLength: 5000
        type: string
        x-stripeBypassValidation: true
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: >-
                  The list contains all external accounts that have been
                  attached to the Stripe account. These may be bank accounts or
                  cards.
                items:
                  anyOf:
                    - $ref: ../components/schemas/bank_account.yaml
                    - $ref: ../components/schemas/card.yaml
                  title: Polymorphic
                  x-stripeBypassValidation: true
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: ExternalAccountList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all external accounts
post:
  description: <p>Create an external account for a given account.</p>
  operationId: PostAccountsAccountExternalAccounts
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          bank_account:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            bank_account:
              anyOf:
                - properties:
                    account_holder_name:
                      maxLength: 5000
                      type: string
                    account_holder_type:
                      enum:
                        - company
                        - individual
                      maxLength: 5000
                      type: string
                    account_number:
                      maxLength: 5000
                      type: string
                    account_type:
                      enum:
                        - checking
                        - futsu
                        - savings
                        - toza
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    currency:
                      format: currency
                      type: string
                    documents:
                      properties:
                        bank_account_ownership_verification:
                          properties:
                            files:
                              items:
                                maxLength: 500
                                type: string
                              type: array
                          title: documents_param
                          type: object
                      title: external_account_documents_param
                      type: object
                    object:
                      enum:
                        - bank_account
                      maxLength: 5000
                      type: string
                    routing_number:
                      maxLength: 5000
                      type: string
                  required:
                    - account_number
                    - country
                  title: external_account_payout_bank_account
                  type: object
                - maxLength: 5000
                  type: string
              description: >-
                Either a token, like the ones returned by
                [Stripe.js](https://stripe.com/docs/js), or a dictionary
                containing a user's bank account details.
            default_for_currency:
              description: >-
                When set to true, or if this is the first external account added
                in this currency, this account becomes the default external
                account for its currency.
              type: boolean
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            external_account:
              description: >-
                A token, like the ones returned by
                [Stripe.js](https://docs.stripe.com/js) or a dictionary
                containing a user's external account details (with the options
                shown below). Please refer to full
                [documentation](https://stripe.com/docs/api/external_accounts)
                instead.
              maxLength: 5000
              type: string
              x-stripeBypassValidation: true
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/external_account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create an external account
