get:
  description: <p>Returns a list of <code>Location</code> objects.</p>
  operationId: GetTerminalLocations
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/terminal.location.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/terminal/locations
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TerminalLocationLocationList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all Locations
post:
  description: >-
    <p>Creates a new <code>Location</code> object.

    For further details, including which address fields are required in each
    country, see the <a href="/docs/terminal/fleet/locations">Manage
    locations</a> guide.</p>
  operationId: PostTerminalLocations
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          address:
            explode: true
            style: deepObject
          address_kana:
            explode: true
            style: deepObject
          address_kanji:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            address:
              description: The full address of the location.
              properties:
                city:
                  maxLength: 5000
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 5000
                  type: string
                line2:
                  maxLength: 5000
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
              required:
                - country
              title: create_location_address_param
              type: object
            address_kana:
              description: >-
                The Kana variation of the full address of the location (Japan
                only).
              properties:
                city:
                  maxLength: 5000
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 5000
                  type: string
                line2:
                  maxLength: 5000
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
                town:
                  maxLength: 5000
                  type: string
              title: japan_address_kana_specs
              type: object
            address_kanji:
              description: >-
                The Kanji variation of the full address of the location (Japan
                only).
              properties:
                city:
                  maxLength: 5000
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 5000
                  type: string
                line2:
                  maxLength: 5000
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
                town:
                  maxLength: 5000
                  type: string
              title: japan_address_kanji_specs
              type: object
            configuration_overrides:
              description: >-
                The ID of a configuration that will be used to customize all
                readers in this location.
              maxLength: 500
              type: string
            display_name:
              description: A name for the location. Maximum length is 1000 characters.
              maxLength: 1000
              type: string
            display_name_kana:
              description: >-
                The Kana variation of the name for the location (Japan only).
                Maximum length is 1000 characters.
              maxLength: 1000
              type: string
            display_name_kanji:
              description: >-
                The Kanji variation of the name for the location (Japan only).
                Maximum length is 1000 characters.
              maxLength: 1000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            phone:
              description: The phone number for the location.
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/terminal.location.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Location
