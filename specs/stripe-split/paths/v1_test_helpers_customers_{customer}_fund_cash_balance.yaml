post:
  description: <p>Create an incoming testmode bank transfer</p>
  operationId: PostTestHelpersCustomersCustomerFundCashBalance
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                Amount to be used for this test cash balance transaction. A
                positive integer representing how much to fund in the [smallest
                currency unit](https://docs.stripe.com/currencies#zero-decimal)
                (e.g., 100 cents to fund $1.00 or 100 to fund ¥100, a
                zero-decimal currency).
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            reference:
              description: >-
                A description of the test funding. This simulates free-text
                references supplied by customers when making bank transfers to
                their cash balance. You can use this to test how Stripe's
                [reconciliation
                algorithm](https://docs.stripe.com/payments/customer-balance/reconciliation)
                applies to different user inputs.
              maxLength: 5000
              type: string
          required:
            - amount
            - currency
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer_cash_balance_transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Fund a test mode cash balance
