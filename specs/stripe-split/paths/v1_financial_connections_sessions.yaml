post:
  description: >-
    <p>To launch the Financial Connections authorization flow, create a
    <code>Session</code>. The session’s <code>client_secret</code> can be used
    to launch the flow using Stripe.js.</p>
  operationId: PostFinancialConnectionsSessions
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          account_holder:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          filters:
            explode: true
            style: deepObject
          limits:
            explode: true
            style: deepObject
          manual_entry:
            explode: true
            style: deepObject
          permissions:
            explode: true
            style: deepObject
          prefetch:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            account_holder:
              description: The account holder to link accounts for.
              properties:
                account:
                  maxLength: 5000
                  type: string
                customer:
                  maxLength: 5000
                  type: string
                customer_account:
                  maxLength: 5000
                  type: string
                type:
                  enum:
                    - account
                    - customer
                  type: string
              required:
                - type
              title: accountholder_params
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            filters:
              description: Filters to restrict the kinds of accounts to collect.
              properties:
                account_subcategories:
                  items:
                    enum:
                      - checking
                      - credit_card
                      - line_of_credit
                      - mortgage
                      - savings
                    type: string
                  type: array
                countries:
                  items:
                    maxLength: 5000
                    type: string
                  type: array
                require_payment_method_support:
                  enum:
                    - all
                    - at_least_one
                    - none
                  type: string
              title: filters_params
              type: object
            limits:
              description: Settings for configuring Session-specific limits.
              properties:
                accounts:
                  anyOf:
                    - type: integer
                    - enum:
                        - ''
                      type: string
              required:
                - accounts
              title: limits_params
              type: object
            manual_entry:
              description: Customize manual entry behavior
              properties:
                mode:
                  enum:
                    - automatic
                    - disabled
                  type: string
                  x-stripeBypassValidation: true
              title: manual_entry_params
              type: object
            permissions:
              description: >-
                List of data features that you would like to request access to.


                Possible values are `balances`, `transactions`, `ownership`, and
                `payment_method`.
              items:
                enum:
                  - balances
                  - ownership
                  - payment_method
                  - transactions
                maxLength: 5000
                type: string
                x-stripeBypassValidation: true
              type: array
            prefetch:
              description: >-
                List of data features that you would like to retrieve upon
                account creation.
              items:
                enum:
                  - balances
                  - ownership
                  - transactions
                type: string
                x-stripeBypassValidation: true
              type: array
            return_url:
              description: >-
                For webview integrations only. Upon completing OAuth login in
                the native browser, the user will be redirected to this URL to
                return to your app.
              maxLength: 5000
              type: string
          required:
            - account_holder
            - permissions
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/financial_connections.session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Session
