post:
  description: >-
    <p>Updates the shipping status of the specified Issuing <code>Card</code>
    object to <code>submitted</code>. This method requires Stripe Version
    ‘2024-09-30.acacia’ or later.</p>
  operationId: PostTestHelpersIssuingCardsCardShippingSubmit
  parameters:
    - in: path
      name: card
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.card.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Submit a testmode card
