post:
  deprecated: true
  description: >-
    <p>[Deprecated] Approves a pending Issuing <code>Authorization</code>
    object. This request should be made within the timeout window of the <a
    href="/docs/issuing/controls/real-time-authorizations">real-time
    authorization</a> flow. 

    This method is deprecated. Instead, <a
    href="/docs/issuing/controls/real-time-authorizations#authorization-handling">respond
    directly to the webhook request to approve an authorization</a>.</p>
  operationId: PostIssuingAuthorizationsAuthorizationApprove
  parameters:
    - in: path
      name: authorization
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                If the authorization's `pending_request.is_amount_controllable`
                property is `true`, you may provide this value to control how
                much to hold for the authorization. Must be positive (use
                [`decline`](https://docs.stripe.com/api/issuing/authorizations/decline)
                to decline an authorization request).
              type: integer
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.authorization.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Approve an authorization
