get:
  description: <p>Retrieve a list of billing meters.</p>
  operationId: GetBillingMeters
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Filter results to only include meters with the given status.
      in: query
      name: status
      required: false
      schema:
        enum:
          - active
          - inactive
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/billing.meter.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/billing/meters
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: BillingMeterResourceBillingMeterList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List billing meters
post:
  description: <p>Creates a billing meter.</p>
  operationId: PostBillingMeters
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          customer_mapping:
            explode: true
            style: deepObject
          default_aggregation:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          value_settings:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            customer_mapping:
              description: Fields that specify how to map a meter event to a customer.
              properties:
                event_payload_key:
                  maxLength: 100
                  type: string
                type:
                  enum:
                    - by_id
                  type: string
              required:
                - event_payload_key
                - type
              title: customer_mapping_param
              type: object
            default_aggregation:
              description: The default settings to aggregate a meter's events with.
              properties:
                formula:
                  enum:
                    - count
                    - last
                    - sum
                  type: string
                  x-stripeBypassValidation: true
              required:
                - formula
              title: aggregation_settings_param
              type: object
            display_name:
              description: The meter’s name. Not visible to the customer.
              maxLength: 250
              type: string
            event_name:
              description: >-
                The name of the meter event to record usage for. Corresponds
                with the `event_name` field on meter events.
              maxLength: 100
              type: string
            event_time_window:
              description: >-
                The time window which meter events have been pre-aggregated for,
                if any.
              enum:
                - day
                - hour
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            value_settings:
              description: Fields that specify how to calculate a meter event's value.
              properties:
                event_payload_key:
                  maxLength: 100
                  type: string
              required:
                - event_payload_key
              title: meter_value_settings_param
              type: object
          required:
            - default_aggregation
            - display_name
            - event_name
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.meter.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a billing meter
