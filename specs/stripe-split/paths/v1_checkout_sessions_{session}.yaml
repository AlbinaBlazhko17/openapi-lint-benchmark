get:
  description: <p>Retrieves a Checkout Session object.</p>
  operationId: GetCheckoutSessionsSession
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: session
      required: true
      schema:
        maxLength: 66
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/checkout.session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a Checkout Session
post:
  description: >-
    <p>Updates a Checkout Session object.</p>


    <p>Related guide: <a href="/payments/advanced/dynamic-updates">Dynamically
    update a Checkout Session</a></p>
  operationId: PostCheckoutSessionsSession
  parameters:
    - in: path
      name: session
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          collected_information:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          line_items:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          shipping_options:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            collected_information:
              description: >-
                Information about the customer collected within the Checkout
                Session. Can only be set when updating `embedded` or `custom`
                sessions.
              properties:
                shipping_details:
                  properties:
                    address:
                      properties:
                        city:
                          maxLength: 5000
                          type: string
                        country:
                          maxLength: 5000
                          type: string
                        line1:
                          maxLength: 5000
                          type: string
                        line2:
                          maxLength: 5000
                          type: string
                        postal_code:
                          maxLength: 5000
                          type: string
                        state:
                          maxLength: 5000
                          type: string
                      required:
                        - country
                        - line1
                      title: shipping_address
                      type: object
                    name:
                      maxLength: 255
                      type: string
                  required:
                    - address
                    - name
                  title: shipping_details_params
                  type: object
              title: collected_information_params
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            line_items:
              description: >-
                A list of items the customer is purchasing.


                When updating line items, you must retransmit the entire array
                of line items.


                To retain an existing line item, specify its `id`.


                To update an existing line item, specify its `id` along with the
                new values of the fields to update.


                To add a new line item, specify one of `price` or `price_data`
                and `quantity`.


                To remove an existing line item, omit the line item's ID from
                the retransmitted array.


                To reorder a line item, specify it at the desired position in
                the retransmitted array.
              items:
                properties:
                  adjustable_quantity:
                    properties:
                      enabled:
                        type: boolean
                      maximum:
                        type: integer
                      minimum:
                        type: integer
                    required:
                      - enabled
                    title: adjustable_quantity_params
                    type: object
                  id:
                    maxLength: 5000
                    type: string
                  metadata:
                    anyOf:
                      - additionalProperties:
                          type: string
                        type: object
                      - enum:
                          - ''
                        type: string
                  price:
                    maxLength: 5000
                    type: string
                  price_data:
                    properties:
                      currency:
                        format: currency
                        type: string
                      product:
                        maxLength: 5000
                        type: string
                      product_data:
                        properties:
                          description:
                            maxLength: 40000
                            type: string
                          images:
                            items:
                              type: string
                            type: array
                          metadata:
                            additionalProperties:
                              type: string
                            type: object
                          name:
                            maxLength: 5000
                            type: string
                          tax_code:
                            maxLength: 5000
                            type: string
                          unit_label:
                            maxLength: 12
                            type: string
                        required:
                          - name
                        title: product_data
                        type: object
                      recurring:
                        properties:
                          interval:
                            enum:
                              - day
                              - month
                              - week
                              - year
                            type: string
                          interval_count:
                            type: integer
                        required:
                          - interval
                        title: recurring_adhoc
                        type: object
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    required:
                      - currency
                    title: price_data_with_product_data
                    type: object
                  quantity:
                    type: integer
                  tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                title: line_item_params
                type: object
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            shipping_options:
              anyOf:
                - items:
                    properties:
                      shipping_rate:
                        maxLength: 5000
                        type: string
                      shipping_rate_data:
                        properties:
                          delivery_estimate:
                            properties:
                              maximum:
                                properties:
                                  unit:
                                    enum:
                                      - business_day
                                      - day
                                      - hour
                                      - month
                                      - week
                                    type: string
                                  value:
                                    type: integer
                                required:
                                  - unit
                                  - value
                                title: delivery_estimate_bound
                                type: object
                              minimum:
                                properties:
                                  unit:
                                    enum:
                                      - business_day
                                      - day
                                      - hour
                                      - month
                                      - week
                                    type: string
                                  value:
                                    type: integer
                                required:
                                  - unit
                                  - value
                                title: delivery_estimate_bound
                                type: object
                            title: delivery_estimate
                            type: object
                          display_name:
                            maxLength: 100
                            type: string
                          fixed_amount:
                            properties:
                              amount:
                                type: integer
                              currency:
                                format: currency
                                type: string
                              currency_options:
                                additionalProperties:
                                  properties:
                                    amount:
                                      type: integer
                                    tax_behavior:
                                      enum:
                                        - exclusive
                                        - inclusive
                                        - unspecified
                                      type: string
                                  required:
                                    - amount
                                  title: currency_option
                                  type: object
                                type: object
                            required:
                              - amount
                              - currency
                            title: fixed_amount
                            type: object
                          metadata:
                            additionalProperties:
                              type: string
                            type: object
                          tax_behavior:
                            enum:
                              - exclusive
                              - inclusive
                              - unspecified
                            type: string
                          tax_code:
                            type: string
                          type:
                            enum:
                              - fixed_amount
                            type: string
                        required:
                          - display_name
                        title: method_params
                        type: object
                    title: shipping_option_params
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The shipping rate options to apply to this Session. Up to a
                maximum of 5.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/checkout.session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a Checkout Session
