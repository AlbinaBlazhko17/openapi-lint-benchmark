delete:
  description: <p>Deletes a <code>Configuration</code> object.</p>
  operationId: DeleteTerminalConfigurationsConfiguration
  parameters:
    - in: path
      name: configuration
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_terminal.configuration.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a Configuration
get:
  description: <p>Retrieves a <code>Configuration</code> object.</p>
  operationId: GetTerminalConfigurationsConfiguration
  parameters:
    - in: path
      name: configuration
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/terminal.configuration.yaml
              - $ref: ../components/schemas/deleted_terminal.configuration.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a Configuration
