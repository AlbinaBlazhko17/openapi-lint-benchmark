post:
  description: >-
    <p>Starts advancing a test clock to a specified time in the future.
    Advancement is done when status changes to <code>Ready</code>.</p>
  operationId: PostTestHelpersTestClocksTestClockAdvance
  parameters:
    - in: path
      name: test_clock
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            frozen_time:
              description: >-
                The time to advance the test clock. Must be after the test
                clock's current frozen time. Cannot be more than two intervals
                in the future from the shortest subscription in this test clock.
                If there are no subscriptions in this test clock, it cannot be
                more than two years in the future.
              format: unix-time
              type: integer
          required:
            - frozen_time
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/test_helpers.test_clock.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Advance a test clock
