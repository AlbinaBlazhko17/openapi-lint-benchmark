post:
  description: >-
    <p>Creates a Tax Transaction from a calculation, if that calculation hasn’t
    expired. Calculations expire after 90 days.</p>
  operationId: PostTaxTransactionsCreateFromCalculation
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            calculation:
              description: >-
                Tax Calculation ID to be used as input when creating the
                transaction.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            posted_at:
              description: >-
                The Unix timestamp representing when the tax liability is
                assumed or reduced, which determines the liability posting
                period and handling in tax liability reports. The timestamp must
                fall within the `tax_date` and the current time, unless the
                `tax_date` is scheduled in advance. Defaults to the current
                time.
              format: unix-time
              type: integer
            reference:
              description: >-
                A custom order or sale identifier, such as 'myOrder_123'. Must
                be unique across all transactions, including reversals.
              maxLength: 500
              type: string
          required:
            - calculation
            - reference
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax.transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Transaction from a Calculation
