post:
  description: <p>Deletes a secret from the secret store by name and scope.</p>
  operationId: PostAppsSecretsDelete
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          scope:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            name:
              description: A name for the secret that's unique within the scope.
              maxLength: 5000
              type: string
            scope:
              description: >-
                Specifies the scoping of the secret. Requests originating from
                UI extensions can only access account-scoped secrets or secrets
                scoped to their own user.
              properties:
                type:
                  enum:
                    - account
                    - user
                  type: string
                user:
                  maxLength: 5000
                  type: string
              required:
                - type
              title: scope_param
              type: object
          required:
            - name
            - scope
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apps.secret.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a Secret
