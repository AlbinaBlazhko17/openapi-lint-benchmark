post:
  description: >-
    <p>Initiates resumption of a paused subscription, optionally resetting the
    billing cycle anchor and creating prorations. Resume is only available for
    subscriptions that use <code>charge_automatically</code> collection. If
    Stripe doesn’t generate a resumption invoice, the subscription becomes
    <code>active</code> immediately. When a resumption invoice is generated,
    Stripe finalizes it immediately. If the invoice is paid or marked
    uncollectible, the subscription becomes <code>active</code>. If the invoice
    is manually voided, the subscription stays <code>paused</code>. If there is
    no payment attempt within 23 hours, Stripe voids the invoice and the
    subscription stays <code>paused</code>. Learn more about <a
    href="/docs/billing/subscriptions/pause#resume-subscriptions">resuming
    subscriptions</a>.</p>
  operationId: PostSubscriptionsSubscriptionResume
  parameters:
    - in: path
      name: subscription
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            billing_cycle_anchor:
              description: >-
                The billing cycle anchor that applies when the subscription is
                resumed. Either `now` or `unchanged`. The default is `now`. For
                more information, see the billing cycle
                [documentation](https://docs.stripe.com/billing/subscriptions/billing-cycle).
              enum:
                - now
                - unchanged
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                resulting from the `billing_cycle_anchor` being `unchanged`.
                When the `billing_cycle_anchor` is set to `now` (default value),
                no prorations are generated. If no value is passed, the default
                is `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            proration_date:
              description: >-
                If set, prorations will be calculated as though the subscription
                was resumed at the given time. This can be used to apply exactly
                the same prorations that were previewed with the [create
                preview](https://stripe.com/docs/api/invoices/create_preview)
                endpoint.
              format: unix-time
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Resume a subscription
