get:
  description: >-
    <p>Returns a list of OutboundTransfers sent from the specified
    FinancialAccount.</p>
  operationId: GetTreasuryOutboundTransfers
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Returns objects associated with this FinancialAccount.
      in: query
      name: financial_account
      required: true
      schema:
        type: string
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return OutboundTransfers that have the given status: `processing`,
        `canceled`, `failed`, `posted`, or `returned`.
      in: query
      name: status
      required: false
      schema:
        enum:
          - canceled
          - failed
          - posted
          - processing
          - returned
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/treasury.outbound_transfer.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TreasuryOutboundTransfersResourceOutboundTransferList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all OutboundTransfers
post:
  description: <p>Creates an OutboundTransfer.</p>
  operationId: PostTreasuryOutboundTransfers
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          destination_payment_method_data:
            explode: true
            style: deepObject
          destination_payment_method_options:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: Amount (in cents) to be transferred.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 5000
              type: string
            destination_payment_method:
              description: >-
                The PaymentMethod to use as the payment instrument for the
                OutboundTransfer.
              maxLength: 5000
              type: string
            destination_payment_method_data:
              description: >-
                Hash used to generate the PaymentMethod to be used for this
                OutboundTransfer. Exclusive with `destination_payment_method`.
              properties:
                financial_account:
                  type: string
                type:
                  enum:
                    - financial_account
                  type: string
              required:
                - type
              title: payment_method_data
              type: object
            destination_payment_method_options:
              description: Hash describing payment method configuration details.
              properties:
                us_bank_account:
                  anyOf:
                    - properties:
                        network:
                          enum:
                            - ach
                            - us_domestic_wire
                          type: string
                      title: payment_method_options_param
                      type: object
                    - enum:
                        - ''
                      type: string
              title: payment_method_options
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            financial_account:
              description: The FinancialAccount to pull funds from.
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            statement_descriptor:
              description: >-
                Statement descriptor to be shown on the receiving end of an
                OutboundTransfer. Maximum 10 characters for `ach` transfers or
                140 characters for `us_domestic_wire` transfers. The default
                value is "transfer". Can only include -#.$&*, spaces, and
                alphanumeric characters.
              maxLength: 5000
              type: string
          required:
            - amount
            - currency
            - financial_account
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.outbound_transfer.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create an OutboundTransfer
