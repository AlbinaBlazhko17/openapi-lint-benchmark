get:
  description: >-
    <p>Returns a list of personalization design objects. The objects are sorted
    in descending order by creation date, with the most recently created object
    appearing first.</p>
  operationId: GetIssuingPersonalizationDesigns
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Only return personalization designs with the given lookup keys.
      explode: true
      in: query
      name: lookup_keys
      required: false
      schema:
        items:
          maxLength: 200
          type: string
        type: array
      style: deepObject
    - description: Only return personalization designs with the given preferences.
      explode: true
      in: query
      name: preferences
      required: false
      schema:
        properties:
          is_default:
            type: boolean
          is_platform_default:
            type: boolean
        title: preferences_list_param
        type: object
      style: deepObject
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return personalization designs with the given status.
      in: query
      name: status
      required: false
      schema:
        enum:
          - active
          - inactive
          - rejected
          - review
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/issuing.personalization_design.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/issuing/personalization_designs
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: IssuingPersonalizationDesignList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all personalization designs
post:
  description: <p>Creates a personalization design object.</p>
  operationId: PostIssuingPersonalizationDesigns
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          carrier_text:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          preferences:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            card_logo:
              description: >-
                The file for the card logo, for use with physical bundles that
                support card logos. Must have a `purpose` value of
                `issuing_logo`.
              type: string
            carrier_text:
              description: >-
                Hash containing carrier text, for use with physical bundles that
                support carrier text.
              properties:
                footer_body:
                  anyOf:
                    - maxLength: 200
                      type: string
                    - enum:
                        - ''
                      type: string
                footer_title:
                  anyOf:
                    - maxLength: 30
                      type: string
                    - enum:
                        - ''
                      type: string
                header_body:
                  anyOf:
                    - maxLength: 200
                      type: string
                    - enum:
                        - ''
                      type: string
                header_title:
                  anyOf:
                    - maxLength: 30
                      type: string
                    - enum:
                        - ''
                      type: string
              title: carrier_text_param
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            lookup_key:
              description: >-
                A lookup key used to retrieve personalization designs
                dynamically from a static string. This may be up to 200
                characters.
              maxLength: 200
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            name:
              description: Friendly display name.
              maxLength: 200
              type: string
            physical_bundle:
              description: >-
                The physical bundle object belonging to this personalization
                design.
              maxLength: 5000
              type: string
            preferences:
              description: >-
                Information on whether this personalization design is used to
                create cards when one is not specified.
              properties:
                is_default:
                  type: boolean
              required:
                - is_default
              title: preferences_param
              type: object
            transfer_lookup_key:
              description: >-
                If set to true, will atomically remove the lookup key from the
                existing personalization design, and assign it to this
                personalization design.
              type: boolean
          required:
            - physical_bundle
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.personalization_design.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a personalization design
