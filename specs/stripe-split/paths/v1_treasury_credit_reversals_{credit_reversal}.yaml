get:
  description: >-
    <p>Retrieves the details of an existing CreditReversal by passing the unique
    CreditReversal ID from either the CreditReversal creation request or
    CreditReversal list</p>
  operationId: GetTreasuryCreditReversalsCreditReversal
  parameters:
    - in: path
      name: credit_reversal
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.credit_reversal.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a CreditReversal
