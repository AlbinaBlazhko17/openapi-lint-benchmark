get:
  description: >-
    <p>Returns a list of charges you’ve previously created. The charges are
    returned in sorted order, with the most recent charges appearing first.</p>
  operationId: GetCharges
  parameters:
    - description: Only return charges that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return charges for the customer specified by this customer ID.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        Only return charges that were created by the PaymentIntent specified by
        this PaymentIntent ID.
      in: query
      name: payment_intent
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
      style: form
    - description: Only return charges for this transfer group, limited to 100.
      in: query
      name: transfer_group
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/charge.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/charges
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: ChargeList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all charges
post:
  description: >-
    <p>This method is no longer recommended—use the <a
    href="/docs/api/payment_intents">Payment Intents API</a>

    to initiate a new payment instead. Confirmation of the PaymentIntent creates
    the <code>Charge</code>

    object used to request payment.</p>
  operationId: PostCharges
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          card:
            explode: true
            style: deepObject
          destination:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          radar_options:
            explode: true
            style: deepObject
          shipping:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                Amount intended to be collected by this payment. A positive
                integer representing how much to charge in the [smallest
                currency unit](https://docs.stripe.com/currencies#zero-decimal)
                (e.g., 100 cents to charge $1.00 or 100 to charge ¥100, a
                zero-decimal currency). The minimum amount is $0.50 US or
                [equivalent in charge
                currency](https://docs.stripe.com/currencies#minimum-and-maximum-charge-amounts).
                The amount value supports up to eight digits (e.g., a value of
                99999999 for a USD charge of $999,999.99).
              type: integer
            application_fee:
              type: integer
            application_fee_amount:
              description: >-
                A fee in cents (or local equivalent) that will be applied to the
                charge and transferred to the application owner's Stripe
                account. The request must be made with an OAuth key or the
                `Stripe-Account` header in order to take an application fee. For
                more information, see the application fees
                [documentation](https://docs.stripe.com/connect/direct-charges#collect-fees).
              type: integer
            capture:
              description: >-
                Whether to immediately capture the charge. Defaults to `true`.
                When `false`, the charge issues an authorization (or
                pre-authorization), and will need to be
                [captured](https://api.stripe.com#capture_charge) later.
                Uncaptured charges expire after a set number of days (7 by
                default). For more information, see the [authorizing charges and
                settling later](https://docs.stripe.com/charges/placing-a-hold)
                documentation.
              type: boolean
            card:
              anyOf:
                - properties:
                    address_city:
                      maxLength: 5000
                      type: string
                    address_country:
                      maxLength: 5000
                      type: string
                    address_line1:
                      maxLength: 5000
                      type: string
                    address_line2:
                      maxLength: 5000
                      type: string
                    address_state:
                      maxLength: 5000
                      type: string
                    address_zip:
                      maxLength: 5000
                      type: string
                    cvc:
                      maxLength: 5000
                      type: string
                    encrypted:
                      maxLength: 5000
                      type: string
                    exp_month:
                      type: integer
                    exp_year:
                      type: integer
                    metadata:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      maxLength: 5000
                      type: string
                    network_token:
                      properties:
                        number:
                          maxLength: 5000
                          type: string
                      title: source_deprecated_card_network_token
                      type: object
                    number:
                      maxLength: 5000
                      type: string
                    object:
                      enum:
                        - card
                      maxLength: 5000
                      type: string
                    swipe_data:
                      maxLength: 5000
                      type: string
                  required:
                    - exp_month
                    - exp_year
                    - number
                  title: customer_payment_source_card
                  type: object
                - maxLength: 5000
                  type: string
              description: >-
                A token, like the ones returned by
                [Stripe.js](https://stripe.com/docs/js).
              x-stripeBypassValidation: true
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            customer:
              description: >-
                The ID of an existing customer that will be charged in this
                request.
              maxLength: 500
              type: string
            description:
              description: >-
                An arbitrary string which you can attach to a `Charge` object.
                It is displayed when in the web interface alongside the charge.
                Note that if you use Stripe to send automatic email receipts to
                your customers, your receipt emails will include the
                `description` of the charge(s) that they are describing.
              maxLength: 40000
              type: string
            destination:
              anyOf:
                - properties:
                    account:
                      maxLength: 5000
                      type: string
                    amount:
                      type: integer
                  required:
                    - account
                  title: destination_specs
                  type: object
                - type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            on_behalf_of:
              description: >-
                The Stripe account ID for which these funds are intended. You
                can specify the business of record as the connected account
                using the `on_behalf_of` attribute on the charge. For details,
                see [Creating Separate Charges and
                Transfers](https://docs.stripe.com/connect/separate-charges-and-transfers#settlement-merchant).
              maxLength: 5000
              type: string
            radar_options:
              description: >-
                Options to configure Radar. See [Radar
                Session](https://docs.stripe.com/radar/radar-session) for more
                information.
              properties:
                session:
                  maxLength: 5000
                  type: string
              title: radar_options_with_hidden_options
              type: object
            receipt_email:
              description: >-
                The email address to which this charge's
                [receipt](https://docs.stripe.com/dashboard/receipts) will be
                sent. The receipt will not be sent until the charge is paid, and
                no receipts will be sent for test mode charges. If this charge
                is for a
                [Customer](https://docs.stripe.com/api/customers/object), the
                email address specified here will override the customer's email
                address. If `receipt_email` is specified for a charge in live
                mode, a receipt will be sent regardless of your [email
                settings](https://dashboard.stripe.com/account/emails).
              type: string
            shipping:
              description: >-
                Shipping information for the charge. Helps prevent fraud on
                charges for physical goods.
              properties:
                address:
                  properties:
                    city:
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      maxLength: 5000
                      type: string
                    line2:
                      maxLength: 5000
                      type: string
                    postal_code:
                      maxLength: 5000
                      type: string
                    state:
                      maxLength: 5000
                      type: string
                  title: optional_fields_address
                  type: object
                carrier:
                  maxLength: 5000
                  type: string
                name:
                  maxLength: 5000
                  type: string
                phone:
                  maxLength: 5000
                  type: string
                tracking_number:
                  maxLength: 5000
                  type: string
              required:
                - address
                - name
              title: optional_fields_shipping
              type: object
            source:
              description: >-
                A payment source to be charged. This can be the ID of a
                [card](https://docs.stripe.com/api#cards) (i.e., credit or debit
                card), a [bank
                account](https://docs.stripe.com/api#bank_accounts), a
                [source](https://docs.stripe.com/api#sources), a
                [token](https://docs.stripe.com/api#tokens), or a [connected
                account](https://docs.stripe.com/connect/account-debits#charging-a-connected-account).
                For certain sources---namely,
                [cards](https://docs.stripe.com/api#cards), [bank
                accounts](https://docs.stripe.com/api#bank_accounts), and
                attached [sources](https://docs.stripe.com/api#sources)---you
                must also pass the ID of the associated customer.
              maxLength: 5000
              type: string
              x-stripeBypassValidation: true
            statement_descriptor:
              description: >-
                For a non-card charge, text that appears on the customer's
                statement as the statement descriptor. This value overrides the
                account's default statement descriptor. For information about
                requirements, including the 22-character limit, see [the
                Statement Descriptor
                docs](https://docs.stripe.com/get-started/account/statement-descriptors).


                For a card charge, this value is ignored unless you don't
                specify a `statement_descriptor_suffix`, in which case this
                value is used as the suffix.
              maxLength: 22
              type: string
            statement_descriptor_suffix:
              description: >-
                Provides information about a card charge. Concatenated to the
                account's [statement descriptor
                prefix](https://docs.stripe.com/get-started/account/statement-descriptors#static)
                to form the complete statement descriptor that appears on the
                customer's statement. If the account has no prefix value, the
                suffix is concatenated to the account's statement descriptor.
              maxLength: 22
              type: string
            transfer_data:
              description: >-
                An optional dictionary including the account to automatically
                transfer to as part of a destination charge. [See the Connect
                documentation](https://docs.stripe.com/connect/destination-charges)
                for details.
              properties:
                amount:
                  type: integer
                description:
                  maxLength: 5000
                  type: string
                destination:
                  maxLength: 5000
                  type: string
              required:
                - destination
              title: transfer_data_specs
              type: object
            transfer_group:
              description: >-
                A string that identifies this transaction as part of a group.
                For details, see [Grouping
                transactions](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options).
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/charge.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a charge
