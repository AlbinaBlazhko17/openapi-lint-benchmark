post:
  description: >-
    <p>You can cancel a SetupIntent object when it’s in one of these statuses:
    <code>requires_payment_method</code>, <code>requires_confirmation</code>, or
    <code>requires_action</code>. </p>


    <p>After you cancel it, setup is abandoned and any operations on the
    SetupIntent fail with an error. You can’t cancel the SetupIntent for a
    Checkout Session. <a href="/docs/api/checkout/sessions/expire">Expire the
    Checkout Session</a> instead.</p>
  operationId: PostSetupIntentsIntentCancel
  parameters:
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            cancellation_reason:
              description: >-
                Reason for canceling this SetupIntent. Possible values are:
                `abandoned`, `requested_by_customer`, or `duplicate`
              enum:
                - abandoned
                - duplicate
                - requested_by_customer
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/setup_intent.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Cancel a SetupIntent
