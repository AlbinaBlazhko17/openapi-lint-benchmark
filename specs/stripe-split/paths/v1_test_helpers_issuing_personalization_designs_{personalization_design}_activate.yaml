post:
  description: >-
    <p>Updates the <code>status</code> of the specified testmode personalization
    design object to <code>active</code>.</p>
  operationId: PostTestHelpersIssuingPersonalizationDesignsPersonalizationDesignActivate
  parameters:
    - in: path
      name: personalization_design
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.personalization_design.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Activate a testmode personalization design
