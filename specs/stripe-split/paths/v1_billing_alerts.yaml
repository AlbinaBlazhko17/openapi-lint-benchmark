get:
  description: <p>Lists billing active and inactive alerts</p>
  operationId: GetBillingAlerts
  parameters:
    - description: Filter results to only include this type of alert.
      in: query
      name: alert_type
      required: false
      schema:
        enum:
          - usage_threshold
        type: string
        x-stripeBypassValidation: true
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Filter results to only include alerts with the given meter.
      in: query
      name: meter
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/billing.alert.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/billing/alerts
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: ThresholdsResourceAlertList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List billing alerts
post:
  description: <p>Creates a billing alert</p>
  operationId: PostBillingAlerts
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          usage_threshold:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            alert_type:
              description: The type of alert to create.
              enum:
                - usage_threshold
              type: string
              x-stripeBypassValidation: true
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            title:
              description: The title of the alert.
              maxLength: 256
              type: string
            usage_threshold:
              description: The configuration of the usage threshold.
              properties:
                filters:
                  items:
                    properties:
                      customer:
                        maxLength: 5000
                        type: string
                      type:
                        enum:
                          - customer
                        type: string
                    required:
                      - type
                    title: usage_alert_filter
                    type: object
                  type: array
                gte:
                  type: integer
                meter:
                  maxLength: 5000
                  type: string
                recurrence:
                  enum:
                    - one_time
                  type: string
                  x-stripeBypassValidation: true
              required:
                - gte
                - meter
                - recurrence
              title: usage_threshold_config
              type: object
          required:
            - alert_type
            - title
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.alert.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a billing alert
