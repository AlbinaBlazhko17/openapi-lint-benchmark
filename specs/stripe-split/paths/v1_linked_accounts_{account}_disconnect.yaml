post:
  description: >-
    <p>Disables your access to a Financial Connections <code>Account</code>. You
    will no longer be able to access data associated with the account (e.g.
    balances, transactions).</p>
  operationId: PostLinkedAccountsAccountDisconnect
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/financial_connections.account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Disconnect an Account
