get:
  description: >-
    <p>Retrieves the details of a PaymentIntent that has previously been
    created. </p>


    <p>You can retrieve a PaymentIntent client-side using a publishable key when
    the <code>client_secret</code> is in the query string. </p>


    <p>If you retrieve a PaymentIntent with a publishable key, it only returns a
    subset of properties. Refer to the <a href="#payment_intent_object">payment
    intent</a> object reference for more details.</p>
  operationId: GetPaymentIntentsIntent
  parameters:
    - description: >-
        The client secret of the PaymentIntent. We require it if you use a
        publishable key to retrieve the source.
      in: query
      name: client_secret
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_intent.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a PaymentIntent
post:
  description: >-
    <p>Updates properties on a PaymentIntent object without confirming.</p>


    <p>Depending on which properties you update, you might need to confirm the

    PaymentIntent again. For example, updating the <code>payment_method</code>

    always requires you to confirm the PaymentIntent again. If you prefer to

    update and confirm at the same time, we recommend updating properties
    through

    the <a href="/docs/api/payment_intents/confirm">confirm API</a> instead.</p>
  operationId: PostPaymentIntentsIntent
  parameters:
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          allowed_payment_method_types:
            explode: true
            style: deepObject
          amount_details:
            explode: true
            style: deepObject
          application_fee_amount:
            explode: true
            style: deepObject
          excluded_payment_method_types:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          hooks:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payment_details:
            explode: true
            style: deepObject
          payment_method_data:
            explode: true
            style: deepObject
          payment_method_options:
            explode: true
            style: deepObject
          payment_method_types:
