              description: >-
                Amount intended to be collected by this PaymentIntent. A
                positive integer representing how much to charge in the
                [smallest currency
                unit](https://docs.stripe.com/currencies#zero-decimal) (e.g.,
                100 cents to charge $1.00 or 100 to charge ¥100, a zero-decimal
                currency). The minimum amount is $0.50 US or [equivalent in
                charge
                currency](https://docs.stripe.com/currencies#minimum-and-maximum-charge-amounts).
                The amount value supports up to eight digits (e.g., a value of
                99999999 for a USD charge of $999,999.99).
              type: integer
            amount_details:
              anyOf:
