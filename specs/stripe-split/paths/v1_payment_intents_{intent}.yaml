            payment_method_types:
              description: >-
                The list of payment method types (for example, card) that this
                PaymentIntent can use. Use `automatic_payment_methods` to manage
                payment methods from the [Stripe
                Dashboard](https://dashboard.stripe.com/settings/payment_methods).
                A list of valid payment method types can be found
                [here](https://docs.stripe.com/api/payment_methods/object#payment_method_object-type).
              items:
                maxLength: 5000
                type: string
              type: array
            receipt_email:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: >-
                Email address that the receipt for the resulting payment will be
                sent to. If `receipt_email` is specified for a payment in live
                mode, a receipt will be sent regardless of your [email
                settings](https://dashboard.stripe.com/account/emails).
            setup_future_usage:
              description: >-
                Indicates that you intend to make future payments with this
                PaymentIntent's payment method.


                If you provide a Customer with the PaymentIntent, you can use
                this parameter to [attach the payment
                method](/payments/save-during-payment) to the Customer after the
                PaymentIntent is confirmed and the customer completes any
                required actions. If you don't provide a Customer, you can still
                [attach](/api/payment_methods/attach) the payment method to a
                Customer after the transaction completes.


                If the payment method is `card_present` and isn't a digital
                wallet, Stripe creates and attaches a
                [generated_card](/api/charges/object#charge_object-payment_method_details-card_present-generated_card)
                payment method representing the card to the Customer instead.


                When processing card payments, Stripe uses `setup_future_usage`
                to help you comply with regional legislation and network rules,
                such as [SCA](/strong-customer-authentication).


                If you've already set `setup_future_usage` and you're performing
                a request using a publishable key, you can only update the value
                from `on_session` to `off_session`.
              enum:
                - ''
                - off_session
                - on_session
              type: string
            shipping:
              anyOf:
                - properties:
                    address:
                      properties:
                        city:
                          maxLength: 5000
                          type: string
                        country:
                          maxLength: 5000
                          type: string
                        line1:
                          maxLength: 5000
                          type: string
                        line2:
                          maxLength: 5000
                          type: string
                        postal_code:
                          maxLength: 5000
                          type: string
                        state:
                          maxLength: 5000
                          type: string
                      title: optional_fields_address
                      type: object
                    carrier:
                      maxLength: 5000
                      type: string
                    name:
                      maxLength: 5000
                      type: string
                    phone:
                      maxLength: 5000
                      type: string
                    tracking_number:
                      maxLength: 5000
                      type: string
                  required:
                    - address
                    - name
                  title: optional_fields_shipping
                  type: object
                - enum:
                    - ''
                  type: string
              description: Shipping information for this PaymentIntent.
            statement_descriptor:
              description: >-
                Text that appears on the customer's statement as the statement
                descriptor for a non-card charge. This value overrides the
                account's default statement descriptor. For information about
                requirements, including the 22-character limit, see [the
                Statement Descriptor
                docs](https://docs.stripe.com/get-started/account/statement-descriptors).


                Setting this value for a card charge returns an error. For card
                charges, set the
                [statement_descriptor_suffix](https://docs.stripe.com/get-started/account/statement-descriptors#dynamic)
                instead.
              maxLength: 22
              type: string
            statement_descriptor_suffix:
              description: >-
                Provides information about a card charge. Concatenated to the
                account's [statement descriptor
                prefix](https://docs.stripe.com/get-started/account/statement-descriptors#static)
                to form the complete statement descriptor that appears on the
                customer's statement.
              maxLength: 22
              type: string
            transfer_data:
              description: >-
                Use this parameter to automatically create a Transfer when the
                payment succeeds. Learn more about the [use case for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              properties:
                amount:
                  type: integer
                description:
                  maxLength: 5000
                  type: string
                metadata:
                  anyOf:
                    - additionalProperties:
                        type: string
                      type: object
                    - enum:
                        - ''
                      type: string
                payment_data:
                  properties:
                    description:
                      maxLength: 5000
                      type: string
                    metadata:
                      anyOf:
                        - additionalProperties:
                            type: string
                          type: object
                        - enum:
                            - ''
                          type: string
                  title: transfer_data_payment_data_params
                  type: object
              title: transfer_data_update_params
              type: object
            transfer_group:
              description: >-
                A string that identifies the resulting payment as part of a
                group. You can only provide `transfer_group` if it hasn't been
                set. Learn more about the [use case for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              type: string
          type: object
    required: false
  responses:
    '200':
