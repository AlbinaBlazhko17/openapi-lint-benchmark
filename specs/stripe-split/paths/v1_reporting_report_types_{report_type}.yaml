get:
  description: >-
    <p>Retrieves the details of a Report Type. (Certain report types require a
    <a href="https://stripe.com/docs/keys#test-live-modes">live-mode API
    key</a>.)</p>
  operationId: GetReportingReportTypesReportType
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: report_type
      required: true
      schema:
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/reporting.report_type.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a Report Type
