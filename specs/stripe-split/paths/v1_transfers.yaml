get:
  description: >-
    <p>Returns a list of existing transfers sent to connected accounts. The
    transfers are returned in sorted order, with the most recently created
    transfers appearing first.</p>
  operationId: GetTransfers
  parameters:
    - description: Only return transfers that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return transfers for the destination specified by this account ID.
      in: query
      name: destination
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return transfers with the specified transfer group.
      in: query
      name: transfer_group
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/transfer.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/transfers
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TransferList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all transfers
post:
  description: >-
    <p>To send funds from your Stripe account to a connected account, you create
    a new transfer object. Your <a href="#balance">Stripe balance</a> must be
    able to cover the transfer amount, or you’ll receive an “Insufficient Funds”
    error.</p>
  operationId: PostTransfers
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                A positive integer in cents (or local equivalent) representing
                how much to transfer.
              type: integer
            currency:
              description: >-
                Three-letter [ISO code for
                currency](https://www.iso.org/iso-4217-currency-codes.html) in
                lowercase. Must be a [supported
                currency](https://docs.stripe.com/currencies).
              format: currency
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 5000
              type: string
            destination:
              description: >-
                The ID of a connected Stripe account. <a
                href="/docs/connect/separate-charges-and-transfers">See the
                Connect documentation</a> for details.
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            source_transaction:
              description: >-
                You can use this parameter to transfer funds from a charge
                before they are added to your available balance. A pending
                balance will transfer immediately but the funds will not become
                available until the original charge becomes available. [See the
                Connect
                documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-availability)
                for details.
              type: string
            source_type:
              description: >-
                The source balance to use for this transfer. One of
                `bank_account`, `card`, or `fpx`. For most users, this will
                default to `card`.
              enum:
                - bank_account
                - card
                - fpx
              maxLength: 5000
              type: string
              x-stripeBypassValidation: true
            transfer_group:
              description: >-
                A string that identifies this transaction as part of a group.
                See the [Connect
                documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options)
                for details.
              type: string
          required:
            - currency
            - destination
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/transfer.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a transfer
