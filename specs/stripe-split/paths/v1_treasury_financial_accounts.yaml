get:
  description: <p>Returns a list of FinancialAccounts.</p>
  operationId: GetTreasuryFinancialAccounts
  parameters:
    - description: >-
        Only return FinancialAccounts that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: An object ID cursor for use in pagination.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: A limit ranging from 1 to 100 (defaults to 10).
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: An object ID cursor for use in pagination.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return FinancialAccounts that have the given status: `open` or
        `closed`
      in: query
      name: status
      required: false
      schema:
        enum:
          - closed
          - open
        type: string
        x-stripeBypassValidation: true
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/treasury.financial_account.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/treasury/financial_accounts
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TreasuryFinancialAccountsResourceFinancialAccountList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all FinancialAccounts
post:
  description: >-
    <p>Creates a new FinancialAccount. Each connected account can have up to
    three FinancialAccounts by default.</p>
  operationId: PostTreasuryFinancialAccounts
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          features:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          nickname:
            explode: true
            style: deepObject
          platform_restrictions:
            explode: true
            style: deepObject
          supported_currencies:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            features:
              description: >-
                Encodes whether a FinancialAccount has access to a particular
                feature. Stripe or the platform can control features via the
                requested field.
              properties:
                card_issuing:
                  properties:
                    requested:
                      type: boolean
                  required:
                    - requested
                  title: access
                  type: object
                deposit_insurance:
                  properties:
                    requested:
                      type: boolean
                  required:
                    - requested
                  title: access
                  type: object
                financial_addresses:
                  properties:
                    aba:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: aba_access
                      type: object
                  title: financial_addresses
                  type: object
                inbound_transfers:
                  properties:
                    ach:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: access_with_ach_details_inbound
                      type: object
                  title: inbound_transfers
                  type: object
                intra_stripe_flows:
                  properties:
                    requested:
                      type: boolean
                  required:
                    - requested
                  title: access
                  type: object
                outbound_payments:
                  properties:
                    ach:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: access_with_ach_details_outbound
                      type: object
                    us_domestic_wire:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: access
                      type: object
                  title: outbound_payments
                  type: object
                outbound_transfers:
                  properties:
                    ach:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: access_with_ach_details_outbound
                      type: object
                    us_domestic_wire:
                      properties:
                        requested:
                          type: boolean
                      required:
                        - requested
                      title: access
                      type: object
                  title: outbound_transfers
                  type: object
              title: feature_access
              type: object
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            nickname:
              anyOf:
                - maxLength: 5000
                  type: string
                - enum:
                    - ''
                  type: string
              description: The nickname for the FinancialAccount.
            platform_restrictions:
              description: >-
                The set of functionalities that the platform can restrict on the
                FinancialAccount.
              properties:
                inbound_flows:
                  enum:
                    - restricted
                    - unrestricted
                  type: string
                outbound_flows:
                  enum:
                    - restricted
                    - unrestricted
                  type: string
              title: platform_restrictions
              type: object
            supported_currencies:
              description: The currencies the FinancialAccount can hold a balance in.
              items:
                maxLength: 5000
                type: string
              type: array
          required:
            - supported_currencies
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.financial_account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a FinancialAccount
