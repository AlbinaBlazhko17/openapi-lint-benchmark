delete:
  description: >-
    <p>Deletes an invoice item, removing it from an invoice. Deleting invoice
    items is only possible when they’re not attached to invoices, or if it’s
    attached to a draft invoice.</p>
  operationId: DeleteInvoiceitemsInvoiceitem
  parameters:
    - in: path
      name: invoiceitem
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_invoiceitem.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete an invoice item
get:
  description: <p>Retrieves the invoice item with the given ID.</p>
  operationId: GetInvoiceitemsInvoiceitem
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: invoiceitem
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoiceitem.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve an invoice item
post:
  description: >-
    <p>Updates the amount or description of an invoice item on an upcoming
    invoice. Updating an invoice item is only possible before the invoice it’s
    attached to is closed.</p>
  operationId: PostInvoiceitemsInvoiceitem
  parameters:
    - in: path
      name: invoiceitem
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          period:
            explode: true
            style: deepObject
          price_data:
            explode: true
            style: deepObject
          pricing:
            explode: true
            style: deepObject
          tax_code:
            explode: true
            style: deepObject
          tax_rates:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The integer amount in cents (or local equivalent) of the charge
                to be applied to the upcoming invoice. If you want to apply a
                credit to the customer's account, pass a negative amount.
              type: integer
            description:
              description: >-
                An arbitrary string which you can attach to the invoice item.
                The description is displayed in the invoice for easy tracking.
              maxLength: 5000
              type: string
            discountable:
              description: >-
                Controls whether discounts apply to this invoice item. Defaults
                to false for prorations or negative invoice items, and true for
                all other invoice items. Cannot be set to true for prorations.
              type: boolean
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The coupons, promotion codes & existing discounts which apply to
                the invoice item or invoice line item. Item discounts are
                applied before invoice discounts. Pass an empty string to remove
                previously-defined discounts.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            period:
              description: >-
                The period associated with this invoice item. When set to
                different values, the period will be rendered on the invoice. If
                you have [Stripe Revenue
                Recognition](https://docs.stripe.com/revenue-recognition)
                enabled, the period will be used to recognize and defer revenue.
                See the [Revenue Recognition
                documentation](https://docs.stripe.com/revenue-recognition/methodology/subscriptions-and-invoicing)
                for details.
              properties:
                end:
                  format: unix-time
                  type: integer
                start:
                  format: unix-time
                  type: integer
              required:
                - end
                - start
              title: period
              type: object
            price_data:
              description: >-
                Data used to generate a new
                [Price](https://docs.stripe.com/api/prices) object inline.
              properties:
                currency:
                  format: currency
                  type: string
                product:
                  maxLength: 5000
                  type: string
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - unspecified
                  type: string
                unit_amount:
                  type: integer
                unit_amount_decimal:
                  format: decimal
                  type: string
              required:
                - currency
                - product
              title: one_time_price_data
              type: object
            pricing:
              description: The pricing information for the invoice item.
              properties:
                price:
                  maxLength: 5000
                  type: string
              title: pricing_param
              type: object
            quantity:
              description: >-
                Non-negative integer. The quantity of units for the invoice
                item. Use `quantity_decimal` instead to provide decimal
                precision. This field will be deprecated in favor of
                `quantity_decimal` in a future version.
              type: integer
            quantity_decimal:
              description: >-
                Non-negative decimal with at most 12 decimal places. The
                quantity of units for the line item.
              format: decimal
              type: string
            tax_behavior:
              description: >-
                Only required if a [default tax
                behavior](https://docs.stripe.com/tax/products-prices-tax-categories-tax-behavior#setting-a-default-tax-behavior-(recommended))
                was not provided in the Stripe Tax settings. Specifies whether
                the price is considered inclusive of taxes or exclusive of
                taxes. One of `inclusive`, `exclusive`, or `unspecified`. Once
                specified as either `inclusive` or `exclusive`, it cannot be
                changed.
              enum:
                - exclusive
                - inclusive
                - unspecified
              type: string
            tax_code:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: A [tax code](https://docs.stripe.com/tax/tax-categories) ID.
            tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The tax rates which apply to the invoice item. When set, the
                `default_tax_rates` on the invoice do not apply to this invoice
                item. Pass an empty string to remove previously-defined tax
                rates.
            unit_amount_decimal:
              description: >-
                The decimal unit amount in cents (or local equivalent) of the
                charge to be applied to the upcoming invoice. This
                `unit_amount_decimal` will be multiplied by the quantity to get
                the full amount. Passing in a negative `unit_amount_decimal`
                will reduce the `amount_due` on the invoice. Accepts at most 12
                decimal places.
              format: decimal
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoiceitem.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update an invoice item
