post:
  description: >-
    <p>Marks the test mode InboundTransfer object as returned and links the
    InboundTransfer to a ReceivedDebit. The InboundTransfer must already be in
    the <code>succeeded</code> state.</p>
  operationId: PostTestHelpersTreasuryInboundTransfersIdReturn
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.inbound_transfer.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: 'Test mode: Return an InboundTransfer'
