get:
  description: >-
    <p>Retrieves the promotion code with the given ID. In order to retrieve a
    promotion code by the customer-facing <code>code</code> use <a
    href="/docs/api/promotion_codes/list">list</a> with the desired
    <code>code</code>.</p>
  operationId: GetPromotionCodesPromotionCode
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: promotion_code
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/promotion_code.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a promotion code
post:
  description: >-
    <p>Updates the specified promotion code by setting the values of the
    parameters passed. Most fields are, by design, not editable.</p>
  operationId: PostPromotionCodesPromotionCode
  parameters:
    - in: path
      name: promotion_code
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          restrictions:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Whether the promotion code is currently active. A promotion code
                can only be reactivated when the coupon is still valid and the
                promotion code is otherwise redeemable.
              type: boolean
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            restrictions:
              description: Settings that restrict the redemption of the promotion code.
              properties:
                currency_options:
                  additionalProperties:
                    properties:
                      minimum_amount:
                        type: integer
                    title: currency_option
                    type: object
                  type: object
              title: restrictions_params
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/promotion_code.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a promotion code
