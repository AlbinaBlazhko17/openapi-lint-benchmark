get:
  description: >-
    <p>Returns a list of configurations that describe the functionality of the
    customer portal.</p>
  operationId: GetBillingPortalConfigurations
  parameters:
    - description: >-
        Only return configurations that are active or inactive (e.g., pass
        `true` to only list active configurations).
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        Only return the default or non-default configurations (e.g., pass `true`
        to only list the default configuration).
      in: query
      name: is_default
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/billing_portal.configuration.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/billing_portal/configurations
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: PortalPublicResourceConfigurationList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List portal configurations
post:
  description: >-
    <p>Creates a configuration that describes the functionality and behavior of
    a PortalSession</p>
  operationId: PostBillingPortalConfigurations
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          business_profile:
            explode: true
            style: deepObject
          default_return_url:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          features:
            explode: true
            style: deepObject
          login_page:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          name:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            business_profile:
              description: The business information shown to customers in the portal.
              properties:
                headline:
                  anyOf:
                    - maxLength: 60
                      type: string
                    - enum:
                        - ''
                      type: string
                privacy_policy_url:
                  type: string
                terms_of_service_url:
                  type: string
              title: business_profile_create_param
              type: object
            default_return_url:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: >-
                The default URL to redirect customers to when they click on the
                portal's link to return to your website. This can be
                [overridden](https://docs.stripe.com/api/customer_portal/sessions/create#create_portal_session-return_url)
                when creating the session.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            features:
              description: Information about the features available in the portal.
              properties:
                customer_update:
                  properties:
                    allowed_updates:
                      anyOf:
                        - items:
                            enum:
                              - address
                              - email
                              - name
                              - phone
                              - shipping
                              - tax_id
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: customer_update_creation_param
                  type: object
                invoice_history:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: invoice_list_param
                  type: object
                payment_method_update:
                  properties:
                    enabled:
                      type: boolean
                    payment_method_configuration:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  required:
                    - enabled
                  title: payment_method_update_param
                  type: object
                subscription_cancel:
                  properties:
                    cancellation_reason:
                      properties:
                        enabled:
                          type: boolean
                        feedback_options:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                        options:
                          anyOf:
                            - items:
                                enum:
                                  - customer_service
                                  - low_quality
                                  - missing_features
                                  - other
                                  - switched_service
                                  - too_complex
                                  - too_expensive
                                  - unused
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      required:
                        - enabled
                        - options
                      title: subscription_cancellation_reason_creation_param
                      type: object
                    enabled:
                      type: boolean
                    mode:
                      enum:
                        - at_period_end
                        - immediately
                      type: string
                    proration_behavior:
                      enum:
                        - always_invoice
                        - create_prorations
                        - none
                      type: string
                  required:
                    - enabled
                  title: subscription_cancel_creation_param
                  type: object
                subscription_update:
                  properties:
                    billing_cycle_anchor:
                      enum:
                        - now
                        - unchanged
                      type: string
                    default_allowed_updates:
                      anyOf:
                        - items:
                            enum:
                              - price
                              - promotion_code
                              - quantity
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    enabled:
                      type: boolean
                    products:
                      anyOf:
                        - items:
                            properties:
                              adjustable_quantity:
                                properties:
                                  enabled:
                                    type: boolean
                                  maximum:
                                    type: integer
                                  minimum:
                                    type: integer
                                required:
                                  - enabled
                                title: >-
                                  subscription_update_product_adjustable_quantity_param
                                type: object
                              prices:
                                items:
                                  maxLength: 5000
                                  type: string
                                type: array
                              product:
                                maxLength: 5000
                                type: string
                            required:
                              - prices
                              - product
                            title: subscription_update_product_param
                            type: object
                          type: array
                        - enum:
                            - ''
                          type: string
                    proration_behavior:
                      enum:
                        - always_invoice
                        - create_prorations
                        - none
                      type: string
                    schedule_at_period_end:
                      properties:
                        conditions:
                          items:
                            properties:
                              type:
                                enum:
                                  - decreasing_item_amount
                                  - shortening_interval
                                type: string
                            required:
                              - type
                            title: schedule_update_at_period_end_condition_param
                            type: object
                          type: array
                      title: schedule_update_at_period_end_creating_param
                      type: object
                    trial_update_behavior:
                      enum:
                        - continue_trial
                        - end_trial
                      type: string
                  required:
                    - enabled
                  title: subscription_update_creation_param
                  type: object
              title: features_creation_param
              type: object
            login_page:
              description: >-
                The hosted login page for this configuration. Learn more about
                the portal login page in our [integration
                docs](https://stripe.com/docs/billing/subscriptions/integrating-customer-portal#share).
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
              title: login_page_create_param
              type: object
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            name:
              anyOf:
                - maxLength: 256
                  type: string
                - enum:
                    - ''
                  type: string
              description: The name of the configuration.
          required:
            - features
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing_portal.configuration.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a portal configuration
