post:
  description: >-
    <p>Removes multiple line items from an invoice. This is only possible when
    an invoice is still a draft.</p>
  operationId: PostInvoicesInvoiceRemoveLines
  parameters:
    - in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          invoice_metadata:
            explode: true
            style: deepObject
          lines:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            invoice_metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            lines:
              description: The line items to remove.
              items:
                properties:
                  behavior:
                    enum:
                      - delete
                      - unassign
                    type: string
                  id:
                    maxLength: 5000
                    type: string
                required:
                  - behavior
                  - id
                title: lines_data_param
                type: object
              type: array
          required:
            - lines
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Bulk remove invoice line items
