post:
  description: >-
    <p>When a meter is deactivated, no more meter events will be accepted for
    this meter. You can’t attach a deactivated meter to a price.</p>
  operationId: PostBillingMetersIdDeactivate
  parameters:
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.meter.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Deactivate a billing meter
