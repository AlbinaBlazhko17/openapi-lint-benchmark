get:
  description: <p>Returns a list of VerificationSessions</p>
  operationId: GetIdentityVerificationSessions
  parameters:
    - description: >-
        A string to reference this user. This can be a customer ID, a session
        ID, or similar, and can be used to reconcile this verification with your
        internal systems.
      in: query
      name: client_reference_id
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return VerificationSessions that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Customer ID
      in: query
      name: related_customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: The ID of the Account representing a customer.
      in: query
      name: related_customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return VerificationSessions with this status. [Learn more about the
        lifecycle of
        sessions](https://docs.stripe.com/identity/how-sessions-work).
      in: query
      name: status
      required: false
      schema:
        enum:
          - canceled
          - processing
          - requires_input
          - verified
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/identity.verification_session.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/identity/verification_sessions
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: GelatoVerificationSessionList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List VerificationSessions
post:
  description: >-
    <p>Creates a VerificationSession object.</p>


    <p>After the VerificationSession is created, display a verification modal
    using the session <code>client_secret</code> or send your users to the
    session’s <code>url</code>.</p>


    <p>If your API key is in test mode, verification checks won’t actually
    process, though everything else will occur as if in live mode.</p>


    <p>Related guide: <a href="/docs/identity/verify-identity-documents">Verify
    your users’ identity documents</a></p>
  operationId: PostIdentityVerificationSessions
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          options:
            explode: true
            style: deepObject
          provided_details:
            explode: true
            style: deepObject
          related_person:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            client_reference_id:
              description: >-
                A string to reference this user. This can be a customer ID, a
                session ID, or similar, and can be used to reconcile this
                verification with your internal systems.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            options:
              description: A set of options for the session’s verification checks.
              properties:
                document:
                  anyOf:
                    - properties:
                        allowed_types:
                          items:
                            enum:
                              - driving_license
                              - id_card
                              - passport
                            type: string
                          type: array
                        require_id_number:
                          type: boolean
                        require_live_capture:
                          type: boolean
                        require_matching_selfie:
                          type: boolean
                      title: document_options
                      type: object
                    - enum:
                        - ''
                      type: string
              title: session_options_param
              type: object
            provided_details:
              description: >-
                Details provided about the user being verified. These details
                might be shown to the user.
              properties:
                email:
                  type: string
                phone:
                  type: string
              title: provided_details_param
              type: object
            related_customer:
              description: Customer ID
              maxLength: 5000
              type: string
            related_customer_account:
              description: The ID of the Account representing a customer.
              maxLength: 5000
              type: string
            related_person:
              description: Tokens referencing a Person resource and its associated account.
              properties:
                account:
                  maxLength: 5000
                  type: string
                person:
                  maxLength: 5000
                  type: string
              required:
                - account
                - person
              title: related_person_param
              type: object
            return_url:
              description: >-
                The URL that the user will be redirected to upon completing the
                verification flow.
              type: string
            type:
              description: >-
                The type of [verification
                check](https://docs.stripe.com/identity/verification-checks) to
                be performed. You must provide a `type` if not passing
                `verification_flow`.
              enum:
                - document
                - id_number
              type: string
              x-stripeBypassValidation: true
            verification_flow:
              description: >-
                The ID of a verification flow from the Dashboard. See
                https://docs.stripe.com/identity/verification-flows.
              maxLength: 5000
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.verification_session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a VerificationSession
