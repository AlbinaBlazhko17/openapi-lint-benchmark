post:
  description: >-
    <p>Calculates tax based on the input and returns a Tax
    <code>Calculation</code> object.</p>
  operationId: PostTaxCalculations
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          customer_details:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          line_items:
            explode: true
            style: deepObject
          ship_from_details:
            explode: true
            style: deepObject
          shipping_cost:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            customer:
              description: >-
                The ID of an existing customer to use for this calculation. If
                provided, the customer's address and tax IDs are copied to
                `customer_details`.
              maxLength: 5000
              type: string
            customer_details:
              description: Details about the customer, including address and tax IDs.
              properties:
                address:
                  properties:
                    city:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    line2:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    postal_code:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    state:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  required:
                    - country
                  title: postal_address
                  type: object
                address_source:
                  enum:
                    - billing
                    - shipping
                  type: string
                ip_address:
                  type: string
                tax_ids:
                  items:
                    properties:
                      type:
                        enum:
                          - ad_nrt
                          - ae_trn
                          - al_tin
                          - am_tin
                          - ao_tin
                          - ar_cuit
                          - au_abn
                          - au_arn
                          - aw_tin
                          - az_tin
                          - ba_tin
                          - bb_tin
                          - bd_bin
                          - bf_ifu
                          - bg_uic
                          - bh_vat
                          - bj_ifu
                          - bo_tin
                          - br_cnpj
                          - br_cpf
                          - bs_tin
                          - by_tin
                          - ca_bn
                          - ca_gst_hst
                          - ca_pst_bc
                          - ca_pst_mb
                          - ca_pst_sk
                          - ca_qst
                          - cd_nif
                          - ch_uid
                          - ch_vat
                          - cl_tin
                          - cm_niu
                          - cn_tin
                          - co_nit
                          - cr_tin
                          - cv_nif
                          - de_stn
                          - do_rcn
                          - ec_ruc
                          - eg_tin
                          - es_cif
                          - et_tin
                          - eu_oss_vat
                          - eu_vat
                          - fo_vat
                          - gb_vat
                          - ge_vat
                          - gi_tin
                          - gn_nif
                          - hk_br
                          - hr_oib
                          - hu_tin
                          - ic_nif
                          - id_npwp
                          - il_vat
                          - in_gst
                          - is_vat
                          - it_cf
                          - jp_cn
                          - jp_rn
                          - jp_trn
                          - ke_pin
                          - kg_tin
                          - kh_tin
                          - kr_brn
                          - kz_bin
                          - la_tin
                          - li_uid
                          - li_vat
                          - lk_vat
                          - ma_vat
                          - md_vat
                          - me_pib
                          - mk_vat
                          - mr_nif
                          - mx_rfc
                          - my_frp
                          - my_itn
                          - my_sst
                          - ng_tin
                          - no_vat
                          - no_voec
                          - np_pan
                          - nz_gst
                          - om_vat
                          - pe_ruc
                          - ph_tin
                          - pl_nip
                          - py_ruc
                          - ro_tin
                          - rs_pib
                          - ru_inn
                          - ru_kpp
                          - sa_vat
                          - sg_gst
                          - sg_uen
                          - si_tin
                          - sn_ninea
                          - sr_fin
                          - sv_nit
                          - th_vat
                          - tj_tin
                          - tr_tin
                          - tw_vat
                          - tz_vat
                          - ua_vat
                          - ug_tin
                          - us_ein
                          - uy_ruc
                          - uz_tin
                          - uz_vat
                          - ve_rif
                          - vn_tin
                          - za_vat
                          - zm_tin
                          - zw_tin
                        maxLength: 5000
                        type: string
                        x-stripeBypassValidation: true
                      value:
                        type: string
                    required:
                      - type
                      - value
                    title: data_params
                    type: object
                  type: array
                taxability_override:
                  enum:
                    - customer_exempt
                    - none
                    - reverse_charge
                  type: string
              title: customer_details
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            line_items:
              description: >-
                A list of items the customer is purchasing. You can pass up to
                100 line items, or 1,000 if your account has an increased limit.
              items:
                properties:
                  amount:
                    type: integer
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  product:
                    maxLength: 5000
                    type: string
                  quantity:
                    type: integer
                  reference:
                    maxLength: 500
                    type: string
                  tax_behavior:
                    enum:
                      - exclusive
                      - inclusive
                    type: string
                  tax_code:
                    type: string
                required:
                  - amount
                title: calculation_line_item
                type: object
              type: array
            ship_from_details:
              description: >-
                Details about the address from which the goods are being
                shipped.
              properties:
                address:
                  properties:
                    city:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    line2:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    postal_code:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    state:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  required:
                    - country
                  title: merchant_postal_address
                  type: object
              required:
                - address
              title: ship_from_details
              type: object
            shipping_cost:
              description: Shipping cost details to be used for the calculation.
              properties:
                amount:
                  type: integer
                shipping_rate:
                  maxLength: 5000
                  type: string
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                  type: string
                tax_code:
                  type: string
              title: shipping_cost
              type: object
            tax_date:
              description: >-
                The calculation uses the tax rules and rates that are in effect
                at this timestamp. You can use a date up to 31 days in the past
                or up to 31 days in the future. If you use a future date, Stripe
                doesn't guarantee that the expected tax rules and rate being
                used match the actual rules and rate that will be in effect on
                that date. We deploy tax changes before their effective date,
                but not within a fixed window.
              type: integer
          required:
            - currency
            - line_items
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax.calculation.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Calculation
