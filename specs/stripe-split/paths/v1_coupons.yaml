get:
  description: <p>Returns a list of your coupons.</p>
  operationId: GetCoupons
  parameters:
    - description: >-
        A filter on the list, based on the object `created` field. The value can
        be a string with an integer Unix timestamp, or it can be a dictionary
        with a number of different query options.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/coupon.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/coupons
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: CouponsResourceCouponList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all coupons
post:
  description: >-
    <p>You can create coupons easily via the <a
    href="https://dashboard.stripe.com/coupons">coupon management</a> page of
    the Stripe dashboard. Coupon creation is also accessible via the API if you
    need to create coupons on the fly.</p>


    <p>A coupon has either a <code>percent_off</code> or an
    <code>amount_off</code> and <code>currency</code>. If you set an
    <code>amount_off</code>, that amount will be subtracted from any invoice’s
    subtotal. For example, an invoice with a subtotal of
    <currency>100</currency> will have a final total of <currency>0</currency>
    if a coupon with an <code>amount_off</code> of <amount>200</amount> is
    applied to it and an invoice with a subtotal of <currency>300</currency>
    will have a final total of <currency>100</currency> if a coupon with an
    <code>amount_off</code> of <amount>200</amount> is applied to it.</p>
  operationId: PostCoupons
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          applies_to:
            explode: true
            style: deepObject
          currency_options:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount_off:
              description: >-
                A positive integer representing the amount to subtract from an
                invoice total (required if `percent_off` is not passed).
              type: integer
            applies_to:
              description: >-
                A hash containing directions for what this Coupon will apply
                discounts to.
              properties:
                products:
                  items:
                    maxLength: 5000
                    type: string
                  type: array
              title: applies_to_params
              type: object
            currency:
              description: >-
                Three-letter [ISO code for the
                currency](https://stripe.com/docs/currencies) of the
                `amount_off` parameter (required if `amount_off` is passed).
              format: currency
              type: string
            currency_options:
              additionalProperties:
                properties:
                  amount_off:
                    type: integer
                required:
                  - amount_off
                title: currency_option
                type: object
              description: >-
                Coupons defined in each available currency option (only
                supported if `amount_off` is passed). Each key must be a
                three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html) and a
                [supported currency](https://stripe.com/docs/currencies).
              type: object
            duration:
              description: >-
                Specifies how long the discount will be in effect if used on a
                subscription. Defaults to `once`.
              enum:
                - forever
                - once
                - repeating
              type: string
              x-stripeBypassValidation: true
            duration_in_months:
              description: >-
                Required only if `duration` is `repeating`, in which case it
                must be a positive integer that specifies the number of months
                the discount will be in effect.
              type: integer
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            id:
              description: >-
                Unique string of your choice that will be used to identify this
                coupon when applying it to a customer. If you don't want to
                specify a particular code, you can leave the ID blank and we'll
                generate a random code for you.
              maxLength: 5000
              type: string
            max_redemptions:
              description: >-
                A positive integer specifying the number of times the coupon can
                be redeemed before it's no longer valid. For example, you might
                have a 50% off coupon that the first 20 readers of your blog can
                use.
              type: integer
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            name:
              description: >-
                Name of the coupon displayed to customers on, for instance
                invoices, or receipts. By default the `id` is shown if `name` is
                not set.
              maxLength: 40
              type: string
            percent_off:
              description: >-
                A positive float larger than 0, and smaller or equal to 100,
                that represents the discount the coupon will apply (required if
                `amount_off` is not passed).
              type: number
            redeem_by:
              description: >-
                Unix timestamp specifying the last time at which the coupon can
                be redeemed (cannot be set to more than 5 years in the future).
                After the redeem_by date, the coupon can no longer be applied to
                new customers.
              format: unix-time
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/coupon.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a coupon
