get:
  description: >-
    <p>Returns a list of OutboundPayments sent from the specified
    FinancialAccount.</p>
  operationId: GetTreasuryOutboundPayments
  parameters:
    - description: >-
        Only return OutboundPayments that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return OutboundPayments sent to this customer.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Returns objects associated with this FinancialAccount.
      in: query
      name: financial_account
      required: true
      schema:
        type: string
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return OutboundPayments that have the given status: `processing`,
        `failed`, `posted`, `returned`, or `canceled`.
      in: query
      name: status
      required: false
      schema:
        enum:
          - canceled
          - failed
          - posted
          - processing
          - returned
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/treasury.outbound_payment.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/treasury/outbound_payments
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TreasuryOutboundPaymentsResourceOutboundPaymentList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all OutboundPayments
post:
  description: <p>Creates an OutboundPayment.</p>
  operationId: PostTreasuryOutboundPayments
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          destination_payment_method_data:
            explode: true
            style: deepObject
          destination_payment_method_options:
            explode: true
            style: deepObject
          end_user_details:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: Amount (in cents) to be transferred.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            customer:
              description: >-
                ID of the customer to whom the OutboundPayment is sent. Must
                match the Customer attached to the `destination_payment_method`
                passed in.
              maxLength: 5000
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 5000
              type: string
            destination_payment_method:
              description: >-
                The PaymentMethod to use as the payment instrument for the
                OutboundPayment. Exclusive with
                `destination_payment_method_data`.
              maxLength: 5000
              type: string
            destination_payment_method_data:
              description: >-
                Hash used to generate the PaymentMethod to be used for this
                OutboundPayment. Exclusive with `destination_payment_method`.
              properties:
                billing_details:
                  properties:
                    address:
                      anyOf:
                        - properties:
                            city:
                              maxLength: 5000
                              type: string
                            country:
                              maxLength: 5000
                              type: string
                            line1:
                              maxLength: 5000
                              type: string
                            line2:
                              maxLength: 5000
                              type: string
                            postal_code:
                              maxLength: 5000
                              type: string
                            state:
                              maxLength: 5000
                              type: string
                          title: billing_details_address
                          type: object
                        - enum:
                            - ''
                          type: string
                    email:
                      anyOf:
                        - type: string
                        - enum:
                            - ''
                          type: string
                    name:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    phone:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  title: billing_details_inner_params
                  type: object
                financial_account:
                  type: string
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                type:
                  enum:
                    - financial_account
                    - us_bank_account
                  type: string
                  x-stripeBypassValidation: true
                us_bank_account:
                  properties:
                    account_holder_type:
                      enum:
                        - company
                        - individual
                      type: string
                    account_number:
                      maxLength: 5000
                      type: string
                    account_type:
                      enum:
                        - checking
                        - savings
                      type: string
                    financial_connections_account:
                      maxLength: 5000
                      type: string
                    routing_number:
                      maxLength: 5000
                      type: string
                  title: payment_method_param
                  type: object
              required:
                - type
              title: payment_method_data
              type: object
            destination_payment_method_options:
              description: Payment method-specific configuration for this OutboundPayment.
              properties:
                us_bank_account:
                  anyOf:
                    - properties:
                        network:
                          enum:
                            - ach
                            - us_domestic_wire
                          type: string
                      title: payment_method_options_param
                      type: object
                    - enum:
                        - ''
                      type: string
              title: payment_method_options
              type: object
            end_user_details:
              description: End user details.
              properties:
                ip_address:
                  type: string
                present:
                  type: boolean
              required:
                - present
              title: end_user_details_params
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            financial_account:
              description: The FinancialAccount to pull funds from.
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            statement_descriptor:
              description: >-
                The description that appears on the receiving end for this
                OutboundPayment (for example, bank statement for external bank
                transfer). Maximum 10 characters for `ach` payments, 140
                characters for `us_domestic_wire` payments, or 500 characters
                for `stripe` network transfers. Can only include -#.$&*, spaces,
                and alphanumeric characters. The default value is "payment".
              maxLength: 5000
              type: string
          required:
            - amount
            - currency
            - financial_account
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.outbound_payment.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create an OutboundPayment
