post:
  description: >-
    <p>Marking an invoice as uncollectible is useful for keeping track of bad
    debts that can be written off for accounting purposes.</p>
  operationId: PostInvoicesInvoiceMarkUncollectible
  parameters:
    - in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Mark an invoice as uncollectible
