get:
  description: >-
    <p>You can list all invoices, or list the invoices for a specific customer.
    The invoices are returned sorted by creation date, with the most recently
    created invoices appearing first.</p>
  operationId: GetInvoices
  parameters:
    - description: >-
        The collection method of the invoice to retrieve. Either
        `charge_automatically` or `send_invoice`.
      in: query
      name: collection_method
      required: false
      schema:
        enum:
          - charge_automatically
          - send_invoice
        type: string
      style: form
    - description: Only return invoices that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return invoices for the customer specified by this customer ID.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return invoices for the account representing the customer specified
        by this account ID.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - explode: true
      in: query
      name: due_date
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        The status of the invoice, one of `draft`, `open`, `paid`,
        `uncollectible`, or `void`. [Learn
        more](https://docs.stripe.com/billing/invoices/workflow#workflow-overview)
      in: query
      name: status
      required: false
      schema:
        enum:
          - draft
          - open
          - paid
          - uncollectible
          - void
        type: string
      style: form
    - description: >-
        Only return invoices for the subscription specified by this subscription
        ID.
      in: query
      name: subscription
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/invoice.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/invoices
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: InvoicesResourceList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all invoices
post:
  description: >-
    <p>This endpoint creates a draft invoice for a given customer. The invoice
    remains a draft until you <a href="/api/invoices/finalize">finalize</a> the
    invoice, which allows you to <a href="/api/invoices/pay">pay</a> or <a
    href="/api/invoices/send">send</a> the invoice to your customers.</p>
  operationId: PostInvoices
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          account_tax_ids:
            explode: true
            style: deepObject
          automatic_tax:
            explode: true
            style: deepObject
          custom_fields:
            explode: true
            style: deepObject
          default_tax_rates:
            explode: true
            style: deepObject
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          from_invoice:
            explode: true
            style: deepObject
          issuer:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payment_settings:
            explode: true
            style: deepObject
          rendering:
            explode: true
            style: deepObject
          shipping_cost:
            explode: true
            style: deepObject
          shipping_details:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            account_tax_ids:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The account tax IDs associated with the invoice. Only editable
                when the invoice is a draft.
            application_fee_amount:
              description: >-
                A fee in cents (or local equivalent) that will be applied to the
                invoice and transferred to the application owner's Stripe
                account. The request must be made with an OAuth key or the
                Stripe-Account header in order to take an application fee. For
                more information, see the application fees
                [documentation](https://docs.stripe.com/billing/invoices/connect#collecting-fees).
              type: integer
            auto_advance:
              description: >-
                Controls whether Stripe performs [automatic
                collection](https://docs.stripe.com/invoicing/integration/automatic-advancement-collection)
                of the invoice. If `false`, the invoice's state doesn't
                automatically advance without an explicit action. Defaults to
                false.
              type: boolean
            automatic_tax:
              description: Settings for automatic tax lookup for this invoice.
              properties:
                enabled:
                  type: boolean
                liability:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              required:
                - enabled
              title: automatic_tax_param
              type: object
            automatically_finalizes_at:
              description: >-
                The time when this invoice should be scheduled to finalize (up
                to 5 years in the future). The invoice is finalized at this time
                if it's still in draft state.
              format: unix-time
              type: integer
            collection_method:
              description: >-
                Either `charge_automatically`, or `send_invoice`. When charging
                automatically, Stripe will attempt to pay this invoice using the
                default source attached to the customer. When sending an
                invoice, Stripe will email this invoice to the customer with
                payment instructions. Defaults to `charge_automatically`.
              enum:
                - charge_automatically
                - send_invoice
              type: string
            currency:
              description: >-
                The currency to create this invoice in. Defaults to that of
                `customer` if not specified.
              format: currency
              type: string
            custom_fields:
              anyOf:
                - items:
                    properties:
                      name:
                        maxLength: 40
                        type: string
                      value:
                        maxLength: 140
                        type: string
                    required:
                      - name
                      - value
                    title: custom_field_params
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: A list of up to 4 custom fields to be displayed on the invoice.
            customer:
              description: The ID of the customer to bill.
              maxLength: 5000
              type: string
            customer_account:
              description: The ID of the account to bill.
              maxLength: 5000
              type: string
            days_until_due:
              description: >-
                The number of days from when the invoice is created until it is
                due. Valid only for invoices where
                `collection_method=send_invoice`.
              type: integer
            default_payment_method:
              description: >-
                ID of the default payment method for the invoice. It must belong
                to the customer associated with the invoice. If not set,
                defaults to the subscription's default payment method, if any,
                or to the default payment method in the customer's invoice
                settings.
              maxLength: 5000
              type: string
            default_source:
              description: >-
                ID of the default payment source for the invoice. It must belong
                to the customer associated with the invoice and be in a
                chargeable state. If not set, defaults to the subscription's
                default source, if any, or to the customer's default source.
              maxLength: 5000
              type: string
            default_tax_rates:
              description: >-
                The tax rates that will apply to any line item that does not
                have `tax_rates` set.
              items:
                maxLength: 5000
                type: string
              type: array
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users. Referenced as 'memo' in the Dashboard.
              maxLength: 1500
              type: string
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The coupons and promotion codes to redeem into discounts for the
                invoice. If not specified, inherits the discount from the
                invoice's customer. Pass an empty string to avoid inheriting any
                discounts.
            due_date:
              description: >-
                The date on which payment for this invoice is due. Valid only
                for invoices where `collection_method=send_invoice`.
              format: unix-time
              type: integer
            effective_at:
              description: >-
                The date when this invoice is in effect. Same as `finalized_at`
                unless overwritten. When defined, this value replaces the
                system-generated 'Date of issue' printed on the invoice PDF and
                receipt.
              format: unix-time
              type: integer
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            footer:
              description: Footer to be displayed on the invoice.
              maxLength: 5000
              type: string
            from_invoice:
              description: >-
                Revise an existing invoice. The new invoice will be created in
                `status=draft`. See the [revision
                documentation](https://docs.stripe.com/invoicing/invoice-revisions)
                for more details.
              properties:
                action:
                  enum:
                    - revision
                  maxLength: 5000
                  type: string
                invoice:
                  maxLength: 5000
                  type: string
              required:
                - action
                - invoice
              title: from_invoice
              type: object
            issuer:
              description: >-
                The connected account that issues the invoice. The invoice is
                presented with the branding and support information of the
                specified account.
              properties:
                account:
                  type: string
                type:
                  enum:
                    - account
                    - self
                  type: string
                  x-stripeBypassValidation: true
              required:
                - type
              title: param
              type: object
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            number:
              description: >-
                Set the number for this invoice. If no number is present then a
                number will be assigned automatically when the invoice is
                finalized. In many markets, regulations require invoices to be
                unique, sequential and / or gapless. You are responsible for
                ensuring this is true across all your different invoicing
                systems in the event that you edit the invoice number using our
                API. If you use only Stripe for your invoices and do not change
                invoice numbers, Stripe handles this aspect of compliance for
                you automatically.
              maxLength: 26
              type: string
            on_behalf_of:
              description: >-
                The account (if any) for which the funds of the invoice payment
                are intended. If set, the invoice will be presented with the
                branding and support information of the specified account. See
                the [Invoices with
                Connect](https://docs.stripe.com/billing/invoices/connect)
                documentation for details.
              type: string
            payment_settings:
              description: >-
                Configuration settings for the PaymentIntent that is generated
                when the invoice is finalized.
              properties:
                default_mandate:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
                payment_method_options:
                  properties:
                    acss_debit:
                      anyOf:
                        - properties:
                            mandate_options:
                              properties:
                                transaction_type:
                                  enum:
                                    - business
                                    - personal
                                  type: string
                              title: mandate_options_param
                              type: object
                            verification_method:
                              enum:
                                - automatic
                                - instant
                                - microdeposits
                              type: string
                              x-stripeBypassValidation: true
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    bancontact:
                      anyOf:
                        - properties:
                            preferred_language:
                              enum:
                                - de
                                - en
                                - fr
                                - nl
                              type: string
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    billie:
                      anyOf:
                        - properties: {}
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    card:
                      anyOf:
                        - properties:
                            installments:
                              properties:
                                enabled:
                                  type: boolean
                                plan:
                                  anyOf:
                                    - properties:
                                        count:
                                          type: integer
                                        interval:
                                          enum:
                                            - month
                                          type: string
                                        type:
                                          enum:
                                            - bonus
                                            - fixed_count
                                            - revolving
                                          type: string
                                      required:
                                        - type
                                      title: installment_plan
                                      type: object
                                    - enum:
                                        - ''
                                      type: string
                              title: installments_param
                              type: object
                            request_three_d_secure:
                              enum:
                                - any
                                - automatic
                                - challenge
                              type: string
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    customer_balance:
                      anyOf:
                        - properties:
                            bank_transfer:
                              properties:
                                eu_bank_transfer:
                                  properties:
                                    country:
                                      maxLength: 5000
                                      type: string
                                  required:
                                    - country
                                  title: eu_bank_transfer_param
                                  type: object
                                type:
                                  type: string
                              title: bank_transfer_param
                              type: object
                            funding_type:
                              type: string
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    konbini:
                      anyOf:
                        - properties: {}
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    payto:
                      anyOf:
                        - properties:
                            mandate_options:
                              properties:
                                amount:
                                  type: integer
                                purpose:
                                  enum:
                                    - dependant_support
                                    - government
                                    - loan
                                    - mortgage
                                    - other
                                    - pension
                                    - personal
                                    - retail
                                    - salary
                                    - tax
                                    - utility
                                  type: string
                              title: mandate_options_param
                              type: object
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    pix:
                      anyOf:
                        - properties:
                            amount_includes_iof:
                              enum:
                                - always
                                - never
                              type: string
                            expires_after_seconds:
                              type: integer
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    sepa_debit:
                      anyOf:
                        - properties: {}
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    upi:
                      anyOf:
                        - properties:
                            mandate_options:
                              properties:
                                amount:
                                  type: integer
                                amount_type:
                                  enum:
                                    - fixed
                                    - maximum
                                  type: string
                                description:
                                  maxLength: 20
                                  type: string
                                end_date:
                                  format: unix-time
                                  type: integer
                              title: >-
                                invoice_payment_method_options_mandate_options_param
                              type: object
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                    us_bank_account:
                      anyOf:
                        - properties:
                            financial_connections:
                              properties:
                                filters:
                                  properties:
                                    account_subcategories:
                                      items:
                                        enum:
                                          - checking
                                          - savings
                                        type: string
                                      type: array
                                  title: invoice_linked_account_options_filters_param
                                  type: object
                                permissions:
                                  items:
                                    enum:
                                      - balances
                                      - ownership
                                      - payment_method
                                      - transactions
                                    maxLength: 5000
                                    type: string
                                    x-stripeBypassValidation: true
                                  type: array
                                prefetch:
                                  items:
                                    enum:
                                      - balances
                                      - ownership
                                      - transactions
                                    type: string
                                    x-stripeBypassValidation: true
                                  type: array
                              title: invoice_linked_account_options_param
                              type: object
                            verification_method:
                              enum:
                                - automatic
                                - instant
                                - microdeposits
                              type: string
                              x-stripeBypassValidation: true
                          title: invoice_payment_method_options_param
                          type: object
                        - enum:
                            - ''
                          type: string
                  title: payment_method_options
                  type: object
                payment_method_types:
                  anyOf:
                    - items:
                        enum:
                          - ach_credit_transfer
                          - ach_debit
                          - acss_debit
                          - affirm
                          - alipay
                          - amazon_pay
                          - au_becs_debit
                          - bacs_debit
                          - bancontact
                          - billie
                          - boleto
                          - card
                          - cashapp
                          - crypto
                          - custom
                          - customer_balance
                          - eps
                          - fpx
                          - giropay
                          - grabpay
                          - ideal
                          - jp_credit_transfer
                          - kakao_pay
                          - klarna
                          - konbini
                          - kr_card
                          - link
                          - mb_way
                          - multibanco
                          - naver_pay
                          - nz_bank_account
                          - p24
                          - pay_by_bank
                          - payco
                          - paynow
                          - paypal
                          - payto
                          - pix
                          - promptpay
                          - revolut_pay
                          - satispay
                          - sepa_credit_transfer
                          - sepa_debit
                          - sofort
                          - swish
                          - twint
                          - upi
                          - us_bank_account
                          - wechat_pay
                        type: string
                        x-stripeBypassValidation: true
                      type: array
                    - enum:
                        - ''
                      type: string
              title: payment_settings
              type: object
            pending_invoice_items_behavior:
              description: >-
                How to handle pending invoice items on invoice creation.
                Defaults to `exclude` if the parameter is omitted.
              enum:
                - exclude
                - include
              type: string
              x-stripeBypassValidation: true
            rendering:
              description: >-
                The rendering-related settings that control how the invoice is
                displayed on customer-facing surfaces such as PDF and Hosted
                Invoice Page.
              properties:
                amount_tax_display:
                  enum:
                    - ''
                    - exclude_tax
                    - include_inclusive_tax
                  type: string
                pdf:
                  properties:
                    page_size:
                      enum:
                        - a4
                        - auto
                        - letter
                      type: string
                  title: rendering_pdf_param
                  type: object
                template:
                  maxLength: 5000
                  type: string
                template_version:
                  anyOf:
                    - type: integer
                    - enum:
                        - ''
                      type: string
              title: rendering_param
              type: object
            shipping_cost:
              description: Settings for the cost of shipping for this invoice.
              properties:
                shipping_rate:
                  maxLength: 5000
                  type: string
                shipping_rate_data:
                  properties:
                    delivery_estimate:
                      properties:
                        maximum:
                          properties:
                            unit:
                              enum:
                                - business_day
                                - day
                                - hour
                                - month
                                - week
                              type: string
                            value:
                              type: integer
                          required:
                            - unit
                            - value
                          title: delivery_estimate_bound
                          type: object
                        minimum:
                          properties:
                            unit:
                              enum:
                                - business_day
                                - day
                                - hour
                                - month
                                - week
                              type: string
                            value:
                              type: integer
                          required:
                            - unit
                            - value
                          title: delivery_estimate_bound
                          type: object
                      title: delivery_estimate
                      type: object
                    display_name:
                      maxLength: 100
                      type: string
                    fixed_amount:
                      properties:
                        amount:
                          type: integer
                        currency:
                          format: currency
                          type: string
                        currency_options:
                          additionalProperties:
                            properties:
                              amount:
                                type: integer
                              tax_behavior:
                                enum:
                                  - exclusive
                                  - inclusive
                                  - unspecified
                                type: string
                            required:
                              - amount
                            title: currency_option
                            type: object
                          type: object
                      required:
                        - amount
                        - currency
                      title: fixed_amount
                      type: object
                    metadata:
                      additionalProperties:
                        type: string
                      type: object
                    tax_behavior:
                      enum:
                        - exclusive
                        - inclusive
                        - unspecified
                      type: string
                    tax_code:
                      type: string
                    type:
                      enum:
                        - fixed_amount
                      type: string
                  required:
                    - display_name
                  title: method_params
                  type: object
              title: shipping_cost
              type: object
            shipping_details:
              description: >-
                Shipping details for the invoice. The Invoice PDF will use the
                `shipping_details` value if it is set, otherwise the PDF will
                render the shipping address from the customer.
              properties:
                address:
                  properties:
                    city:
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      maxLength: 5000
                      type: string
                    line2:
                      maxLength: 5000
                      type: string
                    postal_code:
                      maxLength: 5000
                      type: string
                    state:
                      maxLength: 5000
                      type: string
                  title: optional_fields_address
                  type: object
                name:
                  maxLength: 5000
                  type: string
                phone:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
              required:
                - address
                - name
              title: recipient_shipping_with_optional_fields_address
              type: object
            statement_descriptor:
              description: >-
                Extra information about a charge for the customer's credit card
                statement. It must contain at least one letter. If not specified
                and this invoice is part of a subscription, the default
                `statement_descriptor` will be set to the first subscription
                item's product's `statement_descriptor`.
              maxLength: 22
              type: string
            subscription:
              description: >-
                The ID of the subscription to invoice, if any. If set, the
                created invoice will only include pending invoice items for that
                subscription. The subscription's billing cycle and regular
                subscription events won't be affected.
              maxLength: 5000
              type: string
            transfer_data:
              description: >-
                If specified, the funds from the invoice will be transferred to
                the destination and the ID of the resulting transfer will be
                found on the invoice's charge.
              properties:
                amount:
                  type: integer
                destination:
                  type: string
              required:
                - destination
              title: transfer_data_specs
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
