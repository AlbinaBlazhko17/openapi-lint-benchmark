get:
  description: <p>Returns a list of <code>Reader</code> objects.</p>
  operationId: GetTerminalReaders
  parameters:
    - description: Filters readers by device type
      in: query
      name: device_type
      required: false
      schema:
        enum:
          - bbpos_chipper2x
          - bbpos_wisepad3
          - bbpos_wisepos_e
          - mobile_phone_reader
          - simulated_stripe_s700
          - simulated_stripe_s710
          - simulated_verifone_m425
          - simulated_verifone_p630
          - simulated_verifone_ux700
          - simulated_verifone_v660p
          - simulated_wisepos_e
          - stripe_m2
          - stripe_s700
          - stripe_s710
          - verifone_P400
          - verifone_m425
          - verifone_p630
          - verifone_ux700
          - verifone_v660p
        type: string
        x-stripeBypassValidation: true
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A location ID to filter the response list to only readers at the
        specific location
      in: query
      name: location
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Filters readers by serial number
      in: query
      name: serial_number
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: A status filter to filter readers to only offline or online readers
      in: query
      name: status
      required: false
      schema:
        enum:
          - offline
          - online
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: A list of readers
                items:
                  $ref: ../components/schemas/terminal.reader.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TerminalReaderRetrieveReader
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all Readers
post:
  description: <p>Creates a new <code>Reader</code> object.</p>
  operationId: PostTerminalReaders
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            label:
              description: >-
                Custom label given to the reader for easier identification. If
                no label is specified, the registration code will be used.
              maxLength: 5000
              type: string
            location:
              description: The location to assign the reader to.
              maxLength: 5000
              type: string
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            registration_code:
              description: >-
                A code generated by the reader used for registering to an
                account.
              maxLength: 5000
              type: string
          required:
            - registration_code
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/terminal.reader.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Reader
