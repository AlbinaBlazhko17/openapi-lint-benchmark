post:
  description: >-
    <p>Capture the funds of an existing uncaptured PaymentIntent when its status
    is <code>requires_capture</code>.</p>


    <p>Uncaptured PaymentIntents are cancelled a set number of days (7 by
    default) after their creation.</p>


    <p>Learn more about <a href="/docs/payments/capture-later">separate
    authorization and capture</a>.</p>
  operationId: PostPaymentIntentsIntentCapture
  parameters:
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          amount_details:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          hooks:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payment_details:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount_details:
              description: Provides industry-specific information about the amount.
              properties:
                discount_amount:
                  anyOf:
                    - type: integer
                    - enum:
                        - ''
                      type: string
                enforce_arithmetic_validation:
                  type: boolean
                line_items:
                  anyOf:
                    - items:
                        properties:
                          discount_amount:
                            type: integer
                          payment_method_options:
                            properties:
                              card:
                                properties:
                                  commodity_code:
                                    maxLength: 12
                                    type: string
                                title: >-
                                  payment_intent_amount_details_line_item_payment_method_options_param
                                type: object
                              card_present:
                                properties:
                                  commodity_code:
                                    maxLength: 12
                                    type: string
                                title: >-
                                  amount_details_line_item_payment_method_options_param
                                type: object
                              klarna:
                                properties:
                                  image_url:
                                    maxLength: 4096
                                    type: string
                                  product_url:
                                    maxLength: 4096
                                    type: string
                                  reference:
                                    maxLength: 255
                                    type: string
                                  subscription_reference:
                                    maxLength: 255
                                    type: string
                                title: >-
                                  payment_intent_amount_details_line_item_payment_method_options_param
                                type: object
                              paypal:
                                properties:
                                  category:
                                    enum:
                                      - digital_goods
                                      - donation
                                      - physical_goods
                                    type: string
                                  description:
                                    maxLength: 127
                                    type: string
                                  sold_by:
                                    maxLength: 127
                                    type: string
                                title: >-
                                  amount_details_line_item_payment_method_options_param
                                type: object
                            title: >-
                              amount_details_line_item_payment_method_options_param
                            type: object
                          product_code:
                            maxLength: 12
                            type: string
                          product_name:
                            maxLength: 1024
                            type: string
                          quantity:
                            type: integer
                          tax:
                            properties:
                              total_tax_amount:
                                type: integer
                            required:
                              - total_tax_amount
                            title: amount_details_line_item_tax_param
                            type: object
                          unit_cost:
                            type: integer
                          unit_of_measure:
                            maxLength: 12
                            type: string
                        required:
                          - product_name
                          - quantity
                          - unit_cost
                        title: amount_details_line_item_param
                        type: object
                      type: array
                    - enum:
                        - ''
                      type: string
                shipping:
                  anyOf:
                    - properties:
                        amount:
                          anyOf:
                            - type: integer
                            - enum:
                                - ''
                              type: string
                        from_postal_code:
                          anyOf:
                            - maxLength: 10
                              type: string
                            - enum:
                                - ''
                              type: string
                        to_postal_code:
                          anyOf:
                            - maxLength: 10
                              type: string
                            - enum:
                                - ''
                              type: string
                      title: amount_details_shipping_param
                      type: object
                    - enum:
                        - ''
                      type: string
                tax:
                  anyOf:
                    - properties:
                        total_tax_amount:
                          type: integer
                      required:
                        - total_tax_amount
                      title: amount_details_tax_param
                      type: object
                    - enum:
                        - ''
                      type: string
              title: amount_details_param
              type: object
            amount_to_capture:
              description: >-
                The amount to capture from the PaymentIntent, which must be less
                than or equal to the original amount. Defaults to the full
                `amount_capturable` if it's not provided.
              type: integer
            application_fee_amount:
              description: >-
                The amount of the application fee (if any) that will be
                requested to be applied to the payment and transferred to the
                application owner's Stripe account. The amount of the
                application fee collected will be capped at the total amount
                captured. For more information, see the PaymentIntents [use case
                for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              type: integer
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            final_capture:
              description: >-
                Defaults to `true`. When capturing a PaymentIntent, setting
                `final_capture` to `false` notifies Stripe to not release the
                remaining uncaptured funds to make sure that they're captured in
                future requests. You can only use this setting when
                [multicapture](https://docs.stripe.com/payments/multicapture) is
                available for PaymentIntents.
              type: boolean
            hooks:
              description: Automations to be run during the PaymentIntent lifecycle
              properties:
                inputs:
                  properties:
                    tax:
                      properties:
                        calculation:
                          anyOf:
                            - maxLength: 5000
                              type: string
                            - enum:
                                - ''
                              type: string
                      required:
                        - calculation
                      title: async_workflows_inputs_tax_param
                      type: object
                  title: async_workflows_inputs_param
                  type: object
              title: async_workflows_param
              type: object
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            payment_details:
              anyOf:
                - properties:
                    customer_reference:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    order_reference:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  title: payment_details_capture_params
                  type: object
                - enum:
                    - ''
                  type: string
              description: Provides industry-specific information about the charge.
            statement_descriptor:
              description: >-
                Text that appears on the customer's statement as the statement
                descriptor for a non-card charge. This value overrides the
                account's default statement descriptor. For information about
                requirements, including the 22-character limit, see [the
                Statement Descriptor
                docs](https://docs.stripe.com/get-started/account/statement-descriptors).


                Setting this value for a card charge returns an error. For card
                charges, set the
                [statement_descriptor_suffix](https://docs.stripe.com/get-started/account/statement-descriptors#dynamic)
                instead.
              maxLength: 22
              type: string
            statement_descriptor_suffix:
              description: >-
                Provides information about a card charge. Concatenated to the
                account's [statement descriptor
                prefix](https://docs.stripe.com/get-started/account/statement-descriptors#static)
                to form the complete statement descriptor that appears on the
                customer's statement.
              maxLength: 22
              type: string
            transfer_data:
              description: >-
                The parameters that you can use to automatically create a
                transfer after the payment

                is captured. Learn more about the [use case for connected
                accounts](https://docs.stripe.com/payments/connected-accounts).
              properties:
                amount:
                  type: integer
              title: transfer_data_capture_params
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_intent.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Capture a PaymentIntent
