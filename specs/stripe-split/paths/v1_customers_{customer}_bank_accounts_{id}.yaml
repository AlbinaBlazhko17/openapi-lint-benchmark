delete:
  description: <p>Delete a specified source for a given customer.</p>
  operationId: DeleteCustomersCustomerBankAccountsId
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/payment_source.yaml
              - $ref: ../components/schemas/deleted_payment_source.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a customer source
get:
  deprecated: true
  description: >-
    <p>By default, you can see the 10 most recent sources stored on a Customer
    directly on the object, but you can also retrieve details about a specific
    bank account stored on the Stripe account.</p>
  operationId: GetCustomersCustomerBankAccountsId
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/bank_account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a bank account
post:
  description: <p>Update a specified source for a given customer.</p>
  operationId: PostCustomersCustomerBankAccountsId
  parameters:
    - in: path
      name: customer
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          owner:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            account_holder_name:
              description: The name of the person or business that owns the bank account.
              maxLength: 5000
              type: string
            account_holder_type:
              description: >-
                The type of entity that holds the account. This can be either
                `individual` or `company`.
              enum:
                - company
                - individual
              maxLength: 5000
              type: string
            address_city:
              description: City/District/Suburb/Town/Village.
              maxLength: 5000
              type: string
            address_country:
              description: Billing address country, if provided when creating card.
              maxLength: 5000
              type: string
            address_line1:
              description: Address line 1 (Street address/PO Box/Company name).
              maxLength: 5000
              type: string
            address_line2:
              description: Address line 2 (Apartment/Suite/Unit/Building).
              maxLength: 5000
              type: string
            address_state:
              description: State/County/Province/Region.
              maxLength: 5000
              type: string
            address_zip:
              description: ZIP or postal code.
              maxLength: 5000
              type: string
            exp_month:
              description: Two digit number representing the card’s expiration month.
              maxLength: 5000
              type: string
            exp_year:
              description: Four digit number representing the card’s expiration year.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            name:
              description: Cardholder name.
              maxLength: 5000
              type: string
            owner:
              properties:
                address:
                  properties:
                    city:
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      maxLength: 5000
                      type: string
                    line2:
                      maxLength: 5000
                      type: string
                    postal_code:
                      maxLength: 5000
                      type: string
                    state:
                      maxLength: 5000
                      type: string
                  title: source_address
                  type: object
                email:
                  type: string
                name:
                  maxLength: 5000
                  type: string
                phone:
                  maxLength: 5000
                  type: string
              title: owner
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../components/schemas/card.yaml
              - $ref: ../components/schemas/bank_account.yaml
              - $ref: ../components/schemas/source.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a card
