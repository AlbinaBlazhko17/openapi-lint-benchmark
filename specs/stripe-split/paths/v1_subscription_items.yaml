get:
  description: <p>Returns a list of your subscription items for a given subscription.</p>
  operationId: GetSubscriptionItems
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
      style: form
    - description: The ID of the subscription whose items will be retrieved.
      in: query
      name: subscription
      required: true
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/subscription_item.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/subscription_items
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: SubscriptionsItemsSubscriptionItemList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all subscription items
post:
  description: >-
    <p>Adds a new item to an existing subscription. No existing items will be
    changed or replaced.</p>
  operationId: PostSubscriptionItems
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          billing_thresholds:
            explode: true
            style: deepObject
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          price_data:
            explode: true
            style: deepObject
          tax_rates:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            billing_thresholds:
              anyOf:
                - properties:
                    usage_gte:
                      type: integer
                  required:
                    - usage_gte
                  title: item_billing_thresholds_param
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Define thresholds at which an invoice will be sent, and the
                subscription advanced to a new billing period. Pass an empty
                string to remove previously-defined thresholds.
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: The coupons to redeem into discounts for the subscription item.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            payment_behavior:
              description: >-
                Controls how Stripe handles payment when a subscription update
                requires payment and `collection_method=charge_automatically`.
              enum:
                - allow_incomplete
                - default_incomplete
                - error_if_incomplete
                - pending_if_incomplete
              type: string
            price:
              description: The ID of the price object.
              maxLength: 5000
              type: string
            price_data:
              description: >-
                Data used to generate a new
                [Price](https://docs.stripe.com/api/prices) object inline.
              properties:
                currency:
                  format: currency
                  type: string
                product:
                  maxLength: 5000
                  type: string
                recurring:
                  properties:
                    interval:
                      enum:
                        - day
                        - month
                        - week
                        - year
                      type: string
                    interval_count:
                      type: integer
                  required:
                    - interval
                  title: recurring_adhoc
                  type: object
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - unspecified
                  type: string
                unit_amount:
                  type: integer
                unit_amount_decimal:
                  format: decimal
                  type: string
              required:
                - currency
                - product
                - recurring
              title: recurring_price_data
              type: object
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                when the billing cycle changes (e.g., when switching plans,
                resetting `billing_cycle_anchor=now`, or starting a trial), or
                if an item's `quantity` changes. The default value is
                `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            proration_date:
              description: >-
                If set, the proration will be calculated as though the
                subscription was updated at the given time. This can be used to
                apply the same proration that was previewed with the [upcoming
                invoice](/api/invoices/create_preview) endpoint.
              format: unix-time
              type: integer
            quantity:
              description: >-
                The quantity you'd like to apply to the subscription item you're
                creating.
              type: integer
            subscription:
              description: The identifier of the subscription to modify.
              maxLength: 5000
              type: string
            tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of [Tax Rate](https://docs.stripe.com/api/tax_rates) ids.
                These Tax Rates will override the
                [`default_tax_rates`](https://docs.stripe.com/api/subscriptions/create#create_subscription-default_tax_rates)
                on the Subscription. When updating, pass an empty string to
                remove previously-defined tax rates.
          required:
            - subscription
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_item.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a subscription item
