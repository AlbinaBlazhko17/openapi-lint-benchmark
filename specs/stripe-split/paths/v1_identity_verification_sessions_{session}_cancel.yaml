post:
  description: >-
    <p>A VerificationSession object can be canceled when it is in
    <code>requires_input</code> <a
    href="/docs/identity/how-sessions-work">status</a>.</p>


    <p>Once canceled, future submission attempts are disabled. This cannot be
    undone. <a href="/docs/identity/verification-sessions#cancel">Learn
    more</a>.</p>
  operationId: PostIdentityVerificationSessionsSessionCancel
  parameters:
    - in: path
      name: session
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/identity.verification_session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Cancel a VerificationSession
