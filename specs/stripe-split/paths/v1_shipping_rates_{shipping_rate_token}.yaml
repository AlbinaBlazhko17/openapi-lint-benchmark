get:
  description: <p>Returns the shipping rate object with the given ID.</p>
  operationId: GetShippingRatesShippingRateToken
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: shipping_rate_token
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/shipping_rate.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a shipping rate
post:
  description: <p>Updates an existing shipping rate object.</p>
  operationId: PostShippingRatesShippingRateToken
  parameters:
    - in: path
      name: shipping_rate_token
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          fixed_amount:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Whether the shipping rate can be used for new purchases.
                Defaults to `true`.
              type: boolean
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            fixed_amount:
              description: >-
                Describes a fixed amount to charge for shipping. Must be present
                if type is `fixed_amount`.
              properties:
                currency_options:
                  additionalProperties:
                    properties:
                      amount:
                        type: integer
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                    title: currency_option_update
                    type: object
                  type: object
              title: fixed_amount_update
              type: object
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            tax_behavior:
              description: >-
                Specifies whether the rate is considered inclusive of taxes or
                exclusive of taxes. One of `inclusive`, `exclusive`, or
                `unspecified`.
              enum:
                - exclusive
                - inclusive
                - unspecified
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/shipping_rate.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a shipping rate
