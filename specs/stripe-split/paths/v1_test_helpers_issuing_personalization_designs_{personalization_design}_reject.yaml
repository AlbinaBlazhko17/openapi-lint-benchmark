post:
  description: >-
    <p>Updates the <code>status</code> of the specified testmode personalization
    design object to <code>rejected</code>.</p>
  operationId: PostTestHelpersIssuingPersonalizationDesignsPersonalizationDesignReject
  parameters:
    - in: path
      name: personalization_design
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          rejection_reasons:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            rejection_reasons:
              description: The reason(s) the personalization design was rejected.
              properties:
                card_logo:
                  items:
                    enum:
                      - geographic_location
                      - inappropriate
                      - network_name
                      - non_binary_image
                      - non_fiat_currency
                      - other
                      - other_entity
                      - promotional_material
                    type: string
                  type: array
                carrier_text:
                  items:
                    enum:
                      - geographic_location
                      - inappropriate
                      - network_name
                      - non_fiat_currency
                      - other
                      - other_entity
                      - promotional_material
                    type: string
                  type: array
              title: rejection_reasons_param
              type: object
          required:
            - rejection_reasons
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.personalization_design.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Reject a testmode personalization design
