get:
  description: >-
    <p>Retrieves a configuration that describes the functionality of the
    customer portal.</p>
  operationId: GetBillingPortalConfigurationsConfiguration
  parameters:
    - in: path
      name: configuration
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing_portal.configuration.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a portal configuration
post:
  description: >-
    <p>Updates a configuration that describes the functionality of the customer
    portal.</p>
  operationId: PostBillingPortalConfigurationsConfiguration
  parameters:
    - in: path
      name: configuration
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          business_profile:
            explode: true
            style: deepObject
          default_return_url:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          features:
            explode: true
            style: deepObject
          login_page:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          name:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Whether the configuration is active and can be used to create
                portal sessions.
              type: boolean
            business_profile:
              description: The business information shown to customers in the portal.
              properties:
                headline:
                  anyOf:
                    - maxLength: 60
                      type: string
                    - enum:
                        - ''
                      type: string
                privacy_policy_url:
                  anyOf:
                    - type: string
                    - enum:
                        - ''
                      type: string
                terms_of_service_url:
                  anyOf:
                    - type: string
                    - enum:
                        - ''
                      type: string
              title: business_profile_update_param
              type: object
            default_return_url:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: >-
                The default URL to redirect customers to when they click on the
                portal's link to return to your website. This can be
                [overridden](https://docs.stripe.com/api/customer_portal/sessions/create#create_portal_session-return_url)
                when creating the session.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            features:
              description: Information about the features available in the portal.
              properties:
                customer_update:
                  properties:
                    allowed_updates:
                      anyOf:
                        - items:
                            enum:
                              - address
                              - email
                              - name
                              - phone
                              - shipping
                              - tax_id
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    enabled:
                      type: boolean
                  title: customer_update_updating_param
                  type: object
                invoice_history:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: invoice_list_param
                  type: object
                payment_method_update:
                  properties:
                    enabled:
                      type: boolean
                    payment_method_configuration:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  required:
                    - enabled
                  title: payment_method_update_param
                  type: object
                subscription_cancel:
                  properties:
                    cancellation_reason:
                      properties:
                        enabled:
                          type: boolean
                        feedback_options:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                        options:
                          anyOf:
                            - items:
                                enum:
                                  - customer_service
                                  - low_quality
                                  - missing_features
                                  - other
                                  - switched_service
                                  - too_complex
                                  - too_expensive
                                  - unused
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      required:
                        - enabled
                      title: subscription_cancellation_reason_updating_param
                      type: object
                    enabled:
                      type: boolean
                    mode:
                      enum:
                        - at_period_end
                        - immediately
                      type: string
                    proration_behavior:
                      enum:
                        - always_invoice
                        - create_prorations
                        - none
                      type: string
                  title: subscription_cancel_updating_param
                  type: object
                subscription_update:
                  properties:
                    billing_cycle_anchor:
                      enum:
                        - now
                        - unchanged
                      type: string
                    default_allowed_updates:
                      anyOf:
                        - items:
                            enum:
                              - price
                              - promotion_code
                              - quantity
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    enabled:
                      type: boolean
                    products:
                      anyOf:
                        - items:
                            properties:
                              adjustable_quantity:
                                properties:
                                  enabled:
                                    type: boolean
                                  maximum:
                                    type: integer
                                  minimum:
                                    type: integer
                                required:
                                  - enabled
                                title: >-
                                  subscription_update_product_adjustable_quantity_param
                                type: object
                              prices:
                                items:
                                  maxLength: 5000
                                  type: string
                                type: array
                              product:
                                maxLength: 5000
                                type: string
                            required:
                              - prices
                              - product
                            title: subscription_update_product_param
                            type: object
                          type: array
                        - enum:
                            - ''
                          type: string
                    proration_behavior:
                      enum:
                        - always_invoice
                        - create_prorations
                        - none
                      type: string
                    schedule_at_period_end:
                      properties:
                        conditions:
                          anyOf:
                            - items:
                                properties:
                                  type:
                                    enum:
                                      - decreasing_item_amount
                                      - shortening_interval
                                    type: string
                                required:
                                  - type
                                title: schedule_update_at_period_end_condition_param
                                type: object
                              type: array
                            - enum:
                                - ''
                              type: string
                      title: schedule_update_at_period_end_updating_param
                      type: object
                    trial_update_behavior:
                      enum:
                        - continue_trial
                        - end_trial
                      type: string
                  title: subscription_update_updating_param
                  type: object
              title: features_updating_param
              type: object
            login_page:
              description: >-
                The hosted login page for this configuration. Learn more about
                the portal login page in our [integration
                docs](https://stripe.com/docs/billing/subscriptions/integrating-customer-portal#share).
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
              title: login_page_update_param
              type: object
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            name:
              anyOf:
                - maxLength: 256
                  type: string
                - enum:
                    - ''
                  type: string
              description: The name of the configuration.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing_portal.configuration.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a portal configuration
