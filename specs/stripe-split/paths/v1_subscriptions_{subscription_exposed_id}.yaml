                  title: pending_invoice_item_interval_params
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Specifies an interval for how often to bill for any pending
                invoice items. It is analogous to calling [Create an
                invoice](/api/invoices/create) for the given subscription at the
                specified interval.
            proration_behavior:
              description: >-
                Determines how to handle
                [prorations](https://docs.stripe.com/billing/subscriptions/prorations)
                when the billing cycle changes (e.g., when switching plans,
                resetting `billing_cycle_anchor=now`, or starting a trial), or
                if an item's `quantity` changes. The default value is
                `create_prorations`.
              enum:
                - always_invoice
                - create_prorations
                - none
              type: string
            proration_date:
              description: >-
                If set, prorations will be calculated as though the subscription
                was updated at the given time. This can be used to apply exactly
                the same prorations that were previewed with the [create
                preview](https://stripe.com/docs/api/invoices/create_preview)
                endpoint. `proration_date` can also be used to implement custom
                proration logic, such as prorating by day instead of by second,
                by providing the time that you wish to use for proration
                calculations.
              format: unix-time
              type: integer
            transfer_data:
              anyOf:
                - properties:
                    amount_percent:
                      type: number
                    destination:
                      type: string
                  required:
                    - destination
                  title: transfer_data_specs
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                If specified, the funds from the subscription's invoices will be
                transferred to the destination and the ID of the resulting
                transfers will be found on the resulting charges. This will be
                unset if you POST an empty value.
            trial_end:
              anyOf:
                - enum:
                    - now
                  maxLength: 5000
                  type: string
                - format: unix-time
                  type: integer
              description: >-
                Unix timestamp representing the end of the trial period the
                customer will get before being charged for the first time. This
                will always overwrite any trials that might apply via a
                subscribed plan. If set, `trial_end` will override the default
                trial period of the plan the customer is being subscribed to.
                The `billing_cycle_anchor` will be updated to the `trial_end`
                value. The special value `now` can be provided to end the
                customer's trial immediately. Can be at most two years from
                `billing_cycle_anchor`.
            trial_from_plan:
              description: >-
                Indicates if a plan's `trial_period_days` should be applied to
                the subscription. Setting `trial_end` per subscription is
                preferred, and this defaults to `false`. Setting this flag to
                `true` together with `trial_end` is not allowed. See [Using
                trial periods on
                subscriptions](https://docs.stripe.com/billing/subscriptions/trials)
                to learn more.
              type: boolean
            trial_settings:
              description: Settings related to subscription trials.
