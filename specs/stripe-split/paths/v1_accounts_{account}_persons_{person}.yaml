delete:
  description: >-
    <p>Deletes an existing person’s relationship to the account’s legal entity.
    Any person with a relationship for an account can be deleted through the
    API, except if the person is the <code>representative</code>. If your
    integration is using the <code>executive</code> parameter, you cannot delete
    the only verified <code>executive</code> on file.</p>
  operationId: DeleteAccountsAccountPersonsPerson
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: person
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/deleted_person.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Delete a person
get:
  description: <p>Retrieves an existing person.</p>
  operationId: GetAccountsAccountPersonsPerson
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: person
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/person.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a person
post:
  description: <p>Updates an existing person.</p>
  operationId: PostAccountsAccountPersonsPerson
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: person
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          additional_tos_acceptances:
            explode: true
            style: deepObject
          address:
            explode: true
            style: deepObject
          address_kana:
            explode: true
            style: deepObject
          address_kanji:
            explode: true
            style: deepObject
          dob:
            explode: true
            style: deepObject
          documents:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          full_name_aliases:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          registered_address:
            explode: true
            style: deepObject
          relationship:
            explode: true
            style: deepObject
          us_cfpb_data:
            explode: true
            style: deepObject
          verification:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            additional_tos_acceptances:
              description: >-
                Details on the legal guardian's or authorizer's acceptance of
                the required Stripe agreements.
              properties:
                account:
                  properties:
                    date:
                      format: unix-time
                      type: integer
                    ip:
                      type: string
                    user_agent:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                  title: settings_terms_of_service_specs
                  type: object
              title: person_additional_tos_acceptances_specs
              type: object
            address:
              description: The person's address.
              properties:
                city:
                  maxLength: 100
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 200
                  type: string
                line2:
                  maxLength: 200
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
              title: legal_entity_and_kyc_address_specs
              type: object
            address_kana:
              description: The Kana variation of the person's address (Japan only).
              properties:
                city:
                  maxLength: 5000
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 5000
                  type: string
                line2:
                  maxLength: 5000
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
                town:
                  maxLength: 5000
                  type: string
              title: japan_address_kana_specs
              type: object
            address_kanji:
              description: The Kanji variation of the person's address (Japan only).
              properties:
                city:
                  maxLength: 5000
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 5000
                  type: string
                line2:
                  maxLength: 5000
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
                town:
                  maxLength: 5000
                  type: string
              title: japan_address_kanji_specs
              type: object
            dob:
              anyOf:
                - properties:
                    day:
                      type: integer
                    month:
                      type: integer
                    year:
                      type: integer
                  required:
                    - day
                    - month
                    - year
                  title: date_of_birth_specs
                  type: object
                - enum:
                    - ''
                  type: string
              description: The person's date of birth.
            documents:
              description: >-
                Documents that may be submitted to satisfy various informational
                requests.
              properties:
                company_authorization:
                  properties:
                    files:
                      items:
                        anyOf:
                          - maxLength: 500
                            type: string
                          - enum:
                              - ''
                            type: string
                      type: array
                  title: documents_param
                  type: object
                passport:
                  properties:
                    files:
                      items:
                        anyOf:
                          - maxLength: 500
                            type: string
                          - enum:
                              - ''
                            type: string
                      type: array
                  title: documents_param
                  type: object
                visa:
                  properties:
                    files:
                      items:
                        anyOf:
                          - maxLength: 500
                            type: string
                          - enum:
                              - ''
                            type: string
                      type: array
                  title: documents_param
                  type: object
              title: person_documents_specs
              type: object
            email:
              description: The person's email address.
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            first_name:
              description: The person's first name.
              maxLength: 5000
              type: string
            first_name_kana:
              description: The Kana variation of the person's first name (Japan only).
              maxLength: 5000
              type: string
            first_name_kanji:
              description: The Kanji variation of the person's first name (Japan only).
              maxLength: 5000
              type: string
            full_name_aliases:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of alternate names or aliases that the person is known
                by.
            gender:
              description: >-
                The person's gender (International regulations require either
                "male" or "female").
              type: string
            id_number:
              description: >-
                The person's ID number, as appropriate for their country. For
                example, a social security number in the U.S., social insurance
                number in Canada, etc. Instead of the number itself, you can
                also provide a [PII token provided by
                Stripe.js](https://docs.stripe.com/js/tokens/create_token?type=pii).


                Changing this value for the account's representative requires
                that the account re-accept the [terms of
                service](/api/accounts/object#account_object-tos_acceptance).
              maxLength: 5000
              type: string
            id_number_secondary:
              description: >-
                The person's secondary ID number, as appropriate for their
                country, will be used for enhanced verification checks. In
                Thailand, this would be the laser code found on the back of an
                ID card. Instead of the number itself, you can also provide a
                [PII token provided by
                Stripe.js](https://docs.stripe.com/js/tokens/create_token?type=pii).


                Changing this value for the account's representative requires
                that the account re-accept the [terms of
                service](/api/accounts/object#account_object-tos_acceptance).
              maxLength: 5000
              type: string
            last_name:
              description: The person's last name.
              maxLength: 5000
              type: string
            last_name_kana:
              description: The Kana variation of the person's last name (Japan only).
              maxLength: 5000
              type: string
            last_name_kanji:
              description: The Kanji variation of the person's last name (Japan only).
              maxLength: 5000
              type: string
            maiden_name:
              description: The person's maiden name.
              maxLength: 5000
              type: string
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            nationality:
              description: >-
                The country where the person is a national. Two-letter country
                code ([ISO 3166-1
                alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)), or
                "XX" if unavailable.
              maxLength: 5000
              type: string
            person_token:
              description: >-
                A [person
                token](https://docs.stripe.com/connect/account-tokens), used to
                securely provide details to the person.
              maxLength: 5000
              type: string
            phone:
              description: The person's phone number.
              type: string
            political_exposure:
              description: >-
                Indicates if the person or any of their representatives, family
                members, or other closely related persons, declares that they
                hold or have held an important public job or function, in any
                jurisdiction.
              enum:
                - existing
                - none
              type: string
            registered_address:
              description: The person's registered address.
              properties:
                city:
                  maxLength: 100
                  type: string
                country:
                  maxLength: 5000
                  type: string
                line1:
                  maxLength: 200
                  type: string
                line2:
                  maxLength: 200
                  type: string
                postal_code:
                  maxLength: 5000
                  type: string
                state:
                  maxLength: 5000
                  type: string
              title: address_specs
              type: object
            relationship:
              description: >-
                The relationship that this person has with the account's legal
                entity.
              properties:
                authorizer:
                  type: boolean
                director:
                  type: boolean
                executive:
                  type: boolean
                legal_guardian:
                  type: boolean
                owner:
                  type: boolean
                percent_ownership:
                  anyOf:
                    - type: number
                    - enum:
                        - ''
                      type: string
                representative:
                  type: boolean
                title:
                  maxLength: 5000
                  type: string
              title: relationship_specs
              type: object
            ssn_last_4:
              description: >-
                The last four digits of the person's Social Security number
                (U.S. only).


                Changing this value for the account's representative requires
                that the account re-accept the [terms of
                service](/api/accounts/object#account_object-tos_acceptance).
              type: string
            us_cfpb_data:
              description: Demographic data related to the person.
              properties:
                ethnicity_details:
                  properties:
                    ethnicity:
                      items:
                        enum:
                          - cuban
                          - hispanic_or_latino
                          - mexican
                          - not_hispanic_or_latino
                          - other_hispanic_or_latino
                          - prefer_not_to_answer
                          - puerto_rican
                        type: string
                      type: array
                    ethnicity_other:
                      maxLength: 5000
                      type: string
                  title: us_cfpb_ethnicity_details_specs
                  type: object
                race_details:
                  properties:
                    race:
                      items:
                        enum:
                          - african_american
                          - american_indian_or_alaska_native
                          - asian
                          - asian_indian
                          - black_or_african_american
                          - chinese
                          - ethiopian
                          - filipino
                          - guamanian_or_chamorro
                          - haitian
                          - jamaican
                          - japanese
                          - korean
                          - native_hawaiian
                          - native_hawaiian_or_other_pacific_islander
                          - nigerian
                          - other_asian
                          - other_black_or_african_american
                          - other_pacific_islander
                          - prefer_not_to_answer
                          - samoan
                          - somali
                          - vietnamese
                          - white
                        type: string
                      type: array
                    race_other:
                      maxLength: 5000
                      type: string
                  title: us_cfpb_race_details_specs
                  type: object
                self_identified_gender:
                  maxLength: 5000
                  type: string
              title: us_cfpb_data_specs
              type: object
            verification:
              description: The person's verification status.
              properties:
                additional_document:
                  properties:
                    back:
                      maxLength: 500
                      type: string
                    front:
                      maxLength: 500
                      type: string
                  title: person_verification_document_specs
                  type: object
                document:
                  properties:
                    back:
                      maxLength: 500
                      type: string
                    front:
                      maxLength: 500
                      type: string
                  title: person_verification_document_specs
                  type: object
              title: person_verification_specs
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/person.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a person
