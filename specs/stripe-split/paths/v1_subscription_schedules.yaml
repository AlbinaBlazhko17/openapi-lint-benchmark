get:
  description: <p>Retrieves the list of your subscription schedules.</p>
  operationId: GetSubscriptionSchedules
  parameters:
    - description: >-
        Only return subscription schedules that were created canceled the given
        date interval.
      explode: true
      in: query
      name: canceled_at
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        Only return subscription schedules that completed during the given date
        interval.
      explode: true
      in: query
      name: completed_at
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        Only return subscription schedules that were created during the given
        date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        Only return subscription schedules for the given customer. The response
        will not include subscription schedules for customers with a test clock
        attached if this parameter is not set.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return subscription schedules for the given account.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        Only return subscription schedules that were released during the given
        date interval.
      explode: true
      in: query
      name: released_at
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return subscription schedules that have not started yet.
      in: query
      name: scheduled
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/subscription_schedule.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/subscription_schedules
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: SubscriptionSchedulesResourceScheduleList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all schedules
post:
  description: >-
    <p>Creates a new subscription schedule object. Each customer can have up to
    500 active or scheduled subscriptions.</p>
  operationId: PostSubscriptionSchedules
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          billing_mode:
            explode: true
            style: deepObject
          default_settings:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          phases:
            explode: true
            style: deepObject
          start_date:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            billing_mode:
              description: >-
                Controls how prorations and invoices for subscriptions are
                calculated and orchestrated.
              properties:
                flexible:
                  properties:
                    proration_discounts:
                      enum:
                        - included
                        - itemized
                      type: string
                  title: flexible_params
                  type: object
                type:
                  enum:
                    - classic
                    - flexible
                  type: string
              required:
                - type
              title: billing_mode
              type: object
            customer:
              description: >-
                The identifier of the customer to create the subscription
                schedule for.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                The identifier of the account to create the subscription
                schedule for.
              maxLength: 5000
              type: string
            default_settings:
              description: >-
                Object representing the subscription schedule's default
                settings.
              properties:
                application_fee_percent:
                  type: number
                automatic_tax:
                  properties:
                    enabled:
                      type: boolean
                    liability:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                  required:
                    - enabled
                  title: automatic_tax_config
                  type: object
                billing_cycle_anchor:
                  enum:
                    - automatic
                    - phase_start
                  type: string
                billing_thresholds:
                  anyOf:
                    - properties:
                        amount_gte:
                          type: integer
                        reset_billing_cycle_anchor:
                          type: boolean
                      title: billing_thresholds_param
                      type: object
                    - enum:
                        - ''
                      type: string
                collection_method:
                  enum:
                    - charge_automatically
                    - send_invoice
                  type: string
                default_payment_method:
                  maxLength: 5000
                  type: string
                description:
                  anyOf:
                    - maxLength: 500
                      type: string
                    - enum:
                        - ''
                      type: string
                invoice_settings:
                  properties:
                    account_tax_ids:
                      anyOf:
                        - items:
                            maxLength: 5000
                            type: string
                          type: array
                        - enum:
                            - ''
                          type: string
                    custom_fields:
                      anyOf:
                        - items:
                            properties:
                              name:
                                maxLength: 40
                                type: string
                              value:
                                maxLength: 140
                                type: string
                            required:
                              - name
                              - value
                            title: custom_field_params
                            type: object
                          type: array
                        - enum:
                            - ''
                          type: string
                    days_until_due:
                      type: integer
                    description:
                      anyOf:
                        - maxLength: 1500
                          type: string
                        - enum:
                            - ''
                          type: string
                    footer:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    issuer:
                      properties:
                        account:
                          type: string
                        type:
                          enum:
                            - account
                            - self
                          type: string
                          x-stripeBypassValidation: true
                      required:
                        - type
                      title: param
                      type: object
                  title: subscription_schedule_default_settings_param
                  type: object
                on_behalf_of:
                  anyOf:
                    - type: string
                    - enum:
                        - ''
                      type: string
                transfer_data:
                  anyOf:
                    - properties:
                        amount_percent:
                          type: number
                        destination:
                          type: string
                      required:
                        - destination
                      title: transfer_data_specs
                      type: object
                    - enum:
                        - ''
                      type: string
              title: default_settings_params
              type: object
            end_behavior:
              description: >-
                Behavior of the subscription schedule and underlying
                subscription when it ends. Possible values are `release` or
                `cancel` with the default being `release`. `release` will end
                the subscription schedule and keep the underlying subscription
                running. `cancel` will end the subscription schedule and cancel
                the underlying subscription.
              enum:
                - cancel
                - none
                - release
                - renew
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            from_subscription:
              description: >-
                Migrate an existing subscription to be managed by a subscription
                schedule. If this parameter is set, a subscription schedule will
                be created using the subscription's item(s), set to auto-renew
                using the subscription's interval. When using this parameter,
                other parameters (such as phase values) cannot be set. To create
                a subscription schedule with other modifications, we recommend
                making two separate API calls.
              maxLength: 5000
              type: string
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            phases:
              description: >-
                List representing phases of the subscription schedule. Each
                phase can be customized to have different durations, plans, and
                coupons. If there are multiple phases, the `end_date` of one
                phase will always equal the `start_date` of the next phase.
              items:
                properties:
                  add_invoice_items:
                    items:
                      properties:
                        discountable:
                          type: boolean
                        discounts:
                          items:
                            properties:
                              coupon:
                                maxLength: 5000
                                type: string
                              discount:
                                maxLength: 5000
                                type: string
                              promotion_code:
                                maxLength: 5000
                                type: string
                            title: discounts_data_param
                            type: object
                          type: array
                        metadata:
                          additionalProperties:
                            type: string
                          type: object
                        period:
                          properties:
                            end:
                              properties:
                                timestamp:
                                  format: unix-time
                                  type: integer
                                type:
                                  enum:
                                    - min_item_period_end
                                    - phase_end
                                    - timestamp
                                  type: string
                                  x-stripeBypassValidation: true
                              required:
                                - type
                              title: invoice_item_period_end
                              type: object
                            start:
                              properties:
                                timestamp:
                                  format: unix-time
                                  type: integer
                                type:
                                  enum:
                                    - max_item_period_start
                                    - phase_start
                                    - timestamp
                                  type: string
                                  x-stripeBypassValidation: true
                              required:
                                - type
                              title: invoice_item_period_start
                              type: object
                          required:
                            - end
                            - start
                          title: invoice_item_period
                          type: object
                        price:
                          maxLength: 5000
                          type: string
                        price_data:
                          properties:
                            currency:
                              format: currency
                              type: string
                            product:
                              maxLength: 5000
                              type: string
                            tax_behavior:
                              enum:
                                - exclusive
                                - inclusive
                                - unspecified
                              type: string
                            unit_amount:
                              type: integer
                            unit_amount_decimal:
                              format: decimal
                              type: string
                          required:
                            - currency
                            - product
                          title: one_time_price_data_with_negative_amounts
                          type: object
                        quantity:
                          type: integer
                        tax_rates:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      title: add_invoice_item_entry
                      type: object
                    type: array
                  application_fee_percent:
                    type: number
                  automatic_tax:
                    properties:
                      enabled:
                        type: boolean
                      liability:
                        properties:
                          account:
                            type: string
                          type:
                            enum:
                              - account
                              - self
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: param
                        type: object
                    required:
                      - enabled
                    title: automatic_tax_config
                    type: object
                  billing_cycle_anchor:
                    enum:
                      - automatic
                      - phase_start
                    type: string
                  billing_thresholds:
                    anyOf:
                      - properties:
                          amount_gte:
                            type: integer
                          reset_billing_cycle_anchor:
                            type: boolean
                        title: billing_thresholds_param
                        type: object
                      - enum:
                          - ''
                        type: string
                  collection_method:
                    enum:
                      - charge_automatically
                      - send_invoice
                    type: string
                  currency:
                    format: currency
                    type: string
                  default_payment_method:
                    maxLength: 5000
                    type: string
                  default_tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                  description:
                    anyOf:
                      - maxLength: 500
                        type: string
                      - enum:
                          - ''
                        type: string
                  discounts:
                    anyOf:
                      - items:
                          properties:
                            coupon:
                              maxLength: 5000
                              type: string
                            discount:
                              maxLength: 5000
                              type: string
                            promotion_code:
                              maxLength: 5000
                              type: string
                          title: schedule_discounts_data_param
                          type: object
                        type: array
                      - enum:
                          - ''
                        type: string
                  duration:
                    properties:
                      interval:
                        enum:
                          - day
                          - month
                          - week
                          - year
                        type: string
                      interval_count:
                        type: integer
                    required:
                      - interval
                    title: duration_params
                    type: object
                  end_date:
                    format: unix-time
                    type: integer
                  invoice_settings:
                    properties:
                      account_tax_ids:
                        anyOf:
                          - items:
                              maxLength: 5000
                              type: string
                            type: array
                          - enum:
                              - ''
                            type: string
                      custom_fields:
                        anyOf:
                          - items:
                              properties:
                                name:
                                  maxLength: 40
                                  type: string
                                value:
                                  maxLength: 140
                                  type: string
                              required:
                                - name
                                - value
                              title: custom_field_params
                              type: object
                            type: array
                          - enum:
                              - ''
                            type: string
                      days_until_due:
                        type: integer
                      description:
                        anyOf:
                          - maxLength: 1500
                            type: string
                          - enum:
                              - ''
                            type: string
                      footer:
                        anyOf:
                          - maxLength: 5000
                            type: string
                          - enum:
                              - ''
                            type: string
                      issuer:
                        properties:
                          account:
                            type: string
                          type:
                            enum:
                              - account
                              - self
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - type
                        title: param
                        type: object
                    title: schedule_phase_invoice_settings
                    type: object
                  items:
                    items:
                      properties:
                        billing_thresholds:
                          anyOf:
                            - properties:
                                usage_gte:
                                  type: integer
                              required:
                                - usage_gte
                              title: item_billing_thresholds_param
                              type: object
                            - enum:
                                - ''
                              type: string
                        discounts:
                          anyOf:
                            - items:
                                properties:
                                  coupon:
                                    maxLength: 5000
                                    type: string
                                  discount:
                                    maxLength: 5000
                                    type: string
                                  promotion_code:
                                    maxLength: 5000
                                    type: string
                                title: schedule_discounts_data_param
                                type: object
                              type: array
                            - enum:
                                - ''
                              type: string
                        metadata:
                          additionalProperties:
                            type: string
                          type: object
                        price:
                          maxLength: 5000
                          type: string
                        price_data:
                          properties:
                            currency:
                              format: currency
                              type: string
                            product:
                              maxLength: 5000
                              type: string
                            recurring:
                              properties:
                                interval:
                                  enum:
                                    - day
                                    - month
                                    - week
                                    - year
                                  type: string
                                interval_count:
                                  type: integer
                              required:
                                - interval
                              title: recurring_adhoc
                              type: object
                            tax_behavior:
                              enum:
                                - exclusive
                                - inclusive
                                - unspecified
                              type: string
                            unit_amount:
                              type: integer
                            unit_amount_decimal:
                              format: decimal
                              type: string
                          required:
                            - currency
                            - product
                            - recurring
                          title: recurring_price_data
                          type: object
                        quantity:
                          type: integer
                        tax_rates:
                          anyOf:
                            - items:
                                maxLength: 5000
                                type: string
                              type: array
                            - enum:
                                - ''
                              type: string
                      title: configuration_item_params
                      type: object
                    type: array
                  metadata:
                    additionalProperties:
                      type: string
                    type: object
                  on_behalf_of:
                    type: string
                  proration_behavior:
                    enum:
                      - always_invoice
                      - create_prorations
                      - none
                    type: string
                  transfer_data:
                    properties:
                      amount_percent:
                        type: number
                      destination:
                        type: string
                    required:
                      - destination
                    title: transfer_data_specs
                    type: object
                  trial:
                    type: boolean
                  trial_end:
                    format: unix-time
                    type: integer
                required:
                  - items
                title: phase_configuration_params
                type: object
              type: array
            start_date:
              anyOf:
                - format: unix-time
                  type: integer
                - enum:
                    - now
                  maxLength: 5000
                  type: string
              description: >-
                When the subscription schedule starts. We recommend using `now`
                so that it starts the subscription immediately, and to avoid
                unexpected behavior due to request delays or clock skew
                resulting in a slightly backdated or postdated start. You can
                also use a Unix timestamp to backdate the subscription so that
                it starts on a past date, or set a future date for the
                subscription to start on.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_schedule.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a schedule
