post:
  description: <p>Allows the user to mark an Issuing settlement as complete.</p>
  operationId: PostTestHelpersIssuingSettlementsSettlementComplete
  parameters:
    - description: The settlement token to mark as complete.
      in: path
      name: settlement
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.settlement.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Complete a test-mode settlement
