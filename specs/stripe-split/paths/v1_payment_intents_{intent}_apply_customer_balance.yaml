post:
  description: >-
    <p>Manually reconcile the remaining amount for a
    <code>customer_balance</code> PaymentIntent.</p>
  operationId: PostPaymentIntentsIntentApplyCustomerBalance
  parameters:
    - in: path
      name: intent
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                Amount that you intend to apply to this PaymentIntent from the
                customer’s cash balance. If the PaymentIntent was created by an
                Invoice, the full amount of the PaymentIntent is applied
                regardless of this parameter.


                A positive integer representing how much to charge in the
                [smallest currency
                unit](https://docs.stripe.com/currencies#zero-decimal) (for
                example, 100 cents to charge 1 USD or 100 to charge 100 JPY, a
                zero-decimal currency). The maximum amount is the amount of the
                PaymentIntent.


                When you omit the amount, it defaults to the remaining amount
                requested on the PaymentIntent.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_intent.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Reconcile a customer_balance PaymentIntent
