get:
  description: >-
    <p>Download the PDF for a finalized quote. Explanation for special handling
    can be found <a
    href="https://docs.stripe.com/quotes/overview#quote_pdf">here</a></p>
  operationId: GetQuotesQuotePdf
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: quote
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/pdf:
          schema:
            format: binary
            type: string
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  servers:
    - url: https://files.stripe.com/
  summary: Download quote PDF
