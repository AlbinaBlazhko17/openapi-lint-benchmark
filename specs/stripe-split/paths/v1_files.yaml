get:
  description: >-
    <p>Returns a list of the files that your account has access to. Stripe sorts
    and returns the files by their creation dates, placing the most recently
    created files at the top.</p>
  operationId: GetFiles
  parameters:
    - description: Only return files that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        Filter queries by the file purpose. If you don't provide a purpose, the
        queries return unfiltered files.
      in: query
      name: purpose
      required: false
      schema:
        enum:
          - account_requirement
          - additional_verification
          - business_icon
          - business_logo
          - customer_signature
          - dispute_evidence
          - document_provider_identity_document
          - finance_report_run
          - financial_account_statement
          - identity_document
          - identity_document_downloadable
          - issuing_regulatory_reporting
          - pci_document
          - platform_terms_of_service
          - selfie
          - sigma_scheduled_query
          - tax_document_user_upload
          - terminal_android_apk
          - terminal_reader_splashscreen
          - terminal_wifi_certificate
          - terminal_wifi_private_key
        maxLength: 5000
        type: string
        x-stripeBypassValidation: true
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/file.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/files
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: FileResourceFileList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all files
post:
  description: >-
    <p>To upload a file to Stripe, you need to send a request of type
    <code>multipart/form-data</code>. Include the file you want to upload in the
    request, and the parameters for creating a file.</p>


    <p>All of Stripe’s officially supported Client libraries support sending
    <code>multipart/form-data</code>.</p>
  operationId: PostFiles
  requestBody:
    content:
      multipart/form-data:
        encoding:
          expand:
            explode: true
            style: deepObject
          file_link_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            file:
              description: >-
                A file to upload. Make sure that the specifications follow RFC
                2388, which defines file transfers for the `multipart/form-data`
                protocol.
              format: binary
              type: string
            file_link_data:
              description: >-
                Optional parameters that automatically create a [file
                link](https://api.stripe.com#file_links) for the newly created
                file.
              properties:
                create:
                  type: boolean
                expires_at:
                  format: unix-time
                  type: integer
                metadata:
                  anyOf:
                    - additionalProperties:
                        type: string
                      type: object
                    - enum:
                        - ''
                      type: string
              required:
                - create
              title: file_link_creation_params
              type: object
            purpose:
              description: >-
                The
                [purpose](https://docs.stripe.com/file-upload#uploading-a-file)
                of the uploaded file.
              enum:
                - account_requirement
                - additional_verification
                - business_icon
                - business_logo
                - customer_signature
                - dispute_evidence
                - identity_document
                - issuing_regulatory_reporting
                - pci_document
                - platform_terms_of_service
                - tax_document_user_upload
                - terminal_android_apk
                - terminal_reader_splashscreen
                - terminal_wifi_certificate
                - terminal_wifi_private_key
              type: string
              x-stripeBypassValidation: true
          required:
            - file
            - purpose
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/file.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  servers:
    - url: https://files.stripe.com/
  summary: Create a file
