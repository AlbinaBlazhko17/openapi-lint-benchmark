post:
  description: >-
    <p>Releases the subscription schedule immediately, which will stop
    scheduling of its phases, but leave any existing subscription in place. A
    schedule can only be released if its status is <code>not_started</code> or
    <code>active</code>. If the subscription schedule is currently associated
    with a subscription, releasing it will remove its <code>subscription</code>
    property and set the subscription’s ID to the
    <code>released_subscription</code> property.</p>
  operationId: PostSubscriptionSchedulesScheduleRelease
  parameters:
    - in: path
      name: schedule
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            preserve_cancel_date:
              description: >-
                Keep any cancellation on the subscription that the schedule has
                set
              type: boolean
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/subscription_schedule.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Release a schedule
