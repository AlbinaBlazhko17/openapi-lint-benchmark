get:
  description: <p>Returns a list of your plans.</p>
  operationId: GetPlans
  parameters:
    - description: >-
        Only return plans that are active or inactive (e.g., pass `false` to
        list all inactive plans).
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A filter on the list, based on the object `created` field. The value can
        be a string with an integer Unix timestamp, or it can be a dictionary
        with a number of different query options.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Only return plans for the given product.
      in: query
      name: product
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/plan.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/plans
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: PlanList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all plans
post:
  description: >-
    <p>You can now model subscriptions more flexibly using the <a
    href="#prices">Prices API</a>. It replaces the Plans API and is backwards
    compatible to simplify your migration.</p>
  operationId: PostPlans
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          product:
            explode: true
            style: deepObject
          tiers:
            explode: true
            style: deepObject
          transform_usage:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Whether the plan is currently available for new subscriptions.
                Defaults to `true`.
              type: boolean
            amount:
              description: >-
                A positive integer in cents (or local equivalent) (or 0 for a
                free plan) representing how much to charge on a recurring basis.
              type: integer
            amount_decimal:
              description: >-
                Same as `amount`, but accepts a decimal value with at most 12
                decimal places. Only one of `amount` and `amount_decimal` can be
                set.
              format: decimal
              type: string
            billing_scheme:
              description: >-
                Describes how to compute the price per period. Either `per_unit`
                or `tiered`. `per_unit` indicates that the fixed amount
                (specified in `amount`) will be charged per unit in `quantity`
                (for plans with `usage_type=licensed`), or per unit of total
                usage (for plans with `usage_type=metered`). `tiered` indicates
                that the unit pricing will be computed using a tiering strategy
                as defined using the `tiers` and `tiers_mode` attributes.
              enum:
                - per_unit
                - tiered
              type: string
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            id:
              description: >-
                An identifier randomly generated by Stripe. Used to identify
                this plan when subscribing a customer. You can optionally
                override this ID, but the ID must be unique across all plans in
                your Stripe account. You can, however, use the same plan ID in
                both live and test modes.
              maxLength: 5000
              type: string
            interval:
              description: >-
                Specifies billing frequency. Either `day`, `week`, `month` or
                `year`.
              enum:
                - day
                - month
                - week
                - year
              type: string
            interval_count:
              description: >-
                The number of intervals between subscription billings. For
                example, `interval=month` and `interval_count=3` bills every 3
                months. Maximum of three years interval allowed (3 years, 36
                months, or 156 weeks).
              type: integer
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            meter:
              description: The meter tracking the usage of a metered price
              maxLength: 5000
              type: string
            nickname:
              description: A brief description of the plan, hidden from customers.
              maxLength: 5000
              type: string
            product:
              anyOf:
                - description: >-
                    The product whose pricing the created plan will represent.
                    This can either be the ID of an existing product, or a
                    dictionary containing fields used to create a [service
                    product](https://docs.stripe.com/api#product_object-type).
                  properties:
                    active:
                      type: boolean
                    id:
                      deprecated: true
                      maxLength: 5000
                      type: string
                    metadata:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      maxLength: 5000
                      type: string
                    statement_descriptor:
                      maxLength: 22
                      type: string
                    tax_code:
                      maxLength: 5000
                      type: string
                    unit_label:
                      maxLength: 12
                      type: string
                  required:
                    - name
                  title: inline_product_params
                  type: object
                - description: >-
                    The ID of the product whose pricing the created plan will
                    represent.
                  maxLength: 5000
                  type: string
            tiers:
              description: >-
                Each element represents a pricing tier. This parameter requires
                `billing_scheme` to be set to `tiered`. See also the
                documentation for `billing_scheme`.
              items:
                properties:
                  flat_amount:
                    type: integer
                  flat_amount_decimal:
                    format: decimal
                    type: string
                  unit_amount:
                    type: integer
                  unit_amount_decimal:
                    format: decimal
                    type: string
                  up_to:
                    anyOf:
                      - enum:
                          - inf
                        maxLength: 5000
                        type: string
                      - type: integer
                required:
                  - up_to
                title: tier
                type: object
              type: array
            tiers_mode:
              description: >-
                Defines if the tiering price should be `graduated` or `volume`
                based. In `volume`-based tiering, the maximum quantity within a
                period determines the per unit price, in `graduated` tiering
                pricing can successively change as the quantity grows.
              enum:
                - graduated
                - volume
              type: string
            transform_usage:
              description: >-
                Apply a transformation to the reported usage or set quantity
                before computing the billed price. Cannot be combined with
                `tiers`.
              properties:
                divide_by:
                  type: integer
                round:
                  enum:
                    - down
                    - up
                  type: string
              required:
                - divide_by
                - round
              title: transform_usage_param
              type: object
            trial_period_days:
              description: >-
                Default number of trial days when subscribing a customer to this
                plan using
                [`trial_from_plan=true`](https://docs.stripe.com/api#create_subscription-trial_from_plan).
              type: integer
            usage_type:
              description: >-
                Configures how the quantity per period should be determined. Can
                be either `metered` or `licensed`. `licensed` automatically
                bills the `quantity` set when adding it to a subscription.
                `metered` aggregates the total usage based on usage records.
                Defaults to `licensed`.
              enum:
                - licensed
                - metered
              type: string
          required:
            - currency
            - interval
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/plan.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a plan
