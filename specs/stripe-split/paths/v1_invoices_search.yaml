get:
  description: >-
    <p>Search for invoices you’ve previously created using Stripe’s <a
    href="/docs/search#search-query-language">Search Query Language</a>.

    Don’t use search in read-after-write flows where strict consistency is
    necessary. Under normal operating

    conditions, data is searchable in less than a minute. Occasionally,
    propagation of new or updated data can be up

    to an hour behind during outages. Search functionality is not available to
    merchants in India.</p>
  operationId: GetInvoicesSearch
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for pagination across multiple pages of results. Don't include
        this parameter on the first call. Use the next_page value returned in a
        previous response to request subsequent results.
      in: query
      name: page
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        The search query string. See [search query
        language](https://docs.stripe.com/search#search-query-language) and the
        list of supported [query fields for
        invoices](https://docs.stripe.com/search#query-fields-for-invoices).
      in: query
      name: query
      required: true
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/invoice.yaml
                type: array
              has_more:
                type: boolean
              next_page:
                maxLength: 5000
                nullable: true
                type: string
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value.
                enum:
                  - search_result
                type: string
              total_count:
                description: >-
                  The total number of objects that match the query, only
                  accurate up to 10,000.
                type: integer
              url:
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: SearchResult
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Search invoices
