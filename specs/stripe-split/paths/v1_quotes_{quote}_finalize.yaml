post:
  description: <p>Finalizes the quote.</p>
  operationId: PostQuotesQuoteFinalize
  parameters:
    - in: path
      name: quote
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            expires_at:
              description: >-
                A future timestamp on which the quote will be canceled if in
                `open` or `draft` status. Measured in seconds since the Unix
                epoch.
              format: unix-time
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quote.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Finalize a quote
