post:
  description: >-
    <p>Some payment methods might require additional steps to register a domain.
    If the requirements weren’t satisfied when the domain was created, the
    payment method will be inactive on the domain.

    The payment method doesn’t appear in Elements or Embedded Checkout for this
    domain until it is active.</p>


    <p>To activate a payment method on an existing payment method domain,
    complete the required registration steps specific to the payment method, and
    then validate the payment method domain with this endpoint.</p>


    <p>Related guides: <a
    href="/docs/payments/payment-methods/pmd-registration">Payment method
    domains</a>.</p>
  operationId: PostPaymentMethodDomainsPaymentMethodDomainValidate
  parameters:
    - in: path
      name: payment_method_domain
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_method_domain.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Validate an existing payment method domain
