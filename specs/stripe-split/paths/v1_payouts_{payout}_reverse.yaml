post:
  description: >-
    <p>Reverses a payout by debiting the destination bank account. At this time,
    you can only reverse payouts for connected accounts to US and Canadian bank
    accounts. If the payout is manual and in the <code>pending</code> status,
    use <code>/v1/payouts/:id/cancel</code> instead.</p>


    <p>By requesting a reversal through <code>/v1/payouts/:id/reverse</code>,
    you confirm that the authorized signatory of the selected bank account
    authorizes the debit on the bank account and that no other authorization is
    required.</p>
  operationId: PostPayoutsPayoutReverse
  parameters:
    - in: path
      name: payout
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payout.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Reverse a payout
