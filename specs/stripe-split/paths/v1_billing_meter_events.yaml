post:
  description: <p>Creates a billing meter event.</p>
  operationId: PostBillingMeterEvents
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          payload:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            event_name:
              description: >-
                The name of the meter event. Corresponds with the `event_name`
                field on a meter.
              maxLength: 100
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            identifier:
              description: >-
                A unique identifier for the event. If not provided, one is
                generated. We recommend using UUID-like identifiers. Stripe
                enforces uniqueness within a rolling period of at least 24
                hours. The enforcement of uniqueness primarily addresses issues
                arising from accidental retries or other problems occurring
                within extremely brief time intervals. This approach helps
                prevent duplicate entries and ensures data integrity in
                high-frequency operations.
              maxLength: 100
              type: string
            payload:
              additionalProperties:
                type: string
              description: >-
                The payload of the event. This must contain the fields
                corresponding to a meter's `customer_mapping.event_payload_key`
                (default is `stripe_customer_id`) and
                `value_settings.event_payload_key` (default is `value`). Read
                more about the
                [payload](https://docs.stripe.com/billing/subscriptions/usage-based/meters/configure#meter-configuration-attributes).
              type: object
            timestamp:
              description: >-
                The time of the event. Measured in seconds since the Unix epoch.
                Must be within the past 35 calendar days or up to 5 minutes in
                the future. Defaults to current timestamp if not specified.
              format: unix-time
              type: integer
          required:
            - event_name
            - payload
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.meter_event.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a billing meter event
