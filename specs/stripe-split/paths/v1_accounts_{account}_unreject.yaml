post:
  description: >-
    <p>With Connect, you can unreject accounts that you have previously
    rejected.</p>


    <p>Only accounts that were rejected by your platform can be unrejected. This
    API cannot be used to unreject accounts that were rejected by Stripe.</p>


    <p>Unreject will only enable charges and/or payouts if there are no other
    restrictions other than those placed by a previous rejection. If you have
    separately paused charges and/or payouts outside of rejection, those pauses
    will remain in place after unrejection.</p>
  operationId: PostAccountsAccountUnreject
  parameters:
    - in: path
      name: account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Unreject an account
