post:
  description: >-
    <p>Updates an invoice’s line item. Some fields, such as
    <code>tax_amounts</code>, only live on the invoice line item,

    so they can only be updated through this endpoint. Other fields, such as
    <code>amount</code>, live on both the invoice

    item and the invoice line item, so updates on this endpoint will propagate
    to the invoice item as well.

    Updating an invoice’s line item is only possible before the invoice is
    finalized.</p>
  operationId: PostInvoicesInvoiceLinesLineItemId
  parameters:
    - description: Invoice ID of line item
      in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - description: Invoice line item ID
      in: path
      name: line_item_id
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          period:
            explode: true
            style: deepObject
          price_data:
            explode: true
            style: deepObject
          pricing:
            explode: true
            style: deepObject
          tax_amounts:
            explode: true
            style: deepObject
          tax_rates:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The integer amount in cents (or local equivalent) of the charge
                to be applied to the upcoming invoice. If you want to apply a
                credit to the customer's account, pass a negative amount.
              type: integer
            description:
              description: >-
                An arbitrary string which you can attach to the invoice item.
                The description is displayed in the invoice for easy tracking.
              maxLength: 5000
              type: string
            discountable:
              description: >-
                Controls whether discounts apply to this line item. Defaults to
                false for prorations or negative line items, and true for all
                other line items. Cannot be set to true for prorations.
              type: boolean
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The coupons, promotion codes & existing discounts which apply to
                the line item. Item discounts are applied before invoice
                discounts. Pass an empty string to remove previously-defined
                discounts.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
                For [type=subscription](/api/invoices/line_item) line items, the
                incoming metadata specified on the request is directly used to
                set this value, in contrast to
                [type=invoiceitem](/api/invoices/line_item) line items, where
                any existing metadata on the invoice line is merged with the
                incoming data.
            period:
              description: >-
                The period associated with this invoice item. When set to
                different values, the period will be rendered on the invoice. If
                you have [Stripe Revenue
                Recognition](https://docs.stripe.com/revenue-recognition)
                enabled, the period will be used to recognize and defer revenue.
                See the [Revenue Recognition
                documentation](https://docs.stripe.com/revenue-recognition/methodology/subscriptions-and-invoicing)
                for details.
              properties:
                end:
                  format: unix-time
                  type: integer
                start:
                  format: unix-time
                  type: integer
              required:
                - end
                - start
              title: period
              type: object
            price_data:
              description: >-
                Data used to generate a new
                [Price](https://docs.stripe.com/api/prices) object inline.
              properties:
                currency:
                  format: currency
                  type: string
                product:
                  maxLength: 5000
                  type: string
                product_data:
                  properties:
                    description:
                      maxLength: 40000
                      type: string
                    images:
                      items:
                        type: string
                      type: array
                    metadata:
                      additionalProperties:
                        type: string
                      type: object
                    name:
                      maxLength: 5000
                      type: string
                    tax_code:
                      maxLength: 5000
                      type: string
                    unit_label:
                      maxLength: 12
                      type: string
                  required:
                    - name
                  title: product_data
                  type: object
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - unspecified
                  type: string
                unit_amount:
                  type: integer
                unit_amount_decimal:
                  format: decimal
                  type: string
              required:
                - currency
              title: one_time_price_data_with_product_data
              type: object
            pricing:
              description: The pricing information for the invoice item.
              properties:
                price:
                  maxLength: 5000
                  type: string
              title: pricing_param
              type: object
            quantity:
              description: >-
                Non-negative integer. The quantity of units for the line item.
                Use `quantity_decimal` instead to provide decimal precision.
                This field will be deprecated in favor of `quantity_decimal` in
                a future version.
              type: integer
            quantity_decimal:
              description: >-
                Non-negative decimal with at most 12 decimal places. The
                quantity of units for the line item.
              format: decimal
              type: string
            tax_amounts:
              anyOf:
                - items:
                    properties:
                      amount:
                        type: integer
                      tax_rate_data:
                        properties:
                          country:
                            maxLength: 5000
                            type: string
                          description:
                            maxLength: 5000
                            type: string
                          display_name:
                            maxLength: 200
                            type: string
                          inclusive:
                            type: boolean
                          jurisdiction:
                            maxLength: 200
                            type: string
                          jurisdiction_level:
                            enum:
                              - city
                              - country
                              - county
                              - district
                              - multiple
                              - state
                            type: string
                          percentage:
                            type: number
                          state:
                            maxLength: 5000
                            type: string
                          tax_type:
                            enum:
                              - amusement_tax
                              - communications_tax
                              - gst
                              - hst
                              - igst
                              - jct
                              - lease_tax
                              - mass_transit_parking_tax
                              - parking_tax
                              - pst
                              - qst
                              - retail_delivery_fee
                              - rst
                              - sales_tax
                              - service_tax
                              - vat
                            type: string
                            x-stripeBypassValidation: true
                        required:
                          - display_name
                          - inclusive
                          - percentage
                        title: tax_rate_data_param
                        type: object
                      taxability_reason:
                        enum:
                          - customer_exempt
                          - not_collecting
                          - not_subject_to_tax
                          - not_supported
                          - portion_product_exempt
                          - portion_reduced_rated
                          - portion_standard_rated
                          - product_exempt
                          - product_exempt_holiday
                          - proportionally_rated
                          - reduced_rated
                          - reverse_charge
                          - standard_rated
                          - taxable_basis_reduced
                          - zero_rated
                        type: string
                        x-stripeBypassValidation: true
                      taxable_amount:
                        type: integer
                    required:
                      - amount
                      - tax_rate_data
                      - taxable_amount
                    title: tax_amount_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                A list of up to 20 tax amounts for this line item. This can be
                useful if you calculate taxes on your own or use a third-party
                to calculate them. You cannot set tax amounts if any line item
                has
                [tax_rates](https://docs.stripe.com/api/invoices/line_item#invoice_line_item_object-tax_rates)
                or if the invoice has
                [default_tax_rates](https://docs.stripe.com/api/invoices/object#invoice_object-default_tax_rates)
                or uses [automatic tax](https://docs.stripe.com/tax/invoicing).
                Pass an empty string to remove previously defined tax amounts.
            tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The tax rates which apply to the line item. When set, the
                `default_tax_rates` on the invoice do not apply to this line
                item. Pass an empty string to remove previously-defined tax
                rates.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/line_item.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update an invoice's line item
