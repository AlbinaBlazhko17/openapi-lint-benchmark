get:
  description: <p>Returns a list of top-ups.</p>
  operationId: GetTopups
  parameters:
    - description: A positive integer representing how much to transfer.
      explode: true
      in: query
      name: amount
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A filter on the list, based on the object `created` field. The value can
        be a string with an integer Unix timestamp, or it can be a dictionary
        with a number of different query options.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return top-ups that have the given status. One of `canceled`,
        `failed`, `pending` or `succeeded`.
      in: query
      name: status
      required: false
      schema:
        enum:
          - canceled
          - failed
          - pending
          - succeeded
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/topup.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/topups
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TopupList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all top-ups
post:
  description: <p>Top up the balance of an account</p>
  operationId: PostTopups
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payment_method_options:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: A positive integer representing how much to transfer.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            payment_method:
              description: >-
                The ID of a PaymentMethod representing the payment method to be
                used for the top-up. A PaymentMethod of type `us_bank_account`
                can be used.
              maxLength: 5000
              type: string
            payment_method_options:
              description: Payment method-specific configuration for this top-up.
              properties:
                us_bank_account:
                  properties:
                    network:
                      enum:
                        - ach
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - network
                  title: us_bank_account_param
                  type: object
              title: payment_method_options_param
              type: object
            source:
              description: >-
                The ID of a source to transfer funds from. For most users, this
                should be left unspecified which will use the bank account that
                was set up in the dashboard for the specified currency. In test
                mode, this can be a test bank token (see [Testing
                Top-ups](https://docs.stripe.com/connect/testing#testing-top-ups)).
              maxLength: 5000
              type: string
            statement_descriptor:
              description: >-
                Extra information about a top-up for the source's bank
                statement. Limited to 15 ASCII characters.
              maxLength: 15
              type: string
            transfer_group:
              description: A string that identifies this top-up as part of a group.
              type: string
          required:
            - amount
            - currency
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/topup.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a top-up
