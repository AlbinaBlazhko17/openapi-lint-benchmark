get:
  description: >-
    <p>Returns a list of your tax rates. Tax rates are returned sorted by
    creation date, with the most recently created tax rates appearing first.</p>
  operationId: GetTaxRates
  parameters:
    - description: >-
        Optional flag to filter by tax rates that are either active or inactive
        (archived).
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: Optional range for filtering created date.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        Optional flag to filter by tax rates that are inclusive (or those that
        are not inclusive).
      in: query
      name: inclusive
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/tax_rate.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/tax_rates
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TaxRatesList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all tax rates
post:
  description: <p>Creates a new tax rate.</p>
  operationId: PostTaxRates
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Flag determining whether the tax rate is active or inactive
                (archived). Inactive tax rates cannot be used with new
                applications or Checkout Sessions, but will still work for
                subscriptions and invoices that already have it set.
              type: boolean
            country:
              description: >-
                Two-letter country code ([ISO 3166-1
                alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).
              maxLength: 5000
              type: string
            description:
              description: >-
                An arbitrary string attached to the tax rate for your internal
                use only. It will not be visible to your customers.
              maxLength: 5000
              type: string
            display_name:
              description: The display name of the tax rate, which will be shown to users.
              maxLength: 50
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            inclusive:
              description: This specifies if the tax rate is inclusive or exclusive.
              type: boolean
            jurisdiction:
              description: >-
                The jurisdiction for the tax rate. You can use this label field
                for tax reporting purposes. It also appears on your customer’s
                invoice.
              maxLength: 50
              type: string
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            percentage:
              description: This represents the tax rate percent out of 100.
              type: number
            state:
              description: >-
                [ISO 3166-2 subdivision
                code](https://en.wikipedia.org/wiki/ISO_3166-2), without country
                prefix. For example, "NY" for New York, United States.
              maxLength: 5000
              type: string
            tax_type:
              description: The high-level tax type, such as `vat` or `sales_tax`.
              enum:
                - amusement_tax
                - communications_tax
                - gst
                - hst
                - igst
                - jct
                - lease_tax
                - mass_transit_parking_tax
                - parking_tax
                - pst
                - qst
                - retail_delivery_fee
                - rst
                - sales_tax
                - service_tax
                - vat
              type: string
              x-stripeBypassValidation: true
          required:
            - display_name
            - inclusive
            - percentage
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/tax_rate.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a tax rate
