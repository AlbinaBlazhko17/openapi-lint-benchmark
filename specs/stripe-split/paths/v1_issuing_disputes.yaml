get:
  description: >-
    <p>Returns a list of Issuing <code>Dispute</code> objects. The objects are
    sorted in descending order by creation date, with the most recently created
    object appearing first.</p>
  operationId: GetIssuingDisputes
  parameters:
    - description: >-
        Only return Issuing disputes that were created during the given date
        interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Select Issuing disputes with the given status.
      in: query
      name: status
      required: false
      schema:
        enum:
          - expired
          - lost
          - submitted
          - unsubmitted
          - won
        type: string
      style: form
    - description: Select the Issuing dispute for the given transaction.
      in: query
      name: transaction
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/issuing.dispute.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/issuing/disputes
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: IssuingDisputeList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all disputes
post:
  description: >-
    <p>Creates an Issuing <code>Dispute</code> object. Individual pieces of
    evidence within the <code>evidence</code> object are optional at this point.
    Stripe only validates that required evidence is present during submission.
    Refer to <a
    href="/docs/issuing/purchases/disputes#dispute-reasons-and-evidence">Dispute
    reasons and evidence</a> for more details about evidence requirements.</p>
  operationId: PostIssuingDisputes
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          evidence:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          treasury:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                The dispute amount in the card's currency and in the [smallest
                currency unit](https://docs.stripe.com/currencies#zero-decimal).
                If not set, defaults to the full transaction amount.
              type: integer
            evidence:
              description: Evidence provided for the dispute.
              properties:
                canceled:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        canceled_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                        cancellation_policy_provided:
                          anyOf:
                            - type: boolean
                            - enum:
                                - ''
                              type: string
                        cancellation_reason:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        expected_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_description:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_type:
                          enum:
                            - ''
                            - merchandise
                            - service
                          type: string
                        return_status:
                          enum:
                            - ''
                            - merchant_rejected
                            - successful
                          type: string
                        returned_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                      title: canceled
                      type: object
                    - enum:
                        - ''
                      type: string
                duplicate:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        card_statement:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        cash_receipt:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        check_image:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        original_transaction:
                          maxLength: 5000
                          type: string
                      title: duplicate
                      type: object
                    - enum:
                        - ''
                      type: string
                fraudulent:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                      title: fraudulent
                      type: object
                    - enum:
                        - ''
                      type: string
                merchandise_not_as_described:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        received_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                        return_description:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        return_status:
                          enum:
                            - ''
                            - merchant_rejected
                            - successful
                          type: string
                        returned_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                      title: merchandise_not_as_described
                      type: object
                    - enum:
                        - ''
                      type: string
                no_valid_authorization:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                      title: no_valid_authorization
                      type: object
                    - enum:
                        - ''
                      type: string
                not_received:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        expected_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_description:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_type:
                          enum:
                            - ''
                            - merchandise
                            - service
                          type: string
                      title: not_received
                      type: object
                    - enum:
                        - ''
                      type: string
                other:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_description:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        product_type:
                          enum:
                            - ''
                            - merchandise
                            - service
                          type: string
                      title: other
                      type: object
                    - enum:
                        - ''
                      type: string
                reason:
                  enum:
                    - canceled
                    - duplicate
                    - fraudulent
                    - merchandise_not_as_described
                    - no_valid_authorization
                    - not_received
                    - other
                    - service_not_as_described
                  type: string
                  x-stripeBypassValidation: true
                service_not_as_described:
                  anyOf:
                    - properties:
                        additional_documentation:
                          anyOf:
                            - type: string
                            - enum:
                                - ''
                              type: string
                        canceled_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                        cancellation_reason:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        explanation:
                          anyOf:
                            - maxLength: 2500
                              type: string
                            - enum:
                                - ''
                              type: string
                        received_at:
                          anyOf:
                            - format: unix-time
                              type: integer
                            - enum:
                                - ''
                              type: string
                      title: service_not_as_described
                      type: object
                    - enum:
                        - ''
                      type: string
              title: evidence_param
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            transaction:
              description: >-
                The ID of the issuing transaction to create a dispute for. For
                transaction on Treasury FinancialAccounts, use
                `treasury.received_debit`.
              maxLength: 5000
              type: string
            treasury:
              description: Params for disputes related to Treasury FinancialAccounts
              properties:
                received_debit:
                  maxLength: 5000
                  type: string
              required:
                - received_debit
              title: treasury_param
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.dispute.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a dispute
