post:
  description: >-
    <p>To connect to a reader the Stripe Terminal SDK needs to retrieve a
    short-lived connection token from Stripe, proxied through your server. On
    your backend, add an endpoint that creates and returns a connection
    token.</p>
  operationId: PostTerminalConnectionTokens
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            location:
              description: >-
                The id of the location that this connection token is scoped to.
                If specified the connection token will only be usable with
                readers assigned to that location, otherwise the connection
                token will be usable with all readers. Note that location
                scoping only applies to internet-connected readers. For more
                details, see [the docs on scoping connection
                tokens](https://docs.stripe.com/terminal/fleet/locations-and-zones?dashboard-or-api=api#connection-tokens).
              maxLength: 5000
              type: string
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/terminal.connection_token.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Connection Token
