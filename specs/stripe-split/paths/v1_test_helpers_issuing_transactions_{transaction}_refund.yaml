post:
  description: <p>Refund a test-mode Transaction.</p>
  operationId: PostTestHelpersIssuingTransactionsTransactionRefund
  parameters:
    - in: path
      name: transaction
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            refund_amount:
              description: >-
                The total amount to attempt to refund. This amount is in the
                provided currency, or defaults to the cards currency, and in the
                [smallest currency
                unit](https://docs.stripe.com/currencies#zero-decimal).
              type: integer
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/issuing.transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Refund a test-mode transaction
