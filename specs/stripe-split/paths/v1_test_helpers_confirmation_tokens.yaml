post:
  description: >-
    <p>Creates a test mode Confirmation Token server side for your integration
    tests.</p>
  operationId: PostTestHelpersConfirmationTokens
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          payment_method_data:
            explode: true
            style: deepObject
          payment_method_options:
            explode: true
            style: deepObject
          shipping:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            payment_method:
              description: ID of an existing PaymentMethod.
              maxLength: 5000
              type: string
            payment_method_data:
              description: If provided, this hash will be used to create a PaymentMethod.
              properties:
                acss_debit:
                  properties:
                    account_number:
                      maxLength: 5000
                      type: string
                    institution_number:
                      maxLength: 5000
                      type: string
                    transit_number:
                      maxLength: 5000
                      type: string
                  required:
                    - account_number
                    - institution_number
                    - transit_number
                  title: payment_method_param
                  type: object
                affirm:
                  properties: {}
                  title: param
                  type: object
                afterpay_clearpay:
                  properties: {}
                  title: param
                  type: object
                alipay:
                  properties: {}
                  title: param
                  type: object
                allow_redisplay:
                  enum:
                    - always
                    - limited
                    - unspecified
                  type: string
                alma:
                  properties: {}
                  title: param
                  type: object
                amazon_pay:
                  properties: {}
                  title: param
                  type: object
                au_becs_debit:
                  properties:
                    account_number:
                      maxLength: 5000
                      type: string
                    bsb_number:
                      maxLength: 5000
                      type: string
                  required:
                    - account_number
                    - bsb_number
                  title: param
                  type: object
                bacs_debit:
                  properties:
                    account_number:
                      maxLength: 5000
                      type: string
                    sort_code:
                      maxLength: 5000
                      type: string
                  title: param
                  type: object
                bancontact:
                  properties: {}
                  title: param
                  type: object
                billie:
                  properties: {}
                  title: param
                  type: object
                billing_details:
                  properties:
                    address:
                      anyOf:
                        - properties:
                            city:
                              maxLength: 5000
                              type: string
                            country:
                              maxLength: 5000
                              type: string
                            line1:
                              maxLength: 5000
                              type: string
                            line2:
                              maxLength: 5000
                              type: string
                            postal_code:
                              maxLength: 5000
                              type: string
                            state:
                              maxLength: 5000
                              type: string
                          title: billing_details_address
                          type: object
                        - enum:
                            - ''
                          type: string
                    email:
                      anyOf:
                        - type: string
                        - enum:
                            - ''
                          type: string
                    name:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    phone:
                      anyOf:
                        - maxLength: 5000
                          type: string
                        - enum:
                            - ''
                          type: string
                    tax_id:
                      maxLength: 5000
                      type: string
                  title: billing_details_inner_params
                  type: object
                bizum:
                  properties: {}
                  title: param
                  type: object
                blik:
                  properties: {}
                  title: param
                  type: object
                boleto:
                  properties:
                    tax_id:
                      maxLength: 5000
                      type: string
                  required:
                    - tax_id
                  title: param
                  type: object
                cashapp:
                  properties: {}
                  title: param
                  type: object
                crypto:
                  properties: {}
                  title: param
                  type: object
                customer_balance:
                  properties: {}
                  title: param
                  type: object
                eps:
                  properties:
                    bank:
                      enum:
                        - arzte_und_apotheker_bank
                        - austrian_anadi_bank_ag
                        - bank_austria
                        - bankhaus_carl_spangler
                        - bankhaus_schelhammer_und_schattera_ag
                        - bawag_psk_ag
                        - bks_bank_ag
                        - brull_kallmus_bank_ag
                        - btv_vier_lander_bank
                        - capital_bank_grawe_gruppe_ag
                        - deutsche_bank_ag
                        - dolomitenbank
                        - easybank_ag
                        - erste_bank_und_sparkassen
                        - hypo_alpeadriabank_international_ag
                        - hypo_bank_burgenland_aktiengesellschaft
                        - hypo_noe_lb_fur_niederosterreich_u_wien
                        - hypo_oberosterreich_salzburg_steiermark
                        - hypo_tirol_bank_ag
                        - hypo_vorarlberg_bank_ag
                        - marchfelder_bank
                        - oberbank_ag
                        - raiffeisen_bankengruppe_osterreich
                        - schoellerbank_ag
                        - sparda_bank_wien
                        - volksbank_gruppe
                        - volkskreditbank_ag
                        - vr_bank_braunau
                      maxLength: 5000
                      type: string
                  title: param
                  type: object
                fpx:
                  properties:
                    bank:
                      enum:
                        - affin_bank
                        - agrobank
                        - alliance_bank
                        - ambank
                        - bank_islam
                        - bank_muamalat
                        - bank_of_china
                        - bank_rakyat
                        - bnp_paribas
                        - bsn
                        - cimb
                        - citibank
                        - deutsche_bank
                        - hong_leong_bank
                        - hsbc
                        - kfh
                        - maybank2e
                        - maybank2u
                        - mbsb_bank
                        - ocbc
                        - pb_enterprise
                        - public_bank
                        - rhb
                        - standard_chartered
                        - uob
                      maxLength: 5000
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - bank
                  title: param
                  type: object
                giropay:
                  properties: {}
                  title: param
                  type: object
                grabpay:
                  properties: {}
                  title: param
                  type: object
                ideal:
                  properties:
                    bank:
                      enum:
                        - abn_amro
                        - adyen
                        - asn_bank
                        - bunq
                        - buut
                        - finom
                        - handelsbanken
                        - ing
                        - knab
                        - mollie
                        - moneyou
                        - n26
                        - nn
                        - rabobank
                        - regiobank
                        - revolut
                        - sns_bank
                        - triodos_bank
                        - van_lanschot
                        - yoursafe
                      maxLength: 5000
                      type: string
                  title: param
                  type: object
                interac_present:
                  properties: {}
                  title: param
                  type: object
                kakao_pay:
                  properties: {}
                  title: param
                  type: object
                klarna:
                  properties:
                    dob:
                      properties:
                        day:
                          type: integer
                        month:
                          type: integer
                        year:
                          type: integer
                      required:
                        - day
                        - month
                        - year
                      title: date_of_birth
                      type: object
                  title: param
                  type: object
                konbini:
                  properties: {}
                  title: param
                  type: object
                kr_card:
                  properties: {}
                  title: param
                  type: object
                link:
                  properties: {}
                  title: param
                  type: object
                mb_way:
                  properties: {}
                  title: param
                  type: object
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                mobilepay:
                  properties: {}
                  title: param
                  type: object
                multibanco:
                  properties: {}
                  title: param
                  type: object
                naver_pay:
                  properties:
                    funding:
                      enum:
                        - card
                        - points
                      type: string
                      x-stripeBypassValidation: true
                  title: param
                  type: object
                nz_bank_account:
                  properties:
                    account_holder_name:
                      maxLength: 5000
                      type: string
                    account_number:
                      maxLength: 5000
                      type: string
                    bank_code:
                      maxLength: 5000
                      type: string
                    branch_code:
                      maxLength: 5000
                      type: string
                    reference:
                      maxLength: 128
                      type: string
                    suffix:
                      maxLength: 5000
                      type: string
                  required:
                    - account_number
                    - bank_code
                    - branch_code
                    - suffix
                  title: param
                  type: object
                oxxo:
                  properties: {}
                  title: param
                  type: object
                p24:
                  properties:
                    bank:
                      enum:
                        - alior_bank
                        - bank_millennium
                        - bank_nowy_bfg_sa
                        - bank_pekao_sa
                        - banki_spbdzielcze
                        - blik
                        - bnp_paribas
                        - boz
                        - citi_handlowy
                        - credit_agricole
                        - envelobank
                        - etransfer_pocztowy24
                        - getin_bank
                        - ideabank
                        - ing
                        - inteligo
                        - mbank_mtransfer
                        - nest_przelew
                        - noble_pay
                        - pbac_z_ipko
                        - plus_bank
                        - santander_przelew24
                        - tmobile_usbugi_bankowe
                        - toyota_bank
                        - velobank
                        - volkswagen_bank
                      type: string
                      x-stripeBypassValidation: true
                  title: param
                  type: object
                pay_by_bank:
                  properties: {}
                  title: param
                  type: object
                payco:
                  properties: {}
                  title: param
                  type: object
                paynow:
                  properties: {}
                  title: param
                  type: object
                paypal:
                  properties: {}
                  title: param
                  type: object
                payto:
                  properties:
                    account_number:
                      maxLength: 5000
                      type: string
                    bsb_number:
                      maxLength: 5000
                      type: string
                    pay_id:
                      maxLength: 5000
                      type: string
                  title: param
                  type: object
                pix:
                  properties: {}
                  title: param
                  type: object
                promptpay:
                  properties: {}
                  title: param
                  type: object
                radar_options:
                  properties:
                    session:
                      maxLength: 5000
                      type: string
                  title: radar_options_with_hidden_options
                  type: object
                revolut_pay:
                  properties: {}
                  title: param
                  type: object
                samsung_pay:
                  properties: {}
                  title: param
                  type: object
                satispay:
                  properties: {}
                  title: param
                  type: object
                scalapay:
                  properties: {}
                  title: param
                  type: object
                sepa_debit:
                  properties:
                    iban:
                      maxLength: 5000
                      type: string
                  required:
                    - iban
                  title: param
                  type: object
                sofort:
                  properties:
                    country:
                      enum:
                        - AT
                        - BE
                        - DE
                        - ES
                        - IT
                        - NL
                      type: string
                  required:
                    - country
                  title: param
                  type: object
                sunbit:
                  properties: {}
                  title: param
                  type: object
                swish:
                  properties: {}
                  title: param
                  type: object
                twint:
                  properties: {}
                  title: param
                  type: object
                type:
                  enum:
                    - acss_debit
                    - affirm
                    - afterpay_clearpay
                    - alipay
                    - alma
                    - amazon_pay
                    - au_becs_debit
                    - bacs_debit
                    - bancontact
                    - billie
                    - bizum
                    - blik
                    - boleto
                    - cashapp
                    - crypto
                    - customer_balance
                    - eps
                    - fpx
                    - giropay
                    - grabpay
                    - ideal
                    - kakao_pay
                    - klarna
                    - konbini
                    - kr_card
                    - link
                    - mb_way
                    - mobilepay
                    - multibanco
                    - naver_pay
                    - nz_bank_account
                    - oxxo
                    - p24
                    - pay_by_bank
                    - payco
                    - paynow
                    - paypal
                    - payto
                    - pix
                    - promptpay
                    - revolut_pay
                    - samsung_pay
                    - satispay
                    - scalapay
                    - sepa_debit
                    - sofort
                    - sunbit
                    - swish
                    - twint
                    - upi
                    - us_bank_account
                    - wechat_pay
                    - zip
                  type: string
                  x-stripeBypassValidation: true
                upi:
                  properties:
                    mandate_options:
                      properties:
                        amount:
                          type: integer
                        amount_type:
                          enum:
                            - fixed
                            - maximum
                          type: string
                        description:
                          maxLength: 20
                          type: string
                        end_date:
                          format: unix-time
                          type: integer
                      title: mandate_options
                      type: object
                  title: param
                  type: object
                us_bank_account:
                  properties:
                    account_holder_type:
                      enum:
                        - company
                        - individual
                      type: string
                    account_number:
                      maxLength: 5000
                      type: string
                    account_type:
                      enum:
                        - checking
                        - savings
                      type: string
                    financial_connections_account:
                      maxLength: 5000
                      type: string
                    routing_number:
                      maxLength: 5000
                      type: string
                  title: payment_method_param
                  type: object
                wechat_pay:
                  properties: {}
                  title: param
                  type: object
                zip:
                  properties: {}
                  title: param
                  type: object
              required:
                - type
              title: payment_method_data_params
              type: object
            payment_method_options:
              description: >-
                Payment-method-specific configuration for this
                ConfirmationToken.
              properties:
                card:
                  properties:
                    installments:
                      properties:
                        plan:
                          properties:
                            count:
                              type: integer
                            interval:
                              enum:
                                - month
                              type: string
                            type:
                              enum:
                                - bonus
                                - fixed_count
                                - revolving
                              type: string
                          required:
                            - type
                          title: installment_plan
                          type: object
                      required:
                        - plan
                      title: installments_param
                      type: object
                  title: card_param
                  type: object
              title: test_payment_method_options_param
              type: object
            return_url:
              description: Return URL used to confirm the Intent.
              type: string
            setup_future_usage:
              description: >-
                Indicates that you intend to make future payments with this
                ConfirmationToken's payment method.


                The presence of this property will [attach the payment
                method](https://docs.stripe.com/payments/save-during-payment) to
                the PaymentIntent's Customer, if present, after the
                PaymentIntent is confirmed and any required actions from the
                user are complete.
              enum:
                - off_session
                - on_session
              type: string
            shipping:
              description: Shipping information for this ConfirmationToken.
              properties:
                address:
                  properties:
                    city:
                      maxLength: 5000
                      type: string
                    country:
                      maxLength: 5000
                      type: string
                    line1:
                      maxLength: 5000
                      type: string
                    line2:
                      maxLength: 5000
                      type: string
                    postal_code:
                      maxLength: 5000
                      type: string
                    state:
                      maxLength: 5000
                      type: string
                  title: optional_fields_address
                  type: object
                name:
                  maxLength: 5000
                  type: string
                phone:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
              required:
                - address
                - name
              title: recipient_shipping_with_optional_fields_address
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/confirmation_token.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a test Confirmation Token
