post:
  description: >-
    <p>Closes a FinancialAccount. A FinancialAccount can only be closed if it
    has a zero balance, has no pending InboundTransfers, and has canceled all
    attached Issuing cards.</p>
  operationId: PostTreasuryFinancialAccountsFinancialAccountClose
  parameters:
    - in: path
      name: financial_account
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          forwarding_settings:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            forwarding_settings:
              description: >-
                A different bank account where funds can be deposited/debited in
                order to get the closing FA's balance to $0
              properties:
                financial_account:
                  type: string
                payment_method:
                  maxLength: 5000
                  type: string
                type:
                  enum:
                    - financial_account
                    - payment_method
                  type: string
              required:
                - type
              title: forwarding_settings
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.financial_account.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Close a FinancialAccount
