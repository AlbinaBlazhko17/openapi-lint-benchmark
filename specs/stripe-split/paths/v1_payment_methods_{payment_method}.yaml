get:
  description: >-
    <p>Retrieves a PaymentMethod object attached to the StripeAccount. To
    retrieve a payment method attached to a Customer, you should use <a
    href="/docs/api/payment_methods/customer">Retrieve a Customer’s
    PaymentMethods</a></p>
  operationId: GetPaymentMethodsPaymentMethod
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: payment_method
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_method.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a PaymentMethod
post:
  description: >-
    <p>Updates a PaymentMethod object. A PaymentMethod must be attached to a
    customer to be updated.</p>
  operationId: PostPaymentMethodsPaymentMethod
  parameters:
    - in: path
      name: payment_method
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          billing_details:
            explode: true
            style: deepObject
          card:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          payto:
            explode: true
            style: deepObject
          us_bank_account:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            allow_redisplay:
              description: >-
                This field indicates whether this payment method can be shown
                again to its customer in a checkout flow. Stripe products such
                as Checkout and Elements use this field to determine whether a
                payment method can be shown as a saved payment method in a
                checkout flow. The field defaults to `unspecified`.
              enum:
                - always
                - limited
                - unspecified
              type: string
            billing_details:
              description: >-
                Billing information associated with the PaymentMethod that may
                be used or required by particular types of payment methods.
              properties:
                address:
                  anyOf:
                    - properties:
                        city:
                          maxLength: 5000
                          type: string
                        country:
                          maxLength: 5000
                          type: string
                        line1:
                          maxLength: 5000
                          type: string
                        line2:
                          maxLength: 5000
                          type: string
                        postal_code:
                          maxLength: 5000
                          type: string
                        state:
                          maxLength: 5000
                          type: string
                      title: billing_details_address
                      type: object
                    - enum:
                        - ''
                      type: string
                email:
                  anyOf:
                    - type: string
                    - enum:
                        - ''
                      type: string
                name:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
                phone:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
                tax_id:
                  maxLength: 5000
                  type: string
              title: billing_details_inner_params
              type: object
            card:
              description: >-
                If this is a `card` PaymentMethod, this hash contains the user's
                card details.
              properties:
                exp_month:
                  type: integer
                exp_year:
                  type: integer
                networks:
                  properties:
                    preferred:
                      enum:
                        - ''
                        - cartes_bancaires
                        - mastercard
                        - visa
                      type: string
                  title: networks_update_api_param
                  type: object
              title: update_api_param
              type: object
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            payto:
              description: >-
                If this is a `payto` PaymentMethod, this hash contains details
                about the PayTo payment method.
              properties:
                account_number:
                  maxLength: 5000
                  type: string
                bsb_number:
                  maxLength: 5000
                  type: string
                pay_id:
                  maxLength: 5000
                  type: string
              title: param
              type: object
            us_bank_account:
              description: >-
                If this is an `us_bank_account` PaymentMethod, this hash
                contains details about the US bank account payment method.
              properties:
                account_holder_type:
                  enum:
                    - company
                    - individual
                  type: string
                account_type:
                  enum:
                    - checking
                    - savings
                  type: string
              title: update_param
              type: object
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payment_method.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Update a PaymentMethod
