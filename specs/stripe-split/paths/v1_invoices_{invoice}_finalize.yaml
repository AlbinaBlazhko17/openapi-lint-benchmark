post:
  description: >-
    <p>Stripe automatically finalizes drafts before sending and attempting
    payment on invoices. However, if you’d like to finalize a draft invoice
    manually, you can do so using this method.</p>
  operationId: PostInvoicesInvoiceFinalize
  parameters:
    - in: path
      name: invoice
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            auto_advance:
              description: >-
                Controls whether Stripe performs [automatic
                collection](https://docs.stripe.com/invoicing/integration/automatic-advancement-collection)
                of the invoice. If `false`, the invoice's state doesn't
                automatically advance without an explicit action.
              type: boolean
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/invoice.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Finalize an invoice
