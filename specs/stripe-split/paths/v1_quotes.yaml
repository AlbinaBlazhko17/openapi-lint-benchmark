get:
  description: <p>Returns a list of your quotes.</p>
  operationId: GetQuotes
  parameters:
    - description: The ID of the customer whose quotes you're retrieving.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        The ID of the account representing the customer whose quotes you're
        retrieving.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: The status of the quote.
      in: query
      name: status
      required: false
      schema:
        enum:
          - accepted
          - canceled
          - draft
          - open
        type: string
        x-stripeBypassValidation: true
      style: form
    - description: >-
        Provides a list of quotes that are associated with the specified test
        clock. The response will not include quotes with test clocks if this and
        the customer parameter is not set.
      in: query
      name: test_clock
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/quote.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/quotes
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: QuotesResourceQuoteList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all quotes
post:
  description: >-
    <p>A quote models prices and services for a customer. Default options for
    <code>header</code>, <code>description</code>, <code>footer</code>, and
    <code>expires_at</code> can be set in the dashboard via the <a
    href="https://dashboard.stripe.com/settings/billing/quote">quote
    template</a>.</p>
  operationId: PostQuotes
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          application_fee_amount:
            explode: true
            style: deepObject
          application_fee_percent:
            explode: true
            style: deepObject
          automatic_tax:
            explode: true
            style: deepObject
          default_tax_rates:
            explode: true
            style: deepObject
          description:
            explode: true
            style: deepObject
          discounts:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          footer:
            explode: true
            style: deepObject
          from_quote:
            explode: true
            style: deepObject
          header:
            explode: true
            style: deepObject
          invoice_settings:
            explode: true
            style: deepObject
          line_items:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          on_behalf_of:
            explode: true
            style: deepObject
          subscription_data:
            explode: true
            style: deepObject
          transfer_data:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            application_fee_amount:
              anyOf:
                - type: integer
                - enum:
                    - ''
                  type: string
              description: >-
                The amount of the application fee (if any) that will be
                requested to be applied to the payment and transferred to the
                application owner's Stripe account. There cannot be any line
                items with recurring prices when using this field.
            application_fee_percent:
              anyOf:
                - type: number
                - enum:
                    - ''
                  type: string
              description: >-
                A non-negative decimal between 0 and 100, with at most two
                decimal places. This represents the percentage of the
                subscription invoice total that will be transferred to the
                application owner's Stripe account. There must be at least 1
                line item with a recurring price to use this field.
            automatic_tax:
              description: >-
                Settings for automatic tax lookup for this quote and resulting
                invoices and subscriptions.
              properties:
                enabled:
                  type: boolean
                liability:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              required:
                - enabled
              title: automatic_tax_param
              type: object
            collection_method:
              description: >-
                Either `charge_automatically`, or `send_invoice`. When charging
                automatically, Stripe will attempt to pay invoices at the end of
                the subscription cycle or at invoice finalization using the
                default payment method attached to the subscription or customer.
                When sending an invoice, Stripe will email your customer an
                invoice with payment instructions and mark the subscription as
                `active`. Defaults to `charge_automatically`.
              enum:
                - charge_automatically
                - send_invoice
              type: string
            customer:
              description: >-
                The customer for which this quote belongs to. A customer is
                required before finalizing the quote. Once specified, it cannot
                be changed.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                The account for which this quote belongs to. A customer or
                account is required before finalizing the quote. Once specified,
                it cannot be changed.
              maxLength: 5000
              type: string
            default_tax_rates:
              anyOf:
                - items:
                    maxLength: 5000
                    type: string
                  type: array
                - enum:
                    - ''
                  type: string
              description: >-
                The tax rates that will apply to any line item that does not
                have `tax_rates` set.
            description:
              anyOf:
                - maxLength: 500
                  type: string
                - enum:
                    - ''
                  type: string
              description: >-
                A description that will be displayed on the quote PDF. If no
                value is passed, the default description configured in your
                [quote template
                settings](https://dashboard.stripe.com/settings/billing/quote)
                will be used.
            discounts:
              anyOf:
                - items:
                    properties:
                      coupon:
                        maxLength: 5000
                        type: string
                      discount:
                        maxLength: 5000
                        type: string
                      promotion_code:
                        maxLength: 5000
                        type: string
                    title: discounts_data_param
                    type: object
                  type: array
                - enum:
                    - ''
                  type: string
              description: The discounts applied to the quote.
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            expires_at:
              description: >-
                A future timestamp on which the quote will be canceled if in
                `open` or `draft` status. Measured in seconds since the Unix
                epoch. If no value is passed, the default expiration date
                configured in your [quote template
                settings](https://dashboard.stripe.com/settings/billing/quote)
                will be used.
              format: unix-time
              type: integer
            footer:
              anyOf:
                - maxLength: 500
                  type: string
                - enum:
                    - ''
                  type: string
              description: >-
                A footer that will be displayed on the quote PDF. If no value is
                passed, the default footer configured in your [quote template
                settings](https://dashboard.stripe.com/settings/billing/quote)
                will be used.
            from_quote:
              description: >-
                Clone an existing quote. The new quote will be created in
                `status=draft`. When using this parameter, you cannot specify
                any other parameters except for `expires_at`.
              properties:
                is_revision:
                  type: boolean
                quote:
                  maxLength: 5000
                  type: string
              required:
                - quote
              title: from_quote_params
              type: object
            header:
              anyOf:
                - maxLength: 50
                  type: string
                - enum:
                    - ''
                  type: string
              description: >-
                A header that will be displayed on the quote PDF. If no value is
                passed, the default header configured in your [quote template
                settings](https://dashboard.stripe.com/settings/billing/quote)
                will be used.
            invoice_settings:
              description: All invoices will be billed using the specified settings.
              properties:
                custom_fields:
                  anyOf:
                    - items:
                        properties:
                          name:
                            maxLength: 40
                            type: string
                          value:
                            maxLength: 140
                            type: string
                        required:
                          - name
                          - value
                        title: custom_field_params
                        type: object
                      type: array
                    - enum:
                        - ''
                      type: string
                days_until_due:
                  type: integer
                description:
                  anyOf:
                    - maxLength: 500
                      type: string
                    - enum:
                        - ''
                      type: string
                footer:
                  anyOf:
                    - maxLength: 5000
                      type: string
                    - enum:
                        - ''
                      type: string
                issuer:
                  properties:
                    account:
                      type: string
                    type:
                      enum:
                        - account
                        - self
                      type: string
                      x-stripeBypassValidation: true
                  required:
                    - type
                  title: param
                  type: object
              title: quote_param
              type: object
            line_items:
              description: >-
                A list of line items the customer is being quoted for. Each line
                item includes information about the product, the quantity, and
                the resulting cost.
              items:
                properties:
                  discounts:
                    anyOf:
                      - items:
                          properties:
                            coupon:
                              maxLength: 5000
                              type: string
                            discount:
                              maxLength: 5000
                              type: string
                            promotion_code:
                              maxLength: 5000
                              type: string
                          title: discounts_data_param
                          type: object
                        type: array
                      - enum:
                          - ''
                        type: string
                  price:
                    maxLength: 5000
                    type: string
                  price_data:
                    properties:
                      currency:
                        format: currency
                        type: string
                      product:
                        maxLength: 5000
                        type: string
                      recurring:
                        properties:
                          interval:
                            enum:
                              - day
                              - month
                              - week
                              - year
                            type: string
                          interval_count:
                            type: integer
                        required:
                          - interval
                        title: recurring_adhoc
                        type: object
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    required:
                      - currency
                      - product
                    title: price_data
                    type: object
                  quantity:
                    type: integer
                  tax_rates:
                    anyOf:
                      - items:
                          maxLength: 5000
                          type: string
                        type: array
                      - enum:
                          - ''
                        type: string
                title: line_item_create_params
                type: object
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            on_behalf_of:
              anyOf:
                - type: string
                - enum:
                    - ''
                  type: string
              description: The account on behalf of which to charge.
            subscription_data:
              description: >-
                When creating a subscription or subscription schedule, the
                specified configuration data will be used. There must be at
                least one line item with a recurring price for a subscription or
                subscription schedule to be created. A subscription schedule is
                created if `subscription_data[effective_date]` is present and in
                the future, otherwise a subscription is created.
              properties:
                billing_mode:
                  properties:
                    flexible:
                      properties:
                        proration_discounts:
                          enum:
                            - included
                            - itemized
                          type: string
                      title: flexible_params
                      type: object
                    type:
                      enum:
                        - classic
                        - flexible
                      type: string
                  required:
                    - type
                  title: billing_mode
                  type: object
                description:
                  maxLength: 500
                  type: string
                effective_date:
                  anyOf:
                    - enum:
                        - current_period_end
                      maxLength: 5000
                      type: string
                    - format: unix-time
                      type: integer
                    - enum:
                        - ''
                      type: string
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                trial_period_days:
                  anyOf:
                    - type: integer
                    - enum:
                        - ''
                      type: string
              title: subscription_data_create_params
              type: object
            test_clock:
              description: ID of the test clock to attach to the quote.
              maxLength: 5000
              type: string
            transfer_data:
              anyOf:
                - properties:
                    amount:
                      type: integer
                    amount_percent:
                      type: number
                    destination:
                      type: string
                  required:
                    - destination
                  title: transfer_data_specs
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                The data with which to automatically create a Transfer for each
                of the invoices.
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quote.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a quote
