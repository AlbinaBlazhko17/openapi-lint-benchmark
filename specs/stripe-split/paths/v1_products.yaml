get:
  description: >-
    <p>Returns a list of your products. The products are returned sorted by
    creation date, with the most recently created products appearing first.</p>
  operationId: GetProducts
  parameters:
    - description: >-
        Only return products that are active or inactive (e.g., pass `false` to
        list all inactive products).
      in: query
      name: active
      required: false
      schema:
        type: boolean
      style: form
    - description: Only return products that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        Only return products with the given IDs. Cannot be used with
        [starting_after](https://api.stripe.com#list_products-starting_after) or
        [ending_before](https://api.stripe.com#list_products-ending_before).
      explode: true
      in: query
      name: ids
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        Only return products that can be shipped (i.e., physical, not digital
        products).
      in: query
      name: shippable
      required: false
      schema:
        type: boolean
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return products with the given url.
      in: query
      name: url
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/product.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/products
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: ProductList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all products
post:
  description: <p>Creates a new product object.</p>
  operationId: PostProducts
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          default_price_data:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          images:
            explode: true
            style: deepObject
          marketing_features:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
          package_dimensions:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            active:
              description: >-
                Whether the product is currently available for purchase.
                Defaults to `true`.
              type: boolean
            default_price_data:
              description: >-
                Data used to generate a new
                [Price](https://docs.stripe.com/api/prices) object. This Price
                will be set as the default price for this product.
              properties:
                currency:
                  format: currency
                  type: string
                currency_options:
                  additionalProperties:
                    properties:
                      custom_unit_amount:
                        properties:
                          enabled:
                            type: boolean
                          maximum:
                            type: integer
                          minimum:
                            type: integer
                          preset:
                            type: integer
                        required:
                          - enabled
                        title: custom_unit_amount
                        type: object
                      tax_behavior:
                        enum:
                          - exclusive
                          - inclusive
                          - unspecified
                        type: string
                      tiers:
                        items:
                          properties:
                            flat_amount:
                              type: integer
                            flat_amount_decimal:
                              format: decimal
                              type: string
                            unit_amount:
                              type: integer
                            unit_amount_decimal:
                              format: decimal
                              type: string
                            up_to:
                              anyOf:
                                - enum:
                                    - inf
                                  maxLength: 5000
                                  type: string
                                - type: integer
                          required:
                            - up_to
                          title: tier
                          type: object
                        type: array
                      unit_amount:
                        type: integer
                      unit_amount_decimal:
                        format: decimal
                        type: string
                    title: currency_option
                    type: object
                  type: object
                custom_unit_amount:
                  properties:
                    enabled:
                      type: boolean
                    maximum:
                      type: integer
                    minimum:
                      type: integer
                    preset:
                      type: integer
                  required:
                    - enabled
                  title: custom_unit_amount
                  type: object
                metadata:
                  additionalProperties:
                    type: string
                  type: object
                recurring:
                  properties:
                    interval:
                      enum:
                        - day
                        - month
                        - week
                        - year
                      type: string
                    interval_count:
                      type: integer
                  required:
                    - interval
                  title: recurring_adhoc
                  type: object
                tax_behavior:
                  enum:
                    - exclusive
                    - inclusive
                    - unspecified
                  type: string
                unit_amount:
                  type: integer
                unit_amount_decimal:
                  format: decimal
                  type: string
              required:
                - currency
              title: price_data_without_product_with_metadata
              type: object
            description:
              description: >-
                The product's description, meant to be displayable to the
                customer. Use this field to optionally store a long form
                explanation of the product being sold for your own rendering
                purposes.
              maxLength: 40000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            id:
              description: >-
                An identifier will be randomly generated by Stripe. You can
                optionally override this ID, but the ID must be unique across
                all products in your Stripe account.
              maxLength: 5000
              type: string
            images:
              description: >-
                A list of up to 8 URLs of images for this product, meant to be
                displayable to the customer.
              items:
                type: string
              type: array
            marketing_features:
              description: >-
                A list of up to 15 marketing features for this product. These
                are displayed in [pricing
                tables](https://docs.stripe.com/payments/checkout/pricing-table).
              items:
                properties:
                  name:
                    maxLength: 5000
                    type: string
                required:
                  - name
                title: features
                type: object
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            name:
              description: The product's name, meant to be displayable to the customer.
              maxLength: 5000
              type: string
            package_dimensions:
              description: The dimensions of this product for shipping purposes.
              properties:
                height:
                  type: number
                length:
                  type: number
                weight:
                  type: number
                width:
                  type: number
              required:
                - height
                - length
                - weight
                - width
              title: package_dimensions_specs
              type: object
            shippable:
              description: Whether this product is shipped (i.e., physical goods).
              type: boolean
            statement_descriptor:
              description: >-
                An arbitrary string to be displayed on your customer's credit
                card or bank statement. While most banks display this
                information consistently, some may display it incorrectly or not
                at all.


                This may be up to 22 characters. The statement description may
                not include `<`, `>`, `\`, `"`, `'` characters, and will appear
                on your customer's statement in capital letters. Non-ASCII
                characters are automatically stripped.
                 It must contain at least one letter. Only used for subscription payments.
              maxLength: 22
              type: string
            tax_code:
              description: A [tax code](https://docs.stripe.com/tax/tax-categories) ID.
              type: string
            unit_label:
              description: >-
                A label that represents units of this product. When set, this
                will be included in customers' receipts, invoices, Checkout, and
                the customer portal.
              maxLength: 12
              type: string
            url:
              description: A URL of a publicly-accessible webpage for this product.
              maxLength: 5000
              type: string
          required:
            - name
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/product.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a product
