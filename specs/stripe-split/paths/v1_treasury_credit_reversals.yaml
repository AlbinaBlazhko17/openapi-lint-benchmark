get:
  description: <p>Returns a list of CreditReversals.</p>
  operationId: GetTreasuryCreditReversals
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: Returns objects associated with this FinancialAccount.
      in: query
      name: financial_account
      required: true
      schema:
        type: string
      style: form
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Only return CreditReversals for the ReceivedCredit ID.
      in: query
      name: received_credit
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return CreditReversals for a given status.
      in: query
      name: status
      required: false
      schema:
        enum:
          - canceled
          - posted
          - processing
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                description: Details about each object.
                items:
                  $ref: ../components/schemas/treasury.credit_reversal.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: TreasuryReceivedCreditsResourceCreditReversalList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all CreditReversals
post:
  description: <p>Reverses a ReceivedCredit and creates a CreditReversal object.</p>
  operationId: PostTreasuryCreditReversals
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            received_credit:
              description: The ReceivedCredit to reverse.
              maxLength: 5000
              type: string
          required:
            - received_credit
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/treasury.credit_reversal.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a CreditReversal
