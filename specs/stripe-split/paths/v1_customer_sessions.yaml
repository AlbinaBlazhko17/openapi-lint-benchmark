post:
  description: >-
    <p>Creates a Customer Session object that includes a single-use client
    secret that you can use on your front-end to grant client-side API access
    for certain customer resources.</p>
  operationId: PostCustomerSessions
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          components:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            components:
              description: >-
                Configuration for each component. At least 1 component must be
                enabled.
              properties:
                active_entitlements:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: active_entitlements_param
                  type: object
                buy_button:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: buy_button_param
                  type: object
                customer_portal:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: customer_portal_param
                  type: object
                customer_sheet:
                  properties:
                    enabled:
                      type: boolean
                    features:
                      properties:
                        payment_method_allow_redisplay_filters:
                          items:
                            enum:
                              - always
                              - limited
                              - unspecified
                            type: string
                          type: array
                        payment_method_remove:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                      title: features_param
                      type: object
                  required:
                    - enabled
                  title: customer_sheet_param
                  type: object
                mobile_payment_element:
                  properties:
                    enabled:
                      type: boolean
                    features:
                      properties:
                        payment_method_allow_redisplay_filters:
                          items:
                            enum:
                              - always
                              - limited
                              - unspecified
                            type: string
                          type: array
                        payment_method_redisplay:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_remove:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_save:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_save_allow_redisplay_override:
                          enum:
                            - always
                            - limited
                            - unspecified
                          type: string
                      title: features_param
                      type: object
                  required:
                    - enabled
                  title: mobile_payment_element_param
                  type: object
                payment_element:
                  properties:
                    enabled:
                      type: boolean
                    features:
                      properties:
                        payment_method_allow_redisplay_filters:
                          items:
                            enum:
                              - always
                              - limited
                              - unspecified
                            type: string
                          type: array
                        payment_method_redisplay:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_redisplay_limit:
                          type: integer
                        payment_method_remove:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_save:
                          enum:
                            - disabled
                            - enabled
                          type: string
                          x-stripeBypassValidation: true
                        payment_method_save_usage:
                          enum:
                            - off_session
                            - on_session
                          type: string
                      title: features_param
                      type: object
                  required:
                    - enabled
                  title: payment_element_param
                  type: object
                pricing_table:
                  properties:
                    enabled:
                      type: boolean
                  required:
                    - enabled
                  title: pricing_table_param
                  type: object
              title: components
              type: object
            customer:
              description: >-
                The ID of an existing customer for which to create the Customer
                Session.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                The ID of an existing Account for which to create the Customer
                Session.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
          required:
            - components
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/customer_session.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a Customer Session
