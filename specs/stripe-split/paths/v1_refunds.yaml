get:
  description: >-
    <p>Returns a list of all refunds you created. We return the refunds in
    sorted order, with the most recent refunds appearing first. The 10 most
    recent refunds are always available by default on the Charge object.</p>
  operationId: GetRefunds
  parameters:
    - description: Only return refunds for the charge specified by this charge ID.
      in: query
      name: charge
      required: false
      schema:
        type: string
      style: form
    - description: Only return refunds that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: Only return refunds for the PaymentIntent specified by this ID.
      in: query
      name: payment_intent
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/refund.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/refunds
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: APIMethodRefundList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all refunds
post:
  description: >-
    <p>When you create a new refund, you must specify a Charge or a
    PaymentIntent object on which to create it.</p>


    <p>Creating a new refund will refund a charge that has previously been
    created but not yet refunded.

    Funds will be refunded to the credit or debit card that was originally
    charged.</p>


    <p>You can optionally refund only part of a charge.

    You can do so multiple times, until the entire charge has been refunded.</p>


    <p>Once entirely refunded, a charge can’t be refunded again.

    This method will raise an error when called on an already-refunded charge,

    or when trying to refund more money than is left on a charge.</p>
  operationId: PostRefunds
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              type: integer
            charge:
              description: The identifier of the charge to refund.
              maxLength: 5000
              type: string
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            customer:
              description: Customer whose customer balance to refund from.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            instructions_email:
              description: >-
                For payment methods without native refund support (e.g.,
                Konbini, PromptPay), use this email from the customer to receive
                refund instructions.
              type: string
            metadata:
              anyOf:
                - additionalProperties:
                    type: string
                  type: object
                - enum:
                    - ''
                  type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
            origin:
              description: Origin of the refund
              enum:
                - customer_balance
              type: string
            payment_intent:
              description: The identifier of the PaymentIntent to refund.
              maxLength: 5000
              type: string
            reason:
              description: >-
                String indicating the reason for the refund. If set, possible
                values are `duplicate`, `fraudulent`, and
                `requested_by_customer`. If you believe the charge to be
                fraudulent, specifying `fraudulent` as the reason will add the
                associated card and email to your [block
                lists](https://docs.stripe.com/radar/lists), and will also help
                us improve our fraud detection algorithms.
              enum:
                - duplicate
                - fraudulent
                - requested_by_customer
              maxLength: 5000
              type: string
            refund_application_fee:
              description: >-
                Boolean indicating whether the application fee should be
                refunded when refunding this charge. If a full charge refund is
                given, the full application fee will be refunded. Otherwise, the
                application fee will be refunded in an amount proportional to
                the amount of the charge refunded. An application fee can be
                refunded only by the application that created the charge.
              type: boolean
            reverse_transfer:
              description: >-
                Boolean indicating whether the transfer should be reversed when
                refunding this charge. The transfer will be reversed
                proportionally to the amount being refunded (either the entire
                or partial amount).<br><br>A transfer can be reversed only by
                the application that created the charge.
              type: boolean
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/refund.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a refund
