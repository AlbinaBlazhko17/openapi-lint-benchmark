get:
  description: <p>Finds a secret in the secret store by name and scope.</p>
  operationId: GetAppsSecretsFind
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: A name for the secret that's unique within the scope.
      in: query
      name: name
      required: true
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Specifies the scoping of the secret. Requests originating from UI
        extensions can only access account-scoped secrets or secrets scoped to
        their own user.
      explode: true
      in: query
      name: scope
      required: true
      schema:
        properties:
          type:
            enum:
              - account
              - user
            type: string
          user:
            maxLength: 5000
            type: string
        required:
          - type
        title: scope_param
        type: object
      style: deepObject
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/apps.secret.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Find a Secret
