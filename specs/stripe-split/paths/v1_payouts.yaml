get:
  description: >-
    <p>Returns a list of existing payouts sent to third-party bank accounts or
    payouts that Stripe sent to you. The payouts return in sorted order, with
    the most recently created payouts appearing first.</p>
  operationId: GetPayouts
  parameters:
    - description: >-
        Only return payouts that are expected to arrive during the given date
        interval.
      explode: true
      in: query
      name: arrival_date
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: Only return payouts that were created during the given date interval.
      explode: true
      in: query
      name: created
      required: false
      schema:
        anyOf:
          - properties:
              gt:
                type: integer
              gte:
                type: integer
              lt:
                type: integer
              lte:
                type: integer
            title: range_query_specs
            type: object
          - type: integer
      style: deepObject
    - description: >-
        The ID of an external account - only return payouts sent to this
        external account.
      in: query
      name: destination
      required: false
      schema:
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        Only return payouts that have the given status: `pending`, `paid`,
        `failed`, or `canceled`.
      in: query
      name: status
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/payout.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/payouts
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: PayoutList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List all payouts
post:
  description: >-
    <p>To send funds to your own bank account, create a new payout object. Your
    <a href="#balance">Stripe balance</a> must cover the payout amount. If it
    doesn’t, you receive an “Insufficient Funds” error.</p>


    <p>If your API key is in test mode, money won’t actually be sent, though
    every other action occurs as if you’re in live mode.</p>


    <p>If you create a manual payout on a Stripe account that uses multiple
    payment source types, you need to specify the source type balance that the
    payout draws from. The <a href="/api/balances/object">balance object</a>
    details available and pending amounts by source type.</p>
  operationId: PostPayouts
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: A positive integer in cents representing how much to payout.
              type: integer
            currency:
              description: >-
                Three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a [supported
                currency](https://stripe.com/docs/currencies).
              format: currency
              type: string
            description:
              description: >-
                An arbitrary string attached to the object. Often useful for
                displaying to users.
              maxLength: 5000
              type: string
            destination:
              description: >-
                The ID of a bank account or a card to send the payout to. If you
                don't provide a destination, we use the default external account
                for the specified currency.
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            method:
              description: >-
                The method used to send this payout, which is `standard` or
                `instant`. We support `instant` for payouts to debit cards and
                bank accounts in certain countries. Learn more about [bank
                support for Instant
                Payouts](https://stripe.com/docs/payouts/instant-payouts-banks).
              enum:
                - instant
                - standard
              maxLength: 5000
              type: string
              x-stripeBypassValidation: true
            payout_method:
              description: The ID of a v2 FinancialAccount to send funds to.
              type: string
            source_type:
              description: >-
                The balance type of your Stripe balance to draw this payout
                from. Balances for different payment sources are kept
                separately. You can find the amounts with the Balances API. One
                of `bank_account`, `card`, or `fpx`.
              enum:
                - bank_account
                - card
                - fpx
              maxLength: 5000
              type: string
              x-stripeBypassValidation: true
            statement_descriptor:
              description: >-
                A string that displays on the recipient's bank or card statement
                (up to 22 characters). A `statement_descriptor` that's longer
                than 22 characters return an error. Most banks truncate this
                information and display it inconsistently. Some banks might not
                display it at all. For US ACH payouts, this maps to the ACH
                Company Entry Description field, which the NACHA standard limits
                to 10 characters. Stripe truncates descriptors longer than 10
                characters for US ACH payouts.
              maxLength: 22
              type: string
              x-stripeBypassValidation: true
          required:
            - amount
            - currency
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/payout.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a payout
