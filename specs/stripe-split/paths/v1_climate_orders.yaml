get:
  description: >-
    <p>Lists all Climate order objects. The orders are returned sorted by
    creation date, with the

    most recently created orders appearing first.</p>
  operationId: GetClimateOrders
  parameters:
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/climate.order.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/climate/orders
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: ClimateRemovalsOrdersList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List orders
post:
  description: >-
    <p>Creates a Climate order object for a given Climate product. The order
    will be processed immediately

    after creation and payment will be deducted your Stripe balance.</p>
  operationId: PostClimateOrders
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          beneficiary:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: >-
                Requested amount of carbon removal units. Either this or
                `metric_tons` must be specified.
              type: integer
            beneficiary:
              description: >-
                Publicly sharable reference for the end beneficiary of carbon
                removal. Assumed to be the Stripe account if not set.
              properties:
                public_name:
                  maxLength: 5000
                  type: string
              required:
                - public_name
              title: beneficiary_params
              type: object
            currency:
              description: >-
                Request currency for the order as a three-letter [ISO currency
                code](https://www.iso.org/iso-4217-currency-codes.html), in
                lowercase. Must be a supported [settlement currency for your
                account](https://stripe.com/docs/currencies). If omitted, the
                account's default currency will be used.
              maxLength: 5000
              type: string
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of [key-value pairs](https://docs.stripe.com/api/metadata)
                that you can attach to an object. This can be useful for storing
                additional information about the object in a structured format.
                Individual keys can be unset by posting an empty value to them.
                All keys can be unset by posting an empty value to `metadata`.
              type: object
            metric_tons:
              description: >-
                Requested number of tons for the order. Either this or `amount`
                must be specified.
              format: decimal
              type: string
            product:
              description: Unique identifier of the Climate product.
              maxLength: 5000
              type: string
          required:
            - product
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/climate.order.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create an order
