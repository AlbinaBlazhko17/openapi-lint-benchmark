get:
  description: <p>Retrieve a list of credit grants.</p>
  operationId: GetBillingCreditGrants
  parameters:
    - description: Only return credit grants for this customer.
      in: query
      name: customer
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Only return credit grants for this account representing the customer.
      in: query
      name: customer_account
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: >-
        A cursor for use in pagination. `ending_before` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, starting with `obj_bar`, your subsequent call
        can include `ending_before=obj_bar` in order to fetch the previous page
        of the list.
      in: query
      name: ending_before
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - description: >-
        A limit on the number of objects to be returned. Limit can range between
        1 and 100, and the default is 10.
      in: query
      name: limit
      required: false
      schema:
        type: integer
      style: form
    - description: >-
        A cursor for use in pagination. `starting_after` is an object ID that
        defines your place in the list. For instance, if you make a list request
        and receive 100 objects, ending with `obj_foo`, your subsequent call can
        include `starting_after=obj_foo` in order to fetch the next page of the
        list.
      in: query
      name: starting_after
      required: false
      schema:
        maxLength: 5000
        type: string
      style: form
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            description: ''
            properties:
              data:
                items:
                  $ref: ../components/schemas/billing.credit_grant.yaml
                type: array
              has_more:
                description: >-
                  True if this list has another page of items after this one
                  that can be fetched.
                type: boolean
              object:
                description: >-
                  String representing the object's type. Objects of the same
                  type share the same value. Always has the value `list`.
                enum:
                  - list
                type: string
              url:
                description: The URL where this list can be accessed.
                maxLength: 5000
                pattern: ^/v1/billing/credit_grants
                type: string
            required:
              - data
              - has_more
              - object
              - url
            title: BillingCreditGrantsResourceCreditGrantList
            type: object
            x-expandableFields:
              - data
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: List credit grants
post:
  description: <p>Creates a credit grant.</p>
  operationId: PostBillingCreditGrants
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding:
          amount:
            explode: true
            style: deepObject
          applicability_config:
            explode: true
            style: deepObject
          expand:
            explode: true
            style: deepObject
          metadata:
            explode: true
            style: deepObject
        schema:
          additionalProperties: false
          properties:
            amount:
              description: Amount of this credit grant.
              properties:
                monetary:
                  properties:
                    currency:
                      format: currency
                      type: string
                    value:
                      type: integer
                  required:
                    - currency
                    - value
                  title: monetary_amount_param
                  type: object
                type:
                  enum:
                    - monetary
                  type: string
                  x-stripeBypassValidation: true
              required:
                - type
              title: amount_param
              type: object
            applicability_config:
              description: >-
                Configuration specifying what this credit grant applies to. We
                currently only support `metered` prices that have a [Billing
                Meter](https://docs.stripe.com/api/billing/meter) attached to
                them.
              properties:
                scope:
                  properties:
                    price_type:
                      enum:
                        - metered
                      type: string
                    prices:
                      items:
                        properties:
                          id:
                            maxLength: 5000
                            type: string
                        required:
                          - id
                        title: applicable_price_param
                        type: object
                      type: array
                  title: scope_param
                  type: object
              required:
                - scope
              title: applicability_config_param
              type: object
            category:
              description: >-
                The category of this credit grant. It defaults to `paid` if not
                specified.
              enum:
                - paid
                - promotional
              type: string
            customer:
              description: ID of the customer receiving the billing credits.
              maxLength: 5000
              type: string
            customer_account:
              description: >-
                ID of the account representing the customer receiving the
                billing credits.
              maxLength: 5000
              type: string
            effective_at:
              description: >-
                The time when the billing credits become effective-when they're
                eligible for use. It defaults to the current timestamp if not
                specified.
              format: unix-time
              type: integer
            expand:
              description: Specifies which fields in the response should be expanded.
              items:
                maxLength: 5000
                type: string
              type: array
            expires_at:
              description: >-
                The time when the billing credits expire. If not specified, the
                billing credits don't expire.
              format: unix-time
              type: integer
            metadata:
              additionalProperties:
                type: string
              description: >-
                Set of key-value pairs that you can attach to an object. You can
                use this to store additional information about the object (for
                example, cost basis) in a structured format.
              type: object
            name:
              description: A descriptive name shown in the Dashboard.
              maxLength: 100
              type: string
            priority:
              description: >-
                The desired priority for applying this credit grant. If not
                specified, it will be set to the default value of 50. The
                highest priority is 0 and the lowest is 100.
              type: integer
          required:
            - amount
            - applicability_config
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/billing.credit_grant.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Create a credit grant
