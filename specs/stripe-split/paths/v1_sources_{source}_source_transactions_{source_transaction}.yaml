get:
  description: >-
    <p>Retrieve an existing source transaction object. Supply the unique source
    ID from a source creation request and the source transaction ID and Stripe
    will return the corresponding up-to-date source object information.</p>
  operationId: GetSourcesSourceSourceTransactionsSourceTransaction
  parameters:
    - description: Specifies which fields in the response should be expanded.
      explode: true
      in: query
      name: expand
      required: false
      schema:
        items:
          maxLength: 5000
          type: string
        type: array
      style: deepObject
    - in: path
      name: source
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
    - in: path
      name: source_transaction
      required: true
      schema:
        maxLength: 5000
        type: string
      style: simple
  requestBody:
    content:
      application/x-www-form-urlencoded:
        encoding: {}
        schema:
          additionalProperties: false
          properties: {}
          type: object
    required: false
  responses:
    '200':
      content:
        application/json:
          schema:
            $ref: ../components/schemas/source_transaction.yaml
      description: Successful response.
    default:
      content:
        application/json:
          schema:
            $ref: ../components/schemas/error.yaml
      description: Error response.
  summary: Retrieve a source transaction
