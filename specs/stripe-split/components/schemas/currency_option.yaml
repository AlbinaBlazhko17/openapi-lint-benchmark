description: ''
properties:
  custom_unit_amount:
    anyOf:
      - $ref: ./custom_unit_amount.yaml
    description: >-
      When set, provides configuration for the amount to be adjusted by the
      customer during Checkout Sessions and Payment Links.
    nullable: true
  tax_behavior:
    description: >-
      Only required if a [default tax
      behavior](https://docs.stripe.com/tax/products-prices-tax-categories-tax-behavior#setting-a-default-tax-behavior-(recommended))
      was not provided in the Stripe Tax settings. Specifies whether the price
      is considered inclusive of taxes or exclusive of taxes. One of
      `inclusive`, `exclusive`, or `unspecified`. Once specified as either
      `inclusive` or `exclusive`, it cannot be changed.
    enum:
      - exclusive
      - inclusive
      - unspecified
    nullable: true
    type: string
  tiers:
    description: >-
      Each element represents a pricing tier. This parameter requires
      `billing_scheme` to be set to `tiered`. See also the documentation for
      `billing_scheme`.
    items:
      $ref: ./price_tier.yaml
    type: array
  unit_amount:
    description: >-
      The unit amount in cents (or local equivalent) to be charged, represented
      as a whole integer if possible. Only set if `billing_scheme=per_unit`.
    nullable: true
    type: integer
  unit_amount_decimal:
    description: >-
      The unit amount in cents (or local equivalent) to be charged, represented
      as a decimal string with at most 12 decimal places. Only set if
      `billing_scheme=per_unit`.
    format: decimal
    nullable: true
    type: string
title: CurrencyOption
type: object
x-expandableFields:
  - custom_unit_amount
  - tiers
