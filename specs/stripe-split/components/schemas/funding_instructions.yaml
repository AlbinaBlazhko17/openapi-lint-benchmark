description: >-
  Each customer has a
  [`balance`](https://docs.stripe.com/api/customers/object#customer_object-balance)
  that is

  automatically applied to future invoices and payments using the
  `customer_balance` payment method.

  Customers can fund this balance by initiating a bank transfer to any account
  in the

  `financial_addresses` field.

  Related guide: [Customer balance funding
  instructions](https://docs.stripe.com/payments/customer-balance/funding-instructions)
properties:
  bank_transfer:
    $ref: ./funding_instructions_bank_transfer.yaml
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    maxLength: 5000
    type: string
  funding_type:
    description: The `funding_type` of the returned instructions
    enum:
      - bank_transfer
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - funding_instructions
    type: string
required:
  - bank_transfer
  - currency
  - funding_type
  - livemode
  - object
title: CustomerBalanceFundingInstructionsCustomerBalanceFundingInstructions
type: object
x-expandableFields:
  - bank_transfer
x-resourceId: funding_instructions
