description: >-
  A Tax `Registration` lets us know that your business is registered to collect
  tax on payments within a region, enabling you to [automatically collect
  tax](https://docs.stripe.com/tax).


  Stripe doesn't register on your behalf with the relevant authorities when you
  create a Tax `Registration` object. For more information on how to register to
  collect tax, see [our guide](https://docs.stripe.com/tax/registering).


  Related guide: [Using the Registrations
  API](https://docs.stripe.com/tax/registrations-api)
properties:
  active_from:
    description: >-
      Time at which the registration becomes active. Measured in seconds since
      the Unix epoch.
    format: unix-time
    type: integer
  country:
    description: >-
      Two-letter country code ([ISO 3166-1
      alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).
    maxLength: 5000
    type: string
  country_options:
    $ref: ./tax_product_registrations_resource_country_options.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  expires_at:
    description: >-
      If set, the registration stops being active at this time. If not set, the
      registration will be active indefinitely. Measured in seconds since the
      Unix epoch.
    format: unix-time
    nullable: true
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - tax.registration
    type: string
  status:
    description: >-
      The status of the registration. This field is present for convenience and
      can be deduced from `active_from` and `expires_at`.
    enum:
      - active
      - expired
      - scheduled
    type: string
required:
  - active_from
  - country
  - country_options
  - created
  - id
  - livemode
  - object
  - status
title: Tax Registration
type: object
x-expandableFields:
  - country_options
x-resourceId: tax.registration
