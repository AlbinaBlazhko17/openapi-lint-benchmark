description: ''
properties:
  authentication_flow:
    description: >-
      For authenticated transactions: Indicates how the issuing bank
      authenticated the customer.
    enum:
      - challenge
      - frictionless
    nullable: true
    type: string
  electronic_commerce_indicator:
    description: >-
      The Electronic Commerce Indicator (ECI). A protocol-level field indicating
      what degree of authentication was performed.
    enum:
      - '01'
      - '02'
      - '03'
      - '04'
      - '05'
      - '06'
      - '07'
    nullable: true
    type: string
  exemption_indicator:
    description: >-
      The exemption requested via 3DS and accepted by the issuer at
      authentication time.
    enum:
      - low_risk
      - none
    nullable: true
    type: string
  exemption_indicator_applied:
    description: >-
      Whether Stripe requested the value of `exemption_indicator` in the
      transaction. This will depend on the outcome of Stripe's internal risk
      assessment.
    nullable: true
    type: boolean
  result:
    description: Indicates the outcome of 3D Secure authentication.
    enum:
      - attempt_acknowledged
      - authenticated
      - data_share_only
      - exempted
      - failed
      - not_supported
      - processing_error
    nullable: true
    type: string
  result_reason:
    description: >-
      Additional information about why 3D Secure succeeded or failed, based on
      the `result`.
    enum:
      - abandoned
      - bypassed
      - canceled
      - card_not_enrolled
      - network_not_supported
      - protocol_error
      - rejected
    nullable: true
    type: string
  version:
    description: The version of 3D Secure that was used.
    enum:
      - 1.0.2
      - 2.1.0
      - 2.2.0
    nullable: true
    type: string
title: >-
  PaymentsPrimitivesPaymentRecordsResourcePaymentMethodCardDetailsResourceThreeDSecure
type: object
x-expandableFields: []
