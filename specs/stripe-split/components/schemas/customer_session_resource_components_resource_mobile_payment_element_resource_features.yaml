description: This hash contains the features the mobile payment element supports.
properties:
  payment_method_allow_redisplay_filters:
    description: >-
      A list of
      [`allow_redisplay`](https://docs.stripe.com/api/payment_methods/object#payment_method_object-allow_redisplay)
      values that controls which saved payment methods the mobile payment
      element displays by filtering to only show payment methods with an
      `allow_redisplay` value that is present in this list.


      If not specified, defaults to ["always"]. In order to display all saved
      payment methods, specify ["always", "limited", "unspecified"].
    items:
      enum:
        - always
        - limited
        - unspecified
      type: string
    nullable: true
    type: array
  payment_method_redisplay:
    description: >-
      Controls whether or not the mobile payment element shows saved payment
      methods.
    enum:
      - disabled
      - enabled
    nullable: true
    type: string
    x-stripeBypassValidation: true
  payment_method_remove:
    description: >-
      Controls whether the mobile payment element displays the option to remove
      a saved payment method."


      Allowing buyers to remove their saved payment methods impacts
      subscriptions that depend on that payment method. Removing the payment
      method detaches the [`customer`
      object](https://docs.stripe.com/api/payment_methods/object#payment_method_object-customer)
      from that [PaymentMethod](https://docs.stripe.com/api/payment_methods).
    enum:
      - disabled
      - enabled
    nullable: true
    type: string
    x-stripeBypassValidation: true
  payment_method_save:
    description: >-
      Controls whether the mobile payment element displays a checkbox offering
      to save a new payment method.


      If a customer checks the box, the
      [`allow_redisplay`](https://docs.stripe.com/api/payment_methods/object#payment_method_object-allow_redisplay)
      value on the PaymentMethod is set to `'always'` at confirmation time. For
      PaymentIntents, the
      [`setup_future_usage`](https://docs.stripe.com/api/payment_intents/object#payment_intent_object-setup_future_usage)
      value is also set to the value defined in `payment_method_save_usage`.
    enum:
      - disabled
      - enabled
    nullable: true
    type: string
    x-stripeBypassValidation: true
  payment_method_save_allow_redisplay_override:
    description: >-
      Allows overriding the value of allow_override when saving a new payment
      method when payment_method_save is set to disabled. Use values: "always",
      "limited", or "unspecified".


      If not specified, defaults to `nil` (no override value).
    enum:
      - always
      - limited
      - unspecified
    nullable: true
    type: string
title: CustomerSessionResourceComponentsResourceMobilePaymentElementResourceFeatures
type: object
x-expandableFields: []
