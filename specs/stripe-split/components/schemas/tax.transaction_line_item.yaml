description: ''
properties:
  amount:
    description: >-
      The line item amount in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units). If
      `tax_behavior=inclusive`, then this amount includes taxes. Otherwise,
      taxes were calculated on top of this amount.
    type: integer
  amount_tax:
    description: >-
      The amount of tax calculated for this line item, in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - tax.transaction_line_item
    type: string
  product:
    description: >-
      The ID of an existing
      [Product](https://docs.stripe.com/api/products/object).
    maxLength: 5000
    nullable: true
    type: string
  quantity:
    description: >-
      The number of units of the item being purchased. For reversals, this is
      the quantity reversed.
    type: integer
  reference:
    description: A custom identifier for this line item in the transaction.
    maxLength: 5000
    type: string
  reversal:
    anyOf:
      - $ref: >-
          ./tax_product_resource_tax_transaction_line_item_resource_reversal.yaml
    description: If `type=reversal`, contains information about what was reversed.
    nullable: true
  tax_behavior:
    description: >-
      Specifies whether the `amount` includes taxes. If
      `tax_behavior=inclusive`, then the amount includes taxes.
    enum:
      - exclusive
      - inclusive
    type: string
  tax_code:
    description: >-
      The [tax code](https://docs.stripe.com/tax/tax-categories) ID used for
      this resource.
    maxLength: 5000
    type: string
  type:
    description: If `reversal`, this line item reverses an earlier transaction.
    enum:
      - reversal
      - transaction
    type: string
required:
  - amount
  - amount_tax
  - id
  - livemode
  - object
  - quantity
  - reference
  - tax_behavior
  - tax_code
  - type
title: TaxProductResourceTaxTransactionLineItem
type: object
x-expandableFields:
  - reversal
x-resourceId: tax.transaction_line_item
