description: >-
  `Application Fee Refund` objects allow you to refund an application fee that

  has previously been created but not yet refunded. Funds will be refunded to

  the Stripe account from which the fee was originally collected.


  Related guide: [Refunding application
  fees](https://docs.stripe.com/connect/destination-charges#refunding-app-fee)
properties:
  amount:
    description: Amount, in cents (or local equivalent).
    type: integer
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: Balance transaction that describes the impact on your account balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  fee:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application_fee.yaml
    description: ID of the application fee that was refunded.
    x-expansionResources:
      oneOf:
        - $ref: ./application_fee.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - fee_refund
    type: string
required:
  - amount
  - created
  - currency
  - fee
  - id
  - object
title: Application Fee Refund
type: object
x-expandableFields:
  - balance_transaction
  - fee
x-resourceId: fee_refund
