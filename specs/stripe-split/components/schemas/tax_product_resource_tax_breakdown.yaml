description: ''
properties:
  amount:
    description: >-
      The amount of tax, in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
  inclusive:
    description: Specifies whether the tax amount is included in the line item amount.
    type: boolean
  tax_rate_details:
    $ref: ./tax_product_resource_tax_rate_details.yaml
  taxability_reason:
    description: >-
      The reasoning behind this tax, for example, if the product is tax exempt.
      We might extend the possible values for this field to support new tax
      rules.
    enum:
      - customer_exempt
      - not_collecting
      - not_subject_to_tax
      - not_supported
      - portion_product_exempt
      - portion_reduced_rated
      - portion_standard_rated
      - product_exempt
      - product_exempt_holiday
      - proportionally_rated
      - reduced_rated
      - reverse_charge
      - standard_rated
      - taxable_basis_reduced
      - zero_rated
    type: string
  taxable_amount:
    description: >-
      The amount on which tax is calculated, in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
required:
  - amount
  - inclusive
  - tax_rate_details
  - taxability_reason
  - taxable_amount
title: TaxProductResourceTaxBreakdown
type: object
x-expandableFields:
  - tax_rate_details
