description: >-
  A Tax Calculation allows you to calculate the tax to collect from your
  customer.


  Related guide: [Calculate tax in your custom payment
  flow](https://docs.stripe.com/tax/custom)
properties:
  amount_total:
    description: >-
      Total amount after taxes in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    maxLength: 5000
    type: string
  customer:
    description: >-
      The ID of an existing
      [Customer](https://docs.stripe.com/api/customers/object) used for the
      resource.
    maxLength: 5000
    nullable: true
    type: string
  customer_details:
    $ref: ./tax_product_resource_customer_details.yaml
  expires_at:
    description: Timestamp of date at which the tax calculation will expire.
    format: unix-time
    nullable: true
    type: integer
  id:
    description: Unique identifier for the calculation.
    maxLength: 5000
    nullable: true
    type: string
  line_items:
    description: The list of items the customer is purchasing.
    nullable: true
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./tax.calculation_line_item.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        pattern: ^/v1/tax/calculations/[^/]+/line_items
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: TaxProductResourceTaxCalculationLineItemList
    type: object
    x-expandableFields:
      - data
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - tax.calculation
    type: string
  ship_from_details:
    anyOf:
      - $ref: ./tax_product_resource_ship_from_details.yaml
    description: The details of the ship from location, such as the address.
    nullable: true
  shipping_cost:
    anyOf:
      - $ref: ./tax_product_resource_tax_calculation_shipping_cost.yaml
    description: The shipping cost details for the calculation.
    nullable: true
  tax_amount_exclusive:
    description: The amount of tax to be collected on top of the line item prices.
    type: integer
  tax_amount_inclusive:
    description: The amount of tax already included in the line item prices.
    type: integer
  tax_breakdown:
    description: Breakdown of individual tax amounts that add up to the total.
    items:
      $ref: ./tax_product_resource_tax_breakdown.yaml
    type: array
  tax_date:
    description: >-
      The calculation uses the tax rules and rates that are in effect at this
      timestamp. You can use a date up to 31 days in the past or up to 31 days
      in the future. If you use a future date, Stripe doesn't guarantee that the
      expected tax rules and rate being used match the actual rules and rate
      that will be in effect on that date. We deploy tax changes before their
      effective date, but not within a fixed window.
    format: unix-time
    type: integer
required:
  - amount_total
  - currency
  - customer_details
  - livemode
  - object
  - tax_amount_exclusive
  - tax_amount_inclusive
  - tax_breakdown
  - tax_date
title: Tax Calculation
type: object
x-expandableFields:
  - customer_details
  - line_items
  - ship_from_details
  - shipping_cost
  - tax_breakdown
x-resourceId: tax.calculation
