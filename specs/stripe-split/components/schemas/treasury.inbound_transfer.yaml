description: >-
  Use
  [InboundTransfers](https://docs.stripe.com/docs/treasury/moving-money/financial-accounts/into/inbound-transfers)
  to add funds to your
  [FinancialAccount](https://api.stripe.com#financial_accounts) via a
  PaymentMethod that is owned by you. The funds will be transferred via an ACH
  debit.


  Related guide: [Moving money with Treasury using InboundTransfer
  objects](https://docs.stripe.com/docs/treasury/moving-money/financial-accounts/into/inbound-transfers)
properties:
  amount:
    description: Amount (in cents) transferred.
    type: integer
  cancelable:
    description: Returns `true` if the InboundTransfer is able to be canceled.
    type: boolean
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  failure_details:
    anyOf:
      - $ref: ./treasury_inbound_transfers_resource_failure_details.yaml
    description: >-
      Details about this InboundTransfer's failure. Only set when status is
      `failed`.
    nullable: true
  financial_account:
    description: The FinancialAccount that received the funds.
    maxLength: 5000
    type: string
  hosted_regulatory_receipt_url:
    description: >-
      A [hosted transaction
      receipt](https://docs.stripe.com/treasury/moving-money/regulatory-receipts)
      URL that is provided when money movement is considered regulated under
      Stripe's money transmission licenses.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  linked_flows:
    $ref: >-
      ./treasury_inbound_transfers_resource_inbound_transfer_resource_linked_flows.yaml
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.inbound_transfer
    type: string
  origin_payment_method:
    description: The origin payment method to be debited for an InboundTransfer.
    maxLength: 5000
    nullable: true
    type: string
  origin_payment_method_details:
    anyOf:
      - $ref: ./inbound_transfers.yaml
    description: Details about the PaymentMethod for an InboundTransfer.
    nullable: true
  returned:
    description: >-
      Returns `true` if the funds for an InboundTransfer were returned after the
      InboundTransfer went to the `succeeded` state.
    nullable: true
    type: boolean
  statement_descriptor:
    description: >-
      Statement descriptor shown when funds are debited from the source. Not all
      payment networks support `statement_descriptor`.
    maxLength: 5000
    type: string
  status:
    description: >-
      Status of the InboundTransfer: `processing`, `succeeded`, `failed`, and
      `canceled`. An InboundTransfer is `processing` if it is created and
      pending. The status changes to `succeeded` once the funds have been
      "confirmed" and a `transaction` is created and posted. The status changes
      to `failed` if the transfer fails.
    enum:
      - canceled
      - failed
      - processing
      - succeeded
    type: string
    x-stripeBypassValidation: true
  status_transitions:
    $ref: >-
      ./treasury_inbound_transfers_resource_inbound_transfer_resource_status_transitions.yaml
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./treasury.transaction.yaml
    description: The Transaction associated with this object.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./treasury.transaction.yaml
required:
  - amount
  - cancelable
  - created
  - currency
  - financial_account
  - id
  - linked_flows
  - livemode
  - metadata
  - object
  - statement_descriptor
  - status
  - status_transitions
title: InboundTransfer
type: object
x-expandableFields:
  - failure_details
  - linked_flows
  - origin_payment_method_details
  - status_transitions
  - transaction
x-resourceId: treasury.inbound_transfer
