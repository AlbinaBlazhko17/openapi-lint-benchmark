description: Represents a cart to be displayed on the reader
properties:
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  line_items:
    description: List of line items in the cart.
    items:
      $ref: ./terminal_reader_reader_resource_line_item.yaml
    type: array
  tax:
    description: >-
      Tax amount for the entire cart. A positive integer in the [smallest
      currency unit](https://docs.stripe.com/currencies#zero-decimal).
    nullable: true
    type: integer
  total:
    description: >-
      Total amount for the entire cart, including tax. A positive integer in the
      [smallest currency unit](https://docs.stripe.com/currencies#zero-decimal).
    type: integer
required:
  - currency
  - line_items
  - total
title: TerminalReaderReaderResourceCart
type: object
x-expandableFields:
  - line_items
