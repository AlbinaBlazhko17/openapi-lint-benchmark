description: ''
properties:
  industry_product_code:
    description: >-
      [Conexxus Payment System Product
      Code](https://www.conexxus.org/conexxus-payment-system-product-codes)
      identifying the primary fuel product purchased.
    maxLength: 5000
    nullable: true
    type: string
  quantity_decimal:
    description: >-
      The quantity of `unit`s of fuel that was dispensed, represented as a
      decimal string with at most 12 decimal places.
    format: decimal
    nullable: true
    type: string
  type:
    description: The type of fuel that was purchased.
    enum:
      - diesel
      - other
      - unleaded_plus
      - unleaded_regular
      - unleaded_super
    nullable: true
    type: string
  unit:
    description: The units for `quantity_decimal`.
    enum:
      - charging_minute
      - imperial_gallon
      - kilogram
      - kilowatt_hour
      - liter
      - other
      - pound
      - us_gallon
    nullable: true
    type: string
  unit_cost_decimal:
    description: >-
      The cost in cents per each unit of fuel, represented as a decimal string
      with at most 12 decimal places.
    format: decimal
    nullable: true
    type: string
title: IssuingAuthorizationFuelData
type: object
x-expandableFields: []
