description: >-
  If you have [scheduled a Sigma
  query](https://docs.stripe.com/sigma/scheduled-queries), you'll

  receive a `sigma.scheduled_query_run.created` webhook each time the query

  runs. The webhook contains a `ScheduledQueryRun` object, which you can use to

  retrieve the query results.
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  data_load_time:
    description: >-
      When the query was run, Sigma contained a snapshot of your Stripe data at
      this time.
    format: unix-time
    type: integer
  error:
    $ref: ./sigma_scheduled_query_run_error.yaml
  file:
    anyOf:
      - $ref: ./file.yaml
    description: The file object representing the results of the query.
    nullable: true
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - scheduled_query_run
    type: string
  result_available_until:
    description: Time at which the result expires and is no longer available for download.
    format: unix-time
    type: integer
  sql:
    description: SQL for the query.
    maxLength: 100000
    type: string
  status:
    description: >-
      The query's execution status, which will be `completed` for successful
      runs, and `canceled`, `failed`, or `timed_out` otherwise.
    maxLength: 5000
    type: string
  title:
    description: Title of the query.
    maxLength: 5000
    type: string
required:
  - created
  - data_load_time
  - id
  - livemode
  - object
  - result_available_until
  - sql
  - status
  - title
title: Scheduled Query
type: object
x-expandableFields:
  - error
  - file
x-resourceId: scheduled_query_run
