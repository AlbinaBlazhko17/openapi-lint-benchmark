description: ''
properties:
  brand:
    description: Card brand. Can be `interac`, `mastercard` or `visa`.
    maxLength: 5000
    nullable: true
    type: string
  cardholder_name:
    description: >-
      The cardholder name as read from the card, in [ISO
      7813](https://en.wikipedia.org/wiki/ISO/IEC_7813) format. May include
      alphanumeric characters, special characters and first/last name separator
      (`/`). In some cases, the cardholder name may not be available depending
      on how the issuer has configured the card. Cardholder name is typically
      not available on swipe or contactless payments, such as those made with
      Apple Pay and Google Pay.
    maxLength: 5000
    nullable: true
    type: string
  country:
    description: >-
      Two-letter ISO code representing the country of the card. You could use
      this attribute to get a sense of the international breakdown of cards
      you've collected.
    maxLength: 5000
    nullable: true
    type: string
  description:
    description: A high-level description of the type of cards issued in this range.
    maxLength: 5000
    nullable: true
    type: string
  emv_auth_data:
    description: Authorization response cryptogram.
    maxLength: 5000
    nullable: true
    type: string
  exp_month:
    description: Two-digit number representing the card's expiration month.
    type: integer
  exp_year:
    description: Four-digit number representing the card's expiration year.
    type: integer
  fingerprint:
    description: >-
      Uniquely identifies this particular card number. You can use this
      attribute to check whether two customers who’ve signed up with you are
      using the same card number, for example. For payment methods that tokenize
      card information (Apple Pay, Google Pay), the tokenized number might be
      provided instead of the underlying card number.


      *As of May 1, 2021, card fingerprint in India for Connect changed to allow
      two fingerprints for the same card---one for India and one for the rest of
      the world.*
    maxLength: 5000
    nullable: true
    type: string
  funding:
    description: Card funding type. Can be `credit`, `debit`, `prepaid`, or `unknown`.
    maxLength: 5000
    nullable: true
    type: string
  generated_card:
    description: >-
      ID of a card PaymentMethod generated from the card_present PaymentMethod
      that may be attached to a Customer for future transactions. Only present
      if it was possible to generate a card PaymentMethod.
    maxLength: 5000
    nullable: true
    type: string
  issuer:
    description: The name of the card's issuing bank.
    maxLength: 5000
    nullable: true
    type: string
  last4:
    description: The last four digits of the card.
    maxLength: 5000
    nullable: true
    type: string
  location:
    description: >-
      ID of the [location](https://docs.stripe.com/api/terminal/locations) that
      this transaction's reader is assigned to.
    maxLength: 5000
    type: string
  network:
    description: >-
      Identifies which network this charge was processed on. Can be `amex`,
      `cartes_bancaires`, `diners`, `discover`, `eftpos_au`, `interac`, `jcb`,
      `link`, `mastercard`, `unionpay`, `visa`, or `unknown`.
    maxLength: 5000
    nullable: true
    type: string
  network_transaction_id:
    description: >-
      This is used by the financial networks to identify a transaction. Visa
      calls this the Transaction ID, Mastercard calls this the Trace ID, and
      American Express calls this the Acquirer Reference Data. This value will
      be present if it is returned by the financial network in the authorization
      response, and null otherwise.
    maxLength: 5000
    nullable: true
    type: string
  preferred_locales:
    description: >-
      The languages that the issuing bank recommends using for localizing any
      customer-facing text, as read from the card. Referenced from EMV tag 5F2D,
      data encoded on the card's chip.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  read_method:
    description: How card details were read in this transaction.
    enum:
      - contact_emv
      - contactless_emv
      - contactless_magstripe_mode
      - magnetic_stripe_fallback
      - magnetic_stripe_track2
    nullable: true
    type: string
  reader:
    description: >-
      ID of the [reader](https://docs.stripe.com/api/terminal/readers) this
      transaction was made on.
    maxLength: 5000
    type: string
  receipt:
    anyOf:
      - $ref: ./payment_method_details_interac_present_receipt.yaml
    description: >-
      A collection of fields required to be displayed on receipts. Only required
      for EMV transactions.
    nullable: true
required:
  - exp_month
  - exp_year
title: payment_method_details_interac_present
type: object
x-expandableFields:
  - receipt
