description: ''
properties:
  custom_fields:
    description: A list of up to 4 custom fields to be displayed on the invoice.
    items:
      $ref: ./invoice_setting_custom_field.yaml
    nullable: true
    type: array
  days_until_due:
    description: >-
      Number of days within which a customer must pay invoices generated by this
      quote. This value will be `null` for quotes where
      `collection_method=charge_automatically`.
    nullable: true
    type: integer
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  footer:
    description: Footer to be displayed on the invoice.
    maxLength: 5000
    nullable: true
    type: string
  issuer:
    $ref: ./connect_account_reference.yaml
required:
  - issuer
title: InvoiceSettingQuoteSetting
type: object
x-expandableFields:
  - custom_fields
  - issuer
