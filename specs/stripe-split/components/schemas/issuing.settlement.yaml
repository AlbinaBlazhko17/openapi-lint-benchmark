description: >-
  When a non-stripe BIN is used, any use of an [issued
  card](https://docs.stripe.com/issuing) must be settled directly with the card
  network. The net amount owed is represented by an Issuing `Settlement` object.
properties:
  bin:
    description: The Bank Identification Number reflecting this settlement record.
    maxLength: 5000
    type: string
  clearing_date:
    description: The date that the transactions are cleared and posted to user's accounts.
    format: unix-time
    type: integer
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  interchange_fees_amount:
    description: The total interchange received as reimbursement for the transactions.
    type: integer
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  net_total_amount:
    description: The total net amount required to settle with the network.
    type: integer
  network:
    description: >-
      The card network for this settlement report. One of ["visa", "maestro",
      "mastercard"]
    enum:
      - maestro
      - mastercard
      - visa
    type: string
  network_fees_amount:
    description: The total amount of fees owed to the network.
    type: integer
  network_settlement_identifier:
    description: The Settlement Identification Number assigned by the network.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - issuing.settlement
    type: string
  settlement_service:
    description: One of `international` or `uk_national_net`.
    maxLength: 5000
    type: string
  status:
    description: The current processing status of this settlement.
    enum:
      - complete
      - pending
    type: string
  transaction_amount:
    description: The total transaction amount reflected in this settlement.
    type: integer
  transaction_count:
    description: The total number of transactions reflected in this settlement.
    type: integer
required:
  - bin
  - clearing_date
  - created
  - currency
  - id
  - interchange_fees_amount
  - livemode
  - metadata
  - net_total_amount
  - network
  - network_fees_amount
  - network_settlement_identifier
  - object
  - settlement_service
  - status
  - transaction_amount
  - transaction_count
title: Settlement
type: object
x-expandableFields: []
x-resourceId: issuing.settlement
