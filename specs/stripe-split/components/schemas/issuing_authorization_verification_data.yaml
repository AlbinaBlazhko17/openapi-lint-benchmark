description: ''
properties:
  address_line1_check:
    description: >-
      Whether the cardholder provided an address first line and if it matched
      the cardholder’s `billing.address.line1`.
    enum:
      - match
      - mismatch
      - not_provided
    type: string
  address_postal_code_check:
    description: >-
      Whether the cardholder provided a postal code and if it matched the
      cardholder’s `billing.address.postal_code`.
    enum:
      - match
      - mismatch
      - not_provided
    type: string
  authentication_exemption:
    anyOf:
      - $ref: ./issuing_authorization_authentication_exemption.yaml
    description: The exemption applied to this authorization.
    nullable: true
  cvc_check:
    description: Whether the cardholder provided a CVC and if it matched Stripe’s record.
    enum:
      - match
      - mismatch
      - not_provided
    type: string
  expiry_check:
    description: >-
      Whether the cardholder provided an expiry date and if it matched Stripe’s
      record.
    enum:
      - match
      - mismatch
      - not_provided
    type: string
  postal_code:
    description: >-
      The postal code submitted as part of the authorization used for postal
      code verification.
    maxLength: 5000
    nullable: true
    type: string
  three_d_secure:
    anyOf:
      - $ref: ./issuing_authorization_three_d_secure.yaml
    description: 3D Secure details.
    nullable: true
required:
  - address_line1_check
  - address_postal_code_check
  - cvc_check
  - expiry_check
title: IssuingAuthorizationVerificationData
type: object
x-expandableFields:
  - authentication_exemption
  - three_d_secure
