description: |-
  A dispute occurs when a customer questions your charge with their card issuer.
  When this happens, you have the opportunity to respond to the dispute with
  evidence that shows that the charge is legitimate.

  Related guide: [Disputes and fraud](https://docs.stripe.com/disputes)
properties:
  amount:
    description: >-
      Disputed amount. Usually the amount of the charge, but it can differ
      (usually because of currency fluctuation or because only part of the order
      is disputed).
    type: integer
  balance_transactions:
    description: >-
      List of zero, one, or two balance transactions that show funds withdrawn
      and reinstated to your Stripe account as a result of this dispute.
    items:
      $ref: ./balance_transaction.yaml
    type: array
  charge:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./charge.yaml
    description: ID of the charge that's disputed.
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  enhanced_eligibility_types:
    description: List of eligibility types that are included in `enhanced_evidence`.
    items:
      enum:
        - mastercard_compliance
        - visa_compelling_evidence_3
        - visa_compliance
      type: string
    type: array
  evidence:
    $ref: ./dispute_evidence.yaml
  evidence_details:
    $ref: ./dispute_evidence_details.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  is_charge_refundable:
    description: >-
      If true, it's still possible to refund the disputed payment. After the
      payment has been fully refunded, no further funds are withdrawn from your
      Stripe account as a result of this dispute.
    type: boolean
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - dispute
    type: string
  payment_intent:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_intent.yaml
    description: ID of the PaymentIntent that's disputed.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_intent.yaml
  payment_method_details:
    $ref: ./dispute_payment_method_details.yaml
  reason:
    description: >-
      Reason given by cardholder for dispute. Possible values are
      `bank_cannot_process`, `check_returned`, `credit_not_processed`,
      `customer_initiated`, `debit_not_authorized`, `duplicate`, `fraudulent`,
      `general`, `incorrect_account_details`, `insufficient_funds`,
      `noncompliant`, `product_not_received`, `product_unacceptable`,
      `subscription_canceled`, or `unrecognized`. Learn more about [dispute
      reasons](https://docs.stripe.com/disputes/categories).
    maxLength: 5000
    type: string
  status:
    description: >-
      The current status of a dispute. Possible values
      include:`warning_needs_response`, `warning_under_review`,
      `warning_closed`, `needs_response`, `under_review`, `won`, `lost`, or
      `prevented`.
    enum:
      - lost
      - needs_response
      - prevented
      - under_review
      - warning_closed
      - warning_needs_response
      - warning_under_review
      - won
    type: string
    x-stripeBypassValidation: true
required:
  - amount
  - balance_transactions
  - charge
  - created
  - currency
  - enhanced_eligibility_types
  - evidence
  - evidence_details
  - id
  - is_charge_refundable
  - livemode
  - metadata
  - object
  - reason
  - status
title: Dispute
type: object
x-expandableFields:
  - balance_transactions
  - charge
  - evidence
  - evidence_details
  - payment_intent
  - payment_method_details
x-resourceId: dispute
