description: ''
properties:
  billing_mode:
    $ref: ./quotes_resource_subscription_data_billing_mode.yaml
  description:
    description: >-
      The subscription's description, meant to be displayable to the customer.
      Use this field to optionally store an explanation of the subscription for
      rendering in Stripe surfaces and certain local payment methods UIs.
    maxLength: 5000
    nullable: true
    type: string
  effective_date:
    description: >-
      When creating a new subscription, the date of which the subscription
      schedule will start after the quote is accepted. This date is ignored if
      it is in the past when the quote is accepted. Measured in seconds since
      the Unix epoch.
    format: unix-time
    nullable: true
    type: integer
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that will
      set metadata on the subscription or subscription schedule when the quote
      is accepted. If a recurring price is included in `line_items`, this field
      will be passed to the resulting subscription's `metadata` field. If
      `subscription_data.effective_date` is used, this field will be passed to
      the resulting subscription schedule's `phases.metadata` field. Unlike
      object-level metadata, this field is declarative. Updates will clear prior
      values.
    nullable: true
    type: object
  trial_period_days:
    description: >-
      Integer representing the number of trial period days before the customer
      is charged for the first time.
    nullable: true
    type: integer
required:
  - billing_mode
title: QuotesResourceSubscriptionDataSubscriptionData
type: object
x-expandableFields:
  - billing_mode
