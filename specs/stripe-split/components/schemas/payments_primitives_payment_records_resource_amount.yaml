description: >-
  A representation of an amount of money, consisting of an amount and a
  currency.
properties:
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  value:
    description: >-
      A positive integer representing the amount in the currency's [minor
      unit](https://docs.stripe.com/currencies#zero-decimal). For example, `100`
      can represent 1 USD or 100 JPY.
    type: integer
required:
  - currency
  - value
title: PaymentsPrimitivesPaymentRecordsResourceAmount
type: object
x-expandableFields: []
