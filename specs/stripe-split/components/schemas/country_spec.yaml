description: |-
  Stripe needs to collect certain pieces of information about each account
  created. These requirements can differ depending on the account's country. The
  Country Specs API makes these rules available to your integration.

  You can also view the information from this API call as [an online
  guide](/docs/connect/required-verification-information).
properties:
  default_currency:
    description: >-
      The default currency for this country. This applies to both payment
      methods and bank accounts.
    maxLength: 5000
    type: string
  id:
    description: >-
      Unique identifier for the object. Represented as the ISO country code for
      this country.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - country_spec
    type: string
  supported_bank_account_currencies:
    additionalProperties:
      items:
        maxLength: 5000
        type: string
      type: array
    description: Currencies that can be accepted in the specific country (for transfers).
    type: object
  supported_payment_currencies:
    description: Currencies that can be accepted in the specified country (for payments).
    items:
      maxLength: 5000
      type: string
    type: array
  supported_payment_methods:
    description: >-
      Payment methods available in the specified country. You may need to enable
      some payment methods (e.g., [ACH](https://stripe.com/docs/ach)) on your
      account before they appear in this list. The `stripe` payment method
      refers to [charging through your
      platform](https://stripe.com/docs/connect/destination-charges).
    items:
      maxLength: 5000
      type: string
    type: array
  supported_transfer_countries:
    description: Countries that can accept transfers from the specified country.
    items:
      maxLength: 5000
      type: string
    type: array
  verification_fields:
    $ref: ./country_spec_verification_fields.yaml
required:
  - default_currency
  - id
  - object
  - supported_bank_account_currencies
  - supported_payment_currencies
  - supported_payment_methods
  - supported_transfer_countries
  - verification_fields
title: Country Spec
type: object
x-expandableFields:
  - verification_fields
x-resourceId: country_spec
