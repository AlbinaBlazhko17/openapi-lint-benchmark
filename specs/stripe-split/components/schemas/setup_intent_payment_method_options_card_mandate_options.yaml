description: ''
properties:
  amount:
    description: >-
      Amount to be charged for future payments, specified in the presentment
      currency.
    type: integer
  amount_type:
    description: >-
      One of `fixed` or `maximum`. If `fixed`, the `amount` param refers to the
      exact amount to be charged in future payments. If `maximum`, the amount
      charged can be up to the value passed for the `amount` param.
    enum:
      - fixed
      - maximum
    type: string
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      A description of the mandate or subscription that is meant to be displayed
      to the customer.
    maxLength: 200
    nullable: true
    type: string
  end_date:
    description: >-
      End date of the mandate or subscription. If not provided, the mandate will
      be active until canceled. If provided, end date should be after start
      date.
    format: unix-time
    nullable: true
    type: integer
  interval:
    description: >-
      Specifies payment frequency. One of `day`, `week`, `month`, `year`, or
      `sporadic`.
    enum:
      - day
      - month
      - sporadic
      - week
      - year
    type: string
  interval_count:
    description: >-
      The number of intervals between payments. For example, `interval=month`
      and `interval_count=3` indicates one payment every three months. Maximum
      of one year interval allowed (1 year, 12 months, or 52 weeks). This
      parameter is optional when `interval=sporadic`.
    nullable: true
    type: integer
  reference:
    description: Unique identifier for the mandate or subscription.
    maxLength: 80
    type: string
  start_date:
    description: >-
      Start date of the mandate or subscription. Start date should not be lesser
      than yesterday.
    format: unix-time
    type: integer
  supported_types:
    description: Specifies the type of mandates supported. Possible values are `india`.
    items:
      enum:
        - india
      type: string
    nullable: true
    type: array
required:
  - amount
  - amount_type
  - currency
  - interval
  - reference
  - start_date
title: setup_intent_payment_method_options_card_mandate_options
type: object
x-expandableFields: []
