description: >-
  A Connection Token is used by the Stripe Terminal SDK to connect to a reader.


  Related guide: [Fleet
  management](https://docs.stripe.com/terminal/fleet/locations)
properties:
  location:
    description: >-
      The id of the location that this connection token is scoped to. Note that
      location scoping only applies to internet-connected readers. For more
      details, see [the docs on scoping connection
      tokens](https://docs.stripe.com/terminal/fleet/locations-and-zones?dashboard-or-api=api#connection-tokens).
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - terminal.connection_token
    type: string
  secret:
    description: Your application should pass this token to the Stripe Terminal SDK.
    maxLength: 5000
    type: string
required:
  - object
  - secret
title: Connection Token
type: object
x-expandableFields: []
x-resourceId: terminal.connection_token
