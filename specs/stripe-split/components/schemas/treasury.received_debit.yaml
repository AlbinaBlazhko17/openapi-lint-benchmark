description: >-
  ReceivedDebits represent funds pulled from a
  [FinancialAccount](https://api.stripe.com#financial_accounts). These are not
  initiated from the FinancialAccount.
properties:
  amount:
    description: Amount (in cents) transferred.
    type: integer
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    type: string
  failure_code:
    description: >-
      Reason for the failure. A ReceivedDebit might fail because the
      FinancialAccount doesn't have sufficient funds, is closed, or is frozen.
    enum:
      - account_closed
      - account_frozen
      - insufficient_funds
      - international_transaction
      - other
    nullable: true
    type: string
  financial_account:
    description: The FinancialAccount that funds were pulled from.
    maxLength: 5000
    nullable: true
    type: string
  hosted_regulatory_receipt_url:
    description: >-
      A [hosted transaction
      receipt](https://docs.stripe.com/treasury/moving-money/regulatory-receipts)
      URL that is provided when money movement is considered regulated under
      Stripe's money transmission licenses.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  initiating_payment_method_details:
    $ref: >-
      ./treasury_shared_resource_initiating_payment_method_details_initiating_payment_method_details.yaml
  linked_flows:
    $ref: ./treasury_received_debits_resource_linked_flows.yaml
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  network:
    description: The network used for the ReceivedDebit.
    enum:
      - ach
      - card
      - stripe
    type: string
    x-stripeBypassValidation: true
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.received_debit
    type: string
  reversal_details:
    anyOf:
      - $ref: ./treasury_received_debits_resource_reversal_details.yaml
    description: Details describing when a ReceivedDebit might be reversed.
    nullable: true
  status:
    description: >-
      Status of the ReceivedDebit. ReceivedDebits are created with a status of
      either `succeeded` (approved) or `failed` (declined). The failure reason
      can be found under the `failure_code`.
    enum:
      - failed
      - succeeded
    type: string
    x-stripeBypassValidation: true
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./treasury.transaction.yaml
    description: The Transaction associated with this object.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./treasury.transaction.yaml
required:
  - amount
  - created
  - currency
  - description
  - id
  - linked_flows
  - livemode
  - network
  - object
  - status
title: ReceivedDebit
type: object
x-expandableFields:
  - initiating_payment_method_details
  - linked_flows
  - reversal_details
  - transaction
x-resourceId: treasury.received_debit
