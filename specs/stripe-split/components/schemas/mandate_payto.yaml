description: ''
properties:
  amount:
    description: >-
      Amount that will be collected. It is required when `amount_type` is
      `fixed`.
    nullable: true
    type: integer
  amount_type:
    description: >-
      The type of amount that will be collected. The amount charged must be
      exact or up to the value of `amount` param for `fixed` or `maximum` type
      respectively. Defaults to `maximum`.
    enum:
      - fixed
      - maximum
    type: string
  end_date:
    description: >-
      Date, in YYYY-MM-DD format, after which payments will not be collected.
      Defaults to no end date.
    maxLength: 5000
    nullable: true
    type: string
  payment_schedule:
    description: The periodicity at which payments will be collected. Defaults to `adhoc`.
    enum:
      - adhoc
      - annual
      - daily
      - fortnightly
      - monthly
      - quarterly
      - semi_annual
      - weekly
    type: string
  payments_per_period:
    description: >-
      The number of payments that will be made during a payment period. Defaults
      to 1 except for when `payment_schedule` is `adhoc`. In that case, it
      defaults to no limit.
    nullable: true
    type: integer
  purpose:
    description: >-
      The purpose for which payments are made. Has a default value based on your
      merchant category code.
    enum:
      - dependant_support
      - government
      - loan
      - mortgage
      - other
      - pension
      - personal
      - retail
      - salary
      - tax
      - utility
    nullable: true
    type: string
  start_date:
    description: >-
      Date, in YYYY-MM-DD format, from which payments will be collected.
      Defaults to confirmation time.
    maxLength: 5000
    nullable: true
    type: string
required:
  - amount_type
  - payment_schedule
title: mandate_payto
type: object
x-expandableFields: []
