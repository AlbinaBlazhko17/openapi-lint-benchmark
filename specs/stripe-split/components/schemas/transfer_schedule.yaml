description: ''
properties:
  delay_days:
    description: >-
      The number of days charges for the account will be held before being paid
      out.
    type: integer
  interval:
    description: >-
      How frequently funds will be paid out. One of `manual` (payouts only
      created via API call), `daily`, `weekly`, or `monthly`.
    maxLength: 5000
    type: string
  monthly_anchor:
    description: >-
      The day of the month funds will be paid out. Only shown if `interval` is
      monthly. Payouts scheduled between the 29th and 31st of the month are sent
      on the last day of shorter months.
    type: integer
  monthly_payout_days:
    description: >-
      The days of the month funds will be paid out. Only shown if `interval` is
      monthly. Payouts scheduled between the 29th and 31st of the month are sent
      on the last day of shorter months.
    items:
      type: integer
    type: array
  weekly_anchor:
    description: >-
      The day of the week funds will be paid out, of the style 'monday',
      'tuesday', etc. Only shown if `interval` is weekly.
    maxLength: 5000
    type: string
  weekly_payout_days:
    description: >-
      The days of the week when available funds are paid out, specified as an
      array, for example, [`monday`, `tuesday`]. Only shown if `interval` is
      weekly.
    items:
      enum:
        - friday
        - monday
        - thursday
        - tuesday
        - wednesday
      type: string
      x-stripeBypassValidation: true
    type: array
required:
  - delay_days
  - interval
title: TransferSchedule
type: object
x-expandableFields: []
