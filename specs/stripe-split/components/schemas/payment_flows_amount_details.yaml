description: ''
properties:
  discount_amount:
    description: >-
      The total discount applied on the transaction represented in the [smallest
      currency unit](https://docs.stripe.com/currencies#zero-decimal). An
      integer greater than 0.


      This field is mutually exclusive with the
      `amount_details[line_items][#][discount_amount]` field.
    type: integer
  error:
    $ref: ./payment_flows_amount_details_resource_error.yaml
  line_items:
    description: >-
      A list of line items, each containing information about a product in the
      PaymentIntent. There is a maximum of 200 line items.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./payment_intent_amount_details_line_item.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: PaymentFlowsAmountDetailsResourceLineItemsList
    type: object
    x-expandableFields:
      - data
  shipping:
    $ref: ./payment_flows_amount_details_resource_shipping.yaml
  tax:
    $ref: ./payment_flows_amount_details_resource_tax.yaml
  tip:
    $ref: ./payment_flows_amount_details_client_resource_tip.yaml
title: PaymentFlowsAmountDetails
type: object
x-expandableFields:
  - error
  - line_items
  - shipping
  - tax
  - tip
