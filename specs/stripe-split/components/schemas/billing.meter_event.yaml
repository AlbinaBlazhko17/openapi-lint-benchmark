description: >-
  Meter events represent actions that customers take in your system. You can use
  meter events to bill a customer based on their usage. Meter events are
  associated with billing meters, which define both the contents of the event’s
  payload and how to aggregate those events.
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  event_name:
    description: >-
      The name of the meter event. Corresponds with the `event_name` field on a
      meter.
    maxLength: 100
    type: string
  identifier:
    description: A unique identifier for the event.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - billing.meter_event
    type: string
  payload:
    additionalProperties:
      maxLength: 100
      type: string
    description: >-
      The payload of the event. This contains the fields corresponding to a
      meter's `customer_mapping.event_payload_key` (default is
      `stripe_customer_id`) and `value_settings.event_payload_key` (default is
      `value`). Read more about the
      [payload](https://docs.stripe.com/billing/subscriptions/usage-based/meters/configure#meter-configuration-attributes).
    type: object
  timestamp:
    description: >-
      The timestamp passed in when creating the event. Measured in seconds since
      the Unix epoch.
    format: unix-time
    type: integer
required:
  - created
  - event_name
  - identifier
  - livemode
  - object
  - payload
  - timestamp
title: Billing Meter Event
type: object
x-expandableFields: []
x-resourceId: billing.meter_event
