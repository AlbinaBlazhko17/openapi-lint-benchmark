description: ''
properties:
  available:
    additionalProperties:
      type: integer
    description: >-
      The funds available to the account holder. Typically this is the current
      balance after subtracting any outbound pending transactions and adding any
      inbound pending transactions.


      Each key is a three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.


      Each value is a integer amount. A positive amount indicates money owed to
      the account holder. A negative amount indicates money owed by the account
      holder.
    nullable: true
    type: object
title: BankConnectionsResourceBalanceAPIResourceCashBalance
type: object
x-expandableFields: []
