description: ''
properties:
  account_tax_ids:
    description: >-
      The account tax IDs associated with this phase of the subscription
      schedule. Will be set on invoices generated by this phase of the
      subscription schedule.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./tax_id.yaml
        - $ref: ./deleted_tax_id.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./tax_id.yaml
          - $ref: ./deleted_tax_id.yaml
    nullable: true
    type: array
  custom_fields:
    description: A list of up to 4 custom fields to be displayed on the invoice.
    items:
      $ref: ./invoice_setting_custom_field.yaml
    nullable: true
    type: array
  days_until_due:
    description: >-
      Number of days within which a customer must pay invoices generated by this
      subscription schedule. This value will be `null` for subscription
      schedules where `billing=charge_automatically`.
    nullable: true
    type: integer
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  footer:
    description: Footer to be displayed on the invoice.
    maxLength: 5000
    nullable: true
    type: string
  issuer:
    anyOf:
      - $ref: ./connect_account_reference.yaml
    description: >-
      The connected account that issues the invoice. The invoice is presented
      with the branding and support information of the specified account.
    nullable: true
title: InvoiceSettingSubscriptionSchedulePhaseSetting
type: object
x-expandableFields:
  - account_tax_ids
  - custom_fields
  - issuer
