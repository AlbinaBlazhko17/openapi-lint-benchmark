description: >-
  A Promotion Code represents a customer-redeemable code for an underlying
  promotion.

  You can create multiple codes for a single promotion.


  If you enable promotion codes in your [customer portal
  configuration](https://docs.stripe.com/customer-management/configure-portal),
  then customers can redeem a code themselves when updating a subscription in
  the portal.

  Customers can also view the currently active promotion codes and coupons on
  each of their subscriptions in the portal.
properties:
  active:
    description: >-
      Whether the promotion code is currently active. A promotion code is only
      active if the coupon is also valid.
    type: boolean
  code:
    description: >-
      The customer-facing code. Regardless of case, this code must be unique
      across all active promotion codes for each customer. Valid characters are
      lower case letters (a-z), upper case letters (A-Z), digits (0-9), and
      dashes (-).
    maxLength: 5000
    type: string
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: The customer who can use this promotion code.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: The account representing the customer who can use this promotion code.
    maxLength: 5000
    nullable: true
    type: string
  expires_at:
    description: Date at which the promotion code can no longer be redeemed.
    format: unix-time
    nullable: true
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  max_redemptions:
    description: Maximum number of times this promotion code can be redeemed.
    nullable: true
    type: integer
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - promotion_code
    type: string
  promotion:
    $ref: ./promotion_codes_resource_promotion.yaml
  restrictions:
    $ref: ./promotion_codes_resource_restrictions.yaml
  times_redeemed:
    description: Number of times this promotion code has been used.
    type: integer
required:
  - active
  - code
  - created
  - id
  - livemode
  - object
  - promotion
  - restrictions
  - times_redeemed
title: Promotion Code
type: object
x-expandableFields:
  - customer
  - promotion
  - restrictions
x-resourceId: promotion_code
