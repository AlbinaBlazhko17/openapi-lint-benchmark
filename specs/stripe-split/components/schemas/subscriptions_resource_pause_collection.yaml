description: >-
  The Pause Collection settings determine how we will pause collection for this
  subscription and for how long the subscription

  should be paused.
properties:
  behavior:
    description: The payment collection behavior for this subscription while paused.
    enum:
      - keep_as_draft
      - mark_uncollectible
      - void
    type: string
    x-stripeBypassValidation: true
  resumes_at:
    description: The time after which the subscription will resume collecting payments.
    format: unix-time
    nullable: true
    type: integer
required:
  - behavior
title: SubscriptionsResourcePauseCollection
type: object
x-expandableFields: []
