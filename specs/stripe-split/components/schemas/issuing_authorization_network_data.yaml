description: ''
properties:
  acquiring_institution_id:
    description: >-
      Identifier assigned to the acquirer by the card network. Sometimes this
      value is not provided by the network; in this case, the value will be
      `null`.
    maxLength: 5000
    nullable: true
    type: string
  system_trace_audit_number:
    description: >-
      The System Trace Audit Number (STAN) is a 6-digit identifier assigned by
      the acquirer. Prefer `network_data.transaction_id` if present, unless you
      have special requirements.
    maxLength: 5000
    nullable: true
    type: string
  transaction_id:
    description: >-
      Unique identifier for the authorization assigned by the card network used
      to match subsequent messages, disputes, and transactions.
    maxLength: 5000
    nullable: true
    type: string
title: IssuingAuthorizationNetworkData
type: object
