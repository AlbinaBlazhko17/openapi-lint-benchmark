description: A phase item describes the price and quantity of a phase.
properties:
  billing_thresholds:
    anyOf:
      - $ref: ./subscription_item_billing_thresholds.yaml
    description: >-
      Define thresholds at which an invoice will be sent, and the related
      subscription advanced to a new billing period
    nullable: true
  discounts:
    description: >-
      The discounts applied to the subscription item. Subscription item
      discounts are applied before subscription discounts. Use
      `expand[]=discounts` to expand each discount.
    items:
      $ref: ./stackable_discount_with_discount_settings.yaml
    type: array
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an item. Metadata on this item will update the underlying
      subscription item's `metadata` when the phase is entered.
    nullable: true
    type: object
  price:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./price.yaml
      - $ref: ./deleted_price.yaml
    description: ID of the price to which the customer should be subscribed.
    x-expansionResources:
      oneOf:
        - $ref: ./price.yaml
        - $ref: ./deleted_price.yaml
  quantity:
    description: Quantity of the plan to which the customer should be subscribed.
    type: integer
  tax_rates:
    description: >-
      The tax rates which apply to this `phase_item`. When set, the
      `default_tax_rates` on the phase do not apply to this `phase_item`.
    items:
      $ref: ./tax_rate.yaml
    nullable: true
    type: array
required:
  - discounts
  - price
title: SubscriptionScheduleConfigurationItem
type: object
x-expandableFields:
  - billing_thresholds
  - discounts
  - price
  - tax_rates
