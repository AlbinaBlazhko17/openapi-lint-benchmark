description: ''
properties:
  address:
    $ref: ./address.yaml
  address_kana:
    anyOf:
      - $ref: ./legal_entity_japan_address.yaml
    description: The Kana variation of the company's primary address (Japan only).
    nullable: true
  address_kanji:
    anyOf:
      - $ref: ./legal_entity_japan_address.yaml
    description: The Kanji variation of the company's primary address (Japan only).
    nullable: true
  administrative_address:
    $ref: ./address.yaml
  directors_provided:
    description: >-
      Whether the company's directors have been provided. This Boolean will be
      `true` if you've manually indicated that all directors are provided via
      [the `directors_provided`
      parameter](https://docs.stripe.com/api/accounts/update#update_account-company-directors_provided).
    type: boolean
  directorship_declaration:
    anyOf:
      - $ref: ./legal_entity_directorship_declaration.yaml
    description: >-
      This hash is used to attest that the director information provided to
      Stripe is both current and correct.
    nullable: true
  executives_provided:
    description: >-
      Whether the company's executives have been provided. This Boolean will be
      `true` if you've manually indicated that all executives are provided via
      [the `executives_provided`
      parameter](https://docs.stripe.com/api/accounts/update#update_account-company-executives_provided),
      or if Stripe determined that sufficient executives were provided.
    type: boolean
  export_license_id:
    description: >-
      The export license ID number of the company, also referred as Import
      Export Code (India only).
    maxLength: 5000
    type: string
  export_purpose_code:
    description: The purpose code to use for export transactions (India only).
    maxLength: 5000
    type: string
  name:
    description: >-
      The company's legal name. Also available for accounts where
      [controller.requirement_collection](/api/accounts/object#account_object-controller-requirement_collection)
      is `stripe`.
    maxLength: 5000
    nullable: true
    type: string
  name_kana:
    description: >-
      The Kana variation of the company's legal name (Japan only). Also
      available for accounts where
      [controller.requirement_collection](/api/accounts/object#account_object-controller-requirement_collection)
      is `stripe`.
    maxLength: 5000
    nullable: true
    type: string
  name_kanji:
    description: >-
      The Kanji variation of the company's legal name (Japan only). Also
      available for accounts where
      [controller.requirement_collection](/api/accounts/object#account_object-controller-requirement_collection)
      is `stripe`.
    maxLength: 5000
    nullable: true
    type: string
  owners_provided:
    description: >-
      Whether the company's owners have been provided. This Boolean will be
      `true` if you've manually indicated that all owners are provided via [the
      `owners_provided`
      parameter](https://docs.stripe.com/api/accounts/update#update_account-company-owners_provided),
      or if Stripe determined that sufficient owners were provided. Stripe
      determines ownership requirements using both the number of owners provided
      and their total percent ownership (calculated by adding the
      `percent_ownership` of each owner together).
    type: boolean
  ownership_declaration:
    anyOf:
      - $ref: ./legal_entity_ubo_declaration.yaml
    description: >-
      This hash is used to attest that the beneficial owner information provided
      to Stripe is both current and correct.
    nullable: true
  ownership_exemption_reason:
    description: >-
      This value is used to determine if a business is exempt from providing
      ultimate beneficial owners. See [this support
      article](https://support.stripe.com/questions/exemption-from-providing-ownership-details)
      and
      [changelog](https://docs.stripe.com/changelog/acacia/2025-01-27/ownership-exemption-reason-accounts-api)
      for more details.
    enum:
      - qualified_entity_exceeds_ownership_threshold
      - qualifies_as_financial_institution
    type: string
  phone:
    description: The company's phone number (used for verification).
    maxLength: 5000
    nullable: true
    type: string
  principal_place_of_business:
    $ref: ./address.yaml
  registration_date:
    $ref: ./legal_entity_registration_date.yaml
  representative_declaration:
    anyOf:
      - $ref: ./legal_entity_representative_declaration.yaml
    description: >-
      This hash is used to attest that the representative is authorized to act
      as the representative of their legal entity.
    nullable: true
  structure:
    description: >-
      The category identifying the legal structure of the company or legal
      entity. Also available for accounts where
      [controller.requirement_collection](/api/accounts/object#account_object-controller-requirement_collection)
      is `stripe`. See [Business
      structure](https://docs.stripe.com/connect/identity-verification#business-structure)
      for more details.
    enum:
      - free_zone_establishment
      - free_zone_llc
      - government_instrumentality
      - governmental_unit
      - incorporated_non_profit
      - incorporated_partnership
      - limited_liability_partnership
      - llc
      - multi_member_llc
      - private_company
      - private_corporation
      - private_partnership
      - public_company
      - public_corporation
      - public_partnership
      - registered_charity
      - single_member_llc
      - sole_establishment
      - sole_proprietorship
      - tax_exempt_government_instrumentality
      - unincorporated_association
      - unincorporated_non_profit
      - unincorporated_partnership
    type: string
    x-stripeBypassValidation: true
  tax_id_provided:
    description: Whether the company's business ID number was provided.
    type: boolean
  tax_id_registrar:
    description: >-
      The jurisdiction in which the `tax_id` is registered (Germany-based
      companies only).
    maxLength: 5000
    type: string
  vat_id_provided:
    description: Whether the company's business VAT number was provided.
    type: boolean
  verification:
    anyOf:
      - $ref: ./legal_entity_company_verification.yaml
    description: Information on the verification state of the company.
    nullable: true
title: LegalEntityCompany
type: object
x-expandableFields:
  - address
  - address_kana
  - address_kanji
  - administrative_address
  - directorship_declaration
  - ownership_declaration
  - principal_place_of_business
  - registration_date
  - representative_declaration
  - verification
