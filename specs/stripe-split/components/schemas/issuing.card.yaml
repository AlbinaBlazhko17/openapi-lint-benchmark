description: >-
  You can [create physical or virtual cards](https://docs.stripe.com/issuing)
  that are issued to cardholders.
properties:
  brand:
    description: The brand of the card.
    maxLength: 5000
    type: string
  cancellation_reason:
    description: The reason why the card was canceled.
    enum:
      - design_rejected
      - fulfillment_error
      - lost
      - stolen
    nullable: true
    type: string
    x-stripeBypassValidation: true
  cardholder:
    $ref: ./issuing.cardholder.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Supported currencies are `usd` in the US, `eur` in the EU, and `gbp` in
      the UK.
    format: currency
    type: string
  cvc:
    description: >-
      The card's CVC. For security reasons, this is only available for virtual
      cards, and will be omitted unless you explicitly request it with [the
      `expand` parameter](https://docs.stripe.com/api/expanding_objects).
      Additionally, it's only available via the ["Retrieve a card"
      endpoint](https://docs.stripe.com/api/issuing/cards/retrieve), not via
      "List all cards" or any other endpoint.
    maxLength: 5000
    type: string
  exp_month:
    description: The expiration month of the card.
    type: integer
  exp_year:
    description: The expiration year of the card.
    type: integer
  financial_account:
    description: The financial account this card is attached to.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  last4:
    description: The last 4 digits of the card number.
    maxLength: 5000
    type: string
  latest_fraud_warning:
    anyOf:
      - $ref: ./issuing_card_fraud_warning.yaml
    description: >-
      Stripe’s assessment of whether this card’s details have been compromised.
      If this property isn't null, cancel and reissue the card to prevent
      fraudulent activity risk.
    nullable: true
  lifecycle_controls:
    anyOf:
      - $ref: ./issuing_card_lifecycle_controls.yaml
    description: >-
      Rules that control the lifecycle of this card, such as automatic
      cancellation. Refer to our
      [documentation](/issuing/controls/lifecycle-controls) for more details.
    nullable: true
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  number:
    description: >-
      The full unredacted card number. For security reasons, this is only
      available for virtual cards, and will be omitted unless you explicitly
      request it with [the `expand`
      parameter](https://docs.stripe.com/api/expanding_objects). Additionally,
      it's only available via the ["Retrieve a card"
      endpoint](https://docs.stripe.com/api/issuing/cards/retrieve), not via
      "List all cards" or any other endpoint.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - issuing.card
    type: string
  personalization_design:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./issuing.personalization_design.yaml
    description: The personalization design object belonging to this card.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./issuing.personalization_design.yaml
  replaced_by:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./issuing.card.yaml
    description: The latest card that replaces this card, if any.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./issuing.card.yaml
  replacement_for:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./issuing.card.yaml
    description: The card this card replaces, if any.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./issuing.card.yaml
  replacement_reason:
    description: The reason why the previous card needed to be replaced.
    enum:
      - damaged
      - expired
      - fulfillment_error
      - lost
      - stolen
    nullable: true
    type: string
    x-stripeBypassValidation: true
  second_line:
    description: Text separate from cardholder name, printed on the card.
    maxLength: 5000
    nullable: true
    type: string
  shipping:
    anyOf:
      - $ref: ./issuing_card_shipping.yaml
    description: Where and how the card will be shipped.
    nullable: true
  spending_controls:
    $ref: ./issuing_card_authorization_controls.yaml
  status:
    description: >-
      Whether authorizations can be approved on this card. May be blocked from
      activating cards depending on past-due Cardholder requirements. Defaults
      to `inactive`.
    enum:
      - active
      - canceled
      - inactive
    type: string
    x-stripeBypassValidation: true
  type:
    description: The type of the card.
    enum:
      - physical
      - virtual
    type: string
  wallets:
    anyOf:
      - $ref: ./issuing_card_wallets.yaml
    description: Information relating to digital wallets (like Apple Pay and Google Pay).
    nullable: true
required:
  - brand
  - cardholder
  - created
  - currency
  - exp_month
  - exp_year
  - id
  - last4
  - livemode
  - metadata
  - object
  - spending_controls
  - status
  - type
title: Card
type: object
x-expandableFields:
  - cardholder
  - latest_fraud_warning
  - lifecycle_controls
  - personalization_design
  - replaced_by
  - replacement_for
  - shipping
  - spending_controls
  - wallets
x-resourceId: issuing.card
