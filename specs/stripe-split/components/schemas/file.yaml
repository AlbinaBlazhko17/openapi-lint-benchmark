description: |-
  This object represents files hosted on Stripe's servers. You can upload
  files with the [create file](https://api.stripe.com#create_file) request
  (for example, when uploading dispute evidence). Stripe also
  creates files independently (for example, the results of a [Sigma scheduled
  query](#scheduled_queries)).

  Related guide: [File upload guide](https://docs.stripe.com/file-upload)
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  expires_at:
    description: The file expires and isn't available at this time in epoch seconds.
    format: unix-time
    nullable: true
    type: integer
  filename:
    description: The suitable name for saving the file to a filesystem.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  links:
    description: >-
      A list of [file links](https://api.stripe.com#file_links) that point at
      this file.
    nullable: true
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./file_link.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        pattern: ^/v1/file_links
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: FileResourceFileLinkList
    type: object
    x-expandableFields:
      - data
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - file
    type: string
  purpose:
    description: >-
      The [purpose](https://docs.stripe.com/file-upload#uploading-a-file) of the
      uploaded file.
    enum:
      - account_requirement
      - additional_verification
      - business_icon
      - business_logo
      - customer_signature
      - dispute_evidence
      - document_provider_identity_document
      - finance_report_run
      - financial_account_statement
      - identity_document
      - identity_document_downloadable
      - issuing_regulatory_reporting
      - pci_document
      - platform_terms_of_service
      - selfie
      - sigma_scheduled_query
      - tax_document_user_upload
      - terminal_android_apk
      - terminal_reader_splashscreen
      - terminal_wifi_certificate
      - terminal_wifi_private_key
    type: string
    x-stripeBypassValidation: true
  size:
    description: The size of the file object in bytes.
    type: integer
  title:
    description: A suitable title for the document.
    maxLength: 5000
    nullable: true
    type: string
  type:
    description: The returned file type (for example, `csv`, `pdf`, `jpg`, or `png`).
    maxLength: 5000
    nullable: true
    type: string
  url:
    description: Use your live secret API key to download the file from this URL.
    maxLength: 5000
    nullable: true
    type: string
required:
  - created
  - id
  - object
  - purpose
  - size
title: File
type: object
x-expandableFields:
  - links
x-resourceId: file
