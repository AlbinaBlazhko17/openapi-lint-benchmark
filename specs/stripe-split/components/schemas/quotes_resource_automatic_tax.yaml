description: ''
properties:
  enabled:
    description: Automatically calculate taxes
    type: boolean
  liability:
    anyOf:
      - $ref: ./connect_account_reference.yaml
    description: >-
      The account that's liable for tax. If set, the business address and tax
      registrations required to perform the tax calculation are loaded from this
      account. The tax transaction is returned in the report of the connected
      account.
    nullable: true
  provider:
    description: The tax provider powering automatic tax.
    maxLength: 5000
    nullable: true
    type: string
  status:
    description: The status of the most recent automated tax calculation for this quote.
    enum:
      - complete
      - failed
      - requires_location_inputs
    nullable: true
    type: string
required:
  - enabled
title: QuotesResourceAutomaticTax
type: object
x-expandableFields:
  - liability
