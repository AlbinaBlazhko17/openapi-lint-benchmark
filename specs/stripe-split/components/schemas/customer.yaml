description: >-
  This object represents a customer of your business. Use it to [create
  recurring charges](https://docs.stripe.com/invoicing/customer), [save
  payment](https://docs.stripe.com/payments/save-during-payment) and contact
  information,

  and track payments that belong to the same customer.
properties:
  address:
    anyOf:
      - $ref: ./address.yaml
    description: The customer's address.
    nullable: true
  balance:
    description: >-
      The current balance, if any, that's stored on the customer in their
      default currency. If negative, the customer has credit to apply to their
      next invoice. If positive, the customer has an amount owed that's added to
      their next invoice. The balance only considers amounts that Stripe hasn't
      successfully applied to any invoice. It doesn't reflect unpaid invoices.
      This balance is only taken into account after invoices finalize. For
      multi-currency balances, see
      [invoice_credit_balance](https://docs.stripe.com/api/customers/object#customer_object-invoice_credit_balance).
    type: integer
  business_name:
    description: The customer's business name.
    maxLength: 150
    type: string
  cash_balance:
    anyOf:
      - $ref: ./cash_balance.yaml
    description: >-
      The current funds being held by Stripe on behalf of the customer. You can
      apply these funds towards payment intents when the source is
      "cash_balance". The `settings[reconciliation_mode]` field describes if
      these funds apply to these payment intents manually or automatically.
    nullable: true
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO code for the
      currency](https://stripe.com/docs/currencies) the customer can be charged
      in for recurring billing purposes.
    maxLength: 5000
    nullable: true
    type: string
  customer_account:
    description: >-
      The ID of an Account representing a customer. You can use this ID with any
      v1 API that accepts a customer_account parameter.
    maxLength: 5000
    nullable: true
    type: string
  default_source:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./bank_account.yaml
      - $ref: ./card.yaml
      - $ref: ./source.yaml
    description: >-
      ID of the default payment source for the customer.


      If you use payment methods created through the PaymentMethods API, see the
      [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method)
      field instead.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./bank_account.yaml
        - $ref: ./card.yaml
        - $ref: ./source.yaml
    x-stripeBypassValidation: true
  delinquent:
    description: >-
      Tracks the most recent state change on any invoice belonging to the
      customer. Paying an invoice or marking it uncollectible via the API will
      set this field to false. An automatic payment failure or passing the
      `invoice.due_date` will set this field to `true`.


      If an invoice becomes uncollectible by
      [dunning](https://docs.stripe.com/billing/automatic-collection),
      `delinquent` doesn't reset to `false`.


      If you care whether the customer has paid their most recent subscription
      invoice, use `subscription.status` instead. Paying or marking
      uncollectible any customer invoice regardless of whether it is the latest
      invoice for a subscription will always set this field to `false`.
    nullable: true
    type: boolean
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  discount:
    anyOf:
      - $ref: ./discount.yaml
    description: Describes the current discount active on the customer, if there is one.
    nullable: true
  email:
    description: The customer's email address.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  individual_name:
    description: The customer's individual name.
    maxLength: 150
    type: string
  invoice_credit_balance:
    additionalProperties:
      type: integer
    description: >-
      The current multi-currency balances, if any, that's stored on the
      customer. If positive in a currency, the customer has a credit to apply to
      their next invoice denominated in that currency. If negative, the customer
      has an amount owed that's added to their next invoice denominated in that
      currency. These balances don't apply to unpaid invoices. They solely track
      amounts that Stripe hasn't successfully applied to any invoice. Stripe
      only applies a balance in a specific currency to an invoice after that
      invoice (which is in the same currency) finalizes.
    type: object
  invoice_prefix:
    description: The prefix for the customer used to generate unique invoice numbers.
    maxLength: 5000
    nullable: true
    type: string
  invoice_settings:
    $ref: ./invoice_setting_customer_setting.yaml
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  name:
    description: The customer's full name or business name.
    maxLength: 5000
    nullable: true
    type: string
  next_invoice_sequence:
    description: >-
      The suffix of the customer's next invoice number (for example, 0001). When
      the account uses account level sequencing, this parameter is ignored in
      API requests and the field omitted in API responses.
    type: integer
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - customer
    type: string
  phone:
    description: The customer's phone number.
    maxLength: 5000
    nullable: true
    type: string
  preferred_locales:
    description: The customer's preferred locales (languages), ordered by preference.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  shipping:
    anyOf:
      - $ref: ./shipping.yaml
    description: >-
      Mailing and shipping address for the customer. Appears on invoices emailed
      to this customer.
    nullable: true
  sources:
    description: The customer's payment sources, if any.
    properties:
      data:
        description: Details about each object.
        items:
          anyOf:
            - $ref: ./bank_account.yaml
            - $ref: ./card.yaml
            - $ref: ./source.yaml
          title: Polymorphic
          x-stripeBypassValidation: true
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: ApmsSourcesSourceList
    type: object
    x-expandableFields:
      - data
  subscriptions:
    description: The customer's current subscriptions, if any.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./subscription.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: SubscriptionList
    type: object
    x-expandableFields:
      - data
  tax:
    $ref: ./customer_tax.yaml
  tax_exempt:
    description: >-
      Describes the customer's tax exemption status, which is `none`, `exempt`,
      or `reverse`. When set to `reverse`, invoice and receipt PDFs include the
      following text: **"Reverse charge"**.
    enum:
      - exempt
      - none
      - reverse
    nullable: true
    type: string
  tax_ids:
    description: The customer's tax IDs.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./tax_id.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: TaxIDsList
    type: object
    x-expandableFields:
      - data
  test_clock:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./test_helpers.test_clock.yaml
    description: ID of the test clock that this customer belongs to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./test_helpers.test_clock.yaml
required:
  - created
  - id
  - livemode
  - object
title: Customer
type: object
x-expandableFields:
  - address
  - cash_balance
  - default_source
  - discount
  - invoice_settings
  - shipping
  - sources
  - subscriptions
  - tax
  - tax_ids
  - test_clock
x-resourceId: customer
