description: >-
  A phase describes the plans, coupon, and trialing status of a subscription for
  a predefined time period.
properties:
  add_invoice_items:
    description: >-
      A list of prices and quantities that will generate invoice items appended
      to the next invoice for this phase.
    items:
      $ref: ./subscription_schedule_add_invoice_item.yaml
    type: array
  application_fee_percent:
    description: >-
      A non-negative decimal between 0 and 100, with at most two decimal places.
      This represents the percentage of the subscription invoice total that will
      be transferred to the application owner's Stripe account during this phase
      of the schedule.
    nullable: true
    type: number
  automatic_tax:
    $ref: ./schedules_phase_automatic_tax.yaml
  billing_cycle_anchor:
    description: >-
      Possible values are `phase_start` or `automatic`. If `phase_start` then
      billing cycle anchor of the subscription is set to the start of the phase
      when entering the phase. If `automatic` then the billing cycle anchor is
      automatically modified as needed when entering the phase. For more
      information, see the billing cycle
      [documentation](https://docs.stripe.com/billing/subscriptions/billing-cycle).
    enum:
      - automatic
      - phase_start
    nullable: true
    type: string
  billing_thresholds:
    anyOf:
      - $ref: ./subscription_billing_thresholds.yaml
    description: >-
      Define thresholds at which an invoice will be sent, and the subscription
      advanced to a new billing period
    nullable: true
  collection_method:
    description: >-
      Either `charge_automatically`, or `send_invoice`. When charging
      automatically, Stripe will attempt to pay the underlying subscription at
      the end of each billing cycle using the default source attached to the
      customer. When sending an invoice, Stripe will email your customer an
      invoice with payment instructions and mark the subscription as `active`.
    enum:
      - charge_automatically
      - send_invoice
    nullable: true
    type: string
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  default_payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: >-
      ID of the default payment method for the subscription schedule. It must
      belong to the customer associated with the subscription schedule. If not
      set, invoices will use the default payment method in the customer's
      invoice settings.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  default_tax_rates:
    description: >-
      The default tax rates to apply to the subscription during this phase of
      the subscription schedule.
    items:
      $ref: ./tax_rate.yaml
    nullable: true
    type: array
  description:
    description: >-
      Subscription description, meant to be displayable to the customer. Use
      this field to optionally store an explanation of the subscription for
      rendering in Stripe surfaces and certain local payment methods UIs.
    maxLength: 5000
    nullable: true
    type: string
  discounts:
    description: >-
      The stackable discounts that will be applied to the subscription on this
      phase. Subscription item discounts are applied before subscription
      discounts.
    items:
      $ref: ./stackable_discount_with_discount_settings_and_discount_end.yaml
    type: array
  end_date:
    description: The end of this phase of the subscription schedule.
    format: unix-time
    type: integer
  invoice_settings:
    anyOf:
      - $ref: ./invoice_setting_subscription_schedule_phase_setting.yaml
    description: The invoice settings applicable during this phase.
    nullable: true
  items:
    description: >-
      Subscription items to configure the subscription to during this phase of
      the subscription schedule.
    items:
      $ref: ./subscription_schedule_configuration_item.yaml
    type: array
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to a phase. Metadata on a schedule's phase will update the
      underlying subscription's `metadata` when the phase is entered. Updating
      the underlying subscription's `metadata` directly will not affect the
      current phase's `metadata`.
    nullable: true
    type: object
  on_behalf_of:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account (if any) the charge was made on behalf of for charges
      associated with the schedule's subscription. See the Connect documentation
      for details.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  proration_behavior:
    description: >-
      When transitioning phases, controls how prorations are handled (if any).
      Possible values are `create_prorations`, `none`, and `always_invoice`.
    enum:
      - always_invoice
      - create_prorations
      - none
    type: string
  start_date:
    description: The start of this phase of the subscription schedule.
    format: unix-time
    type: integer
  transfer_data:
    anyOf:
      - $ref: ./subscription_transfer_data.yaml
    description: >-
      The account (if any) the associated subscription's payments will be
      attributed to for tax reporting, and where funds from each payment will be
      transferred to for each of the subscription's invoices.
    nullable: true
  trial:
    description: >-
      If set to true the entire phase is counted as a trial and the customer
      will not be charged for any fees.
    type: boolean
  trial_end:
    description: When the trial ends within the phase.
    format: unix-time
    nullable: true
    type: integer
required:
  - add_invoice_items
  - currency
  - discounts
  - end_date
  - items
  - proration_behavior
  - start_date
title: SubscriptionSchedulePhaseConfiguration
type: object
x-expandableFields:
  - add_invoice_items
  - automatic_tax
  - billing_thresholds
  - default_payment_method
  - default_tax_rates
  - discounts
  - invoice_settings
  - items
  - on_behalf_of
  - transfer_data
