description: ''
properties:
  amount:
    description: A non-negative integer in cents representing how much to charge.
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  currency_options:
    additionalProperties:
      $ref: ./shipping_rate_currency_option.yaml
    description: >-
      Shipping rates defined in each available currency option. Each key must be
      a three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html) and a [supported
      currency](https://stripe.com/docs/currencies).
    type: object
required:
  - amount
  - currency
title: ShippingRateFixedAmount
type: object
x-expandableFields:
  - currency_options
