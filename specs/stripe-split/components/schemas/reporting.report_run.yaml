description: >-
  The Report Run object represents an instance of a report type generated with

  specific run parameters. Once the object is created, Stripe begins processing
  the report.

  When the report has finished running, it will give you a reference to a file

  where you can retrieve your results. For an overview, see

  [API Access to Reports](https://docs.stripe.com/reporting/statements/api).


  Note that certain report types can only be run based on your live-mode data
  (not test-mode

  data), and will error when queried without a [live-mode API
  key](https://docs.stripe.com/keys#test-live-modes).
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  error:
    description: >-
      If something should go wrong during the run, a message about the failure
      (populated when
       `status=failed`).
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      `true` if the report is run on live mode data and `false` if it is run on
      test mode data.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - reporting.report_run
    type: string
  parameters:
    $ref: ./financial_reporting_finance_report_run_run_parameters.yaml
  report_type:
    description: >-
      The ID of the [report type](https://docs.stripe.com/reports/report-types)
      to run, such as `"balance.summary.1"`.
    maxLength: 5000
    type: string
  result:
    anyOf:
      - $ref: ./file.yaml
    description: |-
      The file object representing the result of the report run (populated when
       `status=succeeded`).
    nullable: true
  status:
    description: >-
      Status of this report run. This will be `pending` when the run is
      initially created.
       When the run finishes, this will be set to `succeeded` and the `result` field will be populated.
       Rarely, we may encounter an error, at which point this will be set to `failed` and the `error` field will be populated.
    maxLength: 5000
    type: string
  succeeded_at:
    description: |-
      Timestamp at which this run successfully finished (populated when
       `status=succeeded`). Measured in seconds since the Unix epoch.
    format: unix-time
    nullable: true
    type: integer
required:
  - created
  - id
  - livemode
  - object
  - parameters
  - report_type
  - status
title: Report Run
type: object
x-expandableFields:
  - parameters
  - result
x-resourceId: reporting.report_run
