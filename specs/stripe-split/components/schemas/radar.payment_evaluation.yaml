description: >-
  Payment Evaluations represent the risk lifecycle of an externally processed
  payment. It includes the Radar risk score from Stripe, payment outcome taken
  by the merchant or processor, and any post transaction events, such as refunds
  or disputes. See the [Radar API guide](/radar/multiprocessor) for integration
  steps.
properties:
  client_device_metadata_details:
    $ref: ./insights_resources_payment_evaluation_client_device_metadata.yaml
  created_at:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  customer_details:
    $ref: ./insights_resources_payment_evaluation_customer_details.yaml
  events:
    description: >-
      Event information associated with the payment evaluation, such as refunds,
      dispute, early fraud warnings, or user interventions.
    items:
      $ref: ./insights_resources_payment_evaluation_event.yaml
    type: array
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - radar.payment_evaluation
    type: string
  outcome:
    anyOf:
      - $ref: ./insights_resources_payment_evaluation_outcome.yaml
    description: Indicates the final outcome for the payment evaluation.
    nullable: true
  payment_details:
    $ref: ./insights_resources_payment_evaluation_payment_details.yaml
  recommended_action:
    description: >-
      Recommended action based on the score of the `fraudulent_payment` signal.
      Possible values are `block`, `continue` and `request_three_d_secure`.
    enum:
      - block
      - continue
    type: string
    x-stripeBypassValidation: true
  signals:
    $ref: ./insights_resources_payment_evaluation_signals.yaml
required:
  - created_at
  - events
  - id
  - livemode
  - object
  - recommended_action
  - signals
title: Payment Evaluation
type: object
x-expandableFields:
  - client_device_metadata_details
  - customer_details
  - events
  - outcome
  - payment_details
  - signals
x-resourceId: radar.payment_evaluation
