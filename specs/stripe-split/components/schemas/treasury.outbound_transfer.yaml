description: >-
  Use
  [OutboundTransfers](https://docs.stripe.com/docs/treasury/moving-money/financial-accounts/out-of/outbound-transfers)
  to transfer funds from a
  [FinancialAccount](https://api.stripe.com#financial_accounts) to a
  PaymentMethod belonging to the same entity. To send funds to a different
  party, use [OutboundPayments](https://api.stripe.com#outbound_payments)
  instead. You can send funds over ACH rails or through a domestic wire transfer
  to a user's own external bank account.


  Simulate OutboundTransfer state changes with the
  `/v1/test_helpers/treasury/outbound_transfers` endpoints. These methods can
  only be called on test mode objects.


  Related guide: [Moving money with Treasury using OutboundTransfer
  objects](https://docs.stripe.com/docs/treasury/moving-money/financial-accounts/out-of/outbound-transfers)
properties:
  amount:
    description: Amount (in cents) transferred.
    type: integer
  cancelable:
    description: Returns `true` if the object can be canceled, and `false` otherwise.
    type: boolean
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  destination_payment_method:
    description: The PaymentMethod used as the payment instrument for an OutboundTransfer.
    maxLength: 5000
    nullable: true
    type: string
  destination_payment_method_details:
    $ref: ./outbound_transfers_payment_method_details.yaml
  expected_arrival_date:
    description: The date when funds are expected to arrive in the destination account.
    format: unix-time
    type: integer
  financial_account:
    description: The FinancialAccount that funds were pulled from.
    maxLength: 5000
    type: string
  hosted_regulatory_receipt_url:
    description: >-
      A [hosted transaction
      receipt](https://docs.stripe.com/treasury/moving-money/regulatory-receipts)
      URL that is provided when money movement is considered regulated under
      Stripe's money transmission licenses.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.outbound_transfer
    type: string
  returned_details:
    anyOf:
      - $ref: ./treasury_outbound_transfers_resource_returned_details.yaml
    description: >-
      Details about a returned OutboundTransfer. Only set when the status is
      `returned`.
    nullable: true
  statement_descriptor:
    description: >-
      Information about the OutboundTransfer to be sent to the recipient
      account.
    maxLength: 5000
    type: string
  status:
    description: >-
      Current status of the OutboundTransfer: `processing`, `failed`,
      `canceled`, `posted`, `returned`. An OutboundTransfer is `processing` if
      it has been created and is pending. The status changes to `posted` once
      the OutboundTransfer has been "confirmed" and funds have left the account,
      or to `failed` or `canceled`. If an OutboundTransfer fails to arrive at
      its destination, its status will change to `returned`.
    enum:
      - canceled
      - failed
      - posted
      - processing
      - returned
    type: string
  status_transitions:
    $ref: ./treasury_outbound_transfers_resource_status_transitions.yaml
  tracking_details:
    anyOf:
      - $ref: >-
          ./treasury_outbound_transfers_resource_outbound_transfer_resource_tracking_details.yaml
    description: Details about network-specific tracking information if available.
    nullable: true
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./treasury.transaction.yaml
    description: The Transaction associated with this object.
    x-expansionResources:
      oneOf:
        - $ref: ./treasury.transaction.yaml
required:
  - amount
  - cancelable
  - created
  - currency
  - destination_payment_method_details
  - expected_arrival_date
  - financial_account
  - id
  - livemode
  - metadata
  - object
  - statement_descriptor
  - status
  - status_transitions
  - transaction
title: OutboundTransfer
type: object
x-expandableFields:
  - destination_payment_method_details
  - returned_details
  - status_transitions
  - tracking_details
  - transaction
x-resourceId: treasury.outbound_transfer
