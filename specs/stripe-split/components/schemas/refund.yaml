description: |-
  Refund objects allow you to refund a previously created charge that isn't
  refunded yet. Funds are refunded to the credit or debit card that's
  initially charged.

  Related guide: [Refunds](https://docs.stripe.com/refunds)
properties:
  amount:
    description: Amount, in cents (or local equivalent).
    type: integer
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: Balance transaction that describes the impact on your account balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  charge:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./charge.yaml
    description: ID of the charge that's refunded.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: ID of the customer of this refund.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: ID of the account of this refund.
    maxLength: 5000
    nullable: true
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. You can use this for
      displaying to users (available on non-card refunds only).
    maxLength: 5000
    type: string
  destination_details:
    $ref: ./refund_destination_details.yaml
  failure_balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: >-
      After the refund fails, this balance transaction describes the adjustment
      made on your account balance that reverses the initial balance
      transaction.
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  failure_reason:
    description: >-
      Provides the reason for the refund failure. Possible values are:
      `lost_or_stolen_card`, `expired_or_canceled_card`,
      `charge_for_pending_refund_disputed`, `insufficient_funds`, `declined`,
      `merchant_request`, or `unknown`.
    maxLength: 5000
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  instructions_email:
    description: >-
      For payment methods without native refund support (for example, Konbini,
      PromptPay), provide an email address for the customer to receive refund
      instructions.
    maxLength: 5000
    type: string
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  next_action:
    $ref: ./refund_next_action.yaml
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - refund
    type: string
  payment_intent:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_intent.yaml
    description: ID of the PaymentIntent that's refunded.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_intent.yaml
  payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: ID of the payment method associated with this refund.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  pending_reason:
    description: >-
      Provides the reason for why the refund is pending. Possible values are:
      `processing`, `insufficient_funds`, or `charge_pending`.
    enum:
      - charge_pending
      - insufficient_funds
      - processing
    type: string
  presentment_details:
    $ref: ./payment_flows_payment_intent_presentment_details.yaml
  reason:
    description: >-
      Reason for the refund, which is either user-provided (`duplicate`,
      `fraudulent`, or `requested_by_customer`) or generated by Stripe
      internally (`expired_uncaptured_charge`).
    enum:
      - duplicate
      - expired_uncaptured_charge
      - fraudulent
      - requested_by_customer
    nullable: true
    type: string
    x-stripeBypassValidation: true
  receipt_number:
    description: >-
      This is the transaction number that appears on email receipts sent for
      this refund.
    maxLength: 5000
    nullable: true
    type: string
  source_transfer_reversal:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./transfer_reversal.yaml
    description: >-
      The transfer reversal that's associated with the refund. Only present if
      the charge came from another Stripe account.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./transfer_reversal.yaml
  status:
    description: >-
      Status of the refund. This can be `pending`, `requires_action`,
      `succeeded`, `failed`, or `canceled`. Learn more about [failed
      refunds](https://docs.stripe.com/refunds#failed-refunds).
    maxLength: 5000
    nullable: true
    type: string
  transfer_reversal:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./transfer_reversal.yaml
    description: >-
      This refers to the transfer reversal object if the accompanying transfer
      reverses. This is only applicable if the charge was created using the
      destination parameter.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./transfer_reversal.yaml
required:
  - amount
  - created
  - currency
  - id
  - object
title: Refund
type: object
x-expandableFields:
  - balance_transaction
  - charge
  - customer
  - destination_details
  - failure_balance_transaction
  - next_action
  - payment_intent
  - payment_method
  - presentment_details
  - source_transfer_reversal
  - transfer_reversal
x-resourceId: refund
