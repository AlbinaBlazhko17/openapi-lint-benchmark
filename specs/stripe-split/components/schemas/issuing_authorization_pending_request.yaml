description: ''
properties:
  amount:
    description: >-
      The additional amount Stripe will hold if the authorization is approved,
      in the card's
      [currency](https://docs.stripe.com/api#issuing_authorization_object-pending-request-currency)
      and in the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal).
    type: integer
  amount_details:
    anyOf:
      - $ref: ./issuing_authorization_amount_details.yaml
    description: >-
      Detailed breakdown of amount components. These amounts are denominated in
      `currency` and in the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal).
    nullable: true
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  is_amount_controllable:
    description: >-
      If set `true`, you may provide
      [amount](https://docs.stripe.com/api/issuing/authorizations/approve#approve_issuing_authorization-amount)
      to control how much to hold for the authorization.
    type: boolean
  merchant_amount:
    description: >-
      The amount the merchant is requesting to be authorized in the
      `merchant_currency`. The amount is in the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal).
    type: integer
  merchant_currency:
    description: The local currency the merchant is requesting to authorize.
    format: currency
    type: string
  network_risk_score:
    description: >-
      The card network's estimate of the likelihood that an authorization is
      fraudulent. Takes on values between 1 and 99.
    nullable: true
    type: integer
required:
  - amount
  - currency
  - is_amount_controllable
  - merchant_amount
  - merchant_currency
title: IssuingAuthorizationPendingRequest
type: object
x-expandableFields:
  - amount_details
