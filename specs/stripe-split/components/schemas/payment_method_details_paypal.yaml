description: ''
properties:
  country:
    description: >-
      Two-letter ISO code representing the buyer's country. Values are provided
      by PayPal directly (if supported) at the time of authorization or
      settlement. They cannot be set or mutated.
    maxLength: 5000
    nullable: true
    type: string
  payer_email:
    description: >-
      Owner's email. Values are provided by PayPal directly

      (if supported) at the time of authorization or settlement. They cannot be
      set or mutated.
    maxLength: 5000
    nullable: true
    type: string
  payer_id:
    description: >-
      PayPal account PayerID. This identifier uniquely identifies the PayPal
      customer.
    maxLength: 5000
    nullable: true
    type: string
  payer_name:
    description: >-
      Owner's full name. Values provided by PayPal directly

      (if supported) at the time of authorization or settlement. They cannot be
      set or mutated.
    maxLength: 5000
    nullable: true
    type: string
  seller_protection:
    anyOf:
      - $ref: ./paypal_seller_protection.yaml
    description: >-
      The level of protection offered as defined by PayPal Seller Protection for
      Merchants, for this transaction.
    nullable: true
  transaction_id:
    description: A unique ID generated by PayPal for this transaction.
    maxLength: 5000
    nullable: true
    type: string
title: payment_method_details_paypal
type: object
x-expandableFields:
  - seller_protection
