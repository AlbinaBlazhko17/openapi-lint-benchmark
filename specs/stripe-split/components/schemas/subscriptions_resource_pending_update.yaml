description: >-
  Pending Updates store the changes pending from a previous update that will be
  applied

  to the Subscription upon successful payment.
properties:
  billing_cycle_anchor:
    description: >-
      If the update is applied, determines the date of the first full invoice,
      and, for plans with `month` or `year` intervals, the day of the month for
      subsequent invoices. The timestamp is in UTC format.
    format: unix-time
    nullable: true
    type: integer
  discount:
    anyOf:
      - $ref: ./discount.yaml
    description: >-
      The pending subscription-level discount that will be applied when the
      pending update is applied.
    nullable: true
  discounts:
    description: >-
      The discounts that will be applied to the subscription when the pending
      update is applied. Use `expand[]=discounts` to expand each discount.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./discount.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./discount.yaml
    nullable: true
    type: array
  expires_at:
    description: >-
      The point after which the changes reflected by this update will be
      discarded and no longer applied.
    format: unix-time
    type: integer
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  subscription_items:
    description: >-
      List of subscription items, each with an attached plan, that will be set
      if the update is applied.
    items:
      $ref: ./subscription_item.yaml
    nullable: true
    type: array
  trial_end:
    description: >-
      Unix timestamp representing the end of the trial period the customer will
      get before being charged for the first time, if the update is applied.
    format: unix-time
    nullable: true
    type: integer
  trial_from_plan:
    description: >-
      Indicates if a plan's `trial_period_days` should be applied to the
      subscription. Setting `trial_end` per subscription is preferred, and this
      defaults to `false`. Setting this flag to `true` together with `trial_end`
      is not allowed. See [Using trial periods on
      subscriptions](https://docs.stripe.com/billing/subscriptions/trials) to
      learn more.
    nullable: true
    type: boolean
required:
  - expires_at
title: SubscriptionsResourcePendingUpdate
type: object
x-expandableFields:
  - discount
  - discounts
  - subscription_items
