description: ''
properties:
  capture_method:
    description: Indicates when the funds will be captured from the customer's account.
    enum:
      - automatic
      - automatic_async
      - manual
    nullable: true
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that will
      set metadata on [Payment
      Intents](https://docs.stripe.com/api/payment_intents) generated from this
      payment link.
    type: object
  setup_future_usage:
    description: >-
      Indicates that you intend to make future payments with the payment method
      collected during checkout.
    enum:
      - off_session
      - on_session
    nullable: true
    type: string
  statement_descriptor:
    description: >-
      For a non-card payment, information about the charge that appears on the
      customer's statement when this payment succeeds in creating a charge.
    maxLength: 5000
    nullable: true
    type: string
  statement_descriptor_suffix:
    description: >-
      For a card payment, information about the charge that appears on the
      customer's statement when this payment succeeds in creating a charge.
      Concatenated with the account's statement descriptor prefix to form the
      complete statement descriptor.
    maxLength: 5000
    nullable: true
    type: string
  transfer_group:
    description: >-
      A string that identifies the resulting payment as part of a group. See the
      PaymentIntents [use case for connected
      accounts](https://docs.stripe.com/connect/separate-charges-and-transfers)
      for details.
    maxLength: 5000
    nullable: true
    type: string
required:
  - metadata
title: PaymentLinksResourcePaymentIntentData
type: object
x-expandableFields: []
