description: ''
properties:
  decline_on:
    $ref: ./account_decline_charge_on.yaml
  statement_descriptor_prefix:
    description: >-
      The default text that appears on credit card statements when a charge is
      made. This field prefixes any dynamic `statement_descriptor` specified on
      the charge. `statement_descriptor_prefix` is useful for maximizing
      descriptor space for the dynamic portion.
    maxLength: 5000
    nullable: true
    type: string
  statement_descriptor_prefix_kana:
    description: >-
      The Kana variation of the default text that appears on credit card
      statements when a charge is made (Japan only). This field prefixes any
      dynamic `statement_descriptor_suffix_kana` specified on the charge.
      `statement_descriptor_prefix_kana` is useful for maximizing descriptor
      space for the dynamic portion.
    maxLength: 5000
    nullable: true
    type: string
  statement_descriptor_prefix_kanji:
    description: >-
      The Kanji variation of the default text that appears on credit card
      statements when a charge is made (Japan only). This field prefixes any
      dynamic `statement_descriptor_suffix_kanji` specified on the charge.
      `statement_descriptor_prefix_kanji` is useful for maximizing descriptor
      space for the dynamic portion.
    maxLength: 5000
    nullable: true
    type: string
title: AccountCardPaymentsSettings
type: object
x-expandableFields:
  - decline_on
