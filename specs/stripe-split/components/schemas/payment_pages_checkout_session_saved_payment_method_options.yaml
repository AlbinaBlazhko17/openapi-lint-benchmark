description: ''
properties:
  allow_redisplay_filters:
    description: >-
      Uses the `allow_redisplay` value of each saved payment method to filter
      the set presented to a returning customer. By default, only saved payment
      methods with ’allow_redisplay: ‘always’ are shown in Checkout.
    items:
      enum:
        - always
        - limited
        - unspecified
      type: string
    nullable: true
    type: array
  payment_method_remove:
    description: >-
      Enable customers to choose if they wish to remove their saved payment
      methods. Disabled by default.
    enum:
      - disabled
      - enabled
    nullable: true
    type: string
  payment_method_save:
    description: >-
      Enable customers to choose if they wish to save their payment method for
      future use. Disabled by default.
    enum:
      - disabled
      - enabled
    nullable: true
    type: string
title: PaymentPagesCheckoutSessionSavedPaymentMethodOptions
type: object
x-expandableFields: []
