description: A supplier of carbon removal.
properties:
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  info_url:
    description: Link to a webpage to learn more about the supplier.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      Has the value `true` if the object exists in live mode or the value
      `false` if the object exists in test mode.
    type: boolean
  locations:
    description: The locations in which this supplier operates.
    items:
      $ref: ./climate_removals_location.yaml
    type: array
  name:
    description: Name of this carbon removal supplier.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object’s type. Objects of the same type share the
      same value.
    enum:
      - climate.supplier
    type: string
  removal_pathway:
    description: The scientific pathway used for carbon removal.
    enum:
      - biomass_carbon_removal_and_storage
      - direct_air_capture
      - enhanced_weathering
      - marine_carbon_removal
    type: string
    x-stripeBypassValidation: true
required:
  - id
  - info_url
  - livemode
  - locations
  - name
  - object
  - removal_pathway
title: Climate supplier
type: object
x-expandableFields:
  - locations
x-resourceId: climate.supplier
