description: >-
  A payment method domain represents a web domain that you have registered with
  Stripe.

  Stripe Elements use registered payment method domains to control where certain
  payment methods are shown.


  Related guide: [Payment method
  domains](https://docs.stripe.com/payments/payment-methods/pmd-registration).
properties:
  amazon_pay:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
  apple_pay:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  domain_name:
    description: The domain name that this payment method domain object represents.
    maxLength: 5000
    type: string
  enabled:
    description: >-
      Whether this payment method domain is enabled. If the domain is not
      enabled, payment methods that require a payment method domain will not
      appear in Elements.
    type: boolean
  google_pay:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  klarna:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
  link:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - payment_method_domain
    type: string
  paypal:
    $ref: ./payment_method_domain_resource_payment_method_status.yaml
required:
  - amazon_pay
  - apple_pay
  - created
  - domain_name
  - enabled
  - google_pay
  - id
  - klarna
  - link
  - livemode
  - object
  - paypal
title: PaymentMethodDomain
type: object
x-expandableFields:
  - amazon_pay
  - apple_pay
  - google_pay
  - klarna
  - link
  - paypal
x-resourceId: payment_method_domain
