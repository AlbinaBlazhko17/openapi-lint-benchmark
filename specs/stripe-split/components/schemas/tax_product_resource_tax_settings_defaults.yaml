description: ''
properties:
  provider:
    description: >-
      The tax calculation provider this account uses. Defaults to `stripe` when
      not using a [third-party provider](/tax/third-party-apps).
    enum:
      - anrok
      - avalara
      - sphere
      - stripe
    type: string
  tax_behavior:
    description: >-
      Default [tax
      behavior](https://stripe.com/docs/tax/products-prices-tax-categories-tax-behavior#tax-behavior)
      used to specify whether the price is considered inclusive of taxes or
      exclusive of taxes. If the item's price has a tax behavior set, it will
      take precedence over the default tax behavior.
    enum:
      - exclusive
      - inclusive
      - inferred_by_currency
    nullable: true
    type: string
  tax_code:
    description: >-
      Default [tax code](https://stripe.com/docs/tax/tax-categories) used to
      classify your products and prices.
    maxLength: 5000
    nullable: true
    type: string
required:
  - provider
title: TaxProductResourceTaxSettingsDefaults
type: object
x-expandableFields: []
