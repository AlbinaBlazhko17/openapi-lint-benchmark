description: >-
  [Stripe Connect](https://docs.stripe.com/connect) platforms can reverse
  transfers made to a

  connected account, either entirely or partially, and can also specify whether

  to refund any related application fees. Transfer reversals add to the

  platform's balance and subtract from the destination account's balance.


  Reversing a transfer that was made for a [destination

  charge](/docs/connect/destination-charges) is allowed only up to the amount of

  the charge. It is possible to reverse a

  [transfer_group](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options)

  transfer only if the destination account has enough balance to cover the

  reversal.


  Related guide: [Reverse
  transfers](https://docs.stripe.com/connect/separate-charges-and-transfers#reverse-transfers)
properties:
  amount:
    description: Amount, in cents (or local equivalent).
    type: integer
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: Balance transaction that describes the impact on your account balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  destination_payment_refund:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./refund.yaml
    description: Linked payment refund for the transfer reversal.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./refund.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - transfer_reversal
    type: string
  source_refund:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./refund.yaml
    description: ID of the refund responsible for the transfer reversal.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./refund.yaml
  transfer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./transfer.yaml
    description: ID of the transfer that was reversed.
    x-expansionResources:
      oneOf:
        - $ref: ./transfer.yaml
required:
  - amount
  - created
  - currency
  - id
  - object
  - transfer
title: Transfer Reversal
type: object
x-expandableFields:
  - balance_transaction
  - destination_payment_refund
  - source_refund
  - transfer
x-resourceId: transfer_reversal
