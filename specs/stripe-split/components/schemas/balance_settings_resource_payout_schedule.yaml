description: ''
properties:
  interval:
    description: >-
      How frequently funds will be paid out. One of `manual` (payouts only
      created via API call), `daily`, `weekly`, or `monthly`.
    enum:
      - daily
      - manual
      - monthly
      - weekly
    nullable: true
    type: string
    x-stripeBypassValidation: true
  monthly_payout_days:
    description: >-
      The day of the month funds will be paid out. Only shown if `interval` is
      monthly. Payouts scheduled between the 29th and 31st of the month are sent
      on the last day of shorter months.
    items:
      type: integer
    type: array
  weekly_payout_days:
    description: >-
      The days of the week when available funds are paid out, specified as an
      array, for example, [`monday`, `tuesday`]. Only shown if `interval` is
      weekly.
    items:
      enum:
        - friday
        - monday
        - thursday
        - tuesday
        - wednesday
      type: string
      x-stripeBypassValidation: true
    type: array
title: BalanceSettingsResourcePayoutSchedule
type: object
x-expandableFields: []
