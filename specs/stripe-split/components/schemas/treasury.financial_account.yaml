description: >-
  Stripe Treasury for Platforms provides users with a container for money called
  a FinancialAccount that is separate from their Payments balance.

  FinancialAccounts serve as the source and destination of Treasury for
  Platform’s money movement APIs.
properties:
  active_features:
    description: The array of paths to active Features in the Features hash.
    items:
      enum:
        - card_issuing
        - deposit_insurance
        - financial_addresses.aba
        - financial_addresses.aba.forwarding
        - inbound_transfers.ach
        - intra_stripe_flows
        - outbound_payments.ach
        - outbound_payments.us_domestic_wire
        - outbound_transfers.ach
        - outbound_transfers.us_domestic_wire
        - remote_deposit_capture
      type: string
      x-stripeBypassValidation: true
    type: array
  balance:
    $ref: ./treasury_financial_accounts_resource_balance.yaml
  country:
    description: >-
      Two-letter country code ([ISO 3166-1
      alpha-2](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)).
    maxLength: 5000
    type: string
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  features:
    $ref: ./treasury.financial_account_features.yaml
  financial_addresses:
    description: The set of credentials that resolve to a FinancialAccount.
    items:
      $ref: ./treasury_financial_accounts_resource_financial_address.yaml
    type: array
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  is_default:
    type: boolean
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  nickname:
    description: The nickname for the FinancialAccount.
    maxLength: 5000
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.financial_account
    type: string
  pending_features:
    description: The array of paths to pending Features in the Features hash.
    items:
      enum:
        - card_issuing
        - deposit_insurance
        - financial_addresses.aba
        - financial_addresses.aba.forwarding
        - inbound_transfers.ach
        - intra_stripe_flows
        - outbound_payments.ach
        - outbound_payments.us_domestic_wire
        - outbound_transfers.ach
        - outbound_transfers.us_domestic_wire
        - remote_deposit_capture
      type: string
      x-stripeBypassValidation: true
    type: array
  platform_restrictions:
    anyOf:
      - $ref: ./treasury_financial_accounts_resource_platform_restrictions.yaml
    description: >-
      The set of functionalities that the platform can restrict on the
      FinancialAccount.
    nullable: true
  restricted_features:
    description: The array of paths to restricted Features in the Features hash.
    items:
      enum:
        - card_issuing
        - deposit_insurance
        - financial_addresses.aba
        - financial_addresses.aba.forwarding
        - inbound_transfers.ach
        - intra_stripe_flows
        - outbound_payments.ach
        - outbound_payments.us_domestic_wire
        - outbound_transfers.ach
        - outbound_transfers.us_domestic_wire
        - remote_deposit_capture
      type: string
      x-stripeBypassValidation: true
    type: array
  status:
    description: Status of this FinancialAccount.
    enum:
      - closed
      - open
    type: string
    x-stripeBypassValidation: true
  status_details:
    $ref: ./treasury_financial_accounts_resource_status_details.yaml
  supported_currencies:
    description: >-
      The currencies the FinancialAccount can hold a balance in. Three-letter
      [ISO currency code](https://www.iso.org/iso-4217-currency-codes.html), in
      lowercase.
    items:
      type: string
    type: array
required:
  - balance
  - country
  - created
  - financial_addresses
  - id
  - livemode
  - object
  - status
  - status_details
  - supported_currencies
title: FinancialAccount
type: object
x-expandableFields:
  - balance
  - features
  - financial_addresses
  - platform_restrictions
  - status_details
x-resourceId: treasury.financial_account
