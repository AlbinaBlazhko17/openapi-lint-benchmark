description: >-
  An early fraud warning indicates that the card issuer has notified us that a

  charge may be fraudulent.


  Related guide: [Early fraud
  warnings](https://docs.stripe.com/disputes/measuring#early-fraud-warnings)
properties:
  actionable:
    description: >-
      An EFW is actionable if it has not received a dispute and has not been
      fully refunded. You may wish to proactively refund a charge that receives
      an EFW, in order to avoid receiving a dispute later.
    type: boolean
  charge:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./charge.yaml
    description: ID of the charge this early fraud warning is for, optionally expanded.
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  fraud_type:
    description: >-
      The type of fraud labelled by the issuer. One of `card_never_received`,
      `fraudulent_card_application`, `made_with_counterfeit_card`,
      `made_with_lost_card`, `made_with_stolen_card`, `misc`,
      `unauthorized_use_of_card`.
    maxLength: 5000
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - radar.early_fraud_warning
    type: string
  payment_intent:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_intent.yaml
    description: >-
      ID of the Payment Intent this early fraud warning is for, optionally
      expanded.
    x-expansionResources:
      oneOf:
        - $ref: ./payment_intent.yaml
required:
  - actionable
  - charge
  - created
  - fraud_type
  - id
  - livemode
  - object
title: Early Fraud Warning
type: object
x-expandableFields:
  - charge
  - payment_intent
x-resourceId: radar.early_fraud_warning
