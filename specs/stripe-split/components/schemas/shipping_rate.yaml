description: >-
  Shipping rates describe the price of shipping presented to your customers and

  applied to a purchase. For more information, see [Charge for
  shipping](https://docs.stripe.com/payments/during-payment/charge-shipping).
properties:
  active:
    description: >-
      Whether the shipping rate can be used for new purchases. Defaults to
      `true`.
    type: boolean
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  delivery_estimate:
    anyOf:
      - $ref: ./shipping_rate_delivery_estimate.yaml
    description: >-
      The estimated range for how long shipping will take, meant to be
      displayable to the customer. This will appear on CheckoutSessions.
    nullable: true
  display_name:
    description: >-
      The name of the shipping rate, meant to be displayable to the customer.
      This will appear on CheckoutSessions.
    maxLength: 5000
    nullable: true
    type: string
  fixed_amount:
    $ref: ./shipping_rate_fixed_amount.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - shipping_rate
    type: string
  tax_behavior:
    description: >-
      Specifies whether the rate is considered inclusive of taxes or exclusive
      of taxes. One of `inclusive`, `exclusive`, or `unspecified`.
    enum:
      - exclusive
      - inclusive
      - unspecified
    nullable: true
    type: string
  tax_code:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./tax_code.yaml
    description: >-
      A [tax code](https://docs.stripe.com/tax/tax-categories) ID. The Shipping
      tax code is `txcd_92010001`.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./tax_code.yaml
  type:
    description: The type of calculation to use on the shipping rate.
    enum:
      - fixed_amount
    type: string
required:
  - active
  - created
  - id
  - livemode
  - metadata
  - object
  - type
title: Shipping Rate
type: object
x-expandableFields:
  - delivery_estimate
  - fixed_amount
  - tax_code
x-resourceId: shipping_rate
