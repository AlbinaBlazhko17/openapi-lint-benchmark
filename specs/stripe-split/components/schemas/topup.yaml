description: >-
  To top up your Stripe balance, you create a top-up object. You can retrieve

  individual top-ups, as well as list all top-ups. Top-ups are identified by a

  unique, random ID.


  Related guide: [Topping up your platform
  account](https://docs.stripe.com/connect/top-ups)
properties:
  amount:
    description: Amount transferred.
    type: integer
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: >-
      ID of the balance transaction that describes the impact of this top-up on
      your account balance. May not be specified depending on status of top-up.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    maxLength: 5000
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  expected_availability_date:
    description: >-
      Date the funds are expected to arrive in your Stripe account for payouts.
      This factors in delays like weekends or bank holidays. May not be
      specified depending on status of top-up.
    nullable: true
    type: integer
  failure_code:
    description: >-
      Error code explaining reason for top-up failure if available (see [the
      errors section](/api/errors) for a list of codes).
    maxLength: 5000
    nullable: true
    type: string
  failure_message:
    description: Message to user further explaining reason for top-up failure if available.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  initiated_by:
    description: Indicates whether the top-up was initiated by Stripe or by the user.
    enum:
      - stripe
      - user
    nullable: true
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - topup
    type: string
  payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: >-
      The ID of a PaymentMethod representing the payment method used for the
      top-up. A PaymentMethod of type `us_bank_account` can be used.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  payment_method_options:
    anyOf:
      - $ref: ./topup_resource_payment_method_options.yaml
    description: Payment-method-specific configuration for this top-up.
    nullable: true
  source:
    anyOf:
      - $ref: ./source.yaml
    description: >-
      The source field is deprecated. It might not always be present in the API
      response.
    nullable: true
  statement_descriptor:
    description: >-
      Extra information about a top-up. This will appear on your source's bank
      statement. It must contain at least one letter.
    maxLength: 5000
    nullable: true
    type: string
  status:
    description: >-
      The status of the top-up is either `canceled`, `failed`, `pending`,
      `reversed`, or `succeeded`.
    enum:
      - canceled
      - failed
      - pending
      - reversed
      - succeeded
    type: string
  transfer_group:
    description: A string that identifies this top-up as part of a group.
    maxLength: 5000
    nullable: true
    type: string
required:
  - amount
  - created
  - currency
  - id
  - livemode
  - metadata
  - object
  - status
title: Top-up
type: object
x-expandableFields:
  - balance_transaction
  - payment_method
  - payment_method_options
  - source
x-resourceId: topup
