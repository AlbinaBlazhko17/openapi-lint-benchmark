description: >-
  A Climate product represents a type of carbon removal unit available for
  reservation.

  You can retrieve it to see the current price and availability.
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  current_prices_per_metric_ton:
    additionalProperties:
      $ref: ./climate_removals_products_price.yaml
    description: >-
      Current prices for a metric ton of carbon removal in a currency's smallest
      unit.
    type: object
  delivery_year:
    description: >-
      The year in which the carbon removal is expected to be delivered. If the
      year is in the past, this represents spot inventory with guaranteed
      delivery.
    nullable: true
    type: integer
  id:
    description: >-
      Unique identifier for the object. For convenience, Climate product IDs are
      human-readable strings

      that start with `climsku_`. See [carbon removal
      inventory](https://stripe.com/docs/climate/orders/carbon-removal-inventory)

      for a list of available carbon removal products.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      Has the value `true` if the object exists in live mode or the value
      `false` if the object exists in test mode.
    type: boolean
  metric_tons_available:
    description: The quantity of metric tons available for reservation.
    format: decimal
    type: string
  name:
    description: The Climate product's name.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - climate.product
    type: string
  suppliers:
    description: The carbon removal suppliers that fulfill orders for this Climate product.
    items:
      $ref: ./climate.supplier.yaml
    type: array
required:
  - created
  - current_prices_per_metric_ton
  - id
  - livemode
  - metric_tons_available
  - name
  - object
  - suppliers
title: Climate product
type: object
x-expandableFields:
  - current_prices_per_metric_ton
  - suppliers
x-resourceId: climate.product
