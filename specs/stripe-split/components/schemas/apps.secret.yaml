description: >-
  Secret Store is an API that allows Stripe Apps developers to securely persist
  secrets for use by UI Extensions and app backends.


  The primary resource in Secret Store is a `secret`. Other apps can't view
  secrets created by an app. Additionally, secrets are scoped to provide further
  permission control.


  All Dashboard users and the app backend share `account` scoped secrets. Use
  the `account` scope for secrets that don't change per-user, like a third-party
  API key.


  A `user` scoped secret is accessible by the app backend and one specific
  Dashboard user. Use the `user` scope for per-user secrets like per-user OAuth
  tokens, where different users might have different permissions.


  Related guide: [Store data between page
  reloads](https://docs.stripe.com/stripe-apps/store-auth-data-custom-objects)
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  deleted:
    description: If true, indicates that this secret has been deleted
    type: boolean
  expires_at:
    description: >-
      The Unix timestamp for the expiry time of the secret, after which the
      secret deletes.
    format: unix-time
    nullable: true
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  name:
    description: A name for the secret that's unique within the scope.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - apps.secret
    type: string
  payload:
    description: The plaintext secret value to be stored.
    maxLength: 5000
    nullable: true
    type: string
  scope:
    $ref: ./secret_service_resource_scope.yaml
required:
  - created
  - id
  - livemode
  - name
  - object
  - scope
title: Secret
type: object
x-expandableFields:
  - scope
x-resourceId: apps.secret
