description: ''
properties:
  brand:
    description: >-
      Card brand. Can be `amex`, `cartes_bancaires`, `diners`, `discover`,
      `eftpos_au`, `jcb`, `link`, `mastercard`, `unionpay`, `visa` or `unknown`.
    maxLength: 5000
    type: string
  checks:
    anyOf:
      - $ref: ./payment_method_card_checks.yaml
    description: Checks on Card address and CVC if provided.
    nullable: true
  country:
    description: >-
      Two-letter ISO code representing the country of the card. You could use
      this attribute to get a sense of the international breakdown of cards
      you've collected.
    maxLength: 5000
    nullable: true
    type: string
  display_brand:
    description: >-
      The brand to use when displaying the card, this accounts for customer's
      brand choice on dual-branded cards. Can be `american_express`,
      `cartes_bancaires`, `diners_club`, `discover`, `eftpos_australia`,
      `interac`, `jcb`, `mastercard`, `union_pay`, `visa`, or `other` and may
      contain more values in the future.
    maxLength: 5000
    nullable: true
    type: string
  exp_month:
    description: Two-digit number representing the card's expiration month.
    type: integer
  exp_year:
    description: Four-digit number representing the card's expiration year.
    type: integer
  fingerprint:
    description: >-
      Uniquely identifies this particular card number. You can use this
      attribute to check whether two customers who’ve signed up with you are
      using the same card number, for example. For payment methods that tokenize
      card information (Apple Pay, Google Pay), the tokenized number might be
      provided instead of the underlying card number.


      *As of May 1, 2021, card fingerprint in India for Connect changed to allow
      two fingerprints for the same card---one for India and one for the rest of
      the world.*
    maxLength: 5000
    nullable: true
    type: string
  funding:
    description: Card funding type. Can be `credit`, `debit`, `prepaid`, or `unknown`.
    maxLength: 5000
    type: string
  generated_from:
    anyOf:
      - $ref: ./payment_method_card_generated_card.yaml
    description: Details of the original PaymentMethod that created this object.
    nullable: true
  last4:
    description: The last four digits of the card.
    maxLength: 5000
    type: string
  networks:
    anyOf:
      - $ref: ./networks.yaml
    description: >-
      Contains information about card networks that can be used to process the
      payment.
    nullable: true
  regulated_status:
    description: Status of a card based on the card issuer.
    enum:
      - regulated
      - unregulated
    nullable: true
    type: string
  three_d_secure_usage:
    anyOf:
      - $ref: ./three_d_secure_usage.yaml
    description: >-
      Contains details on how this Card may be used for 3D Secure
      authentication.
    nullable: true
  wallet:
    anyOf:
      - $ref: ./payment_method_card_wallet.yaml
    description: >-
      If this Card is part of a card wallet, this contains the details of the
      card wallet.
    nullable: true
required:
  - brand
  - exp_month
  - exp_year
  - funding
  - last4
title: payment_method_card
type: object
x-expandableFields:
  - checks
  - generated_from
  - networks
  - three_d_secure_usage
  - wallet
