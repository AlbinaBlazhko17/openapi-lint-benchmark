description: >-
  A billing meter event summary represents an aggregated view of a customer's
  billing meter events within a specified timeframe. It indicates how much

  usage was accrued by a customer for that period.


  Note: Meters events are aggregated asynchronously so the meter event summaries
  provide an eventually consistent view of the reported usage.
properties:
  aggregated_value:
    description: >-
      Aggregated value of all the events within `start_time` (inclusive) and
      `end_time` (inclusive). The aggregation strategy is defined on meter via
      `default_aggregation`.
    type: number
  end_time:
    description: >-
      End timestamp for this event summary (exclusive). Must be aligned with
      minute boundaries.
    format: unix-time
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  meter:
    description: The meter associated with this event summary.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - billing.meter_event_summary
    type: string
  start_time:
    description: >-
      Start timestamp for this event summary (inclusive). Must be aligned with
      minute boundaries.
    format: unix-time
    type: integer
required:
  - aggregated_value
  - end_time
  - id
  - livemode
  - meter
  - object
  - start_time
title: Billing Meter Event Summary
type: object
x-expandableFields: []
x-resourceId: billing.meter_event_summary
