description: ''
properties:
  billing_cycle_anchor:
    description: >-
      Determines the value to use for the billing cycle anchor on subscription
      updates. Valid values are `now` or `unchanged`, and the default value is
      `unchanged`. Setting the value to `now` resets the subscription's billing
      cycle anchor to the current time (in UTC). For more information, see the
      billing cycle
      [documentation](https://docs.stripe.com/billing/subscriptions/billing-cycle).
    enum:
      - now
      - unchanged
    nullable: true
    type: string
  default_allowed_updates:
    description: >-
      The types of subscription updates that are supported for items listed in
      the `products` attribute. When empty, subscriptions are not updateable.
    items:
      enum:
        - price
        - promotion_code
        - quantity
      type: string
    type: array
  enabled:
    description: Whether the feature is enabled.
    type: boolean
  products:
    description: The list of up to 10 products that support subscription updates.
    items:
      $ref: ./portal_subscription_update_product.yaml
    nullable: true
    type: array
  proration_behavior:
    description: >-
      Determines how to handle prorations resulting from subscription updates.
      Valid values are `none`, `create_prorations`, and `always_invoice`.
      Defaults to a value of `none` if you don't set it during creation.
    enum:
      - always_invoice
      - create_prorations
      - none
    type: string
  schedule_at_period_end:
    $ref: ./portal_resource_schedule_update_at_period_end.yaml
  trial_update_behavior:
    description: >-
      Determines how handle updates to trialing subscriptions. Valid values are
      `end_trial` and `continue_trial`. Defaults to a value of `end_trial` if
      you don't set it during creation.
    enum:
      - continue_trial
      - end_trial
    type: string
required:
  - default_allowed_updates
  - enabled
  - proration_behavior
  - schedule_at_period_end
  - trial_update_behavior
title: PortalSubscriptionUpdate
type: object
x-expandableFields:
  - products
  - schedule_at_period_end
