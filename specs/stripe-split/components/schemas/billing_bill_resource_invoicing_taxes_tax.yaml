description: ''
properties:
  amount:
    description: The amount of the tax, in cents (or local equivalent).
    type: integer
  tax_behavior:
    description: Whether this tax is inclusive or exclusive.
    enum:
      - exclusive
      - inclusive
    type: string
  tax_rate_details:
    anyOf:
      - $ref: ./billing_bill_resource_invoicing_taxes_tax_rate_details.yaml
    description: >-
      Additional details about the tax rate. Only present when `type` is
      `tax_rate_details`.
    nullable: true
  taxability_reason:
    description: >-
      The reasoning behind this tax, for example, if the product is tax exempt.
      The possible values for this field may be extended as new tax rules are
      supported.
    enum:
      - customer_exempt
      - not_available
      - not_collecting
      - not_subject_to_tax
      - not_supported
      - portion_product_exempt
      - portion_reduced_rated
      - portion_standard_rated
      - product_exempt
      - product_exempt_holiday
      - proportionally_rated
      - reduced_rated
      - reverse_charge
      - standard_rated
      - taxable_basis_reduced
      - zero_rated
    type: string
    x-stripeBypassValidation: true
  taxable_amount:
    description: The amount on which tax is calculated, in cents (or local equivalent).
    nullable: true
    type: integer
  type:
    description: The type of tax information.
    enum:
      - tax_rate_details
    type: string
required:
  - amount
  - tax_behavior
  - taxability_reason
  - type
title: BillingBillResourceInvoicingTaxesTax
type: object
