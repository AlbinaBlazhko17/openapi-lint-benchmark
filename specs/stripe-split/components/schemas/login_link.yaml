description: >-
  Login Links are single-use URLs that takes an Express account to the login
  page for their Stripe dashboard.

  A Login Link differs from an [Account
  Link](https://docs.stripe.com/api/account_links) in that it takes the user
  directly to their [Express dashboard for the specified
  account](https://docs.stripe.com/connect/integrate-express-dashboard#create-login-link)
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - login_link
    type: string
  url:
    description: The URL for the login link.
    maxLength: 5000
    type: string
required:
  - created
  - object
  - url
title: Login Link
type: object
x-expandableFields: []
x-resourceId: login_link
