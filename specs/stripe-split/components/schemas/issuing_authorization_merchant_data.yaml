description: ''
properties:
  category:
    description: >-
      A categorization of the seller's type of business. See our [merchant
      categories guide](https://docs.stripe.com/issuing/merchant-categories) for
      a list of possible values.
    maxLength: 5000
    type: string
  category_code:
    description: The merchant category code for the seller’s business
    maxLength: 5000
    type: string
  city:
    description: City where the seller is located
    maxLength: 5000
    nullable: true
    type: string
  country:
    description: Country where the seller is located
    maxLength: 5000
    nullable: true
    type: string
  name:
    description: Name of the seller
    maxLength: 5000
    nullable: true
    type: string
  network_id:
    description: >-
      Identifier assigned to the seller by the card network. Different card
      networks may assign different network_id fields to the same merchant.
    maxLength: 5000
    type: string
  postal_code:
    description: Postal code where the seller is located
    maxLength: 5000
    nullable: true
    type: string
  state:
    description: State where the seller is located
    maxLength: 5000
    nullable: true
    type: string
  tax_id:
    description: >-
      The seller's tax identification number. Currently populated for French
      merchants only.
    maxLength: 5000
    nullable: true
    type: string
  terminal_id:
    description: An ID assigned by the seller to the location of the sale.
    maxLength: 5000
    nullable: true
    type: string
  url:
    description: URL provided by the merchant on a 3DS request
    maxLength: 5000
    nullable: true
    type: string
required:
  - category
  - category_code
  - network_id
title: IssuingAuthorizationMerchantData
type: object
x-expandableFields: []
