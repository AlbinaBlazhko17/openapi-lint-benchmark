description: |-
  A SetupAttempt describes one attempted confirmation of a SetupIntent,
  whether that confirmation is successful or unsuccessful. You can use
  SetupAttempts to inspect details of a specific attempt at setting up a
  payment method using a SetupIntent.
properties:
  application:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application.yaml
    description: >-
      The value of
      [application](https://docs.stripe.com/api/setup_intents/object#setup_intent_object-application)
      on the SetupIntent at the time of this confirmation.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./application.yaml
  attach_to_self:
    description: >-
      If present, the SetupIntent's payment method will be attached to the
      in-context Stripe Account.


      It can only be used for this Stripe Account’s own money movement flows
      like InboundTransfer and OutboundTransfers. It cannot be set to true when
      setting up a PaymentMethod for a Customer, and defaults to false when
      attaching a PaymentMethod to a Customer.
    type: boolean
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: >-
      The value of
      [customer](https://docs.stripe.com/api/setup_intents/object#setup_intent_object-customer)
      on the SetupIntent at the time of this confirmation.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: >-
      The value of
      [customer_account](https://docs.stripe.com/api/setup_intents/object#setup_intent_object-customer_account)
      on the SetupIntent at the time of this confirmation.
    maxLength: 5000
    nullable: true
    type: string
  flow_directions:
    description: >-
      Indicates the directions of money movement for which this payment method
      is intended to be used.


      Include `inbound` if you intend to use the payment method as the origin to
      pull funds from. Include `outbound` if you intend to use the payment
      method as the destination to send funds to. You can include both if you
      intend to use the payment method for both purposes.
    items:
      enum:
        - inbound
        - outbound
      type: string
    nullable: true
    type: array
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - setup_attempt
    type: string
  on_behalf_of:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The value of
      [on_behalf_of](https://docs.stripe.com/api/setup_intents/object#setup_intent_object-on_behalf_of)
      on the SetupIntent at the time of this confirmation.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: ID of the payment method used with this SetupAttempt.
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  payment_method_details:
    $ref: ./setup_attempt_payment_method_details.yaml
  setup_error:
    anyOf:
      - $ref: ./api_errors.yaml
    description: >-
      The error encountered during this attempt to confirm the SetupIntent, if
      any.
    nullable: true
  setup_intent:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./setup_intent.yaml
    description: ID of the SetupIntent that this attempt belongs to.
    x-expansionResources:
      oneOf:
        - $ref: ./setup_intent.yaml
  status:
    description: >-
      Status of this SetupAttempt, one of `requires_confirmation`,
      `requires_action`, `processing`, `succeeded`, `failed`, or `abandoned`.
    maxLength: 5000
    type: string
  usage:
    description: >-
      The value of
      [usage](https://docs.stripe.com/api/setup_intents/object#setup_intent_object-usage)
      on the SetupIntent at the time of this confirmation, one of `off_session`
      or `on_session`.
    maxLength: 5000
    type: string
required:
  - created
  - id
  - livemode
  - object
  - payment_method
  - payment_method_details
  - setup_intent
  - status
  - usage
title: SetupAttempt
type: object
x-expandableFields:
  - application
  - customer
  - on_behalf_of
  - payment_method
  - payment_method_details
  - setup_error
  - setup_intent
x-resourceId: setup_attempt
