description: >-
  As a [card issuer](https://docs.stripe.com/issuing), you can dispute
  transactions that the cardholder does not recognize, suspects to be
  fraudulent, or has other issues with.


  Related guide: [Issuing
  disputes](https://docs.stripe.com/issuing/purchases/disputes)
properties:
  amount:
    description: >-
      Disputed amount in the card's currency and in the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal). Usually the amount
      of the `transaction`, but can differ (usually because of currency
      fluctuation).
    type: integer
  balance_transactions:
    description: List of balance transactions associated with the dispute.
    items:
      $ref: ./balance_transaction.yaml
    nullable: true
    type: array
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: The currency the `transaction` was made in.
    format: currency
    type: string
  evidence:
    $ref: ./issuing_dispute_evidence.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  loss_reason:
    description: >-
      The enum that describes the dispute loss outcome. If the dispute is not
      lost, this field will be absent. New enum values may be added in the
      future, so be sure to handle unknown values.
    enum:
      - cardholder_authentication_issuer_liability
      - eci5_token_transaction_with_tavv
      - excess_disputes_in_timeframe
      - has_not_met_the_minimum_dispute_amount_requirements
      - invalid_duplicate_dispute
      - invalid_incorrect_amount_dispute
      - invalid_no_authorization
      - invalid_use_of_disputes
      - merchandise_delivered_or_shipped
      - merchandise_or_service_as_described
      - not_cancelled
      - other
      - refund_issued
      - submitted_beyond_allowable_time_limit
      - transaction_3ds_required
      - transaction_approved_after_prior_fraud_dispute
      - transaction_authorized
      - transaction_electronically_read
      - transaction_qualifies_for_visa_easy_payment_service
      - transaction_unattended
    type: string
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - issuing.dispute
    type: string
  status:
    description: Current status of the dispute.
    enum:
      - expired
      - lost
      - submitted
      - unsubmitted
      - won
    type: string
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./issuing.transaction.yaml
    description: The transaction being disputed.
    x-expansionResources:
      oneOf:
        - $ref: ./issuing.transaction.yaml
  treasury:
    anyOf:
      - $ref: ./issuing_dispute_treasury.yaml
    description: >-
      [Treasury](https://docs.stripe.com/api/treasury) details related to this
      dispute if it was created on a
      [FinancialAccount](https://docs.stripe.com/api/treasury/financial_accounts)
    nullable: true
required:
  - amount
  - created
  - currency
  - evidence
  - id
  - livemode
  - metadata
  - object
  - status
  - transaction
title: Dispute
type: object
x-expandableFields:
  - balance_transactions
  - evidence
  - transaction
  - treasury
x-resourceId: issuing.dispute
