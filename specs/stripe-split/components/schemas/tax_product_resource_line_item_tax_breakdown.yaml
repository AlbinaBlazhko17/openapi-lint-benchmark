description: ''
properties:
  amount:
    description: >-
      The amount of tax, in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
  jurisdiction:
    $ref: ./tax_product_resource_jurisdiction.yaml
  sourcing:
    description: >-
      Indicates whether the jurisdiction was determined by the origin
      (merchant's address) or destination (customer's address).
    enum:
      - destination
      - origin
    type: string
    x-stripeBypassValidation: true
  tax_rate_details:
    anyOf:
      - $ref: ./tax_product_resource_line_item_tax_rate_details.yaml
    description: >-
      Details regarding the rate for this tax. This field will be `null` when
      the tax is not imposed, for example if the product is exempt from tax.
    nullable: true
  taxability_reason:
    description: >-
      The reasoning behind this tax, for example, if the product is tax exempt.
      The possible values for this field may be extended as new tax rules are
      supported.
    enum:
      - customer_exempt
      - not_collecting
      - not_subject_to_tax
      - not_supported
      - portion_product_exempt
      - portion_reduced_rated
      - portion_standard_rated
      - product_exempt
      - product_exempt_holiday
      - proportionally_rated
      - reduced_rated
      - reverse_charge
      - standard_rated
      - taxable_basis_reduced
      - zero_rated
    type: string
  taxable_amount:
    description: >-
      The amount on which tax is calculated, in the [smallest currency
      unit](https://docs.stripe.com/currencies#minor-units).
    type: integer
required:
  - amount
  - jurisdiction
  - sourcing
  - taxability_reason
  - taxable_amount
title: TaxProductResourceLineItemTaxBreakdown
type: object
x-expandableFields:
  - jurisdiction
  - tax_rate_details
