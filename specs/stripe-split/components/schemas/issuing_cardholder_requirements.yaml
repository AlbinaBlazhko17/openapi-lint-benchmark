description: ''
properties:
  disabled_reason:
    description: >-
      If `disabled_reason` is present, all cards will decline authorizations
      with `cardholder_verification_required` reason.
    enum:
      - listed
      - rejected.listed
      - requirements.past_due
      - under_review
    nullable: true
    type: string
  past_due:
    description: >-
      Array of fields that need to be collected in order to verify and re-enable
      the cardholder.
    items:
      enum:
        - company.tax_id
        - individual.card_issuing.user_terms_acceptance.date
        - individual.card_issuing.user_terms_acceptance.ip
        - individual.dob.day
        - individual.dob.month
        - individual.dob.year
        - individual.first_name
        - individual.last_name
        - individual.verification.document
      type: string
      x-stripeBypassValidation: true
    nullable: true
    type: array
title: IssuingCardholderRequirements
type: object
x-expandableFields: []
