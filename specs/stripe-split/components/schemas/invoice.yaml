description: >-
  Invoices are statements of amounts owed by a customer, and are either

  generated one-off, or generated periodically from a subscription.


  They contain [invoice items](https://api.stripe.com#invoiceitems), and
  proration adjustments

  that may be caused by subscription upgrades/downgrades (if necessary).


  If your invoice is configured to be billed through automatic charges,

  Stripe automatically finalizes your invoice and attempts payment. Note

  that finalizing the invoice,

  [when
  automatic](https://docs.stripe.com/invoicing/integration/automatic-advancement-collection),
  does

  not happen immediately as the invoice is created. Stripe waits

  until one hour after the last webhook was successfully sent (or the last

  webhook timed out after failing). If you (and the platforms you may have

  connected to) have no webhooks configured, Stripe waits one hour after

  creation to finalize the invoice.


  If your invoice is configured to be billed by sending an email, then based on
  your

  [email settings](https://dashboard.stripe.com/account/billing/automatic),

  Stripe will email the invoice to your customer and await payment. These

  emails can contain a link to a hosted page to pay the invoice.


  Stripe applies any customer credit on the account before determining the

  amount due for the invoice (i.e., the amount that will be actually

  charged). If the amount due for the invoice is less than Stripe's [minimum
  allowed charge

  per currency](/docs/currencies#minimum-and-maximum-charge-amounts), the

  invoice is automatically marked paid, and we add the amount due to the

  customer's credit balance which is applied to the next invoice.


  More details on the customer's credit balance are

  [here](https://docs.stripe.com/billing/customer/balance).


  Related guide: [Send invoices to
  customers](https://docs.stripe.com/billing/invoices/sending)
properties:
  account_country:
    description: >-
      The country of the business associated with this invoice, most often the
      business creating the invoice.
    maxLength: 5000
    nullable: true
    type: string
  account_name:
    description: >-
      The public name of the business associated with this invoice, most often
      the business creating the invoice.
    maxLength: 5000
    nullable: true
    type: string
  account_tax_ids:
    description: >-
      The account tax IDs associated with the invoice. Only editable when the
      invoice is a draft.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./tax_id.yaml
        - $ref: ./deleted_tax_id.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./tax_id.yaml
          - $ref: ./deleted_tax_id.yaml
    nullable: true
    type: array
  amount_due:
    description: >-
      Final amount due at this time for this invoice. If the invoice's total is
      smaller than the minimum charge amount, for example, or if there is
      account credit that can be applied to the invoice, the `amount_due` may be
      0. If there is a positive `starting_balance` for the invoice (the customer
      owes money), the `amount_due` will also take that into account. The charge
      that gets generated for the invoice will be for the amount specified in
      `amount_due`.
    type: integer
  amount_overpaid:
    description: >-
      Amount that was overpaid on the invoice. The amount overpaid is credited
      to the customer's credit balance.
    type: integer
  amount_paid:
    description: The amount, in cents (or local equivalent), that was paid.
    type: integer
  amount_paid_off_stripe:
    description: >-
      Amount, in cents (or local equivalent), that was paid on the invoice
      outside of Stripe.
    type: integer
  amount_remaining:
    description: >-
      The difference between amount_due and amount_paid, in cents (or local
      equivalent).
    type: integer
  amount_shipping:
    description: This is the sum of all the shipping amounts.
    type: integer
  application:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application.yaml
      - $ref: ./deleted_application.yaml
    description: ID of the Connect Application that created the invoice.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./application.yaml
        - $ref: ./deleted_application.yaml
  attempt_count:
    description: >-
      Number of payment attempts made for this invoice, from the perspective of
      the payment retry schedule. Any payment attempt counts as the first
      attempt, and subsequently only automatic retries increment the attempt
      count. In other words, manual payment attempts after the first attempt do
      not affect the retry schedule. If a failure is returned with a
      non-retryable return code, the invoice can no longer be retried unless a
      new payment method is obtained. Retries will continue to be scheduled, and
      attempt_count will continue to increment, but retries will only be
      executed if a new payment method is obtained.
    type: integer
  attempted:
    description: >-
      Whether an attempt has been made to pay the invoice. An invoice is not
      attempted until 1 hour after the `invoice.created` webhook, for example,
      so you might not want to display that invoice as unpaid to your users.
    type: boolean
  auto_advance:
    description: >-
      Controls whether Stripe performs [automatic
      collection](https://docs.stripe.com/invoicing/integration/automatic-advancement-collection)
      of the invoice. If `false`, the invoice's state doesn't automatically
      advance without an explicit action.
    type: boolean
  automatic_tax:
    $ref: ./automatic_tax.yaml
  automatically_finalizes_at:
    description: >-
      The time when this invoice is currently scheduled to be automatically
      finalized. The field will be `null` if the invoice is not scheduled to
      finalize in the future. If the invoice is not in the draft state, this
      field will always be `null` - see `finalized_at` for the time when an
      already-finalized invoice was finalized.
    format: unix-time
    nullable: true
    type: integer
  billing_reason:
    description: >-
      Indicates the reason why the invoice was created.


      * `manual`: Unrelated to a subscription, for example, created via the
      invoice editor.

      * `subscription`: No longer in use. Applies to subscriptions from before
      May 2018 where no distinction was made between updates, cycles, and
      thresholds.

      * `subscription_create`: A new subscription was created.

      * `subscription_cycle`: A subscription advanced into a new period.

      * `subscription_threshold`: A subscription reached a billing threshold.

      * `subscription_update`: A subscription was updated.

      * `upcoming`: Reserved for upcoming invoices created through the Create
      Preview Invoice API or when an `invoice.upcoming` event is generated for
      an upcoming invoice on a subscription.
    enum:
      - automatic_pending_invoice_item_invoice
      - manual
      - quote_accept
      - subscription
      - subscription_create
      - subscription_cycle
      - subscription_threshold
      - subscription_update
      - upcoming
    nullable: true
    type: string
  collection_method:
    description: >-
      Either `charge_automatically`, or `send_invoice`. When charging
      automatically, Stripe will attempt to pay this invoice using the default
      source attached to the customer. When sending an invoice, Stripe will
      email this invoice to the customer with payment instructions.
    enum:
      - charge_automatically
      - send_invoice
    type: string
  confirmation_secret:
    anyOf:
      - $ref: ./invoices_resource_confirmation_secret.yaml
    description: >-
      The confirmation secret associated with this invoice. Currently, this
      contains the client_secret of the PaymentIntent that Stripe creates during
      invoice finalization.
    nullable: true
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  custom_fields:
    description: Custom fields displayed on the invoice.
    items:
      $ref: ./invoice_setting_custom_field.yaml
    nullable: true
    type: array
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: The ID of the customer to bill.
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: The ID of the account representing the customer to bill.
    maxLength: 5000
    nullable: true
    type: string
  customer_address:
    anyOf:
      - $ref: ./address.yaml
    description: >-
      The customer's address. Until the invoice is finalized, this field will
      equal `customer.address`. Once the invoice is finalized, this field will
      no longer be updated.
    nullable: true
  customer_email:
    description: >-
      The customer's email. Until the invoice is finalized, this field will
      equal `customer.email`. Once the invoice is finalized, this field will no
      longer be updated.
    maxLength: 5000
    nullable: true
    type: string
  customer_name:
    description: >-
      The customer's name. Until the invoice is finalized, this field will equal
      `customer.name`. Once the invoice is finalized, this field will no longer
      be updated.
    maxLength: 5000
    nullable: true
    type: string
  customer_phone:
    description: >-
      The customer's phone number. Until the invoice is finalized, this field
      will equal `customer.phone`. Once the invoice is finalized, this field
      will no longer be updated.
    maxLength: 5000
    nullable: true
    type: string
  customer_shipping:
    anyOf:
      - $ref: ./shipping.yaml
    description: >-
      The customer's shipping information. Until the invoice is finalized, this
      field will equal `customer.shipping`. Once the invoice is finalized, this
      field will no longer be updated.
    nullable: true
  customer_tax_exempt:
    description: >-
      The customer's tax exempt status. Until the invoice is finalized, this
      field will equal `customer.tax_exempt`. Once the invoice is finalized,
      this field will no longer be updated.
    enum:
      - exempt
      - none
      - reverse
    nullable: true
    type: string
  customer_tax_ids:
    description: >-
      The customer's tax IDs. Until the invoice is finalized, this field will
      contain the same tax IDs as `customer.tax_ids`. Once the invoice is
      finalized, this field will no longer be updated.
    items:
      $ref: ./invoices_resource_invoice_tax_id.yaml
    nullable: true
    type: array
  default_payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: >-
      ID of the default payment method for the invoice. It must belong to the
      customer associated with the invoice. If not set, defaults to the
      subscription's default payment method, if any, or to the default payment
      method in the customer's invoice settings.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  default_source:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./bank_account.yaml
      - $ref: ./card.yaml
      - $ref: ./source.yaml
    description: >-
      ID of the default payment source for the invoice. It must belong to the
      customer associated with the invoice and be in a chargeable state. If not
      set, defaults to the subscription's default source, if any, or to the
      customer's default source.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./bank_account.yaml
        - $ref: ./card.yaml
        - $ref: ./source.yaml
    x-stripeBypassValidation: true
  default_tax_rates:
    description: The tax rates applied to this invoice, if any.
    items:
      $ref: ./tax_rate.yaml
    type: array
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users. Referenced as 'memo' in the Dashboard.
    maxLength: 5000
    nullable: true
    type: string
  discounts:
    description: >-
      The discounts applied to the invoice. Line item discounts are applied
      before invoice discounts. Use `expand[]=discounts` to expand each
      discount.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./discount.yaml
        - $ref: ./deleted_discount.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./discount.yaml
          - $ref: ./deleted_discount.yaml
    type: array
  due_date:
    description: >-
      The date on which payment for this invoice is due. This value will be
      `null` for invoices where `collection_method=charge_automatically`.
    format: unix-time
    nullable: true
    type: integer
  effective_at:
    description: >-
      The date when this invoice is in effect. Same as `finalized_at` unless
      overwritten. When defined, this value replaces the system-generated 'Date
      of issue' printed on the invoice PDF and receipt.
    format: unix-time
    nullable: true
    type: integer
  ending_balance:
    description: >-
      Ending customer balance after the invoice is finalized. Invoices are
      finalized approximately an hour after successful webhook delivery or when
      payment collection is attempted for the invoice. If the invoice has not
      been finalized yet, this will be null.
    nullable: true
    type: integer
  footer:
    description: Footer displayed on the invoice.
    maxLength: 5000
    nullable: true
    type: string
  from_invoice:
    anyOf:
      - $ref: ./invoices_resource_from_invoice.yaml
    description: >-
      Details of the invoice that was cloned. See the [revision
      documentation](https://docs.stripe.com/invoicing/invoice-revisions) for
      more details.
    nullable: true
  hosted_invoice_url:
    description: >-
      The URL for the hosted invoice page, which allows customers to view and
      pay an invoice. If the invoice has not been finalized yet, this will be
      null.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: >-
      Unique identifier for the object. For preview invoices created using the
      [create preview](https://stripe.com/docs/api/invoices/create_preview)
      endpoint, this id will be prefixed with `upcoming_in`.
    maxLength: 5000
    type: string
  invoice_pdf:
    description: >-
      The link to download the PDF for the invoice. If the invoice has not been
      finalized yet, this will be null.
    maxLength: 5000
    nullable: true
    type: string
  issuer:
    $ref: ./connect_account_reference.yaml
  last_finalization_error:
    anyOf:
      - $ref: ./api_errors.yaml
    description: >-
      The error encountered during the previous attempt to finalize the invoice.
      This field is cleared when the invoice is successfully finalized.
    nullable: true
  latest_revision:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./invoice.yaml
    description: The ID of the most recent non-draft revision of this invoice
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./invoice.yaml
  lines:
    description: >-
      The individual line items that make up the invoice. `lines` is sorted as
      follows: (1) pending invoice items (including prorations) in reverse
      chronological order, (2) subscription items in reverse chronological
      order, and (3) invoice items added after invoice creation in chronological
      order.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./line_item.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: InvoiceLinesList
    type: object
    x-expandableFields:
      - data
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  next_payment_attempt:
    description: >-
      The time at which payment will next be attempted. This value will be
      `null` for invoices where `collection_method=send_invoice`.
    format: unix-time
    nullable: true
    type: integer
  number:
    description: >-
      A unique, identifying string that appears on emails sent to the customer
      for this invoice. This starts with the customer's unique invoice_prefix if
      it is specified.
    maxLength: 5000
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - invoice
    type: string
  on_behalf_of:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account (if any) for which the funds of the invoice payment are
      intended. If set, the invoice will be presented with the branding and
      support information of the specified account. See the [Invoices with
      Connect](https://docs.stripe.com/billing/invoices/connect) documentation
      for details.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  parent:
    anyOf:
      - $ref: ./billing_bill_resource_invoicing_parents_invoice_parent.yaml
    description: The parent that generated this invoice
    nullable: true
  payment_settings:
    $ref: ./invoices_payment_settings.yaml
  payments:
    description: >-
      Payments for this invoice. Use [invoice payment](/api/invoice-payment) to
      get more details.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./invoice_payment.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: InvoicesPaymentsListInvoicePayments
    type: object
    x-expandableFields:
      - data
  period_end:
    description: >-
      The latest timestamp at which invoice items can be associated with this
      invoice. Use the [line item
      period](/api/invoices/line_item#invoice_line_item_object-period) to get
      the service period for each price.
    format: unix-time
    type: integer
  period_start:
    description: >-
      The earliest timestamp at which invoice items can be associated with this
      invoice. Use the [line item
      period](/api/invoices/line_item#invoice_line_item_object-period) to get
      the service period for each price.
    format: unix-time
    type: integer
  post_payment_credit_notes_amount:
    description: Total amount of all post-payment credit notes issued for this invoice.
    type: integer
  pre_payment_credit_notes_amount:
    description: Total amount of all pre-payment credit notes issued for this invoice.
    type: integer
  receipt_number:
    description: >-
      This is the transaction number that appears on email receipts sent for
      this invoice.
    maxLength: 5000
    nullable: true
    type: string
  rendering:
    anyOf:
      - $ref: ./invoices_resource_invoice_rendering.yaml
    description: >-
      The rendering-related settings that control how the invoice is displayed
      on customer-facing surfaces such as PDF and Hosted Invoice Page.
    nullable: true
  shipping_cost:
    anyOf:
      - $ref: ./invoices_resource_shipping_cost.yaml
    description: >-
      The details of the cost of shipping, including the ShippingRate applied on
      the invoice.
    nullable: true
  shipping_details:
    anyOf:
      - $ref: ./shipping.yaml
    description: >-
      Shipping details for the invoice. The Invoice PDF will use the
      `shipping_details` value if it is set, otherwise the PDF will render the
      shipping address from the customer.
    nullable: true
  starting_balance:
    description: >-
      Starting customer balance before the invoice is finalized. If the invoice
      has not been finalized yet, this will be the current customer balance. For
      revision invoices, this also includes any customer balance that was
      applied to the original invoice.
    type: integer
  statement_descriptor:
    description: >-
      Extra information about an invoice for the customer's credit card
      statement.
    maxLength: 5000
    nullable: true
    type: string
  status:
    description: >-
      The status of the invoice, one of `draft`, `open`, `paid`,
      `uncollectible`, or `void`. [Learn
      more](https://docs.stripe.com/billing/invoices/workflow#workflow-overview)
    enum:
      - draft
      - open
      - paid
      - uncollectible
      - void
    nullable: true
    type: string
    x-stripeBypassValidation: true
  status_transitions:
    $ref: ./invoices_resource_status_transitions.yaml
  subtotal:
    description: >-
      Total of all subscriptions, invoice items, and prorations on the invoice
      before any invoice level discount or exclusive tax is applied. Item
      discounts are already incorporated
    type: integer
  subtotal_excluding_tax:
    description: >-
      The integer amount in cents (or local equivalent) representing the
      subtotal of the invoice before any invoice level discount or tax is
      applied. Item discounts are already incorporated
    nullable: true
    type: integer
  test_clock:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./test_helpers.test_clock.yaml
    description: ID of the test clock this invoice belongs to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./test_helpers.test_clock.yaml
  threshold_reason:
    $ref: ./invoice_threshold_reason.yaml
  total:
    description: Total after discounts and taxes.
    type: integer
  total_discount_amounts:
    description: The aggregate amounts calculated per discount across all line items.
    items:
      $ref: ./discounts_resource_discount_amount.yaml
    nullable: true
    type: array
  total_excluding_tax:
    description: >-
      The integer amount in cents (or local equivalent) representing the total
      amount of the invoice including all discounts but excluding all tax.
    nullable: true
    type: integer
  total_pretax_credit_amounts:
    description: >-
      Contains pretax credit amounts (ex: discount, credit grants, etc) that
      apply to this invoice. This is a combined list of
      total_pretax_credit_amounts across all invoice line items.
    items:
      $ref: ./invoices_resource_pretax_credit_amount.yaml
    nullable: true
    type: array
  total_taxes:
    description: The aggregate tax information of all line items.
    items:
      $ref: ./billing_bill_resource_invoicing_taxes_tax.yaml
    nullable: true
    type: array
  webhooks_delivered_at:
    description: >-
      Invoices are automatically paid or sent 1 hour after webhooks are
      delivered, or until all webhook delivery attempts have [been
      exhausted](https://docs.stripe.com/billing/webhooks#understand). This
      field tracks the time when webhooks for this invoice were successfully
      delivered. If the invoice had no webhooks to deliver, this will be set
      while the invoice is being created.
    format: unix-time
    nullable: true
    type: integer
required:
  - amount_due
  - amount_overpaid
  - amount_paid
  - amount_paid_off_stripe
  - amount_remaining
  - amount_shipping
  - attempt_count
  - attempted
  - auto_advance
  - automatic_tax
  - collection_method
  - created
  - currency
  - customer
  - default_tax_rates
  - discounts
  - id
  - issuer
  - lines
  - livemode
  - object
  - payment_settings
  - period_end
  - period_start
  - post_payment_credit_notes_amount
  - pre_payment_credit_notes_amount
  - starting_balance
  - status_transitions
  - subtotal
  - total
title: Invoice
type: object
