description: ''
properties:
  status:
    description: >-
      Possible values are `pending`, `supported`, and `unsupported`. When
      `payout.status` is `pending` or `in_transit`, this will be `pending`. When
      the payout transitions to `paid`, `failed`, or `canceled`, this status
      will become `supported` or `unsupported` shortly after in most cases. In
      some cases, this may appear as `pending` for up to 10 days after
      `arrival_date` until transitioning to `supported` or `unsupported`.
    maxLength: 5000
    type: string
  value:
    description: The trace ID value if `trace_id.status` is `supported`, otherwise `nil`.
    maxLength: 5000
    nullable: true
    type: string
required:
  - status
title: PayoutsTraceID
type: object
x-expandableFields: []
