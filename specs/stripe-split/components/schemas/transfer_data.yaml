description: ''
properties:
  amount:
    description: >-
      The amount transferred to the destination account. This transfer will
      occur automatically after the payment succeeds. If no amount is specified,
      by default the entire payment amount is transferred to the destination
      account.
       The amount must be less than or equal to the [amount](https://docs.stripe.com/api/payment_intents/object#payment_intent_object-amount), and must be a positive integer
       representing how much to transfer in the smallest currency unit (e.g., 100 cents to charge $1.00).
    type: integer
  description:
    description: >-
      An arbitrary string attached to the transfer. Often useful for displaying
      to users.
    maxLength: 5000
    type: string
  destination:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account (if any) that the payment is attributed to for tax reporting,
      and where funds from the payment are transferred to after payment success.
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  payment_data:
    $ref: ./payment_data.yaml
required:
  - destination
title: transfer_data
type: object
x-expandableFields:
  - destination
  - payment_data
