description: ''
properties:
  data:
    description: >-
      The raw data string used to generate QR code, it should be used together
      with QR code library.
    maxLength: 5000
    type: string
  hosted_instructions_url:
    description: >-
      The URL to the hosted PromptPay instructions page, which allows customers
      to view the PromptPay QR code.
    maxLength: 5000
    type: string
  image_url_png:
    description: >-
      The PNG path used to render the QR code, can be used as the source in an
      HTML img tag
    maxLength: 5000
    type: string
  image_url_svg:
    description: >-
      The SVG path used to render the QR code, can be used as the source in an
      HTML img tag
    maxLength: 5000
    type: string
required:
  - data
  - hosted_instructions_url
  - image_url_png
  - image_url_svg
