description: Represents an action performed by the reader
properties:
  api_error:
    anyOf:
      - $ref: ./api_errors.yaml
    description: >-
      The reader action failed due to an [API
      error](https://docs.stripe.com/api/errors). Only present when `status` is
      `failed` and the underlying failure was an API error. Avoid parsing the
      `message` field for programmatic logic; use `type` or `code` instead. The
      `message` field is for display to humans only and may be updated at
      anytime. Requires [reader
      version](https://docs.stripe.com/terminal/readers/stripe-reader-s700-s710#reader-software-version)
      2.42 or later. Readers on older versions always return null.
    nullable: true
  collect_inputs:
    $ref: ./terminal_reader_reader_resource_collect_inputs_action.yaml
  collect_payment_method:
    $ref: ./terminal_reader_reader_resource_collect_payment_method_action.yaml
  confirm_payment_intent:
    $ref: ./terminal_reader_reader_resource_confirm_payment_intent_action.yaml
  failure_code:
    description: Failure code, only set if status is `failed`.
    maxLength: 5000
    nullable: true
    type: string
  failure_message:
    description: Detailed failure message, only set if status is `failed`.
    maxLength: 5000
    nullable: true
    type: string
  print_content:
    $ref: ./terminal_reader_reader_resource_print_content.yaml
  process_payment_intent:
    $ref: ./terminal_reader_reader_resource_process_payment_intent_action.yaml
  process_setup_intent:
    $ref: ./terminal_reader_reader_resource_process_setup_intent_action.yaml
  refund_payment:
    $ref: ./terminal_reader_reader_resource_refund_payment_action.yaml
  set_reader_display:
    $ref: ./terminal_reader_reader_resource_set_reader_display_action.yaml
  status:
    description: Status of the action performed by the reader.
    enum:
      - failed
      - in_progress
      - succeeded
    type: string
  type:
    description: Type of action performed by the reader.
    enum:
      - collect_inputs
      - collect_payment_method
      - confirm_payment_intent
      - print_content
      - process_payment_intent
      - process_setup_intent
      - refund_payment
      - set_reader_display
    type: string
    x-stripeBypassValidation: true
required:
  - status
  - type
title: TerminalReaderReaderResourceReaderAction
type: object
x-expandableFields:
  - api_error
  - collect_inputs
  - collect_payment_method
  - confirm_payment_intent
  - print_content
  - process_payment_intent
  - process_setup_intent
  - refund_payment
  - set_reader_display
