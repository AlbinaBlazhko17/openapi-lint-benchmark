description: ''
properties:
  disabled_reason:
    description: If Stripe disabled automatic tax, this enum describes why.
    enum:
      - finalization_requires_location_inputs
      - finalization_system_error
    nullable: true
    type: string
  enabled:
    description: >-
      Whether Stripe automatically computes tax on this invoice. Note that
      incompatible invoice items (invoice items with manually specified [tax
      rates](https://docs.stripe.com/api/tax_rates), negative amounts, or
      `tax_behavior=unspecified`) cannot be added to automatic tax invoices.
    type: boolean
  liability:
    anyOf:
      - $ref: ./connect_account_reference.yaml
    description: >-
      The account that's liable for tax. If set, the business address and tax
      registrations required to perform the tax calculation are loaded from this
      account. The tax transaction is returned in the report of the connected
      account.
    nullable: true
  provider:
    description: The tax provider powering automatic tax.
    maxLength: 5000
    nullable: true
    type: string
  status:
    description: The status of the most recent automated tax calculation for this invoice.
    enum:
      - complete
      - failed
      - requires_location_inputs
    nullable: true
    type: string
required:
  - enabled
title: AutomaticTax
type: object
x-expandableFields:
  - liability
