description: >-
  The Billing customer portal is a Stripe-hosted UI for subscription and

  billing management.


  A portal configuration describes the functionality and features that you

  want to provide to your customers through the portal.


  A portal session describes the instantiation of the customer portal for

  a particular customer. By visiting the session's URL, the customer

  can manage their subscriptions and billing details. For security reasons,

  sessions are short-lived and will expire if the customer does not visit the
  URL.

  Create sessions on-demand when customers intend to manage their subscriptions

  and billing details.


  Related guide: [Customer management](/customer-management)
properties:
  configuration:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./billing_portal.configuration.yaml
    description: The configuration used by this session, describing the features available.
    x-expansionResources:
      oneOf:
        - $ref: ./billing_portal.configuration.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  customer:
    description: The ID of the customer for this session.
    maxLength: 5000
    type: string
  customer_account:
    description: The ID of the account for this session.
    maxLength: 5000
    nullable: true
    type: string
  flow:
    anyOf:
      - $ref: ./portal_flows_flow.yaml
    description: >-
      Information about a specific flow for the customer to go through. See the
      [docs](https://docs.stripe.com/customer-management/portal-deep-links) to
      learn more about using customer portal deep links and flows.
    nullable: true
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  locale:
    description: >-
      The IETF language tag of the locale Customer Portal is displayed in. If
      blank or auto, the customer’s `preferred_locales` or browser’s locale is
      used.
    enum:
      - auto
      - bg
      - cs
      - da
      - de
      - el
      - en
      - en-AU
      - en-CA
      - en-GB
      - en-IE
      - en-IN
      - en-NZ
      - en-SG
      - es
      - es-419
      - et
      - fi
      - fil
      - fr
      - fr-CA
      - hr
      - hu
      - id
      - it
      - ja
      - ko
      - lt
      - lv
      - ms
      - mt
      - nb
      - nl
      - pl
      - pt
      - pt-BR
      - ro
      - ru
      - sk
      - sl
      - sv
      - th
      - tr
      - vi
      - zh
      - zh-HK
      - zh-TW
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - billing_portal.session
    type: string
  on_behalf_of:
    description: >-
      The account for which the session was created on behalf of. When
      specified, only subscriptions and invoices with this `on_behalf_of`
      account appear in the portal. For more information, see the
      [docs](https://docs.stripe.com/connect/separate-charges-and-transfers#settlement-merchant).
      Use the [Accounts
      API](https://docs.stripe.com/api/accounts/object#account_object-settings-branding)
      to modify the `on_behalf_of` account's branding settings, which the portal
      displays.
    maxLength: 5000
    nullable: true
    type: string
  return_url:
    description: >-
      The URL to redirect customers to when they click on the portal's link to
      return to your website.
    maxLength: 5000
    nullable: true
    type: string
  url:
    description: >-
      The short-lived URL of the session that gives customers access to the
      customer portal.
    maxLength: 5000
    type: string
required:
  - configuration
  - created
  - customer
  - id
  - livemode
  - object
  - url
title: Customer Portal Session
type: object
x-expandableFields:
  - configuration
  - flow
x-resourceId: billing_portal.session
