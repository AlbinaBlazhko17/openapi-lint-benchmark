description: ''
properties:
  alternatives:
    description: >-
      Fields that are due and can be resolved by providing the corresponding
      alternative fields instead. Many alternatives can list the same
      `original_fields_due`, and any of these alternatives can serve as a
      pathway for attempting to resolve the fields again. Re-providing
      `original_fields_due` also serves as a pathway for attempting to resolve
      the fields again.
    items:
      $ref: ./account_requirements_alternative.yaml
    nullable: true
    type: array
  current_deadline:
    description: >-
      Date by which the fields in `currently_due` must be collected to keep the
      account enabled. These fields may disable the account sooner if the next
      threshold is reached before they are collected.
    format: unix-time
    nullable: true
    type: integer
  currently_due:
    description: >-
      Fields that need to be resolved to keep the account enabled. If not
      resolved by `current_deadline`, these fields will appear in `past_due` as
      well, and the account will be disabled.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  disabled_reason:
    description: >-
      If the account is disabled, this enum describes why. [Learn more about
      handling verification
      issues](https://docs.stripe.com/connect/handling-api-verification).
    enum:
      - action_required.requested_capabilities
      - listed
      - other
      - platform_paused
      - rejected.fraud
      - rejected.incomplete_verification
      - rejected.listed
      - rejected.other
      - rejected.platform_fraud
      - rejected.platform_other
      - rejected.platform_terms_of_service
      - rejected.terms_of_service
      - requirements.past_due
      - requirements.pending_verification
      - under_review
    nullable: true
    type: string
  errors:
    description: >-
      Fields that are `currently_due` and need to be collected again because
      validation or verification failed.
    items:
      $ref: ./account_requirements_error.yaml
    nullable: true
    type: array
  eventually_due:
    description: >-
      Fields you must collect when all thresholds are reached. As they become
      required, they appear in `currently_due` as well, and `current_deadline`
      becomes set.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  past_due:
    description: >-
      Fields that haven't been resolved by `current_deadline`. These fields need
      to be resolved to enable the account.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  pending_verification:
    description: >-
      Fields that are being reviewed, or might become required depending on the
      results of a review. If the review fails, these fields can move to
      `eventually_due`, `currently_due`, `past_due` or `alternatives`. Fields
      might appear in `eventually_due`, `currently_due`, `past_due` or
      `alternatives` and in `pending_verification` if one verification fails but
      another is still pending.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
title: AccountRequirements
type: object
x-expandableFields:
  - alternatives
  - errors
