description: >-
  A Quote is a way to model prices that you'd like to provide to a customer.

  Once accepted, it will automatically create an invoice, subscription or
  subscription schedule.
properties:
  amount_subtotal:
    description: Total before any discounts or taxes are applied.
    type: integer
  amount_total:
    description: Total after discounts and taxes are applied.
    type: integer
  application:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application.yaml
      - $ref: ./deleted_application.yaml
    description: ID of the Connect Application that created the quote.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./application.yaml
        - $ref: ./deleted_application.yaml
  application_fee_amount:
    description: >-
      The amount of the application fee (if any) that will be requested to be
      applied to the payment and transferred to the application owner's Stripe
      account. Only applicable if there are no line items with recurring prices
      on the quote.
    nullable: true
    type: integer
  application_fee_percent:
    description: >-
      A non-negative decimal between 0 and 100, with at most two decimal places.
      This represents the percentage of the subscription invoice total that will
      be transferred to the application owner's Stripe account. Only applicable
      if there are line items with recurring prices on the quote.
    nullable: true
    type: number
  automatic_tax:
    $ref: ./quotes_resource_automatic_tax.yaml
  collection_method:
    description: >-
      Either `charge_automatically`, or `send_invoice`. When charging
      automatically, Stripe will attempt to pay invoices at the end of the
      subscription cycle or on finalization using the default payment method
      attached to the subscription or customer. When sending an invoice, Stripe
      will email your customer an invoice with payment instructions and mark the
      subscription as `active`. Defaults to `charge_automatically`.
    enum:
      - charge_automatically
      - send_invoice
    type: string
  computed:
    $ref: ./quotes_resource_computed.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    maxLength: 5000
    nullable: true
    type: string
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: >-
      The customer who received this quote. A customer is required to finalize
      the quote. Once specified, you can't change it.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: >-
      The account representing the customer who received this quote. A customer
      or account is required to finalize the quote. Once specified, you can't
      change it.
    maxLength: 5000
    nullable: true
    type: string
  default_tax_rates:
    description: The tax rates applied to this quote.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./tax_rate.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./tax_rate.yaml
    type: array
  description:
    description: A description that will be displayed on the quote PDF.
    maxLength: 5000
    nullable: true
    type: string
  discounts:
    description: The discounts applied to this quote.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./discount.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./discount.yaml
    type: array
  expires_at:
    description: >-
      The date on which the quote will be canceled if in `open` or `draft`
      status. Measured in seconds since the Unix epoch.
    format: unix-time
    type: integer
  footer:
    description: A footer that will be displayed on the quote PDF.
    maxLength: 5000
    nullable: true
    type: string
  from_quote:
    anyOf:
      - $ref: ./quotes_resource_from_quote.yaml
    description: >-
      Details of the quote that was cloned. See the [cloning
      documentation](https://docs.stripe.com/quotes/clone) for more details.
    nullable: true
  header:
    description: A header that will be displayed on the quote PDF.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  invoice:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./invoice.yaml
      - $ref: ./deleted_invoice.yaml
    description: The invoice that was created from this quote.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./invoice.yaml
        - $ref: ./deleted_invoice.yaml
  invoice_settings:
    $ref: ./invoice_setting_quote_setting.yaml
  line_items:
    description: A list of items the customer is being quoted for.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./item.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: QuotesResourceListLineItems
    type: object
    x-expandableFields:
      - data
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  number:
    description: >-
      A unique number that identifies this particular quote. This number is
      assigned once the quote is
      [finalized](https://docs.stripe.com/quotes/overview#finalize).
    maxLength: 5000
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - quote
    type: string
  on_behalf_of:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account on behalf of which to charge. See the [Connect
      documentation](https://support.stripe.com/questions/sending-invoices-on-behalf-of-connected-accounts)
      for details.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  status:
    description: The status of the quote.
    enum:
      - accepted
      - canceled
      - draft
      - open
    type: string
    x-stripeBypassValidation: true
  status_transitions:
    $ref: ./quotes_resource_status_transitions.yaml
  subscription:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./subscription.yaml
    description: The subscription that was created or updated from this quote.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./subscription.yaml
  subscription_data:
    $ref: ./quotes_resource_subscription_data_subscription_data.yaml
  subscription_schedule:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./subscription_schedule.yaml
    description: The subscription schedule that was created or updated from this quote.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./subscription_schedule.yaml
  test_clock:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./test_helpers.test_clock.yaml
    description: ID of the test clock this quote belongs to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./test_helpers.test_clock.yaml
  total_details:
    $ref: ./quotes_resource_total_details.yaml
  transfer_data:
    anyOf:
      - $ref: ./quotes_resource_transfer_data.yaml
    description: >-
      The account (if any) the payments will be attributed to for tax reporting,
      and where funds from each payment will be transferred to for each of the
      invoices.
    nullable: true
required:
  - amount_subtotal
  - amount_total
  - automatic_tax
  - collection_method
  - computed
  - created
  - discounts
  - expires_at
  - id
  - invoice_settings
  - livemode
  - metadata
  - object
  - status
  - status_transitions
  - subscription_data
  - total_details
title: Quote
type: object
x-expandableFields:
  - application
  - automatic_tax
  - computed
  - customer
  - default_tax_rates
  - discounts
  - from_quote
  - invoice
  - invoice_settings
  - line_items
  - on_behalf_of
  - status_transitions
  - subscription
  - subscription_data
  - subscription_schedule
  - test_clock
  - total_details
  - transfer_data
x-resourceId: quote
