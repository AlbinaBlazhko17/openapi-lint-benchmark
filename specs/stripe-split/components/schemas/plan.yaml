description: >-
  You can now model subscriptions more flexibly using the [Prices
  API](https://api.stripe.com#prices). It replaces the Plans API and is
  backwards compatible to simplify your migration.


  Plans define the base price, currency, and billing cycle for recurring
  purchases of products.

  [Products](https://api.stripe.com#products) help you track inventory or
  provisioning, and plans help you track pricing. Different physical goods or
  levels of service should be represented by products, and pricing options
  should be represented by plans. This approach lets you change prices without
  having to change your provisioning scheme.


  For example, you might have a single "gold" product that has plans for
  $10/month, $100/year, €9/month, and €90/year.


  Related guides: [Set up a
  subscription](https://docs.stripe.com/billing/subscriptions/set-up-subscription)
  and more about [products and
  prices](https://docs.stripe.com/products-prices/overview).
properties:
  active:
    description: Whether the plan can be used for new purchases.
    type: boolean
  amount:
    description: >-
      The unit amount in cents (or local equivalent) to be charged, represented
      as a whole integer if possible. Only set if `billing_scheme=per_unit`.
    nullable: true
    type: integer
  amount_decimal:
    description: >-
      The unit amount in cents (or local equivalent) to be charged, represented
      as a decimal string with at most 12 decimal places. Only set if
      `billing_scheme=per_unit`.
    format: decimal
    nullable: true
    type: string
  billing_scheme:
    description: >-
      Describes how to compute the price per period. Either `per_unit` or
      `tiered`. `per_unit` indicates that the fixed amount (specified in
      `amount`) will be charged per unit in `quantity` (for plans with
      `usage_type=licensed`), or per unit of total usage (for plans with
      `usage_type=metered`). `tiered` indicates that the unit pricing will be
      computed using a tiering strategy as defined using the `tiers` and
      `tiers_mode` attributes.
    enum:
      - per_unit
      - tiered
    type: string
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  interval:
    description: >-
      The frequency at which a subscription is billed. One of `day`, `week`,
      `month` or `year`.
    enum:
      - day
      - month
      - week
      - year
    type: string
  interval_count:
    description: >-
      The number of intervals (specified in the `interval` attribute) between
      subscription billings. For example, `interval=month` and
      `interval_count=3` bills every 3 months.
    type: integer
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  meter:
    description: The meter tracking the usage of a metered price
    maxLength: 5000
    nullable: true
    type: string
  nickname:
    description: A brief description of the plan, hidden from customers.
    maxLength: 5000
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - plan
    type: string
  product:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./product.yaml
      - $ref: ./deleted_product.yaml
    description: The product whose pricing this plan determines.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./product.yaml
        - $ref: ./deleted_product.yaml
  tiers:
    description: >-
      Each element represents a pricing tier. This parameter requires
      `billing_scheme` to be set to `tiered`. See also the documentation for
      `billing_scheme`.
    items:
      $ref: ./plan_tier.yaml
    type: array
  tiers_mode:
    description: >-
      Defines if the tiering price should be `graduated` or `volume` based. In
      `volume`-based tiering, the maximum quantity within a period determines
      the per unit price. In `graduated` tiering, pricing can change as the
      quantity grows.
    enum:
      - graduated
      - volume
    nullable: true
    type: string
  transform_usage:
    anyOf:
      - $ref: ./transform_usage.yaml
    description: >-
      Apply a transformation to the reported usage or set quantity before
      computing the amount billed. Cannot be combined with `tiers`.
    nullable: true
  trial_period_days:
    description: >-
      Default number of trial days when subscribing a customer to this plan
      using
      [`trial_from_plan=true`](https://docs.stripe.com/api#create_subscription-trial_from_plan).
    nullable: true
    type: integer
  usage_type:
    description: >-
      Configures how the quantity per period should be determined. Can be either
      `metered` or `licensed`. `licensed` automatically bills the `quantity` set
      when adding it to a subscription. `metered` aggregates the total usage
      based on usage records. Defaults to `licensed`.
    enum:
      - licensed
      - metered
    type: string
required:
  - active
  - billing_scheme
  - created
  - currency
  - id
  - interval
  - interval_count
  - livemode
  - object
  - usage_type
title: Plan
type: object
x-expandableFields:
  - product
  - tiers
  - transform_usage
x-resourceId: plan
