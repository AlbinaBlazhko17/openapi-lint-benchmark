description: ''
properties:
  amount:
    description: >-
      A positive integer in the smallest currency unit (that is, 100 cents for
      $1.00, or 1 for ¥1, Japanese Yen being a zero-decimal currency)
      representing the total amount for the order.
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  email:
    description: The email address of the customer placing the order.
    maxLength: 5000
    type: string
  items:
    description: List of items constituting the order.
    items:
      $ref: ./source_order_item.yaml
    nullable: true
    type: array
  shipping:
    $ref: ./shipping.yaml
required:
  - amount
  - currency
title: SourceOrder
type: object
x-expandableFields:
  - items
  - shipping
