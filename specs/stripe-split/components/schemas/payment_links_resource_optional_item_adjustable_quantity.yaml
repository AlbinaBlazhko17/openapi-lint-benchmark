description: ''
properties:
  enabled:
    description: Set to true if the quantity can be adjusted to any non-negative integer.
    type: boolean
  maximum:
    description: >-
      The maximum quantity of this item the customer can purchase. By default
      this value is 99.
    nullable: true
    type: integer
  minimum:
    description: >-
      The minimum quantity of this item the customer must purchase, if they
      choose to purchase it. Because this item is optional, the customer will
      always be able to remove it from their order, even if the `minimum`
      configured here is greater than 0. By default this value is 0.
    nullable: true
    type: integer
required:
  - enabled
title: PaymentLinksResourceOptionalItemAdjustableQuantity
type: object
