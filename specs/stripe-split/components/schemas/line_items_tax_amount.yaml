description: ''
properties:
  amount:
    description: Amount of tax applied for this rate.
    type: integer
  rate:
    $ref: ./tax_rate.yaml
  taxability_reason:
    description: >-
      The reasoning behind this tax, for example, if the product is tax exempt.
      The possible values for this field may be extended as new tax rules are
      supported.
    enum:
      - customer_exempt
      - not_collecting
      - not_subject_to_tax
      - not_supported
      - portion_product_exempt
      - portion_reduced_rated
      - portion_standard_rated
      - product_exempt
      - product_exempt_holiday
      - proportionally_rated
      - reduced_rated
      - reverse_charge
      - standard_rated
      - taxable_basis_reduced
      - zero_rated
    nullable: true
    type: string
    x-stripeBypassValidation: true
  taxable_amount:
    description: The amount on which tax is calculated, in cents (or local equivalent).
    nullable: true
    type: integer
required:
  - amount
  - rate
title: LineItemsTaxAmount
type: object
x-expandableFields:
  - rate
