description: >-
  A Location represents a grouping of readers.


  Related guide: [Fleet
  management](https://docs.stripe.com/terminal/fleet/locations)
properties:
  address:
    $ref: ./address_api_resource_terminal.yaml
  address_kana:
    $ref: ./legal_entity_japan_address.yaml
  address_kanji:
    $ref: ./legal_entity_japan_address.yaml
  configuration_overrides:
    description: >-
      The ID of a configuration that will be used to customize all readers in
      this location.
    maxLength: 5000
    type: string
  display_name:
    description: The display name of the location.
    maxLength: 5000
    type: string
  display_name_kana:
    description: The Kana variation of the display name of the location.
    maxLength: 5000
    type: string
  display_name_kanji:
    description: The Kanji variation of the display name of the location.
    maxLength: 5000
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - terminal.location
    type: string
  phone:
    description: The phone number of the location.
    maxLength: 5000
    type: string
required:
  - address
  - display_name
  - id
  - livemode
  - metadata
  - object
title: Location
type: object
x-expandableFields:
  - address
  - address_kana
  - address_kanji
x-resourceId: terminal.location
