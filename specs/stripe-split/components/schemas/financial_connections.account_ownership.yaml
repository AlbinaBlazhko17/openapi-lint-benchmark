description: >-
  Describes a snapshot of the owners of an account at a particular point in
  time.
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - financial_connections.account_ownership
    type: string
  owners:
    description: A paginated list of owners for this account.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./financial_connections.account_owner.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: BankConnectionsResourceOwnerList
    type: object
    x-expandableFields:
      - data
required:
  - created
  - id
  - object
  - owners
title: Account Ownership
type: object
x-expandableFields:
  - owners
