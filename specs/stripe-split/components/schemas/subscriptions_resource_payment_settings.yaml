description: ''
properties:
  payment_method_options:
    anyOf:
      - $ref: ./subscriptions_resource_payment_method_options.yaml
    description: >-
      Payment-method-specific configuration to provide to invoices created by
      the subscription.
    nullable: true
  payment_method_types:
    description: >-
      The list of payment method types to provide to every invoice created by
      the subscription. If not set, Stripe attempts to automatically determine
      the types to use by looking at the invoice’s default payment method, the
      subscription’s default payment method, the customer’s default payment
      method, and your [invoice template
      settings](https://dashboard.stripe.com/settings/billing/invoice).
    items:
      enum:
        - ach_credit_transfer
        - ach_debit
        - acss_debit
        - affirm
        - alipay
        - amazon_pay
        - au_becs_debit
        - bacs_debit
        - bancontact
        - billie
        - boleto
        - card
        - cashapp
        - crypto
        - custom
        - customer_balance
        - eps
        - fpx
        - giropay
        - grabpay
        - ideal
        - jp_credit_transfer
        - kakao_pay
        - klarna
        - konbini
        - kr_card
        - link
        - mb_way
        - multibanco
        - naver_pay
        - nz_bank_account
        - p24
        - pay_by_bank
        - payco
        - paynow
        - paypal
        - payto
        - pix
        - promptpay
        - revolut_pay
        - satispay
        - sepa_credit_transfer
        - sepa_debit
        - sofort
        - swish
        - twint
        - upi
        - us_bank_account
        - wechat_pay
      type: string
      x-stripeBypassValidation: true
    nullable: true
    type: array
  save_default_payment_method:
    description: >-
      Configure whether Stripe updates `subscription.default_payment_method`
      when payment succeeds. Defaults to `off`.
    enum:
      - 'off'
      - on_subscription
    nullable: true
    type: string
title: SubscriptionsResourcePaymentSettings
type: object
x-expandableFields:
  - payment_method_options
