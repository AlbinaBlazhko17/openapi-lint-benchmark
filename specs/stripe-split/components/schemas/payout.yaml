description: >-
  A `Payout` object is created when you receive funds from Stripe, or when you

  initiate a payout to either a bank account or debit card of a [connected

  Stripe account](/docs/connect/bank-debit-card-payouts). You can retrieve
  individual payouts,

  and list all payouts. Payouts are made on [varying

  schedules](/docs/connect/manage-payout-schedule), depending on your country
  and

  industry.


  Related guide: [Receiving payouts](https://docs.stripe.com/payouts)
properties:
  amount:
    description: >-
      The amount (in cents (or local equivalent)) that transfers to your bank
      account or debit card.
    type: integer
  application_fee:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application_fee.yaml
    description: >-
      The application fee (if any) for the payout. [See the Connect
      documentation](https://docs.stripe.com/connect/instant-payouts#monetization-and-fees)
      for details.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./application_fee.yaml
  application_fee_amount:
    description: >-
      The amount of the application fee (if any) requested for the payout. [See
      the Connect
      documentation](https://docs.stripe.com/connect/instant-payouts#monetization-and-fees)
      for details.
    nullable: true
    type: integer
  arrival_date:
    description: >-
      Date that you can expect the payout to arrive in the bank. This factors in
      delays to account for weekends or bank holidays.
    format: unix-time
    type: integer
  automatic:
    description: >-
      Returns `true` if the payout is created by an [automated payout
      schedule](https://docs.stripe.com/payouts#payout-schedule) and `false` if
      it's [requested manually](https://stripe.com/docs/payouts#manual-payouts).
    type: boolean
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: >-
      ID of the balance transaction that describes the impact of this payout on
      your account balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  destination:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./bank_account.yaml
      - $ref: ./card.yaml
      - $ref: ./deleted_bank_account.yaml
      - $ref: ./deleted_card.yaml
    description: ID of the bank account or card the payout is sent to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./bank_account.yaml
        - $ref: ./card.yaml
        - $ref: ./deleted_bank_account.yaml
        - $ref: ./deleted_card.yaml
    x-stripeBypassValidation: true
  failure_balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: >-
      If the payout fails or cancels, this is the ID of the balance transaction
      that reverses the initial balance transaction and returns the funds from
      the failed payout back in your balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  failure_code:
    description: >-
      Error code that provides a reason for a payout failure, if available. View
      our [list of failure codes](https://docs.stripe.com/api#payout_failures).
    maxLength: 5000
    nullable: true
    type: string
  failure_message:
    description: Message that provides the reason for a payout failure, if available.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  method:
    description: >-
      The method used to send this payout, which can be `standard` or `instant`.
      `instant` is supported for payouts to debit cards and bank accounts in
      certain countries. Learn more about [bank support for Instant
      Payouts](https://stripe.com/docs/payouts/instant-payouts-banks).
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - payout
    type: string
  original_payout:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payout.yaml
    description: If the payout reverses another, this is the ID of the original payout.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payout.yaml
  payout_method:
    description: ID of the v2 FinancialAccount the funds are sent to.
    maxLength: 5000
    nullable: true
    type: string
  reconciliation_status:
    description: >-
      If `completed`, you can use the [Balance Transactions
      API](https://docs.stripe.com/api/balance_transactions/list#balance_transaction_list-payout)
      to list all balance transactions that are paid out in this payout.
    enum:
      - completed
      - in_progress
      - not_applicable
    type: string
  reversed_by:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payout.yaml
    description: >-
      If the payout reverses, this is the ID of the payout that reverses this
      payout.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payout.yaml
  source_type:
    description: >-
      The source balance this payout came from, which can be one of the
      following: `card`, `fpx`, or `bank_account`.
    maxLength: 5000
    type: string
  statement_descriptor:
    description: >-
      Extra information about a payout that displays on the user's bank
      statement.
    maxLength: 5000
    nullable: true
    type: string
  status:
    description: >-
      Current status of the payout: `paid`, `pending`, `in_transit`, `canceled`
      or `failed`. A payout is `pending` until it's submitted to the bank, when
      it becomes `in_transit`. The status changes to `paid` if the transaction
      succeeds, or to `failed` or `canceled` (within 5 business days). Some
      payouts that fail might initially show as `paid`, then change to `failed`.
    maxLength: 5000
    type: string
  trace_id:
    anyOf:
      - $ref: ./payouts_trace_id.yaml
    description: >-
      A value that generates from the beneficiary's bank that allows users to
      track payouts with their bank. Banks might call this a "reference number"
      or something similar.
    nullable: true
  type:
    description: Can be `bank_account` or `card`.
    enum:
      - bank_account
      - card
    type: string
    x-stripeBypassValidation: true
required:
  - amount
  - arrival_date
  - automatic
  - created
  - currency
  - id
  - livemode
  - method
  - object
  - reconciliation_status
  - source_type
  - status
  - type
title: Payout
type: object
x-expandableFields:
  - application_fee
  - balance_transaction
  - destination
  - failure_balance_transaction
  - original_payout
  - reversed_by
  - trace_id
x-resourceId: payout
