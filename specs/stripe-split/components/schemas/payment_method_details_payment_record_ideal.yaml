description: ''
properties:
  bank:
    description: >-
      The customer's bank. Can be one of `abn_amro`, `adyen`, `asn_bank`,
      `bunq`, `buut`, `finom`, `handelsbanken`, `ing`, `knab`, `mollie`,
      `moneyou`, `n26`, `nn`, `rabobank`, `regiobank`, `revolut`, `sns_bank`,
      `triodos_bank`, `van_lanschot`, or `yoursafe`.
    enum:
      - abn_amro
      - adyen
      - asn_bank
      - bunq
      - buut
      - finom
      - handelsbanken
      - ing
      - knab
      - mollie
      - moneyou
      - n26
      - nn
      - rabobank
      - regiobank
      - revolut
      - sns_bank
      - triodos_bank
      - van_lanschot
      - yoursafe
    nullable: true
    type: string
  bic:
    description: The Bank Identifier Code of the customer's bank.
    enum:
      - ABNANL2A
      - ADYBNL2A
      - ASNBNL21
      - BITSNL2A
      - BUNQNL2A
      - BUUTNL2A
      - FNOMNL22
      - FVLBNL22
      - HANDNL2A
      - INGBNL2A
      - KNABNL2H
      - MLLENL2A
      - MOYONL21
      - NNBANL2G
      - NTSBDEB1
      - RABONL2U
      - RBRBNL21
      - REVOIE23
      - REVOLT21
      - SNSBNL2A
      - TRIONL2U
    nullable: true
    type: string
  generated_sepa_debit:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: >-
      The ID of the SEPA Direct Debit PaymentMethod which was generated by this
      Charge.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  generated_sepa_debit_mandate:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./mandate.yaml
    description: >-
      The mandate for the SEPA Direct Debit PaymentMethod which was generated by
      this Charge.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./mandate.yaml
  iban_last4:
    description: Last four characters of the IBAN.
    maxLength: 5000
    nullable: true
    type: string
  transaction_id:
    description: Unique transaction ID generated by iDEAL.
    maxLength: 5000
    nullable: true
    type: string
  verified_name:
    description: >-
      Owner's verified full name. Values are verified or provided by iDEAL
      directly (if supported) at the time of authorization or settlement. They
      cannot be set or mutated.
    maxLength: 5000
    nullable: true
    type: string
title: payment_method_details_payment_record_ideal
type: object
x-expandableFields:
  - generated_sepa_debit
  - generated_sepa_debit_mandate
