description: ''
properties:
  account_type:
    description: The type of account being debited or credited
    enum:
      - checking
      - credit
      - prepaid
      - unknown
    type: string
    x-stripeBypassValidation: true
  application_cryptogram:
    description: >-
      The Application Cryptogram, a unique value generated by the card to
      authenticate the transaction with issuers.
    maxLength: 5000
    nullable: true
    type: string
  application_preferred_name:
    description: >-
      The Application Identifier (AID) on the card used to determine which
      networks are eligible to process the transaction. Referenced from EMV tag
      9F12, data encoded on the card's chip.
    maxLength: 5000
    nullable: true
    type: string
  authorization_code:
    description: Identifier for this transaction.
    maxLength: 5000
    nullable: true
    type: string
  authorization_response_code:
    description: EMV tag 8A. A code returned by the card issuer.
    maxLength: 5000
    nullable: true
    type: string
  cardholder_verification_method:
    description: >-
      Describes the method used by the cardholder to verify ownership of the
      card. One of the following: `approval`, `failure`, `none`, `offline_pin`,
      `offline_pin_and_signature`, `online_pin`, or `signature`.
    maxLength: 5000
    nullable: true
    type: string
  dedicated_file_name:
    description: >-
      Similar to the application_preferred_name, identifying the applications
      (AIDs) available on the card. Referenced from EMV tag 84.
    maxLength: 5000
    nullable: true
    type: string
  terminal_verification_results:
    description: >-
      A 5-byte string that records the checks and validations that occur between
      the card and the terminal. These checks determine how the terminal
      processes the transaction and what risk tolerance is acceptable.
      Referenced from EMV Tag 95.
    maxLength: 5000
    nullable: true
    type: string
  transaction_status_information:
    description: >-
      An indication of which steps were completed during the card read process.
      Referenced from EMV Tag 9B.
    maxLength: 5000
    nullable: true
    type: string
title: payment_method_details_card_present_receipt
type: object
x-expandableFields: []
