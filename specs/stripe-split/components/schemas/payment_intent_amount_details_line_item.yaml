description: ''
properties:
  discount_amount:
    description: >-
      The discount applied on this line item represented in the [smallest
      currency unit](https://docs.stripe.com/currencies#zero-decimal). An
      integer greater than 0.


      This field is mutually exclusive with the
      `amount_details[discount_amount]` field.
    nullable: true
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - payment_intent_amount_details_line_item
    type: string
  payment_method_options:
    anyOf:
      - $ref: >-
          ./payment_flows_amount_details_resource_line_items_list_resource_line_item_resource_payment_method_options.yaml
    description: Payment method-specific information for line items.
    nullable: true
  product_code:
    description: >-
      The product code of the line item, such as an SKU. Required for L3 rates.
      At most 12 characters long.
    maxLength: 5000
    nullable: true
    type: string
  product_name:
    description: >-
      The product name of the line item. Required for L3 rates. At most 1024
      characters long.


      For Cards, this field is truncated to 26 alphanumeric characters before
      being sent to the card networks. For PayPal, this field is truncated to
      127 characters.
    maxLength: 5000
    type: string
  quantity:
    description: The quantity of items. Required for L3 rates. An integer greater than 0.
    type: integer
  tax:
    anyOf:
      - $ref: >-
          ./payment_flows_amount_details_resource_line_items_list_resource_line_item_resource_tax.yaml
    description: Contains information about the tax on the item.
    nullable: true
  unit_cost:
    description: >-
      The unit cost of the line item represented in the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal). Required for L3
      rates. An integer greater than or equal to 0.
    type: integer
  unit_of_measure:
    description: >-
      A unit of measure for the line item, such as gallons, feet, meters, etc.
      Required for L3 rates. At most 12 alphanumeric characters long.
    maxLength: 5000
    nullable: true
    type: string
required:
  - id
  - object
  - product_name
  - quantity
  - unit_cost
