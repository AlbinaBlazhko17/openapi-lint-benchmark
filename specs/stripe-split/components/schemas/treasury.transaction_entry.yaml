description: >-
  TransactionEntries represent individual units of money movements within a
  single [Transaction](https://api.stripe.com#transactions).
properties:
  balance_impact:
    $ref: ./treasury_transactions_resource_balance_impact.yaml
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  effective_at:
    description: When the TransactionEntry will impact the FinancialAccount's balance.
    format: unix-time
    type: integer
  financial_account:
    description: The FinancialAccount associated with this object.
    maxLength: 5000
    type: string
  flow:
    description: Token of the flow associated with the TransactionEntry.
    maxLength: 5000
    nullable: true
    type: string
  flow_details:
    anyOf:
      - $ref: ./treasury_transactions_resource_flow_details.yaml
    description: Details of the flow associated with the TransactionEntry.
    nullable: true
  flow_type:
    description: Type of the flow associated with the TransactionEntry.
    enum:
      - credit_reversal
      - debit_reversal
      - inbound_transfer
      - issuing_authorization
      - other
      - outbound_payment
      - outbound_transfer
      - received_credit
      - received_debit
    type: string
    x-stripeBypassValidation: true
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.transaction_entry
    type: string
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./treasury.transaction.yaml
    description: The Transaction associated with this object.
    x-expansionResources:
      oneOf:
        - $ref: ./treasury.transaction.yaml
  type:
    description: The specific money movement that generated the TransactionEntry.
    enum:
      - credit_reversal
      - credit_reversal_posting
      - debit_reversal
      - inbound_transfer
      - inbound_transfer_return
      - issuing_authorization_hold
      - issuing_authorization_release
      - other
      - outbound_payment
      - outbound_payment_cancellation
      - outbound_payment_failure
      - outbound_payment_posting
      - outbound_payment_return
      - outbound_transfer
      - outbound_transfer_cancellation
      - outbound_transfer_failure
      - outbound_transfer_posting
      - outbound_transfer_return
      - received_credit
      - received_debit
    type: string
required:
  - balance_impact
  - created
  - currency
  - effective_at
  - financial_account
  - flow_type
  - id
  - livemode
  - object
  - transaction
  - type
title: TransactionEntry
type: object
x-expandableFields:
  - balance_impact
  - flow_details
  - transaction
x-resourceId: treasury.transaction_entry
