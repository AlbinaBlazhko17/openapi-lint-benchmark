description: >-
  Value list items allow you to add specific values to a given Radar value list,
  which can then be used in rules.


  Related guide: [Managing list
  items](https://docs.stripe.com/radar/lists#managing-list-items)
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  created_by:
    description: >-
      The name or email address of the user who added this item to the value
      list.
    maxLength: 5000
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - radar.value_list_item
    type: string
  value:
    description: The value of the item.
    maxLength: 5000
    type: string
  value_list:
    description: The identifier of the value list this item belongs to.
    maxLength: 5000
    type: string
required:
  - created
  - created_by
  - id
  - livemode
  - object
  - value
  - value_list
title: Value List Item
type: object
x-expandableFields: []
x-resourceId: radar.value_list_item
