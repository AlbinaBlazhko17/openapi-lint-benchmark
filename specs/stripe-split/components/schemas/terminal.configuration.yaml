  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  is_account_default:
    description: Whether this Configuration is the default for your account
    nullable: true
    type: boolean
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  name:
    description: String indicating the name of the Configuration object, set by the user
    maxLength: 5000
    nullable: true
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
