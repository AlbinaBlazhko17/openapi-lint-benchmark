description: ''
properties:
  address:
    anyOf:
      - $ref: ./address.yaml
    description: >-
      The customer's address after a completed Checkout Session. Note: This
      property is populated only for sessions on or after March 30, 2022.
    nullable: true
  business_name:
    description: The customer's business name after a completed Checkout Session.
    maxLength: 150
    nullable: true
    type: string
  email:
    description: >-
      The email associated with the Customer, if one exists, on the Checkout
      Session after a completed Checkout Session or at time of session expiry.

      Otherwise, if the customer has consented to promotional content, this
      value is the most recent valid email provided by the customer on the
      Checkout form.
    maxLength: 5000
    nullable: true
    type: string
  individual_name:
    description: The customer's individual name after a completed Checkout Session.
    maxLength: 150
    nullable: true
    type: string
  name:
    description: >-
      The customer's name after a completed Checkout Session. Note: This
      property is populated only for sessions on or after March 30, 2022.
    maxLength: 5000
    nullable: true
    type: string
  phone:
    description: The customer's phone number after a completed Checkout Session.
    maxLength: 5000
    nullable: true
    type: string
  tax_exempt:
    description: The customer’s tax exempt status after a completed Checkout Session.
    enum:
      - exempt
      - none
      - reverse
    nullable: true
    type: string
  tax_ids:
    description: The customer’s tax IDs after a completed Checkout Session.
    items:
      $ref: ./payment_pages_checkout_session_tax_id.yaml
    nullable: true
    type: array
title: PaymentPagesCheckoutSessionCustomerDetails
type: object
x-expandableFields:
  - address
  - tax_ids
