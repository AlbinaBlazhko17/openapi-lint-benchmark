description: ''
properties:
  amount:
    description: >-
      The amount in cents (or local equivalent) that will be transferred to the
      destination account when the invoice is paid. By default, the entire
      amount is transferred to the destination.
    nullable: true
    type: integer
  amount_percent:
    description: >-
      A non-negative decimal between 0 and 100, with at most two decimal places.
      This represents the percentage of the subscription invoice total that will
      be transferred to the destination account. By default, the entire amount
      will be transferred to the destination.
    nullable: true
    type: number
  destination:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account where funds from the payment will be transferred to upon
      payment success.
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
required:
  - destination
title: QuotesResourceTransferData
type: object
x-expandableFields:
  - destination
