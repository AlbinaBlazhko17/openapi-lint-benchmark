description: ''
properties:
  brand:
    description: Card brand. Can be `interac`, `mastercard` or `visa`.
    maxLength: 5000
    nullable: true
    type: string
  cardholder_name:
    description: >-
      The cardholder name as read from the card, in [ISO
      7813](https://en.wikipedia.org/wiki/ISO/IEC_7813) format. May include
      alphanumeric characters, special characters and first/last name separator
      (`/`). In some cases, the cardholder name may not be available depending
      on how the issuer has configured the card. Cardholder name is typically
      not available on swipe or contactless payments, such as those made with
      Apple Pay and Google Pay.
    maxLength: 5000
    nullable: true
    type: string
  country:
    description: >-
      Two-letter ISO code representing the country of the card. You could use
      this attribute to get a sense of the international breakdown of cards
      you've collected.
    maxLength: 5000
    nullable: true
    type: string
  description:
    description: A high-level description of the type of cards issued in this range.
    maxLength: 5000
    nullable: true
    type: string
  exp_month:
    description: Two-digit number representing the card's expiration month.
    type: integer
  exp_year:
    description: Four-digit number representing the card's expiration year.
    type: integer
  fingerprint:
    description: >-
      Uniquely identifies this particular card number. You can use this
      attribute to check whether two customers who’ve signed up with you are
      using the same card number, for example. For payment methods that tokenize
      card information (Apple Pay, Google Pay), the tokenized number might be
      provided instead of the underlying card number.


      *As of May 1, 2021, card fingerprint in India for Connect changed to allow
      two fingerprints for the same card---one for India and one for the rest of
      the world.*
    maxLength: 5000
    nullable: true
    type: string
  funding:
    description: Card funding type. Can be `credit`, `debit`, `prepaid`, or `unknown`.
    maxLength: 5000
    nullable: true
    type: string
  issuer:
    description: The name of the card's issuing bank.
    maxLength: 5000
    nullable: true
    type: string
  last4:
    description: The last four digits of the card.
    maxLength: 5000
    nullable: true
    type: string
  networks:
    anyOf:
      - $ref: ./payment_method_card_present_networks.yaml
    description: >-
      Contains information about card networks that can be used to process the
      payment.
    nullable: true
  preferred_locales:
    description: >-
      The languages that the issuing bank recommends using for localizing any
      customer-facing text, as read from the card. Referenced from EMV tag 5F2D,
      data encoded on the card's chip.
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  read_method:
    description: How card details were read in this transaction.
    enum:
      - contact_emv
      - contactless_emv
      - contactless_magstripe_mode
      - magnetic_stripe_fallback
      - magnetic_stripe_track2
    nullable: true
    type: string
required:
  - exp_month
  - exp_year
title: payment_method_interac_present
type: object
x-expandableFields:
  - networks
