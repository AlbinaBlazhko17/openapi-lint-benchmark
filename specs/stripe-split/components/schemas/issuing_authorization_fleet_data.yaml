description: ''
properties:
  cardholder_prompt_data:
    anyOf:
      - $ref: ./issuing_authorization_fleet_cardholder_prompt_data.yaml
    description: >-
      Answers to prompts presented to the cardholder at the point of sale.
      Prompted fields vary depending on the configuration of your physical fleet
      cards. Typical points of sale support only numeric entry.
    nullable: true
  purchase_type:
    description: The type of purchase.
    enum:
      - fuel_and_non_fuel_purchase
      - fuel_purchase
      - non_fuel_purchase
    nullable: true
    type: string
  reported_breakdown:
    anyOf:
      - $ref: ./issuing_authorization_fleet_reported_breakdown.yaml
    description: >-
      More information about the total amount. Typically this information is
      received from the merchant after the authorization has been approved and
      the fuel dispensed. This information is not guaranteed to be accurate as
      some merchants may provide unreliable data.
    nullable: true
  service_type:
    description: The type of fuel service.
    enum:
      - full_service
      - non_fuel_transaction
      - self_service
    nullable: true
    type: string
title: IssuingAuthorizationFleetData
type: object
x-expandableFields:
  - cardholder_prompt_data
  - reported_breakdown
