description: ''
properties:
  brand:
    description: >-
      Card brand. Can be `American Express`, `Cartes Bancaires`, `Diners Club`,
      `Discover`, `Eftpos Australia`, `Girocard`, `JCB`, `MasterCard`,
      `UnionPay`, `Visa`, or `Unknown`.
    maxLength: 5000
    nullable: true
    type: string
  country:
    description: >-
      Two-letter ISO code representing the country of the card. You could use
      this attribute to get a sense of the international breakdown of cards
      you've collected.
    maxLength: 5000
    nullable: true
    type: string
  exp_month:
    description: Two-digit number representing the card's expiration month.
    nullable: true
    type: integer
  exp_year:
    description: Four-digit number representing the card's expiration year.
    nullable: true
    type: integer
  funding:
    description: Card funding type. Can be `credit`, `debit`, `prepaid`, or `unknown`.
    maxLength: 5000
    nullable: true
    type: string
  last4:
    description: The last four digits of the card.
    maxLength: 5000
    nullable: true
    type: string
