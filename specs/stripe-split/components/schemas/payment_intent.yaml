description: >-
  A PaymentIntent guides you through the process of collecting a payment from
  your customer.

  We recommend that you create exactly one PaymentIntent for each order or

  customer session in your system. You can reference the PaymentIntent later to

  see the history of payment attempts for a particular session.


  A PaymentIntent transitions through

  [multiple statuses](/payments/paymentintents/lifecycle)

  throughout its lifetime as it interfaces with Stripe.js to perform

  authentication flows and ultimately creates at most one successful charge.


  Related guide: [Payment Intents
  API](https://docs.stripe.com/payments/payment-intents)
properties:
  allowed_payment_method_types:
    description: >-
      The list of payment method types allowed for use with this payment. Stripe
      automatically returns compatible payment methods from this list in the
      `payment_method_types` field of the response, based on the other
      PaymentIntent parameters, such as `currency`, `amount`, and `customer`.
    items:
      enum:
        - acss_debit
        - affirm
        - afterpay_clearpay
        - alipay
        - alma
        - amazon_pay
        - au_becs_debit
        - bacs_debit
        - bancontact
        - billie
        - bizum
        - blik
        - boku_promptpay
        - boleto
        - capchase_pay
        - card
        - cashapp
        - check_scan
        - click_to_pay
        - crypto
        - customer_balance
        - demo_pay
        - duitnow
        - dummy_auth_push
        - dummy_passthrough_card
        - edenred
        - eps
        - fpx
        - gcash
        - getbalance
        - gift_card
        - giropay
        - gopay
        - grabpay
        - id_bank_transfer
        - ideal
        - kakao_pay
        - klarna
        - knet
        - konbini
        - kr_card
        - kr_market
        - kriya
