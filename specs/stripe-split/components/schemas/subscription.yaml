description: >-
  Subscriptions allow you to charge a customer on a recurring basis.


  Related guide: [Creating
  subscriptions](https://docs.stripe.com/billing/subscriptions/creating)
properties:
  application:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./application.yaml
      - $ref: ./deleted_application.yaml
    description: ID of the Connect Application that created the subscription.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./application.yaml
        - $ref: ./deleted_application.yaml
  application_fee_percent:
    description: >-
      A non-negative decimal between 0 and 100, with at most two decimal places.
      This represents the percentage of the subscription invoice total that will
      be transferred to the application owner's Stripe account.
    nullable: true
    type: number
  automatic_tax:
    $ref: ./subscription_automatic_tax.yaml
  billing_cycle_anchor:
    description: >-
      The reference point that aligns future [billing
      cycle](https://docs.stripe.com/subscriptions/billing-cycle) dates. It sets
      the day of week for `week` intervals, the day of month for `month` and
      `year` intervals, and the month of year for `year` intervals. The
      timestamp is in UTC format.
    format: unix-time
    type: integer
  billing_cycle_anchor_config:
    anyOf:
      - $ref: ./subscriptions_resource_billing_cycle_anchor_config.yaml
    description: The fixed values used to calculate the `billing_cycle_anchor`.
    nullable: true
  billing_mode:
    $ref: ./subscriptions_resource_billing_mode.yaml
  billing_schedules:
    description: Billing schedules for this subscription.
    items:
      $ref: ./subscriptions_resource_billing_schedules.yaml
    type: array
  billing_thresholds:
    anyOf:
      - $ref: ./subscription_billing_thresholds.yaml
    description: >-
      Define thresholds at which an invoice will be sent, and the subscription
      advanced to a new billing period
    nullable: true
  cancel_at:
    description: >-
      A date in the future at which the subscription will automatically get
      canceled
    format: unix-time
    nullable: true
    type: integer
  cancel_at_period_end:
    description: >-
      Whether this subscription will (if `status=active`) or did (if
      `status=canceled`) cancel at the end of the current billing period.
    type: boolean
  canceled_at:
    description: >-
      If the subscription has been canceled, the date of that cancellation. If
      the subscription was canceled with `cancel_at_period_end`, `canceled_at`
      will reflect the time of the most recent update request, not the end of
      the subscription period when the subscription is automatically moved to a
      canceled state.
    format: unix-time
    nullable: true
    type: integer
  cancellation_details:
    anyOf:
      - $ref: ./cancellation_details.yaml
    description: Details about why this subscription was cancelled
    nullable: true
  collection_method:
    description: >-
      Either `charge_automatically`, or `send_invoice`. When charging
      automatically, Stripe will attempt to pay this subscription at the end of
      the cycle using the default source attached to the customer. When sending
      an invoice, Stripe will email your customer an invoice with payment
      instructions and mark the subscription as `active`.
    enum:
      - charge_automatically
      - send_invoice
    type: string
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
      - $ref: ./deleted_customer.yaml
    description: ID of the customer who owns the subscription.
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
        - $ref: ./deleted_customer.yaml
  customer_account:
    description: ID of the account representing the customer who owns the subscription.
    maxLength: 5000
    nullable: true
    type: string
  days_until_due:
    description: >-
      Number of days a customer has to pay invoices generated by this
      subscription. This value will be `null` for subscriptions where
      `collection_method=charge_automatically`.
    nullable: true
    type: integer
  default_payment_method:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./payment_method.yaml
    description: >-
      ID of the default payment method for the subscription. It must belong to
      the customer associated with the subscription. This takes precedence over
      `default_source`. If neither are set, invoices will use the customer's
      [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method)
      or
      [default_source](https://docs.stripe.com/api/customers/object#customer_object-default_source).
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./payment_method.yaml
  default_source:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./bank_account.yaml
      - $ref: ./card.yaml
      - $ref: ./source.yaml
    description: >-
      ID of the default payment source for the subscription. It must belong to
      the customer associated with the subscription and be in a chargeable
      state. If `default_payment_method` is also set, `default_payment_method`
      will take precedence. If neither are set, invoices will use the customer's
      [invoice_settings.default_payment_method](https://docs.stripe.com/api/customers/object#customer_object-invoice_settings-default_payment_method)
      or
      [default_source](https://docs.stripe.com/api/customers/object#customer_object-default_source).
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./bank_account.yaml
        - $ref: ./card.yaml
        - $ref: ./source.yaml
    x-stripeBypassValidation: true
  default_tax_rates:
    description: >-
      The tax rates that will apply to any subscription item that does not have
      `tax_rates` set. Invoices created will have their `default_tax_rates`
      populated from the subscription.
    items:
      $ref: ./tax_rate.yaml
    nullable: true
    type: array
  description:
    description: >-
      The subscription's description, meant to be displayable to the customer.
      Use this field to optionally store an explanation of the subscription for
      rendering in Stripe surfaces and certain local payment methods UIs.
    maxLength: 500
    nullable: true
    type: string
  discounts:
    description: >-
      The discounts applied to the subscription. Subscription item discounts are
      applied before subscription discounts. Use `expand[]=discounts` to expand
      each discount.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./discount.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./discount.yaml
    type: array
  ended_at:
    description: If the subscription has ended, the date the subscription ended.
    format: unix-time
    nullable: true
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  invoice_settings:
    $ref: ./subscriptions_resource_subscription_invoice_settings.yaml
  items:
    description: List of subscription items, each with an attached price.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./subscription_item.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: SubscriptionItemList
    type: object
    x-expandableFields:
      - data
  latest_invoice:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./invoice.yaml
    description: >-
      The most recent invoice this subscription has generated over its lifecycle
      (for example, when it cycles or is updated).
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./invoice.yaml
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  managed_payments:
    anyOf:
      - $ref: ./smor_resource_managed_payments.yaml
    description: >-
      Settings for Managed Payments for this Subscription and resulting
      [Invoices](/api/invoices/object) and
      [PaymentIntents](/api/payment_intents/object).
    nullable: true
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  next_pending_invoice_item_invoice:
    description: >-
      Specifies the approximate timestamp on which any pending invoice items
      will be billed according to the schedule provided at
      `pending_invoice_item_interval`.
    format: unix-time
    nullable: true
    type: integer
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - subscription
    type: string
  on_behalf_of:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: >-
      The account (if any) the charge was made on behalf of for charges
      associated with this subscription. See the [Connect
      documentation](https://docs.stripe.com/connect/subscriptions#on-behalf-of)
      for details.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  pause_collection:
    anyOf:
      - $ref: ./subscriptions_resource_pause_collection.yaml
    description: >-
      If specified, payment collection for this subscription will be paused.
      Note that the subscription status will be unchanged and will not be
      updated to `paused`. Learn more about [pausing
      collection](https://docs.stripe.com/billing/subscriptions/pause-payment).
    nullable: true
  payment_settings:
    anyOf:
      - $ref: ./subscriptions_resource_payment_settings.yaml
    description: Payment settings passed on to invoices created by the subscription.
    nullable: true
  pending_invoice_item_interval:
    anyOf:
      - $ref: ./subscription_pending_invoice_item_interval.yaml
    description: >-
      Specifies an interval for how often to bill for any pending invoice items.
      It is analogous to calling [Create an invoice](/api/invoices/create) for
      the given subscription at the specified interval.
    nullable: true
  pending_setup_intent:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./setup_intent.yaml
    description: >-
      You can use this [SetupIntent](https://docs.stripe.com/api/setup_intents)
      to collect user authentication when creating a subscription without
      immediate payment or updating a subscription's payment method, allowing
      you to optimize for off-session payments. Learn more in the [SCA Migration
      Guide](https://docs.stripe.com/billing/migration/strong-customer-authentication#scenario-2).
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./setup_intent.yaml
  pending_update:
    anyOf:
      - $ref: ./subscriptions_resource_pending_update.yaml
    description: >-
      If specified, [pending
      updates](https://docs.stripe.com/billing/subscriptions/pending-updates)
      that will be applied to the subscription once the `latest_invoice` has
      been paid.
    nullable: true
  presentment_details:
    $ref: ./subscriptions_resource_subscription_presentment_details.yaml
  schedule:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./subscription_schedule.yaml
    description: The schedule attached to the subscription
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./subscription_schedule.yaml
  start_date:
    description: >-
      Date when the subscription was first created. The date might differ from
      the `created` date due to backdating.
    format: unix-time
    type: integer
  status:
    description: >-
      Possible values are `incomplete`, `incomplete_expired`, `trialing`,
      `active`, `past_due`, `canceled`, `unpaid`, or `paused`. 


      For `collection_method=charge_automatically` a subscription moves into
      `incomplete` if the initial payment attempt fails. A subscription in this
      status can only have metadata and default_source updated. Once the first
      invoice is paid, the subscription moves into an `active` status. If the
      first invoice is not paid within 23 hours, the subscription transitions to
      `incomplete_expired`. This is a terminal status, the open invoice will be
      voided and no further invoices will be generated. 


      A subscription that is currently in a trial period is `trialing` and moves
      to `active` when the trial period is over. 


      A subscription can only enter a `paused` status [when a trial ends without
      a payment
      method](https://docs.stripe.com/billing/subscriptions/trials#create-free-trials-without-payment).
      A `paused` subscription doesn't generate invoices and can be resumed after
      your customer adds their payment method. The `paused` status is different
      from [pausing
      collection](https://docs.stripe.com/billing/subscriptions/pause-payment),
      which still generates invoices and leaves the subscription's status
      unchanged. 


      If subscription `collection_method=charge_automatically`, it becomes
      `past_due` when payment is required but cannot be paid (due to failed
      payment or awaiting additional user actions). Once Stripe has exhausted
      all payment retry attempts, the subscription will become `canceled` or
      `unpaid` (depending on your subscriptions settings). 


      If subscription `collection_method=send_invoice` it becomes `past_due`
      when its invoice is not paid by the due date, and `canceled` or `unpaid`
      if it is still not paid by an additional deadline after that. Note that
      when a subscription has a status of `unpaid`, no subsequent invoices will
      be attempted (invoices will be created, but then immediately automatically
      closed). After receiving updated payment information from a customer, you
      may choose to reopen and pay their closed invoices.
    enum:
      - active
      - canceled
      - incomplete
      - incomplete_expired
      - past_due
      - paused
      - trialing
      - unpaid
    type: string
  test_clock:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./test_helpers.test_clock.yaml
    description: ID of the test clock this subscription belongs to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./test_helpers.test_clock.yaml
  transfer_data:
    anyOf:
      - $ref: ./subscription_transfer_data.yaml
    description: >-
      The account (if any) the subscription's payments will be attributed to for
      tax reporting, and where funds from each payment will be transferred to
      for each of the subscription's invoices.
    nullable: true
  trial_end:
    description: If the subscription has a trial, the end of that trial.
    format: unix-time
    nullable: true
    type: integer
  trial_settings:
    anyOf:
      - $ref: ./subscriptions_resource_trial_settings_trial_settings.yaml
    description: Settings related to subscription trials.
    nullable: true
  trial_start:
    description: If the subscription has a trial, the beginning of that trial.
    format: unix-time
    nullable: true
    type: integer
required:
  - automatic_tax
  - billing_cycle_anchor
  - billing_mode
  - billing_schedules
  - cancel_at_period_end
  - collection_method
  - created
  - currency
  - customer
  - discounts
  - id
  - invoice_settings
  - items
  - livemode
  - metadata
  - object
  - start_date
  - status
