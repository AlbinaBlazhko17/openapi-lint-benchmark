description: >-
  A `Transfer` object is created when you move funds between Stripe accounts as

  part of Connect.


  Before April 6, 2017, transfers also represented movement of funds from a

  Stripe account to a card or bank account. This behavior has since been split

  out into a [Payout](https://api.stripe.com#payout_object) object, with
  corresponding payout endpoints. For more

  information, read about the

  [transfer/payout split](https://docs.stripe.com/transfer-payout-split).


  Related guide: [Creating separate charges and
  transfers](https://docs.stripe.com/connect/separate-charges-and-transfers)
properties:
  amount:
    description: Amount in cents (or local equivalent) to be transferred.
    type: integer
  amount_reversed:
    description: >-
      Amount in cents (or local equivalent) reversed (can be less than the
      amount attribute on the transfer if a partial reversal was issued).
    type: integer
  balance_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./balance_transaction.yaml
    description: >-
      Balance transaction that describes the impact of this transfer on your
      account balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./balance_transaction.yaml
  created:
    description: Time that this record of the transfer was first created.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  description:
    description: >-
      An arbitrary string attached to the object. Often useful for displaying to
      users.
    maxLength: 5000
    nullable: true
    type: string
  destination:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./account.yaml
    description: ID of the Stripe account the transfer was sent to.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./account.yaml
  destination_payment:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./charge.yaml
    description: >-
      If the destination is a Stripe account, this will be the ID of the payment
      that the destination account received for the transfer.
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - transfer
    type: string
  reversals:
    description: A list of reversals that have been applied to the transfer.
    properties:
      data:
        description: Details about each object.
        items:
          $ref: ./transfer_reversal.yaml
        type: array
      has_more:
        description: >-
          True if this list has another page of items after this one that can be
          fetched.
        type: boolean
      object:
        description: >-
          String representing the object's type. Objects of the same type share
          the same value. Always has the value `list`.
        enum:
          - list
        type: string
      url:
        description: The URL where this list can be accessed.
        maxLength: 5000
        type: string
    required:
      - data
      - has_more
      - object
      - url
    title: TransferReversalList
    type: object
    x-expandableFields:
      - data
  reversed:
    description: >-
      Whether the transfer has been fully reversed. If the transfer is only
      partially reversed, this attribute will still be false.
    type: boolean
  source_transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./charge.yaml
    description: >-
      ID of the charge that was used to fund the transfer. If null, the transfer
      was funded from the available balance.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  source_type:
    description: >-
      The source balance this transfer came from. One of `card`, `fpx`, or
      `bank_account`.
    maxLength: 5000
    type: string
  transfer_group:
    description: >-
      A string that identifies this transaction as part of a group. See the
      [Connect
      documentation](https://docs.stripe.com/connect/separate-charges-and-transfers#transfer-options)
      for details.
    maxLength: 5000
    nullable: true
    type: string
required:
  - amount
  - amount_reversed
  - created
  - currency
  - id
  - livemode
  - metadata
  - object
  - reversals
  - reversed
title: Transfer
type: object
x-expandableFields:
  - balance_transaction
  - destination
  - destination_payment
  - reversals
  - source_transaction
x-resourceId: transfer
