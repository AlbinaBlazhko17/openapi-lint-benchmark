description: >-
  PaymentMethod objects represent your customer's payment instruments.

  You can use them with
  [PaymentIntents](https://docs.stripe.com/payments/payment-intents) to collect
  payments or save them to

  Customer objects to store instrument details for future payments.


  Related guides: [Payment
  Methods](https://docs.stripe.com/payments/payment-methods) and [More Payment
  Scenarios](https://docs.stripe.com/payments/more-payment-scenarios).
properties:
  acss_debit:
    $ref: ./payment_method_acss_debit.yaml
  affirm:
    $ref: ./payment_method_affirm.yaml
  afterpay_clearpay:
    $ref: ./payment_method_afterpay_clearpay.yaml
  alipay:
    $ref: ./payment_flows_private_payment_methods_alipay.yaml
  allow_redisplay:
    description: >-
      This field indicates whether this payment method can be shown again to its
      customer in a checkout flow. Stripe products such as Checkout and Elements
      use this field to determine whether a payment method can be shown as a
      saved payment method in a checkout flow. The field defaults to
      “unspecified”.
    enum:
      - always
      - limited
      - unspecified
    type: string
  alma:
    $ref: ./payment_method_alma.yaml
  amazon_pay:
    $ref: ./payment_method_amazon_pay.yaml
  au_becs_debit:
    $ref: ./payment_method_au_becs_debit.yaml
