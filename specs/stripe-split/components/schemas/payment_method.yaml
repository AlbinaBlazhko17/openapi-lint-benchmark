  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  crypto:
    $ref: ./payment_method_crypto.yaml
  custom:
    $ref: ./payment_method_custom.yaml
  customer:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./customer.yaml
    description: >-
      The ID of the Customer to which this PaymentMethod is saved. This will not
      be set when the PaymentMethod has not been saved to a Customer.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./customer.yaml
  customer_account:
    maxLength: 5000
    nullable: true
    type: string
  customer_balance:
