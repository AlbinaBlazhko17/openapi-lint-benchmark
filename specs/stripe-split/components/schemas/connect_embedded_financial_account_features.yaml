description: ''
properties:
  disable_stripe_user_authentication:
    description: >-
      Whether Stripe user authentication is disabled. This value can only be
      `true` for accounts where `controller.requirement_collection` is
      `application` for the account. The default value is the opposite of the
      `external_account_collection` value. For example, if you don't set
      `external_account_collection`, it defaults to `true` and
      `disable_stripe_user_authentication` defaults to `false`.
    type: boolean
  external_account_collection:
    description: >-
      Whether external account collection is enabled. This feature can only be
      `false` for accounts where you’re responsible for collecting updated
      information when requirements are due or change, like Custom accounts. The
      default value for this feature is `true`.
    type: boolean
  send_money:
    description: Whether to allow sending money.
    type: boolean
  transfer_balance:
    description: Whether to allow transferring balance.
    type: boolean
required:
  - disable_stripe_user_authentication
  - external_account_collection
  - send_money
  - transfer_balance
title: ConnectEmbeddedFinancialAccountFeatures
type: object
x-expandableFields: []
