    description: >-
      ID of the successful charge for this payment when `type` is `charge`.Note:
      charge is only surfaced if the charge object is not associated with a
      payment intent. If the charge object does have a payment intent, the
      Invoice Payment surfaces the payment intent instead.
    x-expansionResources:
      oneOf:
        - $ref: ./charge.yaml
  payment_intent:
