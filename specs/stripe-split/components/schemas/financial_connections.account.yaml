description: >-
  A Financial Connections Account represents an account that exists outside of
  Stripe, to which you have been granted some degree of access.
properties:
  account_holder:
    anyOf:
      - $ref: ./bank_connections_resource_accountholder.yaml
    description: The account holder that this account belongs to.
    nullable: true
  account_numbers:
    description: Details about the account numbers.
    items:
      $ref: ./bank_connections_resource_account_number_details.yaml
    nullable: true
    type: array
  balance:
    anyOf:
      - $ref: ./bank_connections_resource_balance.yaml
    description: The most recent information about the account's balance.
    nullable: true
  balance_refresh:
    anyOf:
      - $ref: ./bank_connections_resource_balance_refresh.yaml
    description: The state of the most recent attempt to refresh the account balance.
    nullable: true
  category:
    description: >-
      The type of the account. Account category is further divided in
      `subcategory`.
    enum:
      - cash
      - credit
      - investment
      - other
    type: string
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  display_name:
    description: >-
      A human-readable name that has been assigned to this account, either by
      the account holder or by the institution.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  institution_name:
    description: The name of the institution that holds this account.
    maxLength: 5000
    type: string
  last4:
    description: >-
      The last 4 digits of the account number. If present, this will be 4
      numeric characters.
    maxLength: 5000
    nullable: true
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - financial_connections.account
    type: string
  ownership:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./financial_connections.account_ownership.yaml
    description: The most recent information about the account's owners.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./financial_connections.account_ownership.yaml
  ownership_refresh:
    anyOf:
      - $ref: ./bank_connections_resource_ownership_refresh.yaml
    description: The state of the most recent attempt to refresh the account owners.
    nullable: true
  permissions:
    description: The list of permissions granted by this account.
    items:
      enum:
        - balances
        - ownership
        - payment_method
        - transactions
      type: string
      x-stripeBypassValidation: true
    nullable: true
    type: array
  status:
    description: The status of the link to the account.
    enum:
      - active
      - disconnected
      - inactive
    type: string
  status_details:
    $ref: ./bank_connections_resource_account_status_details.yaml
  subcategory:
    description: |-
      If `category` is `cash`, one of:

       - `checking`
       - `savings`
       - `other`

      If `category` is `credit`, one of:

       - `mortgage`
       - `line_of_credit`
       - `credit_card`
       - `other`

      If `category` is `investment` or `other`, this will be `other`.
    enum:
      - checking
      - credit_card
      - line_of_credit
      - mortgage
      - other
      - savings
    type: string
  subscriptions:
    description: The list of data refresh subscriptions requested on this account.
    items:
      enum:
        - transactions
      type: string
      x-stripeBypassValidation: true
    nullable: true
    type: array
  supported_payment_method_types:
    description: >-
      The [PaymentMethod
      type](https://docs.stripe.com/api/payment_methods/object#payment_method_object-type)(s)
      that can be created from this account.
    items:
      enum:
        - link
        - us_bank_account
      type: string
      x-stripeBypassValidation: true
    type: array
  transaction_refresh:
    anyOf:
      - $ref: ./bank_connections_resource_transaction_refresh.yaml
    description: The state of the most recent attempt to refresh the account transactions.
    nullable: true
required:
  - category
  - created
  - id
  - institution_name
  - livemode
  - object
  - status
  - subcategory
  - supported_payment_method_types
title: Account
type: object
x-expandableFields:
  - account_holder
  - account_numbers
  - balance
  - balance_refresh
  - ownership
  - ownership_refresh
  - status_details
  - transaction_refresh
x-resourceId: financial_connections.account
