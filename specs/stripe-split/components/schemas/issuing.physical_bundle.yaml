description: >-
  A Physical Bundle represents the bundle of physical items - card stock,
  carrier letter, and envelope - that is shipped to a cardholder when you create
  a physical card.
properties:
  features:
    $ref: ./issuing_physical_bundle_features.yaml
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  name:
    description: Friendly display name.
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - issuing.physical_bundle
    type: string
  status:
    description: Whether this physical bundle can be used to create cards.
    enum:
      - active
      - inactive
      - review
    type: string
  type:
    description: >-
      Whether this physical bundle is a standard Stripe offering or custom-made
      for you.
    enum:
      - custom
      - standard
    type: string
required:
  - features
  - id
  - livemode
  - name
  - object
  - status
  - type
title: Physical Bundle
type: object
x-expandableFields:
  - features
x-resourceId: issuing.physical_bundle
