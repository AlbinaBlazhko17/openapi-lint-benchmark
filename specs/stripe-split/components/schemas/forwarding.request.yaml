description: >-
  Instructs Stripe to make a request on your behalf using the destination URL.
  The destination URL

  is activated by Stripe at the time of onboarding. Stripe verifies requests
  with your credentials

  provided during onboarding, and injects card details from the payment_method
  into the request.


  Stripe redacts all sensitive fields and headers, including authentication
  credentials and card numbers,

  before storing the request and response data in the forwarding Request object,
  which are subject to a

  30-day retention period.


  You can provide a Stripe idempotency key to make sure that requests with the
  same key result in only one

  outbound request. The Stripe idempotency key provided should be unique and
  different from any idempotency

  keys provided on the underlying third-party request.


  Forwarding Requests are synchronous requests that return a response or time
  out according to

  Stripe’s limits.


  Related guide: [Forward card details to third-party API
  endpoints](https://docs.stripe.com/payments/forwarding).
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    nullable: true
    type: object
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - forwarding.request
    type: string
  payment_method:
    description: >-
      The PaymentMethod to insert into the forwarded request. Forwarding
      previously consumed PaymentMethods is allowed.
    maxLength: 5000
    type: string
  replacements:
    description: The field kinds to be replaced in the forwarded request.
    items:
      enum:
        - card_cvc
        - card_expiry
        - card_number
        - cardholder_name
        - request_signature
      type: string
      x-stripeBypassValidation: true
    type: array
  request_context:
    anyOf:
      - $ref: ./forwarded_request_context.yaml
    description: >-
      Context about the request from Stripe's servers to the destination
      endpoint.
    nullable: true
  request_details:
    anyOf:
      - $ref: ./forwarded_request_details.yaml
    description: >-
      The request that was sent to the destination endpoint. We redact any
      sensitive fields.
    nullable: true
  response_details:
    anyOf:
      - $ref: ./forwarded_response_details.yaml
    description: >-
      The response that the destination endpoint returned to us. We redact any
      sensitive fields.
    nullable: true
  url:
    description: >-
      The destination URL for the forwarded request. Must be supported by the
      config.
    maxLength: 5000
    nullable: true
    type: string
required:
  - created
  - id
  - livemode
  - object
  - payment_method
  - replacements
title: ForwardingRequest
type: object
x-expandableFields:
  - request_context
  - request_details
  - response_details
x-resourceId: forwarding.request
