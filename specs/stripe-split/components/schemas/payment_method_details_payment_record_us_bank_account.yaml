description: ''
properties:
  account_holder_type:
    description: >-
      The type of entity that holds the account. This can be either 'individual'
      or 'company'.
    enum:
      - company
      - individual
    nullable: true
    type: string
  account_type:
    description: The type of the bank account. This can be either 'checking' or 'savings'.
    enum:
      - checking
      - savings
    nullable: true
    type: string
  bank_name:
    description: Name of the bank associated with the bank account.
    maxLength: 5000
    nullable: true
    type: string
  expected_debit_date:
    description: >-
      Estimated date to debit the customer's bank account. A date string in
      YYYY-MM-DD format.
    maxLength: 5000
    type: string
  fingerprint:
    description: >-
      Uniquely identifies this particular bank account. You can use this
      attribute to check whether two bank accounts are the same.
    maxLength: 5000
    nullable: true
    type: string
  last4:
    description: Last four digits of the bank account number.
    maxLength: 5000
    nullable: true
    type: string
  mandate:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./mandate.yaml
    description: ID of the mandate used to make this payment.
    x-expansionResources:
      oneOf:
        - $ref: ./mandate.yaml
  payment_reference:
    description: The ACH payment reference for this transaction.
    maxLength: 5000
    nullable: true
    type: string
  routing_number:
    description: The routing number for the bank account.
    maxLength: 5000
    nullable: true
    type: string
title: payment_method_details_payment_record_us_bank_account
type: object
x-expandableFields:
  - mandate
