description: ''
properties:
  location:
    description: >-
      ID of the [location](https://docs.stripe.com/api/terminal/locations) that
      this transaction's reader is assigned to.
    maxLength: 5000
    type: string
  payer_details:
    anyOf:
      - $ref: >-
          ./payments_primitives_payment_records_resource_payment_method_klarna_details_resource_payer_details.yaml
    description: The payer details for this transaction.
    nullable: true
  payment_method_category:
    description: >-
      The Klarna payment method used for this transaction. Can be one of
      `pay_later`, `pay_now`, `pay_with_financing`, or `pay_in_installments`
    maxLength: 5000
    nullable: true
    type: string
  preferred_locale:
    description: >-
      Preferred language of the Klarna authorization page that the customer is
      redirected to. Can be one of `de-AT`, `en-AT`, `nl-BE`, `fr-BE`, `en-BE`,
      `de-DE`, `en-DE`, `da-DK`, `en-DK`, `es-ES`, `en-ES`, `fi-FI`, `sv-FI`,
      `en-FI`, `en-GB`, `en-IE`, `it-IT`, `en-IT`, `nl-NL`, `en-NL`, `nb-NO`,
      `en-NO`, `sv-SE`, `en-SE`, `en-US`, `es-US`, `fr-FR`, `en-FR`, `cs-CZ`,
      `en-CZ`, `ro-RO`, `en-RO`, `el-GR`, `en-GR`, `en-AU`, `en-NZ`, `en-CA`,
      `fr-CA`, `pl-PL`, `en-PL`, `pt-PT`, `en-PT`, `de-CH`, `fr-CH`, `it-CH`, or
      `en-CH`
    maxLength: 5000
    nullable: true
    type: string
  reader:
    description: >-
      ID of the [reader](https://docs.stripe.com/api/terminal/readers) this
      transaction was made on.
    maxLength: 5000
    type: string
title: payment_method_details_payment_record_klarna
type: object
x-expandableFields:
  - payer_details
