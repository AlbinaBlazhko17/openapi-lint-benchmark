description: ''
properties:
  fees:
    $ref: ./account_unification_account_controller_fees.yaml
  is_controller:
    description: >-
      `true` if the Connect application retrieving the resource controls the
      account and can therefore exercise [platform
      controls](https://docs.stripe.com/connect/platform-controls-for-standard-accounts).
      Otherwise, this field is null.
    type: boolean
  losses:
    $ref: ./account_unification_account_controller_losses.yaml
  requirement_collection:
    description: >-
      A value indicating responsibility for collecting requirements on this
      account. Only returned when the Connect application retrieving the
      resource controls the account.
    enum:
      - application
      - stripe
    type: string
  stripe_dashboard:
    $ref: ./account_unification_account_controller_stripe_dashboard.yaml
  type:
    description: >-
      The controller type. Can be `application`, if a Connect application
      controls the account, or `account`, if the account controls itself.
    enum:
      - account
      - application
    type: string
required:
  - type
title: AccountUnificationAccountController
type: object
x-expandableFields:
  - fees
  - losses
  - stripe_dashboard
