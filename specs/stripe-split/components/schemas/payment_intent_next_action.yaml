  type:
    description: >-
      Type of the next action to perform. Refer to the other child attributes
      under `next_action` for available values. Examples include:
      `redirect_to_url`, `use_stripe_sdk`, `alipay_handle_redirect`,
      `oxxo_display_details`, or `verify_with_microdeposits`.
    maxLength: 5000
    type: string
  upi_handle_redirect_or_display_qr_code:
    $ref: ./payment_intent_next_action_upi_handle_redirect_or_display_qr_code.yaml
  use_stripe_sdk:
    additionalProperties: true
    description: >-
      When confirming a PaymentIntent with Stripe.js, Stripe.js depends on the
      contents of this dictionary to invoke authentication flows. The shape of
      the contents is subject to change and is only intended to be used by
      Stripe.js.
    type: object
