description: >-
  Orders represent your intent to purchase a particular Climate product. When
  you create an order, the

  payment is deducted from your merchant balance.
properties:
  amount_fees:
    description: >-
      Total amount of [Frontier](https://frontierclimate.com/)'s service fees in
      the currency's smallest unit.
    type: integer
  amount_subtotal:
    description: Total amount of the carbon removal in the currency's smallest unit.
    type: integer
  amount_total:
    description: Total amount of the order including fees in the currency's smallest unit.
    type: integer
  beneficiary:
    $ref: ./climate_removals_beneficiary.yaml
  canceled_at:
    description: >-
      Time at which the order was canceled. Measured in seconds since the Unix
      epoch.
    format: unix-time
    nullable: true
    type: integer
  cancellation_reason:
    description: Reason for the cancellation of this order.
    enum:
      - expired
      - product_unavailable
      - requested
    nullable: true
    type: string
    x-stripeBypassValidation: true
  certificate:
    description: For delivered orders, a URL to a delivery certificate for the order.
    maxLength: 5000
    nullable: true
    type: string
  confirmed_at:
    description: >-
      Time at which the order was confirmed. Measured in seconds since the Unix
      epoch.
    format: unix-time
    nullable: true
    type: integer
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase,
      representing the currency for this order.
    maxLength: 5000
    type: string
  delayed_at:
    description: >-
      Time at which the order's expected_delivery_year was delayed. Measured in
      seconds since the Unix epoch.
    format: unix-time
    nullable: true
    type: integer
  delivered_at:
    description: >-
      Time at which the order was delivered. Measured in seconds since the Unix
      epoch.
    format: unix-time
    nullable: true
    type: integer
  delivery_details:
    description: Details about the delivery of carbon removal for this order.
    items:
      $ref: ./climate_removals_order_deliveries.yaml
    type: array
  expected_delivery_year:
    description: >-
      The year this order is expected to be delivered. If the year is in the
      past, the order is a spot purchase and will be delivered within 30 days of
      purchase.
    type: integer
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      Has the value `true` if the object exists in live mode or the value
      `false` if the object exists in test mode.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  metric_tons:
    description: Quantity of carbon removal that is included in this order.
    format: decimal
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - climate.order
    type: string
  product:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./climate.product.yaml
    description: Unique ID for the Climate `Product` this order is purchasing.
    x-expansionResources:
      oneOf:
        - $ref: ./climate.product.yaml
  product_substituted_at:
    description: >-
      Time at which the order's product was substituted for a different product.
      Measured in seconds since the Unix epoch.
    format: unix-time
    nullable: true
    type: integer
  status:
    description: The current status of this order.
    enum:
      - awaiting_funds
      - canceled
      - confirmed
      - delivered
      - open
    type: string
required:
  - amount_fees
  - amount_subtotal
  - amount_total
  - created
  - currency
  - delivery_details
  - expected_delivery_year
  - id
  - livemode
  - metadata
  - metric_tons
  - object
  - product
  - status
title: Climate order
type: object
x-expandableFields:
  - beneficiary
  - delivery_details
  - product
x-resourceId: climate.order
