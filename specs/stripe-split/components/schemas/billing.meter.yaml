description: >-
  Meters specify how to aggregate meter events over a billing period. Meter
  events represent the actions that customers take in your system. Meters attach
  to prices and form the basis of the bill.


  Related guide: [Usage based
  billing](https://docs.stripe.com/billing/subscriptions/usage-based)
properties:
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  customer_mapping:
    $ref: ./billing_meter_resource_customer_mapping_settings.yaml
  default_aggregation:
    $ref: ./billing_meter_resource_aggregation_settings.yaml
  display_name:
    description: The meter's name.
    maxLength: 5000
    type: string
  event_name:
    description: >-
      The name of the meter event to record usage for. Corresponds with the
      `event_name` field on meter events.
    maxLength: 5000
    type: string
  event_time_window:
    description: The time window which meter events have been pre-aggregated for, if any.
    enum:
      - day
      - hour
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - billing.meter
    type: string
  status:
    description: The meter's status.
    enum:
      - active
      - inactive
    type: string
  status_transitions:
    $ref: ./billing_meter_resource_billing_meter_status_transitions.yaml
  updated:
    description: >-
      Time at which the object was last updated. Measured in seconds since the
      Unix epoch.
    format: unix-time
    type: integer
  value_settings:
    $ref: ./billing_meter_resource_billing_meter_value.yaml
required:
  - created
  - customer_mapping
  - default_aggregation
  - display_name
  - event_name
  - id
  - livemode
  - object
  - status
  - status_transitions
  - updated
  - value_settings
title: Billing Meter
type: object
x-expandableFields:
  - customer_mapping
  - default_aggregation
  - status_transitions
  - value_settings
x-resourceId: billing.meter
