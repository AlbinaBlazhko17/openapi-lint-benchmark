description: >-
  A billing meter event adjustment is a resource that allows you to cancel a
  meter event. For example, you might create a billing meter event adjustment to
  cancel a meter event that was created in error or attached to the wrong
  customer.
properties:
  cancel:
    anyOf:
      - $ref: ./billing_meter_resource_billing_meter_event_adjustment_cancel.yaml
    description: Specifies which event to cancel.
    nullable: true
  event_name:
    description: >-
      The name of the meter event. Corresponds with the `event_name` field on a
      meter.
    maxLength: 100
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - billing.meter_event_adjustment
    type: string
  status:
    description: The meter event adjustment's status.
    enum:
      - complete
      - pending
    type: string
  type:
    description: >-
      Specifies whether to cancel a single event or a range of events for a time
      period. Time period cancellation is not supported yet.
    enum:
      - cancel
    type: string
required:
  - event_name
  - livemode
  - object
  - status
  - type
title: Billing Meter Event Adjustment
type: object
x-expandableFields:
  - cancel
x-resourceId: billing.meter_event_adjustment
