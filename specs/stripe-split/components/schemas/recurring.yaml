description: ''
properties:
  interval:
    description: >-
      The frequency at which a subscription is billed. One of `day`, `week`,
      `month` or `year`.
    enum:
      - day
      - month
      - week
      - year
    type: string
  interval_count:
    description: >-
      The number of intervals (specified in the `interval` attribute) between
      subscription billings. For example, `interval=month` and
      `interval_count=3` bills every 3 months.
    type: integer
  meter:
    description: The meter tracking the usage of a metered price
    maxLength: 5000
    nullable: true
    type: string
  usage_type:
    description: >-
      Configures how the quantity per period should be determined. Can be either
      `metered` or `licensed`. `licensed` automatically bills the `quantity` set
      when adding it to a subscription. `metered` aggregates the total usage
      based on usage records. Defaults to `licensed`.
    enum:
      - licensed
      - metered
    type: string
required:
  - interval
  - interval_count
  - usage_type
title: Recurring
type: object
x-expandableFields: []
