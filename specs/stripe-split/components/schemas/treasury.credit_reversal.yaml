description: >-
  You can reverse some
  [ReceivedCredits](https://api.stripe.com#received_credits) depending on their
  network and source flow. Reversing a ReceivedCredit leads to the creation of a
  new object known as a CreditReversal.
properties:
  amount:
    description: Amount (in cents) transferred.
    type: integer
  created:
    description: >-
      Time at which the object was created. Measured in seconds since the Unix
      epoch.
    format: unix-time
    type: integer
  currency:
    description: >-
      Three-letter [ISO currency
      code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase.
      Must be a [supported currency](https://stripe.com/docs/currencies).
    format: currency
    type: string
  financial_account:
    description: The FinancialAccount to reverse funds from.
    maxLength: 5000
    type: string
  hosted_regulatory_receipt_url:
    description: >-
      A [hosted transaction
      receipt](https://docs.stripe.com/treasury/moving-money/regulatory-receipts)
      URL that is provided when money movement is considered regulated under
      Stripe's money transmission licenses.
    maxLength: 5000
    nullable: true
    type: string
  id:
    description: Unique identifier for the object.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  metadata:
    additionalProperties:
      maxLength: 500
      type: string
    description: >-
      Set of [key-value pairs](https://docs.stripe.com/api/metadata) that you
      can attach to an object. This can be useful for storing additional
      information about the object in a structured format.
    type: object
  network:
    description: The rails used to reverse the funds.
    enum:
      - ach
      - stripe
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - treasury.credit_reversal
    type: string
  received_credit:
    description: The ReceivedCredit being reversed.
    maxLength: 5000
    type: string
  status:
    description: Status of the CreditReversal
    enum:
      - canceled
      - posted
      - processing
    type: string
  status_transitions:
    $ref: ./treasury_received_credits_resource_status_transitions.yaml
  transaction:
    anyOf:
      - maxLength: 5000
        type: string
      - $ref: ./treasury.transaction.yaml
    description: The Transaction associated with this object.
    nullable: true
    x-expansionResources:
      oneOf:
        - $ref: ./treasury.transaction.yaml
required:
  - amount
  - created
  - currency
  - financial_account
  - id
  - livemode
  - metadata
  - network
  - object
  - received_credit
  - status
  - status_transitions
title: CreditReversal
type: object
x-expandableFields:
  - status_transitions
  - transaction
x-resourceId: treasury.credit_reversal
