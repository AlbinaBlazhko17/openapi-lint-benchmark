description: ''
properties:
  capture_method:
    description: Controls when the funds will be captured from the customer's account.
    enum:
      - manual
      - manual_preferred
    type: string
    x-stripeBypassValidation: true
  request_extended_authorization:
    description: >-
      Request ability to capture this payment beyond the standard [authorization
      validity
      window](https://docs.stripe.com/terminal/features/extended-authorizations#authorization-validity)
    nullable: true
    type: boolean
  request_incremental_authorization_support:
    description: >-
      Request ability to
      [increment](https://docs.stripe.com/terminal/features/incremental-authorizations)
      this PaymentIntent if the combination of MCC and card brand is eligible.
      Check
      [incremental_authorization_supported](https://docs.stripe.com/api/charges/object#charge_object-payment_method_details-card_present-incremental_authorization_supported)
      in the [Confirm](https://docs.stripe.com/api/payment_intents/confirm)
      response to verify support.
    nullable: true
    type: boolean
  routing:
    $ref: ./payment_method_options_card_present_routing.yaml
title: payment_method_options_card_present
type: object
x-expandableFields:
  - routing
