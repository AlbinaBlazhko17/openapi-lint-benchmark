description: ''
properties:
  enabled:
    description: Whether the feature is enabled.
    type: boolean
  feedback_options:
    description: >-
      The IDs of custom feedback options configured for this cancellation
      reason.
    items:
      anyOf:
        - maxLength: 5000
          type: string
        - $ref: ./billing.feedback_option.yaml
      x-expansionResources:
        oneOf:
          - $ref: ./billing.feedback_option.yaml
    nullable: true
    type: array
  options:
    description: Which cancellation reasons will be given as options to the customer.
    items:
      enum:
        - customer_service
        - low_quality
        - missing_features
        - other
        - switched_service
        - too_complex
        - too_expensive
        - unused
      type: string
    type: array
required:
  - enabled
  - options
title: PortalSubscriptionCancellationReason
type: object
x-expandableFields:
  - feedback_options
