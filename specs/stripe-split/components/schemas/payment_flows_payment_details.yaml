description: ''
properties:
  customer_reference:
    description: >-
      A unique value to identify the customer. This field is available only for
      card payments.


      This field is truncated to 25 alphanumeric characters, excluding spaces,
      before being sent to card networks.
    maxLength: 5000
    nullable: true
    type: string
  order_reference:
    description: >-
      A unique value assigned by the business to identify the transaction.
      Required for L2 and L3 rates.


      For Cards, this field is truncated to 25 alphanumeric characters,
      excluding spaces, before being sent to card networks. For Klarna, this
      field is truncated to 255 characters and is visible to customers when they
      view the order in the Klarna app.
    maxLength: 5000
    nullable: true
    type: string
title: PaymentFlowsPaymentDetails
type: object
x-expandableFields: []
