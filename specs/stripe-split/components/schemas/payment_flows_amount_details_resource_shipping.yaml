description: ''
properties:
  amount:
    description: >-
      If a physical good is being shipped, the cost of shipping represented in
      the [smallest currency
      unit](https://docs.stripe.com/currencies#zero-decimal). An integer greater
      than or equal to 0.
    nullable: true
    type: integer
  from_postal_code:
    description: >-
      If a physical good is being shipped, the postal code of where it is being
      shipped from. At most 10 alphanumeric characters long, hyphens and spaces
      are allowed.
    maxLength: 5000
    nullable: true
    type: string
  to_postal_code:
    description: >-
      If a physical good is being shipped, the postal code of where it is being
      shipped to. At most 10 alphanumeric characters long, hyphens and spaces
      are allowed.
    maxLength: 5000
    nullable: true
    type: string
title: PaymentFlowsAmountDetailsResourceShipping
type: object
x-expandableFields: []
