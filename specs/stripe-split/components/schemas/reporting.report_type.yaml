description: >-
  The Report Type resource corresponds to a particular type of report, such as

  the "Activity summary" or "Itemized payouts" reports. These objects are

  identified by an ID belonging to a set of enumerated values. See

  [API Access to Reports
  documentation](https://docs.stripe.com/reporting/statements/api)

  for those Report Type IDs, along with required and optional parameters.


  Note that certain report types can only be run based on your live-mode data
  (not test-mode

  data), and will error when queried without a [live-mode API
  key](https://docs.stripe.com/keys#test-live-modes).
properties:
  data_available_end:
    description: >-
      Most recent time for which this Report Type is available. Measured in
      seconds since the Unix epoch.
    format: unix-time
    type: integer
  data_available_start:
    description: >-
      Earliest time for which this Report Type is available. Measured in seconds
      since the Unix epoch.
    format: unix-time
    type: integer
  default_columns:
    description: >-
      List of column names that are included by default when this Report Type
      gets run. (If the Report Type doesn't support the `columns` parameter,
      this will be null.)
    items:
      maxLength: 5000
      type: string
    nullable: true
    type: array
  id:
    description: >-
      The [ID of the Report
      Type](https://docs.stripe.com/reporting/statements/api#available-report-types),
      such as `balance.summary.1`.
    maxLength: 5000
    type: string
  livemode:
    description: >-
      If the object exists in live mode, the value is `true`. If the object
      exists in test mode, the value is `false`.
    type: boolean
  name:
    description: Human-readable name of the Report Type
    maxLength: 5000
    type: string
  object:
    description: >-
      String representing the object's type. Objects of the same type share the
      same value.
    enum:
      - reporting.report_type
    type: string
  updated:
    description: >-
      When this Report Type was latest updated. Measured in seconds since the
      Unix epoch.
    format: unix-time
    type: integer
  version:
    description: >-
      Version of the Report Type. Different versions report with the same ID
      will have the same purpose, but may take different run parameters or have
      different result schemas.
    type: integer
required:
  - data_available_end
  - data_available_start
  - id
  - livemode
  - name
  - object
  - updated
  - version
title: Report Type
type: object
x-expandableFields: []
x-resourceId: reporting.report_type
